<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gaia Formalization Viewer</title>
  <style>
    :root { color-scheme:light; --ink:#172033; --muted:#667085; --line:#d0d5dd; --paper:#f7f8fa; --accent:#175cd3; --error:#d92d20; --warning:#dc6803; --passed:#067647; }
    * { box-sizing:border-box; }
    body { min-width:1080px; margin:0; color:var(--ink); background:var(--paper); font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif; }
    header { display:flex; gap:12px; align-items:center; height:59px; padding:12px 16px; background:white; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:3; }
    h1 { font-size:16px; margin:0 auto 0 0; }
    h2 { font-size:17px; margin:0 0 4px; overflow-wrap:anywhere; }
    input,select,button.toolbar { border:1px solid var(--line); border-radius:7px; padding:7px 9px; background:white; }
    button.toolbar { cursor:pointer; }
    #search { width:min(360px,30vw); }
    #file-input { display:none; }
    #drop-file { cursor:pointer; }
    body.file-dragging::after { content:'释放以打开 formalization.json'; position:fixed; inset:12px; display:grid; place-items:center; border:3px dashed var(--accent); border-radius:16px; background:rgba(238,244,255,.94); color:var(--accent); font-size:20px; font-weight:800; z-index:20; pointer-events:none; }
    #developer-badge { padding:5px 8px; border-radius:999px; color:#6941c6; background:#f4f3ff; font-size:12px; font-weight:700; }
    main { display:grid; grid-template-columns:180px minmax(560px,1fr) 380px; min-height:calc(100vh - 59px); }
    aside { background:white; padding:14px; overflow:auto; }
    #left { border-right:1px solid var(--line); }
    #detail { position:sticky; top:59px; height:calc(100vh - 59px); border-left:1px solid var(--line); }
    #canvas-wrap { overflow:auto; padding:16px; }
    svg { background:white; border:1px solid var(--line); border-radius:10px; min-width:100%; touch-action:none; }
    .edge { fill:none; stroke:#667085; stroke-width:1.7; marker-end:url(#arrow); cursor:pointer; }
    .edge.non-reasoning { stroke:#98a2b3; stroke-dasharray:7 5; }
    .edge.reasoning-candidate { stroke:#b54708; stroke-dasharray:2 5; }
    .edge.infer { stroke:#667085; stroke-dasharray:8 5; }
    .edge.relational { marker-end:none; }
    .edge.equivalence { marker-start:url(#arrow-start); marker-end:url(#arrow); }
    .edge.selected { stroke:var(--accent); stroke-width:3.5; }
    .edge.validation-failed { stroke:var(--error); stroke-width:3; stroke-dasharray:7 4; }
    .edge.validation-warning { stroke:var(--warning); stroke-width:3; }
    .edge-label { fill:var(--muted); font-size:10px; cursor:pointer; user-select:none; paint-order:stroke; stroke:white; stroke-width:4px; }
    .edge-label.selected { fill:var(--accent); font-weight:700; }
    .node .node-shape { stroke-width:1.6; cursor:grab; }
    .node.dragging .node-shape { cursor:grabbing; stroke:var(--accent); stroke-width:3; }
    .node.selected .node-shape { stroke:var(--accent); stroke-width:3.5; }
    .node text { pointer-events:none; fill:var(--ink); }
    .node-title { font-size:13px; font-weight:750; }
    .node-summary { font-size:11px; fill:#344054 !important; }
    .node.hit .node-shape { stroke:#f79009; stroke-width:3; }
    .node.validation-failed .node-shape { stroke:var(--error); stroke-width:3; }
    .node.validation-warning .node-shape { stroke:var(--warning); stroke-width:3; }
    .tone-claim .node-shape { fill:#e3f2fd; stroke:#1976d2; }
    .tone-observation .node-shape { fill:#e8f5e9; stroke:#43a047; }
    .node.observation-proposal .node-shape { stroke-dasharray:8 5; stroke-width:2.4; }
    .node.relation-display .node-shape { stroke-dasharray:6 4; stroke-width:2.2; }
    .tone-hypothesis .node-shape { fill:#f3e5f5; stroke:#7b1fa2; }
    .tone-caveat .node-shape { fill:#fff3e0; stroke:#ef6c00; }
    .tone-alternative .node-shape { fill:#fff1f0; stroke:#d92d20; stroke-dasharray:5 4; }
    .tone-limit .node-shape { fill:#ffebee; stroke:#c62828; }
    .tone-bridge .node-shape { fill:#fffde7; stroke:#f9a825; }
    .tone-setting .node-shape { fill:#f5f5f5; stroke:#616161; stroke-dasharray:5 4; }
    .tone-source .node-shape { fill:#f5f5f5; stroke:#757575; }
    .tone-registry .node-shape { fill:#eceff1; stroke:#546e7a; stroke-dasharray:5 4; }
    .tone-derived .node-shape { fill:#ede7f6; stroke:#673ab7; }
    .tone-weakpoint .node-shape { fill:#fff9c4; stroke:#f9a825; stroke-dasharray:5 4; }
    .operator .node-title { font-size:21px; text-anchor:middle; dominant-baseline:middle; }
    .op-implication .node-shape { fill:#e8f1ff; stroke:#175cd3; }
    .op-conjunction .node-shape { fill:#fff4e5; stroke:#e07912; }
    .op-disjunction .node-shape { fill:#f4f3ff; stroke:#7f56d9; }
    .op-equivalence .node-shape { fill:#e7f8f4; stroke:#0e9384; }
    .op-contradiction .node-shape { fill:#fee4e2; stroke:#d92d20; }
    .op-negation .node-shape,.op-complement .node-shape { fill:#f2f4f7; stroke:#475467; }
    #validation-status { white-space:nowrap; font-weight:700; }
    #validation-status.passed { color:var(--passed); }
    #validation-status.failed { color:var(--error); }
    #validation-status.warning { color:var(--warning); }
    .validation-card { border-left:4px solid var(--error); background:#fef3f2; padding:8px; margin:8px 0; }
    .validation-card.warning { border-color:var(--warning); background:#fff6ed; }
    .property-card { padding:9px 10px; margin:7px 0; border:1px solid #eaecf0; border-radius:7px; background:#f9fafb; }
    .property-row { display:grid; grid-template-columns:100px minmax(0,1fr); gap:7px; margin:4px 0; }
    .property-key { color:var(--muted); }
    .section-title { color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin:12px 0 6px; }
    .legend-item { display:flex; align-items:center; gap:8px; margin:6px 0; color:var(--muted); font-size:12px; }
    .legend-line { display:inline-block; width:34px; border-top:2px solid #667085; }
    .legend-line.non-reasoning { border-top-style:dashed; border-color:#98a2b3; }
    .legend-line.candidate { border-top:2px dotted #b54708; }
    label { display:block; margin:7px 0; }
    button.result { width:100%; text-align:left; border:0; background:#f9fafb; border-radius:6px; padding:7px; margin:4px 0; cursor:pointer; }
    button.result:hover { background:#eef4ff; }
    blockquote { margin:6px 0; padding-left:9px; border-left:3px solid var(--line); color:#475467; }
    pre { white-space:pre-wrap; word-break:break-word; font-size:12px; background:#f9fafb; padding:8px; border-radius:6px; }
    .muted { color:var(--muted); }
    details { margin-top:10px; }
    .mini-graph { width:100%; min-width:0; height:auto; max-height:680px; margin:4px 0 10px; }
    .mini-graph .node-title { font-size:9px; }
    .mini-graph .node-summary { font-size:7.5px; }
    .mini-graph .operator .node-title { font-size:14px; }
    .mode-note { margin:0 0 10px; padding:8px; border-radius:7px; background:#f2f4f7; color:#475467; font-size:12px; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Gaia Formalization Viewer</h1>
    <span id="developer-badge" hidden>开发者模式</span>
    <input id="search" type="search" placeholder="搜索 claim ID 或正文…">
    <input id="file-input" type="file" accept=".json,application/json">
    <button id="drop-file" class="toolbar" type="button">打开 formalization</button>
    <span id="validation-status"></span>
    <select id="stage" aria-label="图版本" hidden></select>
    <select id="view-mode" aria-label="查看模式" hidden><option value="standard" selected>Standard</option></select>
    <button id="reset-layout" class="toolbar" type="button">重置布局</button>
  </header>
  <main>
    <aside id="left">
      <div id="mode-note" class="mode-note"></div>
      <div class="section-title">Layers</div>
      <div id="layers"></div>
      <div class="section-title">Edge legend</div>
      <div class="legend-item"><span class="legend-line"></span>已确认推理</div>
      <div class="legend-item"><span class="legend-line non-reasoning"></span>非推理关系 / weakpoint</div>
      <div class="legend-item"><span class="legend-line candidate"></span>待确认推理</div>
      <div class="section-title">Interaction</div>
      <div class="muted">单击 weakpoint 块可在大图展开／折叠局部推理；单击其他节点或边查看属性；节点可拖动。</div>
      <div class="section-title">Search results</div>
      <div id="results" class="muted">输入关键词进行搜索</div>
    </aside>
    <section id="canvas-wrap"><svg id="graph" role="img"></svg></section>
    <aside id="detail"><div class="muted">单击节点或边，在这里查看属性。</div></aside>
  </main>

"], "text": "Quaternion matrix multiplications have the same asymptotic time complexity as the corresponding real matrix multiplications.", "title": "claim_4"}, {"id": "search:1:claim_5", "metadata": {"step": 1}, "refs": ["step:1:knowledge:claim_5"], "tags": ["claim", "step-1"], "text": "The parameter reduction described in claim 2 is achieved without increasing matrix-multiplication time complexity. [Referenced claim 2: Representing layer weights as quaternion matrices and grouping four real feature channels into one quaternion reduces the number of independent trainable real parameters by a factor of four relative to an equivalent real-valued GNN weight matrix.]", "title": "claim_5"}, {"id": "search:1:claim_6", "metadata": {"step": 1}, "refs": ["step:1:knowledge:claim_6"], "tags": ["claim", "step-1"], "text": "When QMPNN variants of standard GNN architectures are trained under the same hyperparameters as those standard GNN architectures and evaluated on standard datasets, the quaternion models achieve comparable or better accuracy, ROC-AUC, or Hits@K (proportion of top-K predictions that are correct) while using roughly one-fourth of the trainable parameters of those standard GNN architectures.", "title": "claim_6"}, {"id": "search:1:claim_7", "metadata": {"step": 1}, "refs": ["step:1:knowledge:claim_7"], "tags": ["observation_claim", "step-1"], "text": "(a) node classification on Cora: real GCN 85.2 ± 1.3 accuracy with 140.5K parameters vs QGCN 84.1 ± 1.5 accuracy with 42.1K parameters;", "title": "claim_7"}, {"id": "search:1:claim_8", "metadata": {"step": 1}, "refs": ["step:1:knowledge:claim_8"], "tags": ["observation_claim", "step-1"], "text": "(b) node classification on PubMed: GCN 79.1 ± 1.2 with 131.9K parameters vs QGCN 78.4 ± 1.4 with 41.7K parameters;", "title": "claim_8"}, {"id": "search:1:claim_9", "metadata": {"step": 1}, "refs": ["step:1:knowledge:claim_9"], "tags": ["observation_claim", "step-1"], "text": "(c) link prediction on CORA: GCN ROC-AUC 79.27 ± 0.47 with 96.0K parameters vs QGCN ROC-AUC 83.55 ± 0.03 with 27.2K parameters;", "title": "claim_9"}, {"id": "search:1:claim_10", "metadata": {"step": 1}, "refs": ["step:1:knowledge:claim_10"], "tags": ["observation_claim", "step-1"], "text": "(d) graph classification on MUTAG: GCN 83.54 ± 0.40 accuracy with 4.8K parameters vs QGCN 88.61 ± 0.66 accuracy with 4.4K parameters.", "title": "claim_10"}, {"id": "search:1:claim_11", "metadata": {"step": 1}, "refs": ["step:1:knowledge:claim_11"], "tags": ["claim", "step-1"], "text": "Across all tasks and datasets evaluated, quaternion variants of standard GNN architectures frequently perform within a small margin of the corresponding real models and sometimes exceed their performance while consistently having approximately one-fourth the trainable parameter count of the corresponding real models.", "title": "claim_11"}, {"id": "search:1:claim_12", "metadata": {"step": 1}, "refs": ["step:1:knowledge:claim_12"], "tags": ["claim", "step-1"], "text": "Winning graph-lottery tickets exist for both real-valued GNNs and QMPNNs.", "title": "claim_12"}, {"id": "search:1:claim_13", "metadata": {"step": 1}, "refs": ["step:1:knowledge:claim_13"], "tags": ["claim", "step-1"], "text": "Magnitude-based iterative pruning identifies subnetworks that match baseline performance at sparsity levels down to approximately 1–20% of the original parameter count across multiple architectures and tasks.", "title": "claim_13"}, {"id": "search:1:claim_14", "metadata": {"step": 1}, "refs": ["step:1:knowledge:claim_14"], "tags": ["claim", "step-1"], "text": "QMPNN variants scale to large graph datasets and maintain performance comparable to real-valued GNNs while using fewer parameters.", "title": "claim_14"}, {"id": "search:1:claim_15", "metadata": {"step": 1}, "refs": ["step:1:knowledge:claim_15"], "tags": ["observation_claim", "step-1"], "text": "on OGBN-Arxiv node classification, GCN achieves 72.8 ± 1.5 accuracy with 145.1K parameters versus QGCN     function showDetail(item){if(!item)return;const details=item.details||item.metadata||item,isCoarseWeakpoint=item.kind==='strategy'&&details.form==='coarse',sourceLink=details?.href?`<p><a href="${esc(details.href)}" target="_blank">打开冻结的原始 Artifact</a></p>`:'',anchorIds=item.source_anchor_ids||details?.source_anchor_ids||[],sourceCards=anchorIds.map(anchorId=>sourceByKey.get(`${item.step}:${anchorId}`)).filter(Boolean).map(target=>`<div class="property-card"><a href="${esc(target.href||'#')}" target="_blank">${esc(target.source_kind)} · ${esc(target.anchor_id)}</a><div class="muted">${esc(JSON.stringify(target.locator))}</div>${target.quote?`<blockquote>${esc(target.quote)}</blockquote>`:''}</div>`).join(''),sources=sourceCards?`<div class="section-title">原文定位</div>${sourceCards}`:'',findings=item.validation_findings||(item.kind==='validation_finding'?[details]:[]),validation=findings.length?`<div class="section-title">Validation</div>${findings.map(finding=>`<div class="validation-card ${finding.severity==='warning'?'warning':''}"><strong>${esc(finding.rule)}</strong><div>${esc(finding.message)}</div><div class="muted">目标：${esc(finding.target?.type)} · ${esc(finding.target?.id)}</div><div class="muted">位置：${esc(finding.location?.json_pointer)}</div><div>建议：${esc(finding.suggested_action)}</div></div>`).join('')}`:'',kind=item.kind||item.semantic_type||item.edge_class||'property',background=details.background||details.metadata?.background||details.operator?.metadata?.background,reasoningType=details.payload?.reasoning_type,basics=`<div class="section-title">Properties</div><div class="property-card">${propertyRow('step',item.step)}${propertyRow('entity ID',item.entity_id)}${propertyRow('operator ID',details.operator_id||details.id)}${isCoarseWeakpoint?'':propertyRow('type',details.type||item.semantic_type||item.kind)}${propertyRow('reasoning type',reasoningType)}${isCoarseWeakpoint?'':propertyRow('background',background)}${propertyRow('layer',item.layer)}${propertyRow('edge class',item.edge_class)}${propertyRow('reasoning',item.reasoning_state)}${propertyRow('fold groups',item.fold_groups||item.fold_group)}</div>`;document.getElementById('detail').innerHTML=`<h2>${esc(nodeIdentifier(item))}</h2><div class="muted">${esc(kind)} · ${esc(item.id||'')}</div><p>${esc(item.summary||item.text||'')}</p>${basics}${weakpointCard(item)}${miniGraphMarkup(item)}${validation}${sources}${sourceLink}<details ${devMode?'open':''}><summary>完整属性</summary><pre>${esc(JSON.stringify(details,null,2))}</pre></details>`;}

    document.getElementById('view-mode').addEventListener('change',event=>{state.mode=event.target.value;state.step=modeStep();state.expandedWeakpoints.clear();state.manualPositions.clear();state.selectedId=null;clearDetail();updateModeNote();updateValidationStatus();buildLayers(true);runSearch();});
    document.getElementById('search').addEventListener('input',event=>{state.query=event.target.value;runSearch();});
    document.getElementById('reset-layout').addEventListener('click',()=>{state.manualPositions.clear();renderGraph();});
    configureModeControls();updateValidationStatus();buildLayers(true);renderGraph();
    }
  </script>
</body>
