<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gaia Formalization Viewer</title>
  <style>
    :root { color-scheme:light; --ink:#172033; --muted:#667085; --line:#d0d5dd; --paper:#f7f8fa; --accent:#175cd3; --error:#d92d20; --warning:#dc6803; --passed:#067647; }
    * { box-sizing:border-box; }
    body { min-width:1080px; margin:0; color:var(--ink); background:var(--paper); font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif; }
    header { display:flex; gap:12px; align-items:center; height:59px; padding:12px 16px; background:white; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:3; }
    h1 { font-size:16px; margin:0 auto 0 0; }
    h2 { font-size:17px; margin:0 0 4px; overflow-wrap:anywhere; }
    input,select,button.toolbar { border:1px solid var(--line); border-radius:7px; padding:7px 9px; background:white; }
    button.toolbar { cursor:pointer; }
    #search { width:min(360px,30vw); }
    #file-input { display:none; }
    #drop-file { cursor:pointer; }
    body.file-dragging::after { content:'释放以打开 formalization.json'; position:fixed; inset:12px; display:grid; place-items:center; border:3px dashed var(--accent); border-radius:16px; background:rgba(238,244,255,.94); color:var(--accent); font-size:20px; font-weight:800; z-index:20; pointer-events:none; }
    #developer-badge { padding:5px 8px; border-radius:999px; color:#6941c6; background:#f4f3ff; font-size:12px; font-weight:700; }
    main { display:grid; grid-template-columns:180px minmax(560px,1fr) 380px; min-height:calc(100vh - 59px); }
    aside { background:white; padding:14px; overflow:auto; }
    #left { border-right:1px solid var(--line); }
    #detail { position:sticky; top:59px; height:calc(100vh - 59px); border-left:1px solid var(--line); }
    #canvas-wrap { overflow:auto; padding:16px; }
    svg { background:white; border:1px solid var(--line); border-radius:10px; min-width:100%; touch-action:none; }
    .edge { fill:none; stroke:#667085; stroke-width:1.7; marker-end:url(#arrow); cursor:pointer; }
    .edge.non-reasoning { stroke:#98a2b3; stroke-dasharray:7 5; }
    .edge.reasoning-candidate { stroke:#b54708; stroke-dasharray:2 5; }
    .edge.infer { stroke:#667085; stroke-dasharray:8 5; }
    .edge.relational { marker-end:none; }
    .edge.equivalence { marker-start:url(#arrow-start); marker-end:url(#arrow); }
    .edge.selected { stroke:var(--accent); stroke-width:3.5; }
    .edge.validation-failed { stroke:var(--error); stroke-width:3; stroke-dasharray:7 4; }
    .edge.validation-warning { stroke:var(--warning); stroke-width:3; }
    .edge-label { fill:var(--muted); font-size:10px; cursor:pointer; user-select:none; paint-order:stroke; stroke:white; stroke-width:4px; }
    .edge-label.selected { fill:var(--accent); font-weight:700; }
    .node .node-shape { stroke-width:1.6; cursor:grab; }
    .node.dragging .node-shape { cursor:grabbing; stroke:var(--accent); stroke-width:3; }
    .node.selected .node-shape { stroke:var(--accent); stroke-width:3.5; }
    .node text { pointer-events:none; fill:var(--ink); }
    .node-title { font-size:13px; font-weight:750; }
    .node-summary { font-size:11px; fill:#344054 !important; }
    .node.hit .node-shape { stroke:#f79009; stroke-width:3; }
    .node.validation-failed .node-shape { stroke:var(--error); stroke-width:3; }
    .node.validation-warning .node-shape { stroke:var(--warning); stroke-width:3; }
    .tone-claim .node-shape { fill:#e3f2fd; stroke:#1976d2; }
    .tone-observation .node-shape { fill:#e8f5e9; stroke:#43a047; }
    .node.observation-proposal .node-shape { stroke-dasharray:8 5; stroke-width:2.4; }
    .node.relation-display .node-shape { stroke-dasharray:6 4; stroke-width:2.2; }
    .tone-hypothesis .node-shape { fill:#f3e5f5; stroke:#7b1fa2; }
    .tone-caveat .node-shape { fill:#fff3e0; stroke:#ef6c00; }
    .tone-alternative .node-shape { fill:#fff1f0; stroke:#d92d20; stroke-dasharray:5 4; }
    .tone-limit .node-shape { fill:#ffebee; stroke:#c62828; }
    .tone-bridge .node-shape { fill:#fffde7; stroke:#f9a825; }
    .tone-setting .node-shape { fill:#f5f5f5; stroke:#616161; stroke-dasharray:5 4; }
    .tone-source .node-shape { fill:#f5f5f5; stroke:#757575; }
    .tone-registry .node-shape { fill:#eceff1; stroke:#546e7a; stroke-dasharray:5 4; }
    .tone-derived .node-shape { fill:#ede7f6; stroke:#673ab7; }
    .tone-weakpoint .node-shape { fill:#fff9c4; stroke:#f9a825; stroke-dasharray:5 4; }
    .operator .node-title { font-size:21px; text-anchor:middle; dominant-baseline:middle; }
    .op-implication .node-shape { fill:#e8f1ff; stroke:#175cd3; }
    .op-conjunction .node-shape { fill:#fff4e5; stroke:#e07912; }
    .op-disjunction .node-shape { fill:#f4f3ff; stroke:#7f56d9; }
    .op-equivalence .node-shape { fill:#e7f8f4; stroke:#0e9384; }
    .op-contradiction .node-shape { fill:#fee4e2; stroke:#d92d20; }
    .op-negation .node-shape,.op-complement .node-shape { fill:#f2f4f7; stroke:#475467; }
    #validation-status { white-space:nowrap; font-weight:700; }
    #validation-status.passed { color:var(--passed); }
    #validation-status.failed { color:var(--error); }
    #validation-status.warning { color:var(--warning); }
    .validation-card { border-left:4px solid var(--error); background:#fef3f2; padding:8px; margin:8px 0; }
    .validation-card.warning { border-color:var(--warning); background:#fff6ed; }
    .property-card { padding:9px 10px; margin:7px 0; border:1px solid #eaecf0; border-radius:7px; background:#f9fafb; }
    .property-row { display:grid; grid-template-columns:100px minmax(0,1fr); gap:7px; margin:4px 0; }
    .property-key { color:var(--muted); }
    .section-title { color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin:12px 0 6px; }
    .legend-item { display:flex; align-items:center; gap:8px; margin:6px 0; color:var(--muted); font-size:12px; }
    .legend-line { display:inline-block; width:34px; border-top:2px solid #667085; }
    .legend-line.non-reasoning { border-top-style:dashed; border-color:#98a2b3; }
    .legend-line.candidate { border-top:2px dotted #b54708; }
    label { display:block; margin:7px 0; }
    button.result { width:100%; text-align:left; border:0; background:#f9fafb; border-radius:6px; padding:7px; margin:4px 0; cursor:pointer; }
    button.result:hover { background:#eef4ff; }
    blockquote { margin:6px 0; padding-left:9px; border-left:3px solid var(--line); color:#475467; }
    pre { white-space:pre-wrap; word-break:break-word; font-size:12px; background:#f9fafb; padding:8px; border-radius:6px; }
    .muted { color:var(--muted); }
    details { margin-top:10px; }
    .mini-graph { width:100%; min-width:0; height:auto; max-height:680px; margin:4px 0 10px; }
    .mini-graph .node-title { font-size:9px; }
    .mini-graph .node-summary { font-size:7.5px; }
    .mini-graph .operator .node-title { font-size:14px; }
    .mode-note { margin:0 0 10px; padding:8px; border-radius:7px; background:#f2f4f7; color:#475467; font-size:12px; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Gaia Formalization Viewer</h1>
    <span id="developer-badge" hidden>开发者模式</span>
    <input id="search" type="search" placeholder="搜索 claim ID 或正文…">
    <input id="file-input" type="file" accept=".json,application/json">
    <button id="drop-file" class="toolbar" type="button">打开 formalization</button>
    <span id="validation-status"></span>
    <select id="stage" aria-label="图版本" hidden></select>
    <select id="view-mode" aria-label="查看模式" hidden><option value="standard" selected>Standard</option></select>
    <button id="reset-layout" class="toolbar" type="button">重置布局</button>
  </header>
  <main>
    <aside id="left">
      <div id="mode-note" class="mode-note"></div>
      <div class="section-title">Layers</div>
      <div id="layers"></div>
      <div class="section-title">Edge legend</div>
      <div class="legend-item"><span class="legend-line"></span>已确认推理</div>
      <div class="legend-item"><span class="legend-line non-reasoning"></span>非推理关系 / weakpoint</div>
      <div class="legend-item"><span class="legend-line candidate"></span>待确认推理</div>
      <div class="section-title">Interaction</div>
      <div class="muted">单击 weakpoint 块可在大图展开／折叠局部推理；单击其他节点或边查看属性；节点可拖动。</div>
      <div class="section-title">Search results</div>
      <div id="results" class="muted">输入关键词进行搜索</div>
    </aside>
    <section id="canvas-wrap"><svg id="graph" role="img"></svg></section>
    <aside id="detail"><div class="muted">单击节点或边，在这里查看属性。</div></aside>
  </main>
  <script>__DAGRE_SCRIPT__</script>
  <script id="view-data" type="application/json">__VIEW_DATA__</script>
  <script>
    function formalizationToView(document) {
      const isHelperId=id => /(^|::)__|helper[_-]?relation|operator[_-]?result|disjunction[_-]?result|alternative[_-]?explanation/i.test(String(id));
      const isGaiaIr=!document?.graph && Array.isArray(document?.knowledges);
      const knowledges=isGaiaIr ? Object.fromEntries(document.knowledges.map(item=>[item.id,item])) : (document?.knowledges || {});
      const graph=isGaiaIr ? {nodes:Object.keys(knowledges).filter(id=>!isHelperId(id)), operators:(document.operators || []).map(op=>({...op,type:op.type || op.operator})), strategies:document.strategies || []} : (document?.graph || {});
      const step=4, nodes=[], edges=[], search_documents=[];
      const ids=(Array.isArray(graph.nodes) ? graph.nodes : Object.keys(knowledges)).filter(id=>!isHelperId(id));
      const strategyOperators=(graph.strategies || []).flatMap(strategy => (strategy.formal_expr?.operators || []).map((op,index)=>({...op,id:op.id || `${strategy.strategy_id || strategy.id || 'strategy'}:operator:${index+1}`,type:op.type || op.operator})));
      const nodeId=id => `step:${step}:knowledge:${id}`;
      ids.forEach(id => { const k=knowledges[id] || {}, content=k.content, summary=typeof content==='string' ? content : (content?.canonical || content?.text || '');
        nodes.push({id:nodeId(id), entity_id:id, label:id, display_label:id, display_meta:k.type || 'claim', kind:k.type || 'claim', layer:'claims', step, summary, text:summary, details:k, min_granularity:'overview'});
        search_documents.push({id:nodeId(id), title:id, text:summary, tags:[k.type || 'claim'], refs:[nodeId(id)]}); });
      [...(graph.operators || []),...strategyOperators].forEach((op,index) => { const type=String(op.type || op.operator || 'operator').toLowerCase(), vars=(op.variables || []).filter(id=>ids.includes(id)), conclusion=op.conclusion && ids.includes(op.conclusion) ? op.conclusion : null;
        if (type !== 'equivalence' && type !== 'implication') nodes.push({id:`step:${step}:operator:${op.id || index}`, entity_id:op.id || `operator_${index}`, label:type, display_label:type, display_meta:type, kind:'operator', layer:'operators', step, summary:op.metadata?.expression || type, details:{...op,type,variables:vars,conclusion}, min_granularity:'standard'});
        const opNode=`step:${step}:operator:${op.id || index}`;
        if (type === 'equivalence' || type === 'implication') { if (vars.length >= 2) edges.push({id:`step:${step}:op:${op.id || index}`,source:nodeId(vars[0]),target:nodeId(vars[1]),label:type === 'equivalence' ? '=' : '→',semantic_type:type,layer:'operators',step,reasoning_state:'confirmed'}); }
        else { vars.forEach((source,i)=>edges.push({id:`step:${step}:op:${op.id || index}:in:${i}`,source:nodeId(source),target:opNode,label:'input',semantic_type:type,layer:'operators',step,reasoning_state:'confirmed'})); if (conclusion) edges.push({id:`step:${step}:op:${op.id || index}:out`,source:opNode,target:nodeId(conclusion),label:'output',semantic_type:type,layer:'operators',step,reasoning_state:'confirmed'}); }
      });
      (graph.strategies || []).forEach((strategy,index) => { const premises=(strategy.premises || []).filter(id=>ids.includes(id)), conclusion=strategy.conclusion && ids.includes(strategy.conclusion) ? strategy.conclusion : null; if (!strategy.formal_expr?.operators?.length && conclusion) premises.forEach((source,i)=>edges.push({id:`step:${step}:strategy:${strategy.strategy_id || index}:${i}`,source:nodeId(source),target:nodeId(conclusion),label:'→',semantic_type:'implication',layer:'operators',step,reasoning_state:'confirmed'})); });
      return {title:`${document?.package?.name || 'Formalization'} · Step 4`, source_artifacts:[], nodes, edges, search_documents, layers:[{id:'claims',label:'Formal nodes',default_visible:true},{id:'operators',label:'Operators',default_visible:true}], metadata:{latest_step:step, standalone_formalization:true}, stages:[{number:step,name:'formalization',validation_status:'unknown'}], source_targets:[]};
    }
    function openFormalization(file) { if (!file || (!file.name.toLowerCase().endsWith('.json') && file.type !== 'application/json')) return; const reader=new FileReader(); reader.onload=()=>{ try { const parsed=JSON.parse(reader.result); sessionStorage.setItem('gaia-view-data', JSON.stringify(formalizationToView(parsed))); location.reload(); } catch (error) { alert(`无法读取 formalization JSON：${error.message}`); } }; reader.readAsText(file); }
    const fileInput=document.getElementById('file-input');
    document.getElementById('drop-file').addEventListener('click',()=>fileInput.click());
    fileInput.addEventListener('change',event=>openFormalization(event.target.files[0]));
    ['dragenter','dragover'].forEach(type=>document.addEventListener(type,event=>{event.preventDefault(); document.body.classList.add('file-dragging');}));
    ['dragleave','drop'].forEach(type=>document.addEventListener(type,event=>{event.preventDefault(); document.body.classList.remove('file-dragging');}));
    document.addEventListener('drop',event=>openFormalization(event.dataTransfer?.files?.[0]));
    const storedViewData=sessionStorage.getItem('gaia-view-data');
    const rawViewData=storedViewData || document.getElementById('view-data').textContent.trim();
    if (storedViewData) sessionStorage.removeItem('gaia-view-data');
    if (rawViewData === '__VIEW_' + 'DATA__') {
      document.body.innerHTML='<main style="display:block;max-width:760px;min-height:0;margin:48px auto;padding:28px;background:white;border:1px solid #d0d5dd;border-radius:12px"><h1>这是 Viewer 模板</h1><p>请先执行 <code>python3 -m pipeline_harness view --run &lt;run-dir&gt;</code>，再打开生成的 <code>views/viewer.html</code>。</p></main>';
    } else {
    const view=JSON.parse(rawViewData);
    const devMode=new URLSearchParams(location.search).get('dev') === '1';
    const latestStep=String(view.metadata?.latest_step ?? 'all');
    const state={mode:'standard',step:devMode?latestStep:availableStep('4'),query:'',visibleLayers:new Set(),hits:new Set(),expandedWeakpoints:new Set(),manualPositions:new Map(),positions:new Map(),routes:new Map(),nodeMap:new Map(),edgeMap:new Map(),selectedId:null,drag:null};
    const byId=new Map(view.nodes.map(node => [node.id,node]));
    const sourceByKey=new Map((view.source_targets || []).map(target => [`${target.step}:${target.anchor_id}`,target]));
    const esc=value => String(value ?? '').replace(/[&<>"']/g,c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const norm=value => String(value ?? '').normalize('NFKC').toLocaleLowerCase();
    const groupsFor=item => item?.fold_groups || (item?.fold_group ? [item.fold_group] : []);
    document.getElementById('title').textContent=view.title;

    function modeStep(mode=state.mode) {
      if (devMode) return state.step;
      const desired=mode === 'overview' ? '3' : '4';
      return availableStep(desired);
    }
    function availableStep(desired) { return (view.stages || []).some(item => String(item.number) === String(desired)) ? String(desired) : latestStep; }
    function knowledgeNode(step,entityId) { return byId.get(`step:${step}:knowledge:${entityId}`); }
    function strategyNodes(step) { return view.nodes.filter(node => String(node.step) === String(step) && node.kind === 'strategy'); }
    function operatorSymbol(type) { return ({implication:'→',equivalence:'≡',contradiction:'⊗',complement:'⊕',conjunction:'∧',disjunction:'∨',negation:'¬'})[type] || type || '?'; }
    function operatorType(node) { return node?.details?.type || node?.display_meta || node?.label || 'operator'; }
    function directOperatorEdges(step) { return view.edges.filter(edge => String(edge.step) === String(step) && edge.layer === 'operators' && ['implication','equivalence'].includes(edge.semantic_type)); }
    function nodeIdentifier(node) {
      let value=String(node.entity_id || node.display_label || node.label || node.id);
      const sourceKind=node.details?.metadata?.source_node_kind;
      if (sourceKind === 'conclusion') {const match=value.match(/_conclusion_(\d+)$/); if (match) return `C${match[1]}`;}
      if (sourceKind === 'highlight') {const match=value.match(/_(H\d+)$/); if (match) return match[1];}
      if (node.kind === 'source_anchor') {
        const locator=node.details?.locator || {};
        if (locator.figure) return locator.figure;
        return String(node.details?.relevance || node.details?.source_kind || value).replaceAll('_',' ');
      }
      if (value.startsWith('claim_')) value=value.slice(6);
      if (value.includes('_paper_') && value.includes('_')) value=value.split('_').at(-1);
      return value;
    }
    function weakpointType(node) {
      const details=node.details || {}, payload=details.weakpoint?.payload || {};
      const classification=details.coarse?.classification;
      const type=classification && classification !== 'weakpoint'
        ? classification
        : payload.reasoning_type || details.type || classification || 'weakpoint';
      return String(type).replaceAll('_',' ');
    }
    function nodeTone(node) {
      if (node.kind === 'operator') return `operator op-${operatorType(node)}`;
      if (node.kind === 'strategy' || node.kind === 'weakpoint') return 'tone-weakpoint';
      const kind=String(node.kind || ''), id=String(node.entity_id || '');
      if (id==='AltExp'||id.startsWith('AltExp_')) return 'tone-alternative';
      if (node.kind === 'source_anchor') return 'tone-source';
      if (node.layer === 'registry') return 'tone-registry';
      if (kind==='caveat') return 'tone-caveat';
      if (kind.includes('observation') || kind==='experiment_claim') return 'tone-observation';
      if (kind.includes('hypothesis') || kind==='author_interpretation') return 'tone-hypothesis';
      if (kind==='alternative_placeholder') return 'tone-alternative';
      if (kind==='bridge_claim' || kind==='scope_interpretation') return 'tone-bridge';
      if (kind==='derived_claim') return 'tone-derived';
      if (kind==='setting') return 'tone-setting';
      if (kind==='limitation' || id.endsWith('_P3')) return 'tone-limit';
      return 'tone-claim';
    }
    function effectiveLayer(item) { return item.layer || ''; }

    function configureModeControls() {
      const mode=document.getElementById('view-mode'), stage=document.getElementById('stage'), badge=document.getElementById('developer-badge');
      if (!devMode) {mode.hidden=true; stage.hidden=true; badge.hidden=true; updateModeNote(); return;}
      mode.hidden=true; stage.hidden=false; badge.hidden=false; updateDeveloperModeNote();
      const stages=view.stages || [];
      stages.forEach(item => {
        const option=document.createElement('option');
        const mark=item.validation_status === 'passed' ? '✓' : item.validation_status === 'failed' ? '✕' : item.validation_status === 'warning' ? '⚠' : '·';
        option.value=String(item.number); option.textContent=`${mark} Revision ${item.revision || item.number} · Step ${item.number} · ${item.name}`; stage.appendChild(option);
      });
      stage.value=state.step;
      stage.addEventListener('change',event => {
        state.step=event.target.value; state.manualPositions.clear(); state.selectedId=null;
        updateDeveloperModeNote(); updateValidationStatus(); buildLayers(true); runSearch();
      });
    }
    function updateDeveloperModeNote() {
      const notes={
        '1':'Step 1：证据台账切片；来源仅在节点详情中提供定位，registry 为非推理关系。',
        '2':'Step 2：补齐实验 claim；只显示命题及尚未升级为推理的关联。',
        '3':'Step 3：宏观 weakpoint 图；↝ 块表示已分类但尚未展开的推理缺口。',
        '4':'Step 4：命名 Strategy 按 Gaia 规则派生为 Operator；infer 保留为 Strategy，同时显示未展开 weakpoint。',
        '5':'Step 5：编译与验证后的形式化图；校验结论显示在顶部及对象属性中。',
      };
      document.getElementById('mode-note').textContent=`开发者模式 · ${notes[state.step] || `Step ${state.step} 审核投影`}`;
    }
    function updateModeNote() {
      document.getElementById('mode-note').textContent=state.mode === 'overview'
        ? 'Overview：Step 3 宏观图；↝ 表示已识别但尚未展开的 weakpoint。'
        : 'Standard：显示 claim、实验 claim、输入 claim 及展开后的 Operator；infer 使用虚线边表示。';
    }
    function updateValidationStatus() {
      const host=document.getElementById('validation-status'), target=modeStep();
      const stage=(view.stages || []).find(item => String(item.number) === target);
      if (!stage) {host.textContent=''; host.className=''; return;}
      const status=stage.validation_status; host.className=status || '';
      host.textContent=status === 'passed' ? '✓ 通过校验' : status === 'failed' ? `✕ ${stage.validation_errors || 0} 个错误` : status === 'warning' ? `⚠ ${stage.validation_warnings || 0} 个警告` : '未校验';
    }
    function availableLayers() {
      if (devMode) {
        const ids={
          '1':new Set(['claims','registry']),
          '2':new Set(['claims','registry']),
          '3':new Set(['claims','weakpoints','operators']),
          '4':new Set(['claims','operators','strategies','weakpoints']),
          '5':new Set(['claims','operators','strategies','weakpoints']),
        }[state.step] || new Set(['claims']);
        return view.layers.filter(layer => ids.has(layer.id));
      }
      const normalLayers=new Set(['claims','weakpoints','operators']);
      return view.layers.filter(layer => normalLayers.has(layer.id));
    }
    function buildLayers(reset=false) {
      const host=document.getElementById('layers'); host.innerHTML='';
      if (reset) state.visibleLayers.clear();
      availableLayers().forEach(layer => {
        const defaultVisible=layer.default_visible !== false;
        if (reset && defaultVisible) state.visibleLayers.add(layer.id);
        const label=document.createElement('label');
        label.innerHTML=`<input type="checkbox" data-layer="${esc(layer.id)}" ${state.visibleLayers.has(layer.id)?'checked':''}> ${esc(layer.label || layer.id)}`;
        label.querySelector('input').addEventListener('change',event => {event.target.checked ? state.visibleLayers.add(layer.id) : state.visibleLayers.delete(layer.id); renderGraph();});
        host.appendChild(label);
      });
    }

    function overviewProjection(step=modeStep('overview')) {
      const weakpoints=view.nodes.filter(node => String(node.step) === String(step) && node.kind === 'weakpoint');
      const weakpointIds=new Set(weakpoints.map(node => node.id));

      const layouts=components.map(component=>({component,layout:normalizedLayout(component.nodes,dagreLayout(component.nodes,component.edges,false,false),false)})),positions=new Map(),routes=new Map(),outer=36,gap=72,smallGap=36,smallLimit=5,smallColumns=3;let y=outer,maxWidth=980,smallRow=[];
      const place=(entry,x,top)=>{entry.layout.positions.forEach((position,id)=>positions.set(id,{x:position.x+x,y:position.y+top}));entry.layout.routes.forEach((points,id)=>routes.set(id,points.map(point=>({x:point.x+x,y:point.y+top}))));maxWidth=Math.max(maxWidth,x+entry.layout.width+outer);};
      const flushSmall=()=>{if(!smallRow.length)return;let x=outer,rowHeight=0;smallRow.forEach(entry=>{place(entry,x,y);x+=entry.layout.width+smallGap;rowHeight=Math.max(rowHeight,entry.layout.height);});y+=rowHeight+gap;smallRow=[];};
      layouts.forEach(entry=>{if(entry.component.nodes.length<=smallLimit){smallRow.push(entry);if(smallRow.length===smallColumns)flushSmall();return;}flushSmall();place(entry,outer,y);y+=entry.layout.height+gap;});flushSmall();
      if(useManual)nodes.forEach(node=>{const manual=state.manualPositions.get(node.id);if(!manual)return;positions.set(node.id,{...manual});[...routes.keys()].forEach(edgeId=>{const edge=edges.find(item=>item.id===edgeId);if(edge&&(edge.source===node.id||edge.target===node.id))routes.delete(edgeId);});});

    function automaticLayout(nodes,edges,mini=false,useManual=true) {
      try{return componentLayout(nodes,edges,mini,useManual);}catch(error){console.warn('Dagre layout failed; using ranked fallback.',error);return rankedLayout(nodes,layoutConstraintEdges(nodes,edges),mini,useManual);}
    }
    function edgeGeometry(a,b,source,target,mini=false,route=null) {
      if(Array.isArray(route)&&route.length>1){const middle=route[Math.floor(route.length/2)],d=route.map((point,index)=>`${index?'L':'M'} ${point.x} ${point.y}`).join(' ');return {d,lx:middle.x+4,ly:middle.y-4};}
      const as=nodeSize(source,mini),bs=nodeSize(target,mini);if(Math.abs(a.y-b.y)<Math.max(as.h,bs.h)*.55){const forward=b.x>=a.x,x1=forward?a.x+as.w:a.x,x2=forward?b.x:b.x+bs.w,y1=a.y+as.h/2,y2=b.y+bs.h/2;return {d:`M ${x1} ${y1} C ${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}`,lx:(x1+x2)/2,ly:y1-6};}const downward=b.y>a.y,x1=a.x+as.w/2,y1=downward?a.y+as.h:a.y,x2=b.x+bs.w/2,y2=downward?b.y:b.y+bs.h,mid=(y1+y2)/2;return {d:`M ${x1} ${y1} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2}`,lx:(x1+x2)/2+4,ly:mid-4};
    }
    function splitText(value,limit=36,maxLines=2){let rest=String(value||'').replace(/\s+/g,' ').trim();const lines=[];while(rest&&lines.length<maxLines){if(rest.length<=limit){lines.push(rest);rest='';break;}const sample=rest.slice(0,limit+1),space=sample.lastIndexOf(' '),cut=space>=Math.floor(limit*.55)?space:limit;lines.push(rest.slice(0,cut).trim());rest=rest.slice(cut).trim();}if(rest&&lines.length)lines[lines.length-1]=`${lines.at(-1).replace(/[.…]+$/,'')}…`;return lines;}
    function shapeMarkup(node,size){const type=operatorType(node),w=size.w,h=size.h;if(node.kind!=='operator')return `<rect class="node-shape" width="${w}" height="${h}" rx="${node.kind==='strategy'||node.kind==='weakpoint'?26:9}"></rect>`;if(type==='conjunction')return `<polygon class="node-shape" points="${w/2},0 ${w},${h/2} ${w/2},${h} 0,${h/2}"></polygon>`;if(type==='disjunction')return `<polygon class="node-shape" points="${w*.22},0 ${w*.78},0 ${w},${h/2} ${w*.78},${h} ${w*.22},${h} 0,${h/2}"></polygon>`;if(type==='equivalence')return `<ellipse class="node-shape" cx="${w/2}" cy="${h/2}" rx="${w/2-1}" ry="${h/2-1}"></ellipse><ellipse class="node-shape" cx="${w/2}" cy="${h/2}" rx="${w/2-5}" ry="${h/2-5}" fill="none"></ellipse>`;if(type==='contradiction')return `<polygon class="node-shape" points="${w*.22},0 ${w*.78},0 ${w},${h*.25} ${w},${h*.75} ${w*.78},${h} ${w*.22},${h} 0,${h*.75} 0,${h*.25}"></polygon>`;return `<rect class="node-shape" width="${w}" height="${h}" rx="${h/2}"></rect>`;}
    function nodeMarkup(node,position,mini=false,interactive=true){const size=nodeSize(node,mini),tone=nodeTone(node),proposal=node.kind==='observation_proposal'?' observation-proposal':'',relationDisplay=node.kind==='relation_display'?' relation-display':'',hit=state.hits.has(node.id)?' hit':'',selected=state.selectedId===node.id?' selected':'',validation=node.validation_status==='failed'?' validation-failed':node.validation_status==='warning'?' validation-warning':'',data=interactive?` data-node="${esc(node.id)}"`:'';let text='';if(node.kind==='operator')text=`<text class="node-title" x="${size.w/2}" y="${size.h/2+1}">${esc(operatorSymbol(operatorType(node)))}</text>`;else if(isAlternativePlaceholder(node))text=`<text class="node-title" x="${size.w/2}" y="${size.h/2+1}" text-anchor="middle" dominant-baseline="middle">${esc(nodeIdentifier(node))}</text>`;else if(node.kind==='strategy'||node.kind==='weakpoint')text=`<text class="node-title" x="12" y="23">↝ ${esc(node.kind==='weakpoint'?'weakpoint':nodeIdentifier(node))}</text><text class="node-summary" x="12" y="44">${esc(node.kind==='weakpoint'?'evidence / example':weakpointType(node))}</text>`;else{const lines=splitText(node.summary,mini?21:38,2),title=esc(nodeIdentifier(node));text=`<text class="node-title" x="${mini?7:12}" y="${mini?17:24}">${title}</text>${lines.map((line,index)=>`<text class="node-summary" x="${mini?7:12}" y="${(mini?33:51)+index*(mini?11:17)}">${esc(line)}</text>`).join('')}`;}return `<g class="node ${tone}${proposal}${relationDisplay}${hit}${selected}${validation}"${data} transform="translate(${position.x},${position.y})"><title>${esc([node.entity_id,node.summary].filter(Boolean).join('\n'))}</title>${shapeMarkup(node,size)}${text}</g>`;}
    function edgeMarkup(edge,positions,nodeMap,mini=false,interactive=true,routes=new Map()){const source=nodeMap.get(edge.source),target=nodeMap.get(edge.target),a=positions.get(edge.source),b=positions.get(edge.target);if(!source||!target||!a||!b)return '';const geometry=edgeGeometry(a,b,source,target,mini,routes.get(edge.id)),non=edge.edge_class==='non_reasoning'?' non-reasoning':'',candidate=edge.edge_class==='reasoning'&&edge.reasoning_state==='candidate'?' reasoning-candidate':'',infer=edge.semantic_type==='infer'?' infer':'',relational=['contradiction','complement'].includes(edge.semantic_type)?' relational':'',equivalence=edge.semantic_type==='equivalence'?' equivalence':'',arrows=edge.semantic_type==='equivalence'?` marker-start="url(#${mini?'mini-':''}arrow-start)" marker-end="url(#${mini?'mini-':''}arrow)"`:` marker-end="url(#${mini?'mini-':''}arrow)"`,validation=edge.validation_status==='failed'?' validation-failed':edge.validation_status==='warning'?' validation-warning':'',selected=state.selectedId===edge.id?' selected':'',data=interactive?` data-edge="${esc(edge.id)}" data-source="${esc(edge.source)}" data-target="${esc(edge.target)}"`:'',showAuditLabel=devMode&&['1','2'].includes(state.step),label=showAuditLabel?(edge.details?.metadata?.relation_id||edge.label):edge.semantic_type==='background'||edge.semantic_type==='infer'?edge.label:'';return `<path class="edge${non}${candidate}${infer}${relational}${equivalence}${validation}${selected}"${arrows}${data} d="${geometry.d}"></path>${label?`<text class="edge-label${selected}"${data} x="${geometry.lx}" y="${geometry.ly}">${esc(label)}</text>`:''}`;}
    function updateConnectedEdges(nodeId){document.querySelectorAll('#graph [data-edge]').forEach(element=>{if(element.dataset.source!==nodeId&&element.dataset.target!==nodeId)return;const source=state.nodeMap.get(element.dataset.source),target=state.nodeMap.get(element.dataset.target),a=state.positions.get(element.dataset.source),b=state.positions.get(element.dataset.target);if(!source||!target||!a||!b)return;const geometry=edgeGeometry(a,b,source,target,false);if(element.tagName.toLowerCase()==='path')element.setAttribute('d',geometry.d);else{element.setAttribute('x',geometry.lx);element.setAttribute('y',geometry.ly);}});}
    function svgPoint(event,svg){const point=svg.createSVGPoint();point.x=event.clientX;point.y=event.clientY;return point.matrixTransform(svg.getScreenCTM().inverse());}

    function propertyRow(key,value){if(value==null||value===''||(Array.isArray(value)&&!value.length))return '';const rendered=typeof value==='object'?JSON.stringify(value):String(value);return `<div class="property-row"><div class="property-key">${esc(key)}</div><div>${esc(rendered)}</div></div>`;}
    function clearDetail(){document.getElementById('detail').innerHTML='<div class="muted">单击节点或边，在这里查看属性。</div>';}
    function weakpointCard(item){if(item.kind!=='strategy'||item.details?.form!=='coarse')return '';const details=item.details||{},proposal=details.weakpoint||{},payload=proposal.payload||{},review=proposal.review||{},type=weakpointType(item),reasoningType=String(payload.reasoning_type||details.type||'').replaceAll('_',' ');return `<div class="section-title">Weakpoint</div><div class="property-card">${propertyRow('status',details.review_status)}${propertyRow('type',type)}${reasoningType&&reasoningType!==type?propertyRow('reasoning type',reasoningType):''}${propertyRow('gap type',payload.gap_type)}${propertyRow('premises',details.premises)}${propertyRow('conclusion',details.conclusion)}${propertyRow('background',details.background)}${propertyRow('rationale',payload.rationale||details.coarse?.necessity_test?.rationale)}${propertyRow('review',review.decision||review.status)}</div>`;}
    function miniGraphMarkup(item){const strategyId=expandableStrategyId(item);if(!strategyId)return '';const graph=localFormalGraph(strategyId,false);if(!graph.nodes.length)return '<div class="muted">Step 4 中没有对应的局部展开图。</div>';const layout=automaticLayout(graph.nodes,graph.edges,true,false),nodeMap=new Map(graph.nodes.map(node=>[node.id,node])),defs='<defs><marker id="mini-arrow" markerWidth="7" markerHeight="7" refX="6" refY="2.5" orient="auto"><path d="M0,0 L0,5 L7,2.5 z" fill="#667085"></path></marker><marker id="mini-arrow-start" markerWidth="7" markerHeight="7" refX="6" refY="2.5" orient="auto-start-reverse"><path d="M0,0 L0,5 L7,2.5 z" fill="#667085"></path></marker></defs>',edges=graph.edges.map(edge=>edgeMarkup(edge,layout.positions,nodeMap,true,false,layout.routes).replaceAll('url(#arrow-start)','url(#mini-arrow-start)').replaceAll('url(#arrow)','url(#mini-arrow)')).join(''),nodes=graph.nodes.map(node=>nodeMarkup(node,layout.positions.get(node.id),true,false)).join('');return `<div class="section-title">Step 4 局部推理</div><svg class="mini-graph" data-layout-engine="${esc(layout.engine)}" viewBox="0 0 ${layout.width} ${layout.height}" aria-label="${esc(strategyId)} 的 Step 4 局部推理图">${defs}${edges}${nodes}</svg>`;}
