"title": "E:O67"}, {"id": "search:papers:paper_f519c93b::claim_E_imported_11", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E_imported_11"], "tags": ["claim", "weakpoints"], "text": "On the Cora node classification task, without fine-tuning, accuracy falls from a baseline of 0.86 to 0.76 under 90% sparsity.", "title": "E:E_imported_11"}, {"id": "search:papers:paper_f519c93b::claim_E_imported_13", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E_imported_13"], "tags": ["claim", "weakpoints"], "text": "With fine-tuning applied, accuracy at 90% sparsity returns to approximately 0.89.", "title": "E:E_imported_13"}, {"id": "search:papers:paper_f519c93b::claim_E_imported_3", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E_imported_3"], "tags": ["claim", "weakpoints"], "text": "In the Cora node classification task, global pruning yields a ratio of baseline model size to pruned model size of 4.76× at 80% sparsity and 8.98× at 90% sparsity.", "title": "E:E_imported_3"}, {"id": "search:papers:paper_f519c93b::claim_E_imported_37", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E_imported_37"], "tags": ["claim", "claims"], "text": "DQ-INT8 on BBBP attains an accuracy of 0.83 ± 0.01, an inference time of 2.04 seconds, and an energy consumption of 24.78 ± 0.17 J.", "title": "E:E_imported_37"}, {"id": "search:papers:paper_f519c93b::claim_E_imported_39", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E_imported_39"], "tags": ["claim", "claims"], "text": "On Proteins, DQ-INT8 reaches accuracy 0.72 ± 0.01 with energy usage 28.74 ± 2.72 J.", "title": "E:E_imported_39"}, {"id": "search:papers:paper_f519c93b::claim_E_imported_40", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E_imported_40"], "tags": ["claim", "claims"], "text": "QAT-INT8 reaches accuracy 0.72 ± 0.01 and energy 37.19 ± 3.09 J.", "title": "E:E_imported_40"}, {"id": "search:papers:paper_f519c93b::claim_E_imported_43", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E_imported_43"], "tags": ["claim", "claims"], "text": "For BBBP, DQ-INT4 has an accuracy of 0.77 ± 0.02 and an energy draw of 33.69 ± 4.18 J.", "title": "E:E_imported_43"}, {"id": "search:papers:paper_f519c93b::claim_E_imported_44", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E_imported_44"], "tags": ["claim", "claims"], "text": "On Proteins, accuracy amounts to 0.61 ± 0.02 and energy to 30.26 ± 3.39 J.", "title": "E:E_imported_44"}, {"id": "search:papers:paper_f519c93b::claim_E_imported_48", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E_imported_48"], "tags": ["claim", "claims"], "text": "A2Q obtains accuracy 0.59 ± 0.01 on BBBP.", "title": "E:E_imported_48"}, {"id": "search:papers:paper_f519c93b::claim_E_imported_49", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E_imported_49"], "tags": ["claim", "claims"], "text": "Memory consumption reaches 80.15 ± 0.49 GB.", "title": "E:E_imported_49"}, {"id": "search:papers:paper_f519c93b::claim_E_imported_50", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E_imported_50"], "tags": ["claim", "claims"], "text": "On Proteins, the achieved accuracy is 0.70 ± 0.00.", "title": "E:E_imported_50"}, {"id": "search:papers:paper_f519c93b::claim_E_imported_51", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E_imported_51"], "tags": ["claim", "claims"], "text": "Memory consumption sits at 77.35 ± 0.78 GB.", "title": "E:E_imported_51"}, {"id": "search:papers:paper_f519c93b::claim_E_imported_52", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E_imported_52"], "tags": ["claim", "claims"], "text": "Memory used by QAT-INT8 and DQ-INT8 is around 37–47 GB.", "title": "E:E_imported_52"}, {"id": "search:papers:paper_f519c93b::claim_E_imported_66", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E_imported_66"], "tags": ["claim", "claims"], "text": "For BBBP, energy hits 80 J and CPU hits 58% when rates are between 0.6 and 0.8.", "title": "E:E_imported_66"}, {"id": "search:papers:paper_f519c93b::claim_E01", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E01"], "tags": ["claim", "weakpoints"], "text": "In layer-wise sparsity tolerance tests on GNNNets with BBBP, Spline with Cora, and HGPSL with Proteins, early convolutional layers handled more pruning, whereas linear layers showed greater sensitivity.", "title": "E:E01"}, {"id": "search:papers:paper_f519c93b::claim_E02", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E02"], "tags": ["claim", "weakpoints"], "text": "Fine-grained pruning with fine-tuning performs better on BBBP and Cora-Node, but is ineffective on Cora-Link.", "title": "E:E02"}, {"id": "search:papers:paper_f519c93b::claim_E03", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E03"], "tags": ["claim", "weakpoints"], "text": "Compared to global pruning, fine-grained pruning on BBBP, Cora-Node, and Proteins is more aggressive and causes larger accuracy reductions.", "title": "E:E03"}, {"id": "search:papers:paper_f519c93b::claim_E04", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E04"], "tags": ["claim", "claims"], "text": "Under extreme pruning, Cora-Link is affected to the same degree by both fine-grained pruning and global pruning.", "title": "E:E04"}, {"id": "search:papers:paper_f519c93b::claim_E08", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E08"], "tags": ["claim", "weakpoints"], "text": "Global pruning proved more robust than fine-grained pruning across tasks, particularly for link prediction.", "title": "E:E08"}, {"id": "search:papers:paper_f519c93b::claim_E09", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E09"], "tags": ["claim", "claims"], "text": "In the datasets and sparsity levels considered in Figure 5, fine-grained pruning generally used more energy than global pruning for most datasets, particularly at lower sparsity (0.1–0.3), whereas global pruning showed greater consistency and better energy efficiency at medium-to-high sparsity (0.4–0.8).", "title": "E:E09"}, {"id": "search:papers:paper_f519c93b::claim_E10", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E10"], "tags": ["claim", "claims"], "text": "During the energy consumption test, BBBP's energy varies from 24 to 42 for rates no greater than 1e-2, peaks sharply at 80 between rates 0.6 and 0.8, and subsequently falls.", "title": "E:E10"}, {"id": "search:papers:paper_f519c93b::claim_E11", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E11"], "tags": ["claim", "claims"], "text": "Cora-Node's energy consumption over the energy experiment is stable, ranging from 26 to 37.", "title": "E:E11"}, {"id": "search:papers:paper_f519c93b::claim_E12", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E12"], "tags": ["claim", "claims"], "text": "Proteins energy stays within 22 to 28 across all rates during the energy test, aside from small variations.", "title": "E:E12"}, {"id": "search:papers:paper_f519c93b::claim_E19", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E19"], "tags": ["claim", "claims"], "text": "As regularization rates rose, energy usage generally went up, though it jumped at particular thresholds, e.g., 0.6–0.8 for BBBP.", "title": "E:E19"}, {"id": "search:papers:paper_f519c93b::claim_E20", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E20"], "tags": ["claim", "claims"], "text": "Energy consumption can be reduced by regularization rates ranging from 1.00 to 10^6.", "title": "E:E20"}, {"id": "search:papers:paper_f519c93b::claim_E21", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E21"], "tags": ["claim", "claims"], "text": "Energy consumption varied less for Proteins and Cora-Node than for the remaining datasets.", "title": "E:E21"}, {"id": "search:papers:paper_f519c93b::claim_E22", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E22"], "tags": ["claim", "claims"], "text": "In Cora-Link, changing the regularization rate made energy consumption reach 22–32 when rates were below 0.9, go up to 77 at rates 1e2 and 10e6, and stay between 26 and 28 in other cases.", "title": "E:E22"}, {"id": "search:papers:paper_f519c93b::claim_E23", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E23"], "tags": ["claim", "claims"], "text": "Energy and CPU use reached high points at regulation rates between 0.1 and 0.9, a sign of inefficiency.", "title": "E:E23"}, {"id": "search:papers:paper_f519c93b::claim_E24", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E24"], "tags": ["claim", "claims"], "text": "Accuracy was maintained for regularization rates below 1e-2, while rates above that range harmed accuracy.", "title": "E:E24"}, {"id": "search:papers:paper_f519c93b::claim_E25", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E25"], "tags": ["claim", "claims"], "text": "Regularization rates around 1e-6 to 1e-2 usually provided the best trade-off between keeping accuracy and using resources efficiently, with larger rates harming both.", "title": "E:E25"}, {"id": "search:papers:paper_f519c93b::claim_E26", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E26"], "tags": ["claim", "claims"], "text": "Although accuracy drops, resource usage may decrease when regularization rates are very high (at least 1e2).", "title": "E:E26"}, {"id": "search:papers:paper_f519c93b::claim_E27", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E27"], "tags": ["claim", "claims"], "text": "For Proteins, changing the regularization rate affected resource usage only slightly.", "title": "E:E27"}, {"id": "search:papers:paper_f519c93b::claim_E28", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E28"], "tags": ["claim", "weakpoints"], "text": "On Cora node classification, the two-layer GCN models GraphConv (DGL) and GCov (PyG) obtained low accuracy values of 0.727 ± 0.008 and 0.712 ± 0.017, respectively.", "title": "E:E28"}, {"id": "search:papers:paper_f519c93b::claim_E29", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E29"], "tags": ["claim", "claims"], "text": "SplineConv with two layers reached the top accuracy of 0.872 ± 0.008 on Cora node classification.", "title": "E:E29"}, {"id": "search:papers:paper_f519c93b::claim_E30", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E30"], "tags": ["claim", "claims"], "text": "NESS attained the best accuracy, 0.940 ± 0.000, on Cora link prediction, surpassing GraphSAGE's 0.872 ± 0.007 and WalkPooling's 0.919 ± 0.004.", "title": "E:E30"}, {"id": "search:papers:paper_f519c93b::claim_E31", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E31"], "tags": ["claim", "weakpoints"], "text": "Among the GNN models evaluated on BBBP, the two-layer PyTorch-Geometric GCN posted the lowest graph classification accuracy, 0.72 ± 0.02.", "title": "E:E31"}, {"id": "search:papers:paper_f519c93b::claim_E32", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E32"], "tags": ["claim", "weakpoints"], "text": "The two-layer GCN (PyTorch-Geometric) had the lowest graph classification accuracy, 0.56 ± 0.01, among the evaluated GNN models on Proteins.", "title": "E:E32"}, {"id": "search:papers:paper_f519c93b::claim_E33", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E33"], "tags": ["claim", "claims"], "text": "HGP-SL yielded the best graph classification accuracy among the evaluated GNN models on Proteins, at 0.83 ± 0.03.", "title": "E:E33"}, {"id": "search:papers:paper_f519c93b::claim_E34", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E34"], "tags": ["claim", "weakpoints"], "text": "For the datasets in Table 5, the model size ratio grows with sparsity under both pruning approaches.", "title": "E:E34"}, {"id": "search:papers:paper_f519c93b::claim_E35", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E35"], "tags": ["claim", "weakpoints"], "text": "For Cora node classification and link prediction in Table 5, the model size ratios from fine-grained and global pruning were nearly identical, implying that the specifics of pruning matter little for this dataset.", "title": "E:E35"}, {"id": "search:papers:paper_f519c93b::claim_E36", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E36"], "tags": ["claim", "claims"], "text": "For BBBP in Table 5, fine-grained pruning yields larger size ratios (base size / pruned size) than global pruning—5.79 versus 4.49 at 80% sparsity, and 8.71 versus 7.72 at 90% sparsity.", "title": "E:E36"}, {"id": "search:papers:paper_f519c93b::claim_E37", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E37"], "tags": ["claim", "claims"], "text": "In Table 5's Proteins dataset, the model size ratio for global pruning fell from 3.13 to 1.9 as sparsity rose, while fine-grained pruning stayed stable and reached a peak of 8.32.", "title": "E:E37"}, {"id": "search:papers:paper_f519c93b::claim_E38", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E38"], "tags": ["claim", "claims"], "text": "Based on all Table 5 results, fine-grained pruning is preferable for tasks that are structurally sensitive, and global pruning is better when compression alone is the aim.", "title": "E:E38"}, {"id": "search:papers:paper_f519c93b::claim_E39", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E39"], "tags": ["claim", "claims"], "text": "Post-pruning fine-tuning cut memory usage in memory measurements, though usually by less than 5%.", "title": "E:E39"}, {"id": "search:papers:paper_f519c93b::claim_E40", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E40"], "tags": ["claim", "claims"], "text": "During memory-usage measurements, higher pruning sparsity did not consistently lower memory use; for BBBP at 0.8 sparsity, pruning actually increased memory consumption.", "title": "E:E40"}, {"id": "search:papers:paper_f519c93b::claim_E42", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E42"], "tags": ["claim", "claims"], "text": "Energy consumption had a non-linear relationship with sparsity across the energy-consumption measurements.", "title": "E:E42"}, {"id": "search:papers:paper_f519c93b::claim_E43", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E43"], "tags": ["claim", "claims"], "text": "Fine-tuning after pruning produced only small differences in energy consumption compared with pruning alone, like modest standard-deviation changes, during the energy-consumption measurements.", "title": "E:E43"}, {"id": "search:papers:paper_f519c93b::claim_E44", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E44"], "tags": ["claim", "claims"], "text": "With fine-grained pruning, energy use fluctuated for sparsity between 0.2 and 0.5, while global pruning performed better at sparsity levels of 0.7–0.9.", "title": "E:E44"}, {"id": "search:papers:paper_f519c93b::claim_E45", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E45"], "tags": ["claim", "claims"], "text": "CPU usage from pruning with fine-tuning was nearly the same as from pruning alone at all sparsity levels and across all datasets.", "title": "E:E45"}, {"id": "search:papers:paper_f519c93b::claim_E46", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E46"], "tags": ["claim", "claims"], "text": "For all datasets, CPU usage of both pruning methods varied erratically and non-linearly with sparsity, meaning the cost of sparse matrix operations or changing model size did not fall consistently when parameters were reduced.", "title": "E:E46"}, {"id": "search:papers:paper_f519c93b::claim_E47", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E47"], "tags": ["claim", "claims"], "text": "QAT-INT8 and DQ-INT8 attained the top accuracies on BBBP, exceeding FP32, while A2Q scored poorly.", "title": "E:E47"}, {"id": "search:papers:paper_f519c93b::claim_E48", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E48"], "tags": ["claim", "claims"], "text": "On Proteins, A2Q, QAT, and DQ-INT8 beat FP32, QAT-INT8 did the best, and DQ-INT4 trailed.", "title": "E:E48"}, {"id": "search:papers:paper_f519c93b::claim_E49", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E49"], "tags": ["claim", "claims"], "text": "During BBBP training, both QAT-INT8 and DQ-INT8 were much faster than FP32, whereas A2Q and QAT-INT4 were considerably slower.", "title": "E:E49"}, {"id": "search:papers:paper_f519c93b::claim_E50", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E50"], "tags": ["claim", "claims"], "text": "In Proteins training, QAT-INT8 was faster than the others, A2Q and QAT-INT4 were less efficient than QAT-INT8, and DQ-INT8 lagged behind FP32.", "title": "E:E50"}, {"id": "search:papers:paper_f519c93b::claim_E51", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E51"], "tags": ["claim", "claims"], "text": "A2Q quantization consumed 80.15 ± 0.49 GB of memory on BBBP, about twice the ~42.69–47.00 GB that QAT and DQ methods used.", "title": "E:E51"}, {"id": "search:papers:paper_f519c93b::claim_E52", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E52"], "tags": ["claim", "claims"], "text": "On BBBP, quantizing with QAT-INT4 and DQ-INT8 required 45.52 and 44.15 GB memory, respectively, near FP32's 39.82 GB footprint.", "title": "E:E52"}, {"id": "search:papers:paper_f519c93b::claim_E53", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E53"], "tags": ["claim", "claims"], "text": "A2Q quantization used 77.35 GB on Proteins, while the other quantization methods (including DQ-INT8) consumed about 36.78–37.45 GB.", "title": "E:E53"}, {"id": "search:papers:paper_f519c93b::claim_E54", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E54"], "tags": ["claim", "claims"], "text": "Fine-tuning made only a negligible difference to inference time when globally pruned GNNs were compared to their un-fine-tuned counterparts.", "title": "E:E54"}, {"id": "search:papers:paper_f519c93b::claim_E55", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E55"], "tags": ["claim", "claims"], "text": "In tests of global pruning with no fine-tuning across BBBP, Cora-Node, Cora-Link, and Proteins over sparsity 0–0.9, GNN inference time was not consistently shortened; most models kept the same inference time no matter the sparsity. The exception was the Cora node-classification task, where clear decreases appeared.", "title": "E:E55"}, {"id": "search:papers:paper_f519c93b::claim_E56", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E56"], "tags": ["claim", "weakpoints"], "text": "If a globally pruned model saves only non-zero weights, its file size on disk is smaller than that of the base model.", "title": "E:E56"}, {"id": "search:papers:paper_f519c93b::claim_E57", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E57"], "tags": ["claim", "claims"], "text": "Nearly identical sizes were found for pruned models with and without fine-tuning.", "title": "E:E57"}, {"id": "search:papers:paper_f519c93b::claim_E61", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E61"], "tags": ["claim", "weakpoints"], "text": "For all four datasets, the model-size ratio rose with sparsity under global and fine-grained pruning, suggesting bigger substructures were left.", "title": "E:E61"}, {"id": "search:papers:paper_f519c93b::claim_E62", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E62"], "tags": ["claim", "weakpoints"], "text": "Without fine-tuning, increasing fine-grained pruning sparsity from 0 to 0.9 lowered classification accuracy on BBBP, Cora-Node, Core-Link, and Proteins from 0.85 ± 0.02, 0.86 ± 0.00, 0.95 ± 0.00, and 0.83 ± 0.03, respectively, to 0.43 ± 0.17, 0.76 ± 0.01, 0.87 ± 0.00, and 0.54 ± 0.00.", "title": "E:E62"}, {"id": "search:papers:paper_f519c93b::claim_E63", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E63"], "tags": ["claim", "weakpoints"], "text": "Fine-grained pruning on BBBP without fine-tuning produced accuracies 0.85±0.02, 0.85±0.02, and 1.85±0 at sparsity levels 0, 0.1, and 0.2, respectively.", "title": "E:E63"}, {"id": "search:papers:paper_f519c93b::claim_E64", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E64"], "tags": ["claim", "claims"], "text": "BBBP accuracy stayed around 0.84–0.85 for regularization rates at most 1e-3, then fell sharply to 0.50–0.72 for rates above 1e-2, and declined still more at extreme rates of 1e6 or above.", "title": "E:E64"}, {"id": "search:papers:paper_f519c93b::claim_E65", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E65"], "tags": ["claim", "claims"], "text": "Cora-Link trained with NESS lost accuracy gradually from 0.95 to 0.66 as regularization rates rose, including marked drops once rates reached 0.1 or higher.", "title": "E:E65"}, {"id": "search:papers:paper_f519c93b::claim_E66", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E66"], "tags": ["claim", "claims"], "text": "Cora-Node accuracy held at 0.87–0.90 for regularization rates below 1e-2, fell heavily to 0.14–0.28 when rates were greater than 0.1, and remained depressed at rates at least 100.", "title": "E:E66"}, {"id": "search:papers:paper_f519c93b::claim_E67", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_E67"], "tags": ["claim", "claims"], "text": "HGPSL on Proteins kept accuracy at 0.82 for regularization rates below 1e-2, then dropped to 0.70 when rates exceeded 0.1, with no rebound at extreme rates.", "title": "E:E67"}, {"id": "search:papers:paper_f519c93b::note_2", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::note_2"], "tags": ["note", "claims"], "text": "elaboration of The lottery ticket hypothesis (LTH): a randomly initialized neural network contains a subnetwork that, when trained in isolation, can match the test accuracy of the original network.", "title": "E:note_2"}, {"id": "search:papers:paper_607795ad::claim_1", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_1"], "tags": ["claim", "weakpoints"], "text": "By zeroing gradients on pruned coordinates via $\\odot m_k$, where $\\odot$ is elementwise multiplication, only the weights retained by mask $m_k$ are trained on data from subset $\\mathcal{D}_k$ of the training set while keeping all subnetworks tied to the same shared parameter tensor $\\theta$.", "title": "B:1"}, {"id": "search:papers:paper_607795ad::claim_2", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_2"], "tags": ["claim", "weakpoints"], "text": "In CIFAR-10 experiments with $K=10$ class-specific subnetworks, RTL attains balanced accuracy values of 0.781, 0.778, and 0.772 at 25%, 50%, and 75% weight sparsity respectively, outperforming a single shared-mask Iterative Magnitude Pruning (IMP) baseline (0.711, 0.711, 0.732) and matching or exceeding independent per-class IMP models trained without weight sharing (0.712, 0.710, 0.760); at the same sparsity levels RTL achieves recall 0.821 / 0.810 / 0.816 versus 0.480 / 0.480 / 0.518 for the single-mask IMP baseline and 0.701 / 0.702 / 0.766 for independent per-class IMP models, while using 103K / 72K / 38K trainable parameters (RTL) compared to 944K / 629K / 314K parameters for the independent per-class models.", "title": "B:2"}, {"id": "search:papers:paper_607795ad::claim_3", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_3"], "tags": ["claim", "weakpoints"], "text": "In CIFAR-100 experiments where $K=8$ semantically derived clusters are used as subsets, RTL achieves balanced accuracy 0.765 / 0.751 / 0.759 and recall 0.764 / 0.729 / 0.754 at 25% / 50% / 75% sparsity, surpassing a single-mask IMP baseline (balanced accuracy 0.722 / 0.707 / 0.742; recall 0.420 / 0.421 / 0.463) and independent-model IMP (balanced accuracy 0.712 / 0.700 / 0.744; recall 0.660 / 0.637 / 0.732) while using 108K / 76K / 40K parameters versus 944K / 629K / 314K for independent models.", "title": "B:3"}, {"id": "search:papers:paper_607795ad::claim_4", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_4"], "tags": ["claim", "weakpoints"], "text": "In implicit neural representation (INR) reconstruction experiments on 10 ADE20K images where semantic segmentation masks define within-image regions and RTL learns region-specialized subnetworks, RTL achieves higher peak signal-to-noise ratio (PSNR) than a single-mask IMP baseline at all reported sparsity levels.", "title": "B:4"}, {"id": "search:papers:paper_607795ad::claim_5", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_5"], "tags": ["claim", "weakpoints"], "text": "On a speech enhancement task constructed by mixing clean speech from the DNS-2020 dataset with noise from TAU Urban Acoustic Scenes 2020 and grouping noises into three acoustic-environment subsets (indoor, outdoor, transportation), RTL achieves higher scale-invariant signal-to-noise ratio improvement (SI-SNRi) than both a single-mask IMP baseline and independently pruned IMP models at 25% / 50% / 75% sparsity.", "title": "B:5"}, {"id": "search:papers:paper_607795ad::claim_6", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_6"], "tags": ["claim", "weakpoints"], "text": "RTL identifies a failure mode called subnetwork collapse in which aggressive pruning causes specialized subnetworks to converge toward excessive overlap in their retained weights, coinciding with sharp performance degradation.", "title": "B:6"}, {"id": "search:papers:paper_607795ad::claim_7", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_7"], "tags": ["claim", "weakpoints"], "text": "The empirical coincidence in claim 6 supports the use of the mask similarity in note 1 as a label-free early-warning indicator of oversparsification. [Referenced claim 6: RTL identifies a failure mode called subnetwork collapse in which aggressive pruning causes specialized subnetworks to converge toward excessive overlap in their retained weights, coinciding with sharp performance degradation.]", "title": "B:7"}, {"id": "search:papers:paper_607795ad::claim_9", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_9"], "tags": ["claim", "weakpoints"], "text": "In CIFAR-10, Spearman rank-order correlations between WordNet semantic proximity—semantic proximity between class labels computed via WordNet path similarity, a lexical-semantic distance metric derived from the WordNet taxonomy—and mask similarity (per-layer mask Jaccard similarity) vary with layer depth and pruning level, increasing during training and—specifically in deep layers—rising up to moderate sparsity (around 55% weight pruning) before declining at excessive sparsity.", "title": "B:9"}, {"id": "search:papers:paper_607795ad::claim_10", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_10"], "tags": ["claim", "weakpoints"], "text": "In CIFAR-10, during training and with increasing weight pruning up to moderate sparsity, mask structure in deeper layers increasingly reflects high-level semantic relations between class labels, until aggressive pruning destroys the alignment between mask structure in deeper layers and high-level semantic relations between class labels.", "title": "B:10"}, {"id": "search:papers:paper_607795ad::claim_O01", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_O01"], "tags": ["claim", "weakpoints"], "text": "In Panel B of the Figure 2 mask collapse analysis, correlations across network depth during optimization showed weak correlations that decreased with depth in early optimization but increased consistently in later epochs, particularly in middle and deep layers, indicating a gradual emergence of semantic structure as subnetworks refined specialized connectivity.", "title": "B:O01"}, {"id": "search:papers:paper_607795ad::claim_O02", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_O02"], "tags": ["claim", "weakpoints"], "text": "In the semantic and structural correlation analysis of RTL subnetworks for four representative classes (airplane, cat, deer, and truck), semantically related classes (cat and deer) showed stronger correlations of 0.6-0.7 that grew with pruning and depth, whereas unrelated classes (airplane and truck) remained weaker at 0.2-0.3, as measured by Spearman's rank-order correlation between semantic similarity and mask similarity; this pattern indicates that RTL subnetworks for related categories preserve overlapping structures while distant ones evolve independently and is consistent with overall mask stability across dissimilar classes.", "title": "B:O02"}, {"id": "search:papers:paper_607795ad::claim_O04", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_O04"], "tags": ["claim", "weakpoints"], "text": "For each ADE20K image (A-J) in the INR experiment, across sparsity levels, pruning of INR subnetworks showed that the sharp decline in PSNR closely coincides with the point at which mask similarity collapses, indicating that reconstruction quality degrades most significantly once subnetworks corresponding to different semantic regions begin to overlap or interfere rather than as a direct consequence of parameter removal alone, with PSNR and average mask similarity measured by the Jaccard index.", "title": "B:O04"}, {"id": "search:papers:paper_607795ad::claim_O05", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_O05"], "tags": ["claim", "weakpoints"], "text": "For a single ADE20K image with four semantic regions, region-specific subnetworks were assessed by per-class PSNR and average mask similarity to all other region-specific subnetworks as functions of sparsity, and performance degradation coincided with a rapid increase in mask similarity, indicating subnetwork collapse at high pruning ratios.", "title": "B:O05"}, {"id": "search:papers:paper_607795ad::claim_O06", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_O06"], "tags": ["claim", "weakpoints"], "text": "For a second ADE20K image with fifteen semantic regions, as sparsity increased in region-specific pruning masks, per-class PSNR declined gradually until a sharp drop that aligned with increasing similarity between region-specific pruning masks, reflecting loss of structural specialization.", "title": "B:O06"}, {"id": "search:papers:paper_607795ad::claim_O09", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_O09"], "tags": ["claim", "weakpoints"], "text": "At 75% sparsity in qualitative INR reconstructions, RTL maintained more faithful structure and color consistency than IMP, which exhibited increased blurring and loss of high-frequency details, with the gap between the methods becoming more visible as sparsity increased.", "title": "B:O09"}, {"id": "search:papers:paper_607795ad::claim_O11", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_O11"], "tags": ["claim", "weakpoints"], "text": "In qualitative speech enhancement results at 50% sparsity across different acoustic environments, RTL more effectively suppresses noise and preserves harmonic speech structure than IMP across all environments.", "title": "B:O11"}, {"id": "search:papers:paper_607795ad::claim_O12", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_O12"], "tags": ["claim", "weakpoints"], "text": "On CIFAR-10 with class-specific subnetworks at 25%, 50%, and 75% sparsity, RTL achieved the highest balanced accuracy across all sparsity levels, significantly outperforming both baselines at 25% with 0.781 vs. 0.711 for single-model IMP and 0.712 for multi-model IMP, and remaining higher at 50% (0.778 vs. 0.711 for single-model IMP) and at 75% (0.772 vs. 0.760 for multi-model IMP), while using an order of magnitude fewer parameters.", "title": "B:O12"}, {"id": "search:papers:paper_607795ad::claim_O13", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_O13"], "tags": ["claim", "weakpoints"], "text": "On CIFAR-10 with class-specific subnetworks at 25%, 50%, and 75% sparsity, RTL achieved the highest recall at all sparsity levels (0.821, 0.810, and 0.816), exceeding the single-model IMP baseline (0.480, 0.480, and 0.518) and matching or surpassing the multi-model alternative (0.701, 0.702, and 0.766), demonstrating that RTL subnetworks effectively preserve class-relevant signals under aggressive pruning.", "title": "B:O13"}, {"id": "search:papers:paper_607795ad::claim_O15", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_O15"], "tags": ["claim", "weakpoints"], "text": "On CIFAR-100 with cluster-specialized subnetworks at 25%, 50%, and 75% sparsity, RTL achieved the highest balanced accuracy across all sparsity levels: 0.765 at 25%, 0.751 at 50%, and 0.759 at 75%, outperforming both baselines even at 75% sparsity, where model capacity is most constrained.", "title": "B:O15"}, {"id": "search:papers:paper_607795ad::claim_O16", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_O16"], "tags": ["claim", "weakpoints"], "text": "On CIFAR-100 with cluster-specialized subnetworks at 25%, 50%, and 75% sparsity, RTL achieved recall values of 0.764, 0.729, and 0.754, substantially exceeding the single-model IMP baseline (0.420-0.463) and consistently outperforming the multi-model alternative, confirming that RTL subnetworks retained cluster-discriminative features more effectively under pruning.", "title": "B:O16"}, {"id": "search:papers:paper_607795ad::claim_O17", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_O17"], "tags": ["claim", "weakpoints"], "text": "In the INR experiment on the ADE20K dataset at 25%, 50%, and 75% sparsity, RTL achieved PSNR values of 18.86, 17.25, and 14.87, respectively, versus single-model IMP's 15.94, 14.72, and 12.69, consistently outperforming IMP with advantages of almost 3 dB, 2.53 dB, and 2.18 dB, respectively.", "title": "B:O17"}, {"id": "search:papers:paper_607795ad::claim_O18", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_O18"], "tags": ["claim", "weakpoints"], "text": "At 25%, 50%, and 75% sparsity, RTL uses only 103K, 72K, and 38K parameters, respectively, compared with 944K, 629K, and 314K for multi-model IMP—nearly 10× more—to achieve comparable accuracy.", "title": "B:O18"}, {"id": "search:papers:paper_607795ad::claim_O22", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_607795ad::claim_O22"], "tags": ["claim", "weakpoints"], "text": "In the INR experiment on 10 ADE20K images at 25%, 50%, and 75% sparsity, RTL consistently achieved higher PSNR than the single-model IMP baseline across all samples and sparsity levels, with the gap observed for images with diverse scene content and appearance characteristics, confirming that the aggregate improvements reported in the main text are not driven by a small subset of favorable samples.", "title": "B:O22"}, {"id": "search:papers:paper_7768dd46::claim_1", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_7768dd46::claim_1"], "tags": ["claim", "weakpoints"], "text": "Iterative magnitude pruning with layerwise magnitude selection in a binary sentiment analysis task on five Amazon Reviews domains (Books, Electronics, Movies, CDs, Home) using a CNN with three filter heights $h\\in\\{3,4,5\\}$, each with 127 channels, ReLU activation, 1-max pooling, one hidden MLP layer of dimension 117, embedding dimension $d=417$, max sequence length $n=500$, embeddings initialized from $\\mathcal{N}(0,1)$ and convolutional/MLP layers initialized with He initialization, trained with Adam at learning rate $1\\mathrm{e}{-3}$, $\\ell_2$ weight $1\\mathrm{e}{-5}$, batch size 32, dropout $p=0.285$, produces sparse subnetworks (tickets) that, when reinitialized to their original initial values (TICKET-RESET) and retrained in isolation, achieve test accuracy comparable to or better than the unpruned full model (FULL-MODEL) for moderate sparsity levels, with TICKET-RESET outperforming FULL-MODEL in the early-to-moderate sparsification regime (approximately 0%–90% sparsity) for the Books, Electronics, and Home domains.", "title": "C:1"}, {"id": "search:papers:paper_7768dd46::claim_2", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_7768dd46::claim_2"], "tags": ["claim", "weakpoints"], "text": "In the setting of note 1, resetting the retained weights of a sparse subnetwork to random draws from the original initialization distributions (TICKET-RANDOM) yields test performance statistically similar to resetting to the original initial values (TICKET-RESET) for sparsity levels up to approximately 96%.", "title": "C:2"}, {"id": "search:papers:paper_7768dd46::claim_3", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_7768dd46::claim_3"], "tags": ["claim", "weakpoints"], "text": "Using the five Amazon Reviews domains (Books, Electronics, Movies, CDs, Home) and the CNN architecture (three filter heights $h\\in\\{3,4,5\\}$, 127 channels, ReLU, 1-max pooling, MLP dim 117, embedding dim 417, max seq length 500, embeddings from $\\mathcal{N}(0,1)$, conv/MLP He initialization (weights from $\\mathcal{U}(-b,b)$ with $b=\\sqrt{6/((1+a^2)\\times\\text{fan\\_in})}$), Adam lr $1\\mathrm{e}{-3}$, $\\ell_2$ weight $1\\mathrm{e}{-5}$, batch size 32, dropout $p=0.285$) with iterative magnitude pruning ($p=35\\%$, $r_{total}=20$), a phase transition occurs at approximately $96\\%$ sparsity: beyond this threshold, subnetworks reinitialized to random draws from the original initialization distributions (TICKET-RANDOM) exhibit rapid test accuracy degradation and high instability, whereas subnetworks reinitialized to their original initial values (TICKET-RESET) maintain substantially better and more stable test accuracy, even at sparsity levels exceeding $99.9\\%$.", "title": "C:3"}, {"id": "search:papers:paper_7768dd46::claim_4", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_7768dd46::claim_4"], "tags": ["claim", "weakpoints"], "text": "The choice of initialization—whether subnetworks are reinitialized to random draws from the original initialization distributions (TICKET-RANDOM) or to their original initial values (TICKET-RESET)—is largely immaterial below approximately 96% sparsity but becomes crucial for preserving accuracy and reducing variance in the extreme-sparsity regime.", "title": "C:4"}, {"id": "search:papers:paper_7768dd46::claim_5", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_7768dd46::claim_5"], "tags": ["claim", "weakpoints"], "text": "Under the iterative magnitude pruning procedure (prune fraction $p=35\\%$, $r_{total}=20$) with the CNN architecture and training details (five Amazon Reviews domains, CNN with filters $h\\in\\{3,4,5\\}$, 127 channels, ReLU, 1-max pooling, MLP dim 117, embedding dim 417, max seq length 500, embeddings from $\\mathcal{N}(0,1)$, conv/MLP He initialization (weights from $\\mathcal{U}(-b,b)$ with $b=\\sqrt{6/((1+a^2)\\times\\text{fan\\_in})}$), Adam lr $1\\mathrm{e}{-3}$, $\\ell_2$ weight $1\\mathrm{e}{-5}$, batch size 32, dropout $p=0.285$), when sparse masks $m$ obtained from a source domain $\\mathcal{D}_s$ are applied to a target domain $\\mathcal{D}_t$ (with $\\mathcal{D}_s \\neq \\mathcal{D}_t$) and the retained parameters are reinitialized either to the source-domain original values (MASKS-RESET) or to random draws from the original initialization distributions (MASKS-RANDOM), the resulting subnetworks retrain in the target domain with only modest accuracy degradation relative to tickets obtained directly in the target domain via the same procedure (TICKET-TARGET) for sparsity levels up to approximately $90\\%$.", "title": "C:5"}, {"id": "search:papers:paper_7768dd46::claim_6", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_7768dd46::claim_6"], "tags": ["claim", "weakpoints"], "text": "Across the five Amazon review domains (Books, Electronics, Movies, CDs, Home) under the lottery ticket transfer procedure masks obtained from the CDs domain and applied to any other target domain outperform the subnetworks obtained directly in that target domain and retain stronger performance even at sparsity levels exceeding $99\\%$.", "title": "C:6"}, {"id": "search:papers:paper_7768dd46::claim_O02", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_7768dd46::claim_O02"], "tags": ["claim", "weakpoints"], "text": "On the Books, Movies, Electronics, CDs, and Home categories of the Amazon Reviews dataset, at sparsity levels above approximately 0.9865 up to 0.9998, ticket (reset) achieved higher accuracy than ticket (random), with experiments repeated five times (solid lines: mean; shaded regions: standard deviation) and the full model shown as a reference.", "title": "C:O02"}, {"id": "search:papers:paper_7768dd46::claim_O03", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_7768dd46::claim_O03"], "tags": ["claim", "weakpoints"], "text": "On nine transfer tasks constructed from the five categories of the Amazon Reviews dataset, with tickets obtained using the lottery ticket training procedure at p=35% and r_total=20 and sparsity varied from 0.0000 to 0.9998 including high sparsity, the ticket target subnetwork achieved higher test accuracy than the masks (random) baseline, based on five repeated experiments where solid lines show mean accuracy and shaded regions show standard deviation.", "title": "C:O03"}, {"id": "search:papers:paper_7768dd46::claim_O04", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_7768dd46::claim_O04"], "tags": ["claim", "weakpoints"], "text": "On nine transfer tasks constructed from the five categories of the Amazon Reviews dataset, with tickets obtained using the lottery ticket training procedure at p=35% and r_total=20 and sparsity varied from 0.0000 to 0.9998 including high sparsity, the ticket target subnetwork achieved higher test accuracy than the masks (reset) baseline, based on five repeated experiments where solid lines show mean accuracy and shaded regions show standard deviation.", "title": "C:O04"}, {"id": "search:papers:paper_af285cb1::claim_1", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_1"], "tags": ["claim", "weakpoints"], "text": "Distilled Pruning, an operational procedure that replaces the real-data inner-loop training of Iterative Magnitude Pruning (IMP) with training on a small synthetic dataset produced by a dataset distillation method that matches training trajectories, reduces the number of real training points used to select a sparsity mask by orders of magnitude relative to standard IMP.", "title": "D:1"}, {"id": "search:papers:paper_af285cb1::claim_2", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_2"], "tags": ["claim", "weakpoints"], "text": "Distilled Pruning, an operational procedure that replaces the real-data inner-loop training of Iterative Magnitude Pruning (IMP) with training on a small synthetic dataset produced by a dataset distillation method that matches training trajectories, produces sparse subnetworks at initialization.", "title": "D:2"}, {"id": "search:papers:paper_af285cb1::claim_3", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_3"], "tags": ["claim", "claims"], "text": "Sparse subnetworks discovered by Distilled Pruning often train to solutions that are linearly mode connected across different shufflings of the real training data, i.e., the solutions exhibit low or zero loss barriers under linear interpolation between weights trained on different data orders.", "title": "D:3"}, {"id": "search:papers:paper_af285cb1::claim_4", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_4"], "tags": ["claim", "weakpoints"], "text": "Empirically, for studied settings the dense initialization is unstable, i.e., trained models land in different minima.", "title": "D:4"}, {"id": "search:papers:paper_af285cb1::claim_5", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_5"], "tags": ["claim", "weakpoints"], "text": "Empirically, for studied settings, the synthetic subnetworks obtained by pruning on distilled data, i.e., Sparse subnetworks discovered by Distilled Pruning, are stable to SGD noise at initialization.", "title": "D:5"}, {"id": "search:papers:paper_af285cb1::claim_6", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_6"], "tags": ["claim", "weakpoints"], "text": "Interpolating between two independently trained versions of the same synthetic subnetwork, i.e., one of the Sparse subnetworks discovered by Distilled Pruning, shows little or no increase in training loss.", "title": "D:6"}, {"id": "search:papers:paper_af285cb1::claim_7", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_7"], "tags": ["claim", "weakpoints"], "text": "Subnetworks produced by distilled pruning exhibit quantitatively and visually flatter loss landscapes than both the dense model and IMP-chosen subnetworks.", "title": "D:7"}, {"id": "search:papers:paper_af285cb1::claim_8", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_8"], "tags": ["claim", "weakpoints"], "text": "In two-dimensional loss landscape visualizations around trained models on ConvNet-3 and CIFAR-10, synthetic subnetworks produced by distilled pruning fall into a single, flat basin across different random seeds.", "title": "D:8"}, {"id": "search:papers:paper_af285cb1::claim_9", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_9"], "tags": ["claim", "weakpoints"], "text": "In two-dimensional loss landscape visualizations around trained models on ConvNet-3 and CIFAR-10, the dense and IMP cases (the dense model and IMP-chosen subnetworks) display separate minima separated by barriers.", "title": "D:9"}, {"id": "search:papers:paper_af285cb1::claim_10", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_10"], "tags": ["claim", "weakpoints"], "text": "The diagonal of the empirical Hessian computed over training batches for ConvNet-3 on CIFAR-10 shows that synthetic subnetworks produced by distilled pruning have a distribution of diagonal Hessian entries concentrated closer to zero with smaller variance and lower average magnitude than the dense model or IMP subnetworks at matched sparsities (sampled sparsities included 60% and 90% in the reported study).", "title": "D:10"}, {"id": "search:papers:paper_af285cb1::claim_11", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_11"], "tags": ["claim", "weakpoints"], "text": "Applying Iterative Magnitude Pruning (IMP) with weight rewinding to a sparsity mask obtained by distilled pruning (starting IMP from a distilled-pruning-produced sparse initialization rather than the original dense initialization) yields sparse initializations that behave as true lottery tickets at substantially higher overall sparsities than IMP applied to the original dense initialization.", "title": "D:11"}, {"id": "search:papers:paper_af285cb1::claim_12", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_12"], "tags": ["claim", "weakpoints"], "text": "performing 8 distilled-pruning iterations (pruning 20% of weights per iteration to produce an intermediate stable mask at 83% sparsity) and then running Iterative Magnitude Pruning (IMP) (still rewinding to initialization) finds sparse initializations that match or exceed the performance of IMP with weight rewinding to the third training epoch and that reach higher sparsities than achievable by IMP from the original dense initialization.", "title": "D:12"}, {"id": "search:papers:paper_af285cb1::claim_13", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_13"], "tags": ["claim", "weakpoints"], "text": "On ImageNet-10 with ResNet-10, the hybrid method of performing 8 distilled-pruning iterations (pruning 20% of weights per iteration to produce an intermediate stable mask at 83% sparsity) and then running Iterative Magnitude Pruning (IMP) (still rewinding to initialization) yields lottery tickets with up to an order of magnitude fewer parameters compared to IMP applied to the original dense initialization.", "title": "D:13"}, {"id": "search:papers:paper_af285cb1::claim_14", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_14"], "tags": ["claim", "weakpoints"], "text": "When using trajectory-matching distilled datasets of appropriate quality for the target model, Distilled Pruning matches the test accuracy of traditional IMP on ResNet-18 trained on CIFAR-10.", "title": "D:14"}, {"id": "search:papers:paper_af285cb1::claim_15", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_15"], "tags": ["claim", "weakpoints"], "text": "Distilled Pruning uses roughly 150x fewer real training points than traditional IMP to generate the sparsity mask.", "title": "D:15"}, {"id": "search:papers:paper_af285cb1::claim_16", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_16"], "tags": ["claim", "claims"], "text": "Across a range of datasets and compression ratios, the performance of synthetic subnetworks relative to traditional IMP depends strongly on the distilled-data accuracy.", "title": "D:16"}, {"id": "search:papers:paper_af285cb1::claim_17", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_17"], "tags": ["claim", "weakpoints"], "text": "On more complex tasks or when distilled data under-performs, synthetic subnetworks tend to be more stable than traditional IMP.", "title": "D:17"}, {"id": "search:papers:paper_af285cb1::claim_18", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_18"], "tags": ["claim", "claims"], "text": "Synthetic subnetworks can underperform traditional IMP in final test accuracy.", "title": "D:18"}, {"id": "search:papers:paper_af285cb1::claim_19", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_19"], "tags": ["claim", "weakpoints"], "text": "Distilled Pruning provides an empirical trade-off: substantial reductions in inner-loop data usage and increased stability, at the cost of relying on high-quality distilled data to preserve performance.", "title": "D:19"}, {"id": "search:papers:paper_af285cb1::claim_20", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_20"], "tags": ["claim", "claims"], "text": "The locations of pruned parameters chosen by distilled pruning are nearly independent from those chosen by IMP even when starting from the same random initialization.", "title": "D:20"}, {"id": "search:papers:paper_af285cb1::claim_21", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_21"], "tags": ["claim", "claims"], "text": "For the binary sparsity masks produced from the same random initialization, the distribution of zeros across layers does not reveal a consistent structural pattern that differentiates distilled pruning and IMP.", "title": "D:21"}, {"id": "search:papers:paper_af285cb1::claim_22", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_22"], "tags": ["claim", "claims"], "text": "For the binary sparsity masks produced from the same random initialization, the magnitudes of weights that are pruned at initialization follow similar distributions between distilled pruning and IMP.", "title": "D:22"}, {"id": "search:papers:paper_af285cb1::claim_23", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_23"], "tags": ["claim", "weakpoints"], "text": "Distilled pruning and IMP select largely distinct sets of parameters to remove even when starting from the same initialization.", "title": "D:23"}, {"id": "search:papers:paper_af285cb1::claim_24", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_24"], "tags": ["claim", "weakpoints"], "text": "Distilled pruning and IMP produce different downstream stability and curvature properties.", "title": "D:24"}, {"id": "search:papers:paper_af285cb1::claim_25", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_25"], "tags": ["claim", "weakpoints"], "text": "Empirically, for ConvNet-3 on CIFAR-10 and ResNet-10 on ImageNet-10 the dense initialization is unstable, i.e., trained models land in different minima.", "title": "D:25"}, {"id": "search:papers:paper_af285cb1::claim_26", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_26"], "tags": ["claim", "weakpoints"], "text": "When using Efficient Dataset Condensation tuned for the target architecture and of appropriate quality for the target model, Distilled Pruning matches the test accuracy of traditional IMP on ResNet-18 trained on CIFAR-10.", "title": "D:26"}, {"id": "search:papers:paper_af285cb1::claim_27", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_27"], "tags": ["claim", "weakpoints"], "text": "On CIFAR-100 or larger datasets with poorer distilled accuracy, synthetic subnetworks tend to be more stable than traditional IMP.", "title": "D:27"}, {"id": "search:papers:paper_af285cb1::claim_O01", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_O01"], "tags": ["claim", "weakpoints"], "text": "At high sparsities, synthetic subnetworks trained on real data (Distilled Pruning) achieved sufficient performance, just like IMP subnetworks.", "title": "D:O01"}, {"id": "search:papers:paper_af285cb1::claim_O02", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_O02"], "tags": ["claim", "weakpoints"], "text": "On CIFAR-10 with ResNet-18, lottery tickets did not exist past approximately 40% sparsity.", "title": "D:O02"}, {"id": "search:papers:paper_af285cb1::claim_O04", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_O04"], "tags": ["claim", "claims"], "text": "At initialization on CIFAR-10, for subnetworks of different sparsities, including synthetic vs. IMP subnetworks with the left column for subnetworks found via distilled data and the middle column for subnetworks found with real data, the loss increases as the weights are interpolated between two trained models.", "title": "D:O04"}, {"id": "search:papers:paper_af285cb1::claim_O07", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_O07"], "tags": ["claim", "weakpoints"], "text": "In loss landscape visualizations around the neighborhood defined by trained models on different seeds for ConvNet-3 and CIFAR-10, subnetworks chosen with distilled data fall into the same flat basin.", "title": "D:O07"}, {"id": "search:papers:paper_af285cb1::claim_O08", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_O08"], "tags": ["claim", "weakpoints"], "text": "In loss landscape visualizations around the neighborhood defined by trained models on different seeds for ConvNet-3 and CIFAR-10, the trained models in both the IMP and Dense cases fall into two separate minima, explaining the loss barrier in Figure 3.", "title": "D:O08"}, {"id": "search:papers:paper_af285cb1::claim_O09", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_O09"], "tags": ["claim", "weakpoints"], "text": "As the complexity of the dataset increases, dataset distillation under-performs.", "title": "D:O09"}, {"id": "search:papers:paper_af285cb1::claim_O10", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_O10"], "tags": ["claim", "weakpoints"], "text": "For a given dataset, as the data compression ratio increases, synthetic subnetworks exhibit more stability than IMP subnetworks.", "title": "D:O10"}, {"id": "search:papers:paper_af285cb1::claim_O11", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_O11"], "tags": ["claim", "claims"], "text": "For ConvNet-3 on CIFAR-10 and ResNet-10 on Imagenet-10, synthetic subnetworks achieve full linear mode connectivity.", "title": "D:O11"}, {"id": "search:papers:paper_af285cb1::claim_O12", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_O12"], "tags": ["claim", "claims"], "text": "In the comparison of synthetic subnetworks and IMP subnetworks across models and datasets, the performance trend, measured as the ratio of test accuracy between synthetic and IMP subnetworks, largely depends on the distilled accuracy in Kim et al. (2022).", "title": "D:O12"}, {"id": "search:papers:paper_af285cb1::claim_O13", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_O13"], "tags": ["claim", "weakpoints"], "text": "Until distillation methods improve, distilled pruning cannot yet compete as a standalone method for performance, but it can be used for finding stable subnetworks.", "title": "D:O13"}, {"id": "search:papers:paper_af285cb1::claim_O14", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_O14"], "tags": ["claim", "weakpoints"], "text": "At high sparsities (Figure 7, 83% sparsity), our lottery tickets observed performance similar to that of the matching subnetworks produced in spawning (IMP with weight rewinding to the 3rd epoch, k=3).", "title": "D:O14"}, {"id": "search:papers:paper_af285cb1::claim_O16", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_af285cb1::claim_O16"], "tags": ["claim", "weakpoints"], "text": "For ConvNet-3 trained on CIFAR-10, using the diagonal of the Hessian measured over batches of real training data, synthetic subnetworks at 60% and 90% sparsity showed a tighter distribution of diagonal Hessian values around zero with less variance than both the dense model and the IMP subnetworks, as characterized by min/max, mean ± standard deviation, and average magnitude.", "title": "D:O16"}, {"id": "search:candidate_A_016e33196f5660c5", "metadata": {"step": 4}, "refs": ["knowledge:candidate_A_016e33196f5660c5"], "tags": ["claim", "weakpoints"], "text": "Across the reported comparisons, the loss landscape placement and performance equivalence of sparse solutions vary with the procedure that produced them.", "title": "A:1"}, {"id": "search:candidate_A_10803f88dd813cea", "metadata": {"step": 4}, "refs": ["knowledge:candidate_A_10803f88dd813cea"], "tags": ["claim", "weakpoints"], "text": "Pruning at a fixed budget causes greater performance degradation as the granularity of removal becomes finer rather than coarser.", "title": "A:2"}, {"id": "search:candidate_A_1547c3764e68c426", "metadata": {"step": 4}, "refs": ["knowledge:candidate_A_1547c3764e68c426"], "tags": ["claim", "weakpoints"], "text": "Pruned network outcomes depend on how sparsity is configured and how pruned weights are subsequently handled, not on sparsity magnitude alone.", "title": "A:3"}, {"id": "search:candidate_A_44afd14d0349ff15", "metadata": {"step": 4}, "refs": ["knowledge:candidate_A_44afd14d0349ff15"], "tags": ["claim", "weakpoints"], "text": "Across the reported pruning settings, final performance is governed by the composition or coherence of retained subnetworks rather than by the degree of parameter removal alone.", "title": "A:4"}, {"id": "search:candidate_A_803eb5bb18871097", "metadata": {"step": 4}, "refs": ["knowledge:candidate_A_803eb5bb18871097"], "tags": ["claim", "weakpoints"], "text": "Across pruning studies, preserving task-relevant structural specialization, rather than sparsity alone, governs whether performance and output quality are retained.", "title": "A:5"}, {"id": "search:candidate_A_ad9181e71b599a7e", "metadata": {"step": 4}, "refs": ["knowledge:candidate_A_ad9181e71b599a7e"], "tags": ["claim", "weakpoints"], "text": "Subsequent optimization after structural selection improves performance without changing the selected structure's size.", "title": "A:6"}, {"id": "search:candidate_A_eba2cf1220281cf5", "metadata": {"step": 4}, "refs": ["knowledge:candidate_A_eba2cf1220281cf5"], "tags": ["claim", "weakpoints"], "text": "Across diverse tasks and sparsity levels, a particular subnetwork approach consistently outperforms alternative pruning approaches.", "title": "A:7"}, {"id": "search:candidate_A_f4da318bdddf62cc", "metadata": {"step": 4}, "refs": ["knowledge:candidate_A_f4da318bdddf62cc"], "tags": ["claim", "weakpoints"], "text": "Aggressively pruned networks can match their unpruned performance when an auxiliary structural component is retained.", "title": "A:8"}, {"id": "search:candidate_K_927e38c661d96bab", "metadata": {"step": 4}, "refs": ["knowledge:candidate_K_927e38c661d96bab"], "tags": ["claim", "weakpoints"], "text": "Across the evaluated neural and graph neural architectures, tasks, and datasets, reducing effective trainable capacity—whether through quaternion parameter sharing, magnitude-based pruning, or allocating specialized subnetworks—yields compressed models that match or exceed their dense/real-valued baselines while using substantially fewer parameters within a moderate-compression regime, but beyond an architecture- and task-dependent sparsity/compression threshold the compressed models share a failure mode in which retained structural specialization degrades and predictive performance drops sharply, with the threshold, stability, and recovery being contingent on pruning granularity, fine-tuning, initialization/reset policy, and task sensitivity.", "title": "K:1"}], "source_artifacts": ["artifact_519eaf78e49a49ca8772805cf5dd7dd9", "artifact_cf8e6c25b47844dfa66bf4de4cbc12b7", "artifact_54b1d626cff84dc3b54c26c8aba5878e", "artifact_7820b833ceaf44d5b97ee767224fdc6b", "artifact_6809c308fb78477b99cf7529e357bc57", "artifact_3e3411d1e0824424a9b8d8afb0e93521"], "source_targets": [], "stages": [{"name": "integration", "number": 4, "validation_status": "passed"}], "title": "Domain graph · Papers + Integration · delta only"}</script>
  <script>
    function formalizationToView(document) {
      const isHelperId=id => /(^|::)__|helper[_-]?relation|operator[_-]?result|disjunction[_-]?result|alternative[_-]?explanation/i.test(String(id));
      const isGaiaIr=!document?.graph && Array.isArray(document?.knowledges);
      const knowledges=isGaiaIr ? Object.fromEntries(document.knowledges.map(item=>[item.id,item])) : (document?.knowledges || {});
      const graph=isGaiaIr ? {nodes:Object.keys(knowledges).filter(id=>!isHelperId(id)), operators:(document.operators || []).map(op=>({...op,type:op.type || op.operator})), strategies:document.strategies || []} : (document?.graph || {});
      const step=4, nodes=[], edges=[], search_documents=[];
      const ids=(Array.isArray(graph.nodes) ? graph.nodes : Object.keys(knowledges)).filter(id=>!isHelperId(id));
      const strategyOperators=(graph.strategies || []).flatMap(strategy => (strategy.formal_expr?.operators || []).map((op,index)=>({...op,id:op.id || `${strategy.strategy_id || strategy.id || 'strategy'}:operator:${index+1}`,type:op.type || op.operator})));
      const nodeId=id => `step:${step}:knowledge:${id}`;
      const articleName=String(document?.package?.name || '');
      const displayClaimLabel=id => { const value=String(id), parts=value.split('::'); return parts.length === 2 ? `${parts[0].split(':').pop()}-${parts[1]}` : (articleName ? `${articleName}-${value}` : value); };
      ids.forEach(id => { const k=knowledges[id] || {}, content=k.content, summary=typeof content==='string' ? content : (content?.canonical || content?.text || '');
        nodes.push({id:nodeId(id), entity_id:id, label:displayClaimLabel(id), display_label:displayClaimLabel(id), display_meta:k.type || 'claim', kind:k.type || 'claim', layer:'claims', step, summary, text:summary, details:k, min_granularity:'overview'});
        search_documents.push({id:nodeId(id), title:displayClaimLabel(id), text:summary, tags:[k.type || 'claim'], refs:[nodeId(id)]}); });
      [...(graph.operators || []),...strategyOperators].forEach((op,index) => { const type=String(op.type || op.operator || 'operator').toLowerCase(), vars=(op.variables || []).filter(id=>ids.includes(id)), conclusion=op.conclusion && ids.includes(op.conclusion) ? op.conclusion : null;
        if (type !== 'equivalence' && type !== 'implication') nodes.push({id:`step:${step}:operator:${op.id || index}`, entity_id:op.id || `operator_${index}`, label:type, display_label:type, display_meta:type, kind:'operator', layer:'operators', step, summary:op.metadata?.expression || type, details:{...op,type,variables:vars,conclusion}, min_granularity:'standard'});
        const opNode=`step:${step}:operator:${op.id || index}`;
        if (type === 'equivalence' || type === 'implication') { if (vars.length >= 2) edges.push({id:`step:${step}:op:${op.id || index}`,source:nodeId(vars[0]),target:nodeId(vars[1]),label:'',semantic_type:type,layer:'operators',step,reasoning_state:'confirmed'}); }

    function miniGraphMarkup(item){const strategyId=expandableStrategyId(item);if(!strategyId)return '';const graph=localFormalGraph(strategyId,false);if(!graph.nodes.length)return '<div class="muted">Step 4 中没有对应的局部展开图。</div>';const layout=automaticLayout(graph.nodes,graph.edges,true,false),nodeMap=new Map(graph.nodes.map(node=>[node.id,node])),defs='<defs><marker id="mini-arrow" markerWidth="7" markerHeight="7" refX="6" refY="2.5" orient="auto"><path d="M0,0 L0,5 L7,2.5 z" fill="#667085"></path></marker><marker id="mini-arrow-start" markerWidth="7" markerHeight="7" refX="6" refY="2.5" orient="auto-start-reverse"><path d="M0,0 L0,5 L7,2.5 z" fill="#667085"></path></marker></defs>',edges=graph.edges.map(edge=>edgeMarkup(edge,layout.positions,nodeMap,true,false,layout.routes).replaceAll('url(#arrow-start)','url(#mini-arrow-start)').replaceAll('url(#arrow)','url(#mini-arrow)')).join(''),nodes=graph.nodes.map(node=>nodeMarkup(node,layout.positions.get(node.id),true,false)).join('');return `<div class="section-title">Step 4 局部推理</div><svg class="mini-graph" data-layout-engine="${esc(layout.engine)}" viewBox="0 0 ${layout.width} ${layout.height}" aria-label="${esc(strategyId)} 的 Step 4 局部推理图">${defs}${edges}${nodes}</svg>`;}
    function showDetail(item){if(!item)return;const details=item.details||item.metadata||item,isCoarseWeakpoint=item.kind==='strategy'&&details.form==='coarse',sourceLink=details?.href?`<p><a href="${esc(details.href)}" target="_blank">打开冻结的原始 Artifact</a></p>`:'',anchorIds=item.source_anchor_ids||details?.source_anchor_ids||[],sourceCards=anchorIds.map(anchorId=>sourceByKey.get(`${item.step}:${anchorId}`)).filter(Boolean).map(target=>`<div class="property-card"><a href="${esc(target.href||'#')}" target="_blank">${esc(target.source_kind)} · ${esc(target.anchor_id)}</a><div class="muted">${esc(JSON.stringify(target.locator))}</div>${target.quote?`<blockquote>${esc(target.quote)}</blockquote>`:''}</div>`).join(''),sources=sourceCards?`<div class="section-title">原文定位</div>${sourceCards}`:'',findings=item.validation_findings||(item.kind==='validation_finding'?[details]:[]),validation=findings.length?`<div class="section-title">Validation</div>${findings.map(finding=>`<div class="validation-card ${finding.severity==='warning'?'warning':''}"><strong>${esc(finding.rule)}</strong><div>${esc(finding.message)}</div><div class="muted">目标：${esc(finding.target?.type)} · ${esc(finding.target?.id)}</div><div class="muted">位置：${esc(finding.location?.json_pointer)}</div><div>建议：${esc(finding.suggested_action)}</div></div>`).join('')}`:'',kind=item.kind||item.semantic_type||item.edge_class||'property',background=details.background||details.metadata?.background||details.operator?.metadata?.background,reasoningType=details.payload?.reasoning_type,basics=`<div class="section-title">Properties</div><div class="property-card">${propertyRow('step',item.step)}${propertyRow('entity ID',item.entity_id)}${propertyRow('operator ID',details.operator_id||details.id)}${isCoarseWeakpoint?'':propertyRow('type',details.type||item.semantic_type||item.kind)}${propertyRow('reasoning type',reasoningType)}${isCoarseWeakpoint?'':propertyRow('background',background)}${propertyRow('layer',item.layer)}${propertyRow('edge class',item.edge_class)}${propertyRow('reasoning',item.reasoning_state)}${propertyRow('fold groups',item.fold_groups||item.fold_group)}</div>`;document.getElementById('detail').innerHTML=`<h2>${esc(nodeIdentifier(item))}</h2><div class="muted">${esc(kind)} · ${esc(item.id||'')}</div><p>${esc(item.summary||item.text||'')}</p>${basics}${weakpointCard(item)}${miniGraphMarkup(item)}${validation}${sources}${sourceLink}<details ${devMode?'open':''}><summary>完整属性</summary><pre>${esc(JSON.stringify(details,null,2))}</pre></details>`;}

    document.getElementById('view-mode').addEventListener('change',event=>{state.mode=event.target.value;state.step=modeStep();state.expandedWeakpoints.clear();state.manualPositions.clear();state.selectedId=null;clearDetail();updateModeNote();updateValidationStatus();buildLayers(true);runSearch();});
    document.getElementById('search').addEventListener('input',event=>{state.query=event.target.value;runSearch();});
    document.getElementById('reset-layout').addEventListener('click',()=>{state.manualPositions.clear();renderGraph();});
    configureModeControls();updateValidationStatus();buildLayers(true);renderGraph();
    }
  </script>
</body>
</html>
