<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gaia Formalization Viewer</title>
  <style>
    :root { color-scheme:light; --ink:#172033; --muted:#667085; --line:#d0d5dd; --paper:#f7f8fa; --accent:#175cd3; --error:#d92d20; --warning:#dc6803; --passed:#067647; }
    * { box-sizing:border-box; }
    body { min-width:1080px; margin:0; color:var(--ink); background:var(--paper); font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif; }
    header { display:flex; gap:12px; align-items:center; height:59px; padding:12px 16px; background:white; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:3; }
    h1 { font-size:16px; margin:0 auto 0 0; }
    h2 { font-size:17px; margin:0 0 4px; overflow-wrap:anywhere; }
    input,select,button.toolbar { border:1px solid var(--line); border-radius:7px; padding:7px 9px; background:white; }
    button.toolbar { cursor:pointer; }
    #search { width:min(360px,30vw); }
    #file-input { display:none; }
    #drop-file { cursor:pointer; }
    body.file-dragging::after { content:'释放以打开 formalization.json'; position:fixed; inset:12px; display:grid; place-items:center; border:3px dashed var(--accent); border-radius:16px; background:rgba(238,244,255,.94); color:var(--accent); font-size:20px; font-weight:800; z-index:20; pointer-events:none; }
    #developer-badge { padding:5px 8px; border-radius:999px; color:#6941c6; background:#f4f3ff; font-size:12px; font-weight:700; }
    main { display:grid; grid-template-columns:180px minmax(560px,1fr) 380px; min-height:calc(100vh - 59px); }
    aside { background:white; padding:14px; overflow:auto; }
    #left { border-right:1px solid var(--line); }
    #detail { position:sticky; top:59px; height:calc(100vh - 59px); border-left:1px solid var(--line); }
    #canvas-wrap { overflow:auto; padding:16px; }
    svg { background:white; border:1px solid var(--line); border-radius:10px; min-width:100%; touch-action:none; }
    .edge { fill:none; stroke:#667085; stroke-width:1.7; marker-end:url(#arrow); cursor:pointer; }
    .edge.non-reasoning { stroke:#98a2b3; stroke-dasharray:7 5; }
    .edge.reasoning-candidate { stroke:#b54708; stroke-dasharray:2 5; }
    .edge.infer { stroke:#667085; stroke-dasharray:8 5; }
    .edge.relational { marker-end:none; }
    .edge.equivalence { marker-start:url(#arrow-start); marker-end:url(#arrow); }
    .edge.selected { stroke:var(--accent); stroke-width:3.5; }
    .edge.validation-failed { stroke:var(--error); stroke-width:3; stroke-dasharray:7 4; }
    .edge.validation-warning { stroke:var(--warning); stroke-width:3; }
    .edge-label { fill:var(--muted); font-size:10px; cursor:pointer; user-select:none; paint-order:stroke; stroke:white; stroke-width:4px; }
    .edge-label.selected { fill:var(--accent); font-weight:700; }
    .node .node-shape { stroke-width:1.6; cursor:grab; }
    .node.dragging .node-shape { cursor:grabbing; stroke:var(--accent); stroke-width:3; }
    .node.selected .node-shape { stroke:var(--accent); stroke-width:3.5; }
    .node text { pointer-events:none; fill:var(--ink); }
    .node-title { font-size:13px; font-weight:750; }
    .node-summary { font-size:11px; fill:#344054 !important; }
    .node.hit .node-shape { stroke:#f79009; stroke-width:3; }
    .node.validation-failed .node-shape { stroke:var(--error); stroke-width:3; }
    .node.validation-warning .node-shape { stroke:var(--warning); stroke-width:3; }
    .tone-claim .node-shape { fill:#e3f2fd; stroke:#1976d2; }
    .tone-observation .node-shape { fill:#e8f5e9; stroke:#43a047; }
    .node.observation-proposal .node-shape { stroke-dasharray:8 5; stroke-width:2.4; }
    .node.relation-display .node-shape { stroke-dasharray:6 4; stroke-width:2.2; }
    .tone-hypothesis .node-shape { fill:#f3e5f5; stroke:#7b1fa2; }
    .tone-caveat .node-shape { fill:#fff3e0; stroke:#ef6c00; }
    .tone-alternative .node-shape { fill:#fff1f0; stroke:#d92d20; stroke-dasharray:5 4; }
    .tone-limit .node-shape { fill:#ffebee; stroke:#c62828; }
    .tone-bridge .node-shape { fill:#fffde7; stroke:#f9a825; }
    .tone-setting .node-shape { fill:#f5f5f5; stroke:#616161; stroke-dasharray:5 4; }
    .tone-source .node-shape { fill:#f5f5f5; stroke:#757575; }
    .tone-registry .node-shape { fill:#eceff1; stroke:#546e7a; stroke-dasharray:5 4; }
    .tone-derived .node-shape { fill:#ede7f6; stroke:#673ab7; }
    .tone-weakpoint .node-shape { fill:#fff9c4; stroke:#f9a825; stroke-dasharray:5 4; }
    .operator .node-title { font-size:21px; text-anchor:middle; dominant-baseline:middle; }
    .op-implication .node-shape { fill:#e8f1ff; stroke:#175cd3; }
    .op-conjunction .node-shape { fill:#fff4e5; stroke:#e07912; }
    .op-disjunction .node-shape { fill:#f4f3ff; stroke:#7f56d9; }
    .op-equivalence .node-shape { fill:#e7f8f4; stroke:#0e9384; }
    .op-contradiction .node-shape { fill:#fee4e2; stroke:#d92d20; }
    .op-negation .node-shape,.op-complement .node-shape { fill:#f2f4f7; stroke:#475467; }
    #validation-status { white-space:nowrap; font-weight:700; }
    #validation-status.passed { color:var(--passed); }
    #validation-status.failed { color:var(--error); }
    #validation-status.warning { color:var(--warning); }
    .validation-card { border-left:4px solid var(--error); background:#fef3f2; padding:8px; margin:8px 0; }
    .validation-card.warning { border-color:var(--warning); background:#fff6ed; }
    .property-card { padding:9px 10px; margin:7px 0; border:1px solid #eaecf0; border-radius:7px; background:#f9fafb; }
    .property-row { display:grid; grid-template-columns:100px minmax(0,1fr); gap:7px; margin:4px 0; }
    .property-key { color:var(--muted); }
    .section-title { color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin:12px 0 6px; }
    .legend-item { display:flex; align-items:center; gap:8px; margin:6px 0; color:var(--muted); font-size:12px; }
    .legend-line { display:inline-block; width:34px; border-top:2px solid #667085; }
    .legend-line.non-reasoning { border-top-style:dashed; border-color:#98a2b3; }
    .legend-line.candidate { border-top:2px dotted #b54708; }
    label { display:block; margin:7px 0; }
    button.result { width:100%; text-align:left; border:0; background:#f9fafb; border-radius:6px; padding:7px; margin:4px 0; cursor:pointer; }
    button.result:hover { background:#eef4ff; }
    blockquote { margin:6px 0; padding-left:9px; border-left:3px solid var(--line); color:#475467; }
    pre { white-space:pre-wrap; word-break:break-word; font-size:12px; background:#f9fafb; padding:8px; border-radius:6px; }
    .muted { color:var(--muted); }
    details { margin-top:10px; }
    .mini-graph { width:100%; min-width:0; height:auto; max-height:680px; margin:4px 0 10px; }
    .mini-graph .node-title { font-size:9px; }
    .mini-graph .node-summary { font-size:7.5px; }
    .mini-graph .operator .node-title { font-size:14px; }
    .mode-note { margin:0 0 10px; padding:8px; border-radius:7px; background:#f2f4f7; color:#475467; font-size:12px; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Gaia Formalization Viewer</h1>
    <span id="developer-badge" hidden>开发者模式</span>
    <input id="search" type="search" placeholder="搜索 claim ID 或正文…">
    <input id="file-input" type="file" accept=".json,application/json">
    <button id="drop-file" class="toolbar" type="button">打开 formalization</button>
    <span id="validation-status"></span>
    <select id="stage" aria-label="图版本" hidden></select>
    <select id="view-mode" aria-label="查看模式" hidden><option value="standard" selected>Standard</option></select>
    <button id="reset-layout" class="toolbar" type="button">重置布局</button>
  </header>
  <main>
    <aside id="left">
      <div id="mode-note" class="mode-note"></div>
      <div class="section-title">Layers</div>
      <div id="layers"></div>
      <div class="section-title">Edge legend</div>
      <div class="legend-item"><span class="legend-line"></span>已确认推理</div>
      <div class="legend-item"><span class="legend-line non-reasoning"></span>非推理关系 / weakpoint</div>
      <div class="legend-item"><span class="legend-line candidate"></span>待确认推理</div>
      <div class="section-title">Interaction</div>
      <div class="muted">单击 weakpoint 块可在大图展开／折叠局部推理；单击其他节点或边查看属性；节点可拖动。</div>
      <div class="section-title">Search results</div>
      <div id="results" class="muted">输入关键词进行搜索</div>
    </aside>
    <section id="canvas-wrap"><svg id="graph" role="img"></svg></section>
    <aside id="detail"><div class="muted">单击节点或边，在这里查看属性。</div></aside>
  </main>

", "visible_at": ["overview", "standard"]}, {"details": {"content": "In CIFAR-10, during training and with increasing weight pruning up to moderate sparsity, mask structure in deeper layers increasingly reflects high-level semantic relations between class labels, until aggressive pruning destroys the alignment between mask structure in deeper layers and high-level semantic relations between class labels.", "id": "papers:paper_607795ad::claim_10", "integration_owned": false, "qid": "papers:paper_607795ad::claim_10", "type": "claim"}, "display_label": "B:10", "display_meta": "claim", "entity_id": "B:10", "id": "knowledge:papers:paper_607795ad::claim_10", "kind": "claim", "label": "B:10", "layer": "weakpoints", "min_granularity": "overview", "source_anchor_ids": [], "step": 4, "summary": "In CIFAR-10, during training and with increasing weight pruning up to moderate sparsity, mask structure in deeper layers increasingly reflects high-level semantic relations between class labels, until aggressive pruning destroys the alignment between mask structure in deeper layers and high-level semantic relations between class labels.", "visible_at": ["overview", "standard"]}, {"details": {"content": "In Panel B of the Figure 2 mask collapse analysis, correlations across network depth during optimization showed weak correlations that decreased with depth in early optimization but increased consistently in later epochs, particularly in middle and deep layers, indicating a gradual emergence of semantic structure as subnetworks refined specialized connectivity.", "id": "papers:paper_607795ad::claim_O01", "integration_owned": false, "qid": "papers:paper_607795ad::claim_O01", "type": "claim"}, "display_label": "B:O01", "display_meta": "claim", "entity_id": "B:O01", "id": "knowledge:papers:paper_607795ad::claim_O01", "kind": "claim", "label": "B:O01", "layer": "weakpoints", "min_granularity": "overview", "source_anchor_ids": [], "step": 4, "summary": "In Panel B of the Figure 2 mask collapse analysis, correlations across network depth during optimization showed weak correlations that decreased with depth in early optimization but increased consistently in later epochs, particularly in middle and deep layers, indicating a gradual emergence of semantic structure as subnetworks refined specialized connectivity.", "visible_at": ["overview", "standard"]}, {"details": {"content": "In the semantic and structural correlation analysis of RTL subnetworks for four representative classes (airplane, cat, deer, and truck), semantically related classes (cat and deer) showed stronger correlations of 0.6-0.7 that grew with pruning and depth, whereas unrelated classes (airplane and truck) remained weaker at 0.2-0.3, as measured by Spearman's rank-order correlation between semantic similarity and mask similarity; this pattern indicates that RTL subnetworks for related categories preserve overlapping structures while distant ones evolve independently and is consistent with overall mask stability across dissimilar classes.", "id": "papers:paper_607795ad::claim_O02", "integration_owned": false, "qid": "papers:paper_607795ad::claim_O02", "type": "claim"}, "display_label": "B:O02", "display_meta": "claim", "entity_id": "B:O02", "id": "knowledge:papers:paper_607795ad::claim_O02", "kind": "claim", "label": "B:O02", "layer": "weakpoints", "min_granularity": "overview", "source_anchor_ids": [], "step": 4, "summary": "In the semantic and structural correlation analysis of RTL subnetworks for four representative classes (airplane, cat, deer, and truck), semantically related classes (cat and deer) showed stronger correlations of 0.6-0.7 that grew with pruning and depth, whereas unrelated classes (airplane and truck) remained weaker at 0.2-0.3, as measured by Spearman's rank-order correlation between semantic similarity and mask similarity; this pattern indicates that RTL subnetworks for related categories preserve overlapping structures while distant ones evolve independently and  model and the IMP subnetworks, as characterized by min/max, mean ± standard deviation, and average magnitude.", "id": "papers:paper_af285cb1::claim_O16", "integration_owned": false, "qid": "papers:paper_af285cb1::claim_O16", "type": "claim"}, "display_label": "D:O16", "display_meta": "claim", "entity_id": "D:O16", "id": "knowledge:papers:paper_af285cb1::claim_O16", "kind": "claim", "label": "D:O16", "layer": "weakpoints", "min_granularity": "overview", "source_anchor_ids": [], "step": 4, "summary": "For ConvNet-3 trained on CIFAR-10, using the diagonal of the Hessian measured over batches of real training data, synthetic subnetworks at 60% and 90% sparsity showed a tighter distribution of diagonal Hessian values around zero with less variance than both the dense model and the IMP subnetworks, as characterized by min/max, mean ± standard deviation, and average magnitude.", "visible_at": ["overview", "standard"]}, {"details": {"content": "Across the reported comparisons, the loss landscape placement and performance equivalence of sparse solutions vary with the procedure that produced them.", "id": "candidate_A_016e33196f5660c5", "integration_owned": true, "qid": "candidate_A_016e33196f5660c5", "type": "claim"}, "display_label": "A:1", "display_meta": "claim", "entity_id": "A:1", "id": "knowledge:candidate_A_016e33196f5660c5", "kind": "claim", "label": "A:1", "layer": "weakpoints", "min_granularity": "overview", "source_anchor_ids": [], "step": 4, "summary": "Across the reported comparisons, the loss landscape placement and performance equivalence of sparse solutions vary with the procedure that produced them.", "visible_at": ["overview", "standard"]}, {"details": {"content": "Pruning at a fixed budget causes greater performance degradation as the granularity of removal becomes finer rather than coarser.", "id": "candidate_A_10803f88dd813cea", "integration_owned": true, "qid": "candidate_A_10803f88dd813cea", "type": "claim"}, "display_label": "A:2", "display_meta": "claim", "entity_id": "A:2", "id": "knowledge:candidate_A_10803f88dd813cea", "kind": "claim", "label": "A:2", "layer": "weakpoints", "min_granularity": "overview", "source_anchor_ids": [], "step": 4, "summary": "Pruning at a fixed budget causes greater performance degradation as the granularity of removal becomes finer rather than coarser.", "visible_at": ["overview", "standard"]}, {"details": {"content": "Pruned network outcomes depend on how sparsity is configured and how pruned weights are subsequently handled, not on sparsity magnitude alone.", "id": "candidate_A_1547c3764e68c426", "integration_owned": true, "qid": "candidate_A_1547c3764e68c426", "type": "claim"}, "display_label": "A:3", "display_meta": "claim", "entity_id": "A:3", "id": "knowledge:candidate_A_1547c3764e68c426", "kind": "claim", "label": "A:3", "layer": "weakpoints", "min_granularity": "overview", "source_anchor_ids": [], "step": 4, "summary": "Pruned network outcomes depend on how sparsity is configured and how pruned weights are subsequently handled, not on sparsity magnitude alone.", "visible_at": ["overview", "standard"]}, {"details": {"content": "Across the reported pruning settings, final performance is governed by the composition or coherence of retained subnetworks rather than by the degree of parameter removal alone.", "id": "candidate_A_44afd14d0349ff15", "integration_owned": true, "qid": "candidate_A_44afd14d0349ff15", "type": "claim"}, "display_label": "A:4", "display_meta": "claim", "entity_id": "A:4", "id": "knowledge:candidate_A_44afd14d0349ff15", "kind": "claim", "label": "A:4", "layer": "weakpoints", "min_granularity": "overview", "source_anchor_ids": [], "step": 4, "summary": "Across the reported pruning settings, final performance is governed by the composition or coherence of retained subnetworks rather than by the degree of parameter removal alone.", "visible_at": ["overview", "standard"]}, {"details": {"content": "Across pruning studies, preserving task-relevant structural specialization, rather than sparsity alone, governs whether performance and output quality are retained.", "id": "candidate_A_803eb5bb18871097", "integration_owned": true, "qid": "candidate_A_803eb5bb18871097", "type": "claim"}, "display_label": "A:5", "display_meta": "claim", "entity_id": "A:5", "id": "knowledge:candidate_A_803eb5bb18871097", "kind": "claim", "label": "A:5", "layer": "weakpoints", "min_granularity": "overview", "source_anchor_ids": [], "step": 4, "summary": "Across pruning studies, preserving task-relevant structural specialization, rather than sparsity alone, governs whether performance and output quality are retained.", "visible_at": ["overview", "standard"]}, {"details": {"content": "Subsequent optimization after structural selection improves performance without changing the selected structure's size.", "id": "candidate_A_ad9181e71b599a7e", "integration_owned": true, "qid": "candidate_A_ad9181e71b599a7e", "type": "claim"}, "display_label": "A:6", "display_meta": "claim", "entity_id": "A:6", "id": "knowledge:candidate_A_ad9181e71b599a7e", "kind": "claim", "label": "A:6", "layer": "weakpoints", "min_granularity": "overview", "source_anchor_ids": [], "step": 4, "summary": "Subsequent optimization after structural selection improves performance without changing the selected structure's size.", "visible_at": ["overview", "standard"]}, {"details": {"content": "Across diverse tasks and sparsity levels, a particular subnetwork approach consistently outperforms alternative pruning approaches.", "id": "candidate_A_eba2cf1220281cf5", "integration_owned": true, "qid": "candidate_A_eba2cf1220281cf5", "type": "claim"}, "display_label": "A:7", "display_meta": "claim", "entity_id": "A:7", "id": "knowledge:candidate_A_eba2cf1220281cf5", "kind": "claim", "label": "A:7", "layer": "weakpoints", "min_granularity": "overview", "source_anchor_ids": [], "step": 4, "summary": "Across diverse tasks and sparsity levels, a particular subnetwork approach consistently outperforms alternative pruning approaches.", "visible_at": ["overview", "standard"]}, {"details": {"content": "Aggressively pruned networks can match their unpruned performance when an auxiliary structural component is retained.", "id": "candidate_A_f4da318bdddf62cc", "integration_owned": true, "qid": "candidate_A_f4da318bdddf62cc", "type": "claim"}, "display_label": "A:8", "display_meta": "claim", "entity_id": "A:8", "id": "knowledge:candidate_A_f4da318bdddf62cc", "kind": "claim", "label": "A:8", "layer": "weakpoints", "min_granularity": "overview", "source_anchor_ids": [], "step": 4, "summary": "Aggressively pruned networks can match their unpruned performance when an auxiliary structural component is retained.", "visible_at": ["overview", "standard"]}, {"details": {"content": "Across the evaluated neural and graph neural architectures, tasks, and datasets, reducing effective trainable capacity—whether through quaternion parameter sharing, magnitude-based pruning, or allocating specialized subnetworks—yields compressed models that match or exceed their dense/real-valued baselines while using substantially fewer parameters within a moderate-compression regime, but beyond an architecture- and task-dependent sparsity/compression threshold the compressed models share a failure mode in which retained structural specialization degrades and predictive performance drops sharply, with the threshold, stability, and recovery being contingent on pruning granularity, fine-tuning, initialization/reset policy, and task sensitivity.", "id": "candidate_K_927e38c661d96bab", "integration_owned": true, "qid": "candidate_K_927e38c661d96bab", "type": "claim"}, "display_label": "K:1", "display_meta": "claim", "entity_id": "K:1", "id": "knowledge:candidate_K_927e38c661d96bab", "kind": "claim", "label": "K:1", "layer": "weakpoints", "min_granularity": "overview", "source_anchor_ids": [], "step": 4, "summary": "Across the evaluated neural and graph neural architectures, tasks, and datasets, reducing effective trainable capacity—whether through quaternion parameter sharing, magnitude-based pruning, or allocating specialized subnetworks—yields compressed models that match or exceed their dense/real-valued baselines while using substantially fewer parameters within a moderate-compression regime, but beyond an architecture- and task-dependent sparsity/compression threshold the compressed models share a failure mode in which retained structural specialization degrades and predictive performance drops sharply, with the threshold, stability, and recovery being contingent on pruning granularity, fine-tuning, initialization/reset policy, and task sensitivity.", "visible_at": ["overview", "standard"]}], "search_documents": [{"id": "search:papers:paper_24bac745::claim_1", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_1"], "tags": ["claim", "claims"], "text": "The MESSAGE, AGGREGATE, and UPDATE functions of any message-passing GNN are replaced by their quaternion counterparts so that the layerwise message-passing semantics are preserved in quaternion space.", "title": "A:1"}, {"id": "search:papers:paper_24bac745::claim_2", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_2"], "tags": ["claim", "claims"], "text": "Representing layer weights as quaternion matrices and grouping four real feature channels into one quaternion reduces the number of independent trainable real parameters by a factor of four relative to an equivalent real-valued GNN weight matrix.", "title": "A:2"}, {"id": "search:papers:paper_24bac745::claim_3", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_3"], "tags": ["claim", "weakpoints"], "text": "A quaternion weight mapping from $F$ real input features to $F'$ real outputs uses $F/4\\times F'/4$ quaternion entries, yielding one-fourth the degrees of freedom of the corresponding real weight matrix.", "title": "A:3"}, {"id": "search:papers:paper_24bac745::claim_4", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_4"], "tags": ["claim", "weakpoints"], "text": "Quaternion matrix multiplications have the same asymptotic time complexity as the corresponding real matrix multiplications.", "title": "A:4"}, {"id": "search:papers:paper_24bac745::claim_5", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_5"], "tags": ["claim", "weakpoints"], "text": "The parameter reduction described in claim 2 is achieved without increasing matrix-multiplication time complexity. [Referenced claim 2: Representing layer weights as quaternion matrices and grouping four real feature channels into one quaternion reduces the number of independent trainable real parameters by a factor of four relative to an equivalent real-valued GNN weight matrix.]", "title": "A:5"}, {"id": "search:papers:paper_24bac745::claim_6", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_6"], "tags": ["claim", "weakpoints"], "text": "When QMPNN variants of standard GNN architectures are trained under the same hyperparameters as those standard GNN architectures and evaluated on standard datasets, the quaternion models achieve comparable or better accuracy, ROC-AUC, or Hits@K (proportion of top-K predictions that are correct) while using roughly one-fourth of the trainable parameters of those standard GNN architectures.", "title": "A:6"}, {"id": "search:papers:paper_24bac745::claim_7", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_7"], "tags": ["claim", "weakpoints"], "text": "(a) node classification on Cora: real GCN 85.2 ± 1.3 accuracy with 140.5K parameters vs QGCN 84.1 ± 1.5 accuracy with 42.1K parameters;", "title": "A:7"}, {"id": "search:papers:paper_24bac745::claim_8", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_8"], "tags": ["claim", "weakpoints"], "text": "(b) node classification on PubMed: GCN 79.1 ± 1.2 with 131.9K parameters vs QGCN 78.4 ± 1.4 with 41.7K parameters;", "title": "A:8"}, {"id": "search:papers:paper_24bac745::claim_9", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_9"], "tags": ["claim", "claims"], "text": "(c) link prediction on CORA: GCN ROC-AUC 79.27 ± 0.47 with 96.0K parameters vs QGCN ROC-AUC 83.55 ± 0.03 with 27.2K parameters;", "title": "A:9"}, {"id": "search:papers:paper_24bac745::claim_10", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_10"], "tags": ["claim", "weakpoints"], "text": "(d) graph classification on MUTAG: GCN 83.54 ± 0.40 accuracy with 4.8K parameters vs QGCN 88.61 ± 0.66 accuracy with 4.4K parameters.", "title": "A:10"}, {"id": "search:papers:paper_24bac745::claim_11", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_11"], "tags": ["claim", "weakpoints"], "text": "Across all tasks and datasets evaluated, quaternion variants of standard GNN architectures frequently perform within a small margin of the corresponding real models and sometimes exceed their performance while consistently having approximately one-fourth the trainable parameter count of the corresponding real models.", "title": "A:11"}, {"id": "search:papers:paper_24bac745::claim_12", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_12"], "tags": ["claim", "weakpoints"], "text": "Winning graph-lottery tickets exist for both real-valued GNNs and QMPNNs.", "title": "A:12"}, {"id": "search:papers:paper_24bac745::claim_13", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_13"], "tags": ["claim", "weakpoints"], "text": "Magnitude-based iterative pruning identifies subnetworks that match baseline performance at sparsity levels down to approximately 1–20% of the original parameter count across multiple architectures and tasks.", "title": "A:13"}, {"id": "search:papers:paper_24bac745::claim_14", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_14"], "tags": ["claim", "weakpoints"], "text": "QMPNN variants scale to large graph datasets and maintain performance comparable to real-valued GNNs while using fewer parameters.", "title": "A:14"}, {"id": "search:papers:paper_24bac745::claim_15", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_15"], "tags": ["claim", "weakpoints"], "text": "on OGBN-Arxiv node classification, GCN achieves 72.8 ± 1.5 accuracy with 145.1K parameters versus QGCN 72.3 ± 1.6 with 43.5K parameters;", "title": "A:15"}, {"id": "search:papers:paper_24bac745::claim_16", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_16"], "tags": ["claim", "weakpoints"], "text": "on OGBG-COLLAB link prediction, QGCN achieves Hits@50 45.80 ± 1.35 with 6.4K parameters compared to GCN 44.02 ± 1.57 with 12.5K parameters.", "title": "A:16"}, {"id": "search:papers:paper_24bac745::claim_17", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_17"], "tags": ["claim", "claims"], "text": "the quaternion reparameterization is effective on large-scale graph benchmarks.", "title": "A:17"}, {"id": "search:papers:paper_24bac745::claim_18", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_18"], "tags": ["claim", "weakpoints"], "text": "When the three QMPNN variants QGCN, QGAT, and QSAGE of standard GNN architectures are trained under the same hyperparameters as those standard GNN architectures and evaluated on standard datasets, the quaternion models achieve comparable or better accuracy, ROC-AUC, or Hits@K (proportion of top-K predictions that are correct) while using roughly one-fourth of the trainable parameters of those standard GNN architectures.", "title": "A:18"}, {"id": "search:papers:paper_24bac745::claim_19", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_19"], "tags": ["claim", "weakpoints"], "text": "Magnitude-based iterative pruning identifies subnetworks that match baseline performance at sparsity levels down to approximately 1–20% of the original parameter count across the architectures QGCN, QGAT, and QSAGE and tasks.", "title": "A:19"}, {"id": "search:papers:paper_24bac745::claim_O07", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_O07"], "tags": ["claim", "weakpoints"], "text": "At a pruning weight fraction of 0.3 on OGBN-ARXIV, OGBL-COLLAB, and OGBG-MOHLIV, GCN, GAT, and GraphSAGE with GLTs showed comparable performance to their pre-pruning baselines despite sparsity.", "title": "A:O07"}, {"id": "search:papers:paper_24bac745::claim_E_imported_10", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_E_imported_10"], "tags": ["claim", "weakpoints"], "text": "For graph classification on MUTAG, QGCN with 4.4K parameters attains accuracy 88.61 ± 0.66, while GCN with 4.8K parameters attains accuracy 83.54 ± 0.40.", "title": "A:E_imported_10"}, {"id": "search:papers:paper_24bac745::claim_E_imported_15", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_E_imported_15"], "tags": ["claim", "weakpoints"], "text": "In node classification on OGBN-Arxiv, GCN's accuracy is 72.8 ± 1.5 with 145.1K parameters, whereas QGCN's accuracy is 72.3 ± 1.6 with 43.5K parameters.", "title": "A:E_imported_15"}, {"id": "search:papers:paper_24bac745::claim_E_imported_16", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_E_imported_16"], "tags": ["claim", "weakpoints"], "text": "In OGBG-COLLAB link prediction, QGCN reaches Hits@50 45.80 ± 1.35 with 6.4K parameters, while GCN reaches Hits@50 44.02 ± 1.57 with 12.5K parameters.", "title": "A:E_imported_16"}, {"id": "search:papers:paper_24bac745::claim_E_imported_7", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_E_imported_7"], "tags": ["claim", "weakpoints"], "text": "For node classification on Cora, the real GCN's accuracy is 85.2 ± 1.3 with 140.5K parameters, whereas QGCN's accuracy is 84.1 ± 1.5 with 42.1K parameters.", "title": "A:E_imported_7"}, {"id": "search:papers:paper_24bac745::claim_E_imported_8", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_E_imported_8"], "tags": ["claim", "weakpoints"], "text": "In node classification on PubMed, GCN's accuracy is 79.1 ± 1.2 with 131.9K parameters, whereas QGCN's accuracy is 78.4 ± 1.4 with 41.7K parameters.", "title": "A:E_imported_8"}, {"id": "search:papers:paper_24bac745::claim_E_imported_9", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_E_imported_9"], "tags": ["claim", "weakpoints"], "text": "For link prediction on CORA, GCN's ROC-AUC is 79.27 ± 0.47 with 96.0K parameters, whereas QGCN's ROC-AUC is 83.55 ± 0.03 with 27.2K parameters.", "title": "A:E_imported_9"}, {"id": "search:papers:paper_24bac745::claim_E07", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_24bac745::claim_E07"], "tags": ["claim", "weakpoints"], "text": "At a setting in which the pruning weight fraction is 0.3 on the datasets OGBN-ARXIV, OGBL-COLLAB, and OGBG-MOHLIV, GCN, GAT, and GraphSAGE models that incorporate GLTs exhibit performance at a level comparable to their pre-pruning baselines, notwithstanding the sparsity.", "title": "A:E07"}, {"id": "search:papers:paper_f519c93b::claim_1", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_1"], "tags": ["claim", "weakpoints"], "text": "Both global unstructured magnitude pruning, which applies a uniform sparsity ratio across all weights, and fine-grained layer-wise magnitude pruning, which applies per-layer magnitude thresholds, substantially reduce on-disk model size when the model state is stored sparsely by keeping only nonzero weight values and their positions.", "title": "E:1"}, {"id": "search:papers:paper_f519c93b::claim_2", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_2"], "tags": ["claim", "weakpoints"], "text": "Empirically, pruned models achieve size reductions of approximately 4–9× at high sparsity (80–90%), depending on dataset and method.", "title": "E:2"}, {"id": "search:papers:paper_f519c93b::claim_3", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_3"], "tags": ["claim", "weakpoints"], "text": "global pruning on the Cora node classification task achieves a baseline-to-pruned size ratio of 4.76× at 80% sparsity and 8.98× at 90% sparsity.", "title": "E:3"}, {"id": "search:papers:paper_f519c93b::claim_4", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_4"], "tags": ["claim", "weakpoints"], "text": "Accuracy after pruning often remains near baseline or improves following fine-tuning.", "title": "E:4"}, {"id": "search:papers:paper_f519c93b::claim_5", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_5"], "tags": ["claim", "weakpoints"], "text": "Global unstructured magnitude pruning on the Cora node classification setup shows accuracy recovering from values near 0.86 to 0.90 ± 0.01 after fine-tuning at certain pruning levels.", "title": "E:5"}, {"id": "search:papers:paper_f519c93b::claim_6", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_6"], "tags": ["claim", "weakpoints"], "text": "The effects described in claim 1, claim 2, claim 4 were observed across the evaluated GNN architectures (SplineConv, NESS, HGP-SL, GNNNet, GIN) and datasets (Cora, Proteins, BBBP). [Referenced claim 1: Both global unstructured magnitude pruning, which applies a uniform sparsity ratio across all weights, and fine-grained layer-wise magnitude pruning, which applies per-layer magnitude thresholds, substantially reduce on-disk model size when the model state is stored sparsely by keeping only nonzero weight values and their positions.] [Referenced claim 2: Empirically, pruned models achieve size reductions of approximately 4–9× at high sparsity (80–90%), depending on dataset and method.] [Referenced claim 4: Accuracy after pruning often remains near baseline or improves following fine-tuning.]", "title": "E:6"}, {"id": "search:papers:paper_f519c93b::claim_7", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_7"], "tags": ["claim", "weakpoints"], "text": "In the comparison of the two magnitude-based pruning methods applied to the GNN architectures (SplineConv, NESS, HGP-SL, GNNNet, GIN) and tasks (node classification on Cora, link prediction on Cora, graph classification on BBBP and Proteins), global unstructured pruning exhibits more consistent behavior across tasks than fine-grained layer-wise pruning.", "title": "E:7"}, {"id": "search:papers:paper_f519c93b::claim_8", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_8"], "tags": ["claim", "weakpoints"], "text": "Global unstructured pruning tolerates moderate sparsity (30–60%) with small accuracy degradation.", "title": "E:8"}, {"id": "search:papers:paper_f519c93b::claim_9", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_9"], "tags": ["claim", "weakpoints"], "text": "Global unstructured pruning does not require per-layer tuning.", "title": "E:9"}, {"id": "search:papers:paper_f519c93b::claim_10", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_10"], "tags": ["claim", "weakpoints"], "text": "Fine-grained layer-wise pruning, when applied without fine-tuning, yields larger accuracy drops than global unstructured pruning.", "title": "E:10"}, {"id": "search:papers:paper_f519c93b::claim_11", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_11"], "tags": ["claim", "weakpoints"], "text": "(on Cora node classification, accuracy drops from 0.86 at baseline to 0.76 at 90% sparsity without fine-tuning),", "title": "E:11"}, {"id": "search:papers:paper_f519c93b::claim_12", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_12"], "tags": ["claim", "weakpoints"], "text": "When followed by fine-tuning, fine-grained layer-wise pruning can recover or surpass baseline accuracy on structurally sensitive tasks.", "title": "E:12"}, {"id": "search:papers:paper_f519c93b::claim_13", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_13"], "tags": ["claim", "weakpoints"], "text": "(accuracy recovers to approximately 0.89 at 90% sparsity after fine-tuning).", "title": "E:13"}, {"id": "search:papers:paper_f519c93b::claim_14", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_14"], "tags": ["claim", "weakpoints"], "text": "On tasks other than structurally sensitive tasks, fine-grained pruning with fine-tuning does not recover baseline accuracy at high sparsity.", "title": "E:14"}, {"id": "search:papers:paper_f519c93b::claim_15", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_15"], "tags": ["claim", "weakpoints"], "text": "Global pruning is lower-variance than fine-grained pruning.", "title": "E:15"}, {"id": "search:papers:paper_f519c93b::claim_16", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_16"], "tags": ["claim", "claims"], "text": "Global pruning is safer for general compression than fine-grained pruning.", "title": "E:16"}, {"id": "search:papers:paper_f519c93b::claim_17", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_17"], "tags": ["claim", "weakpoints"], "text": "Fine-grained pruning is higher-variance than global pruning.", "title": "E:17"}, {"id": "search:papers:paper_f519c93b::claim_18", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_18"], "tags": ["claim", "weakpoints"], "text": "Fine-grained pruning may preserve critical substructures.", "title": "E:18"}, {"id": "search:papers:paper_f519c93b::claim_19", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_19"], "tags": ["claim", "claims"], "text": "Fine-grained pruning may yield better accuracy recovery than global pruning on some datasets.", "title": "E:19"}, {"id": "search:papers:paper_f519c93b::claim_20", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_20"], "tags": ["claim", "weakpoints"], "text": "Layer-wise analysis of sparsity under global unstructured magnitude pruning applied to the GNN architectures (GNNNet on BBBP, SplineConv on Cora node classification, HGP-SL on Proteins) reveals heterogeneous sensitivity to pruning.", "title": "E:20"}, {"id": "search:papers:paper_f519c93b::claim_21", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_21"], "tags": ["claim", "weakpoints"], "text": "Early convolutional layers maintain a low proportion of zero weights even at high global sparsity targets.", "title": "E:21"}, {"id": "search:papers:paper_f519c93b::claim_22", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_22"], "tags": ["claim", "claims"], "text": "Early convolutional layers exhibit tolerance to pruning even at high global sparsity targets.", "title": "E:22"}, {"id": "search:papers:paper_f519c93b::claim_23", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_23"], "tags": ["claim", "weakpoints"], "text": "Linear projection layers and final classifier MLPs exhibit a high proportion of zero weights even at low global sparsity.", "title": "E:23"}, {"id": "search:papers:paper_f519c93b::claim_24", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_24"], "tags": ["claim", "weakpoints"], "text": "Linear projection layers and final classifier MLPs exhibit greater sensitivity to pruning than early convolutional layers.", "title": "E:24"}, {"id": "search:papers:paper_f519c93b::claim_25", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_25"], "tags": ["claim", "claims"], "text": "In the experiments on GNN architectures and datasets, reductions in parameter count from pruning did not translate into consistent decreases in inference time or memory usage.", "title": "E:25"}, {"id": "search:papers:paper_f519c93b::claim_26", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_26"], "tags": ["claim", "claims"], "text": "Inference latency remained largely unchanged across sparsity levels.", "title": "E:26"}, {"id": "search:papers:paper_f519c93b::claim_27", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_27"], "tags": ["claim", "claims"], "text": "Memory usage and CPU/energy consumption showed non-monotonic, dataset- and sparsity-dependent patterns.", "title": "E:27"}, {"id": "search:papers:paper_f519c93b::claim_28", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_28"], "tags": ["claim", "claims"], "text": "For global pruning, CPU usage peaks at 70% sparsity across datasets.", "title": "E:28"}, {"id": "search:papers:paper_f519c93b::claim_29", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_29"], "tags": ["claim", "claims"], "text": "For fine-grained pruning, CPU and energy consumption exhibit sharp spikes and bimodal profiles.", "title": "E:29"}, {"id": "search:papers:paper_f519c93b::claim_30", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_30"], "tags": ["claim", "claims"], "text": "For fine-grained pruning, energy consumption is higher than for global pruning at low-to-moderate sparsities.", "title": "E:30"}, {"id": "search:papers:paper_f519c93b::claim_31", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_31"], "tags": ["claim", "claims"], "text": "Global pruning is more energy-efficient than fine-grained pruning at medium-to-high sparsities.", "title": "E:31"}, {"id": "search:papers:paper_f519c93b::claim_32", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_32"], "tags": ["claim", "claims"], "text": "This practical sparse-state storage method materially reduces on-disk model sizes for pruned GNNs with architectures.", "title": "E:32"}, {"id": "search:papers:paper_f519c93b::claim_33", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_33"], "tags": ["claim", "claims"], "text": "This approach, a practical sparse-state storage method, yields meaningful disk savings only beyond high sparsity levels.", "title": "E:33"}, {"id": "search:papers:paper_f519c93b::claim_34", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_34"], "tags": ["claim", "weakpoints"], "text": "Empirically, significant reductions in on-disk model sizes appear when sparsity exceeds roughly 80%.", "title": "E:34"}, {"id": "search:papers:paper_f519c93b::claim_35", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_35"], "tags": ["claim", "claims"], "text": "Storing sparse indices and metadata offsets incurs overhead at lower sparsities.", "title": "E:35"}, {"id": "search:papers:paper_f519c93b::claim_36", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_36"], "tags": ["claim", "weakpoints"], "text": "Evaluating quantization schemes on the GIN graph-classification model reveals that Degree-Quant with INT8 and Quantization-Aware Training with INT8 consistently recover most or all accuracy lost to reduced precision and often improve resource metrics.", "title": "E:36"}, {"id": "search:papers:paper_f519c93b::claim_37", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_37"], "tags": ["claim", "claims"], "text": "For the BBBP dataset, DQ-INT8 achieves accuracy 0.83 ± 0.01, inference time 2.04 s, and energy 24.78 ± 0.17 J;", "title": "E:37"}, {"id": "search:papers:paper_f519c93b::claim_38", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_38"], "tags": ["claim", "claims"], "text": "On the GIN graph-classification model, for the BBBP dataset, Quantization-Aware Training with INT8 (QAT-INT8) achieves accuracy and inference time similar to Degree-Quant with INT8, but higher energy than Degree-Quant with INT8.", "title": "E:38"}, {"id": "search:papers:paper_f519c93b::claim_39", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_39"], "tags": ["claim", "claims"], "text": "For the Proteins dataset, DQ-INT8 achieves accuracy 0.72 ± 0.01 and energy 28.74 ± 2.72 J;", "title": "E:39"}, {"id": "search:papers:paper_f519c93b::claim_40", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_40"], "tags": ["claim", "claims"], "text": "QAT-INT8 achieves accuracy 0.72 ± 0.01 and energy 37.19 ± 3.09 J.", "title": "E:40"}, {"id": "search:papers:paper_f519c93b::claim_41", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_41"], "tags": ["claim", "claims"], "text": "On the GIN graph-classification model, INT4 variants are less stable than INT8 variants.", "title": "E:41"}, {"id": "search:papers:paper_f519c93b::claim_42", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_42"], "tags": ["claim", "claims"], "text": "On the GIN graph-classification model, INT4 variants can be faster in training duration than INT8 variants but often incur larger accuracy drops than INT8 variants.", "title": "E:42"}, {"id": "search:papers:paper_f519c93b::claim_43", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_43"], "tags": ["claim", "claims"], "text": "(DQ-INT4 on BBBP: accuracy 0.77 ± 0.02, energy 33.69 ± 4.18 J; )", "title": "E:43"}, {"id": "search:papers:paper_f519c93b::claim_44", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_44"], "tags": ["claim", "claims"], "text": "(on Proteins: accuracy 0.61 ± 0.02, energy 30.26 ± 3.39 J).", "title": "E:44"}, {"id": "search:papers:paper_f519c93b::claim_45", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_45"], "tags": ["claim", "claims"], "text": "On the GIN graph-classification model, the results in claim 36, claim 41, claim 42 hold across the BBBP and Proteins datasets. [Referenced claim 36: Evaluating quantization schemes on the GIN graph-classification model reveals that Degree-Quant with INT8 and Quantization-Aware Training with INT8 consistently recover most or all accuracy lost to reduced precision and often improve resource metrics.] [Referenced claim 41: On the GIN graph-classification model, INT4 variants are less stable than INT8 variants.] [Referenced claim 42: On the GIN graph-classification model, INT4 variants can be faster in training duration than INT8 variants but often incur larger accuracy drops than INT8 variants.]", "title": "E:45"}, {"id": "search:papers:paper_f519c93b::claim_46", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_46"], "tags": ["claim", "weakpoints"], "text": "The aggregation-aware mixed-precision method A^{2}Q demonstrates dataset-dependent behavior.", "title": "E:46"}, {"id": "search:papers:paper_f519c93b::claim_47", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_47"], "tags": ["claim", "claims"], "text": "The aggregation-aware mixed-precision method A^{2}Q demonstrates unusually large memory footprints in quantization experiments on the GIN model with the BBBP and Proteins datasets.", "title": "E:47"}, {"id": "search:papers:paper_f519c93b::claim_48", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_48"], "tags": ["claim", "claims"], "text": "On BBBP, A^{2}Q achieves accuracy 0.59 ± 0.01", "title": "E:48"}, {"id": "search:papers:paper_f519c93b::claim_49", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_49"], "tags": ["claim", "claims"], "text": "consumes 80.15 ± 0.49 GB of memory;", "title": "E:49"}, {"id": "search:papers:paper_f519c93b::claim_50", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_50"], "tags": ["claim", "claims"], "text": "on Proteins, it achieves accuracy 0.70 ± 0.00", "title": "E:50"}, {"id": "search:papers:paper_f519c93b::claim_51", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_51"], "tags": ["claim", "claims"], "text": "consumes 77.35 ± 0.78 GB of memory.", "title": "E:51"}, {"id": "search:papers:paper_f519c93b::claim_52", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_52"], "tags": ["claim", "claims"], "text": "QAT-INT8 and DQ-INT8 use approximately 37–47 GB of memory", "title": "E:52"}, {"id": "search:papers:paper_f519c93b::claim_53", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_53"], "tags": ["claim", "claims"], "text": "QAT-INT8 and DQ-INT8 achieve higher accuracy than A^{2}Q on the BBBP and Proteins datasets.", "title": "E:53"}, {"id": "search:papers:paper_f519c93b::claim_54", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_54"], "tags": ["claim", "claims"], "text": "A^{2}Q is also the slowest in training duration compared with QAT-INT8 and DQ-INT8.", "title": "E:54"}, {"id": "search:papers:paper_f519c93b::claim_55", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_55"], "tags": ["claim", "claims"], "text": "The situation described in claim 46, claim 47, claim 48, claim 49, claim 50, claim 51, claim 52, claim 53, claim 54 makes A^{2}Q an inconsistent choice for resource-limited deployments. [Referenced claim 46: The aggregation-aware mixed-precision method A^{2}Q demonstrates dataset-dependent behavior.] [Referenced claim 47: The aggregation-aware mixed-precision method A^{2}Q demonstrates unusually large memory footprints in quantization experiments on the GIN model with the BBBP and Proteins datasets.] [Referenced claim 48: On BBBP, A^{2}Q achieves accuracy 0.59 ± 0.01] [Referenced claim 49: consumes 80.15 ± 0.49 GB of memory;] [Referenced claim 50: on Proteins, it achieves accuracy 0.70 ± 0.00] [Referenced claim 51: consumes 77.35 ± 0.78 GB of memory.] [Referenced claim 52: QAT-INT8 and DQ-INT8 use approximately 37–47 GB of memory] [Referenced claim 53: QAT-INT8 and DQ-INT8 achieve higher accuracy than A^{2}Q on the BBBP and Proteins datasets.] [Referenced claim 54: A^{2}Q is also the slowest in training duration compared with QAT-INT8 and DQ-INT8.]", "title": "E:55"}, {"id": "search:papers:paper_f519c93b::claim_56", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_56"], "tags": ["claim", "weakpoints"], "text": "In experiments applying the evaluated pruning and fine-tuning workflows to the GNN architectures (SplineConv, NESS, HGP-SL, GNNNet, GIN) and datasets (Cora, Proteins, BBBP), no such subnetwork as that described in note 1, note 2 was found.", "title": "E:56"}, {"id": "search:papers:paper_f519c93b::claim_57", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_57"], "tags": ["claim", "weakpoints"], "text": "In experiments applying the evaluated pruning and fine-tuning workflows to the GNN architectures (SplineConv, NESS, HGP-SL, GNNNet, GIN) and datasets (Cora, Proteins, BBBP), smaller subnetworks obtained by the evaluated pruning schedules generally failed to match full-model accuracy without careful task- and layer-specific tuning.", "title": "E:57"}, {"id": "search:papers:paper_f519c93b::claim_58", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_58"], "tags": ["claim", "weakpoints"], "text": "The lottery ticket hypothesis (LTH), as tested here—in the experiments applying the evaluated pruning and fine-tuning workflows to the GNN architectures (SplineConv, NESS, HGP-SL, GNNNet, GIN) and datasets (Cora, Proteins, BBBP)—is not supported for these graph models and tasks.", "title": "E:58"}, {"id": "search:papers:paper_f519c93b::claim_59", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_59"], "tags": ["claim", "claims"], "text": "With the respective GNN models, modest regularization (regularization rates below approximately 1×10\\^{-2}) preserves accuracy across four datasets (BBBP, Cora node classification, Cora link prediction, Proteins).", "title": "E:59"}, {"id": "search:papers:paper_f519c93b::claim_60", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_60"], "tags": ["claim", "claims"], "text": "On the BBBP dataset, accuracy remains 0.84–0.85 for regularization rates up to 10\\^{-3}.", "title": "E:60"}, {"id": "search:papers:paper_f519c93b::claim_61", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_61"], "tags": ["claim", "claims"], "text": "On the Cora node classification dataset, accuracy is 0.87–0.90 for regularization rates up to 10\\^{-2}.", "title": "E:61"}, {"id": "search:papers:paper_f519c93b::claim_62", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_62"], "tags": ["claim", "claims"], "text": "On the Proteins dataset, accuracy is 0.82 for regularization rates up to 10\\^{-2}.", "title": "E:62"}, {"id": "search:papers:paper_f519c93b::claim_63", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_63"], "tags": ["claim", "claims"], "text": "On the Cora link prediction dataset, accuracy declines gradually from 0.95 to 0.92 for regularization rates up to 10\\^{-2}.", "title": "E:63"}, {"id": "search:papers:paper_f519c93b::claim_64", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_64"], "tags": ["claim", "weakpoints"], "text": "Aggressive regularization rates (≥ 0.1) cause sharp accuracy degradation across four datasets (BBBP, Cora node classification, Cora link prediction, Proteins).", "title": "E:64"}, {"id": "search:papers:paper_f519c93b::claim_65", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_65"], "tags": ["claim", "claims"], "text": "Aggressive regularization rates (≥ 0.1) may produce spikes in energy and CPU usage at intermediate values.", "title": "E:65"}, {"id": "search:papers:paper_f519c93b::claim_66", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_66"], "tags": ["claim", "claims"], "text": "(on BBBP, energy reaches 80 J and CPU reaches 58% at rates 0.6–0.8)", "title": "E:66"}, {"id": "search:papers:paper_f519c93b::claim_67", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_67"], "tags": ["claim", "claims"], "text": "On the Cora link prediction dataset, energy spikes to 77 J at regularization rates 10\\^{2}–10\\^{6}.", "title": "E:67"}, {"id": "search:papers:paper_f519c93b::claim_68", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_68"], "tags": ["claim", "weakpoints"], "text": "Very large regularization sometimes reduces resource consumption but at the cost of greatly reduced accuracy.", "title": "E:68"}, {"id": "search:papers:paper_f519c93b::claim_69", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_69"], "tags": ["claim", "weakpoints"], "text": "When followed by fine-tuning, fine-grained layer-wise pruning can recover or surpass baseline accuracy on the structurally sensitive node classification task on Cora.", "title": "E:69"}, {"id": "search:papers:paper_f519c93b::claim_70", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_70"], "tags": ["claim", "weakpoints"], "text": "On the two graph classification tasks on BBBP and Proteins, fine-grained pruning with fine-tuning does not recover baseline accuracy at high sparsity.", "title": "E:70"}, {"id": "search:papers:paper_f519c93b::claim_71", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_71"], "tags": ["claim", "weakpoints"], "text": "The first GCNConv layer in GNNNet, the spline convolution layers in SplineConv, and the linear transform layer before message passing in HGP-SL maintain a low proportion of zero weights even at high global sparsity targets.", "title": "E:71"}, {"id": "search:papers:paper_f519c93b::claim_72", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_72"], "tags": ["claim", "claims"], "text": "The MLP layer in GNNNet, the linear projection layers in SplineConv, and the classifier MLP layers in HGP-SL exhibit a high proportion of zero weights even at low global sparsity.", "title": "E:72"}, {"id": "search:papers:paper_f519c93b::claim_73", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_73"], "tags": ["claim", "claims"], "text": "In the experiments on SplineConv, NESS, HGP-SL, GNNNet, and GIN, and on Cora node classification, Cora link prediction, BBBP, and Proteins, reductions in parameter count from pruning did not translate into consistent decreases in inference time or memory usage.", "title": "E:73"}, {"id": "search:papers:paper_f519c93b::claim_74", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_74"], "tags": ["claim", "claims"], "text": "For global pruning, CPU usage peaks at 70% sparsity across Cora node classification, Cora link prediction, BBBP, and Proteins.", "title": "E:74"}, {"id": "search:papers:paper_f519c93b::claim_75", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_75"], "tags": ["claim", "claims"], "text": "For fine-grained pruning, energy consumption is higher than for global pruning at the sparsity values of 0.1–0.3.", "title": "E:75"}, {"id": "search:papers:paper_f519c93b::claim_76", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_76"], "tags": ["claim", "claims"], "text": "Global pruning is more energy-efficient than fine-grained pruning at the sparsity values of 0.4–0.8.", "title": "E:76"}, {"id": "search:papers:paper_f519c93b::claim_77", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_77"], "tags": ["claim", "claims"], "text": "This practical sparse-state storage method materially reduces on-disk model sizes for pruned GNNs with the five architectures SplineConv, NESS, HGP-SL, GNNNet, and GIN.", "title": "E:77"}, {"id": "search:papers:paper_f519c93b::claim_78", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_78"], "tags": ["claim", "claims"], "text": "On the GIN graph-classification model, QAT-INT4 and DQ-INT4 are less stable than INT8 variants.", "title": "E:78"}, {"id": "search:papers:paper_f519c93b::claim_79", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_79"], "tags": ["claim", "claims"], "text": "QAT-INT8 and DQ-INT8 achieve the accuracies of 0.83 ± 0.01 on BBBP and 0.72 ± 0.01 on Proteins, higher than A^{2}Q's on the BBBP and Proteins datasets.", "title": "E:79"}, {"id": "search:papers:paper_f519c93b::claim_80", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_80"], "tags": ["claim", "claims"], "text": "A^{2}Q is also the slowest, with the training duration of 159.6 s on BBBP, compared with QAT-INT8 and DQ-INT8.", "title": "E:80"}, {"id": "search:papers:paper_f519c93b::claim_81", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_81"], "tags": ["claim", "claims"], "text": "A regularization rate in the range 10^{2}–10^{6} sometimes reduces resource consumption but at the cost of Cora node classification accuracy dropping to 0.14–0.28 at rates ≥ 0.1.", "title": "E:81"}, {"id": "search:papers:paper_f519c93b::claim_O01", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O01"], "tags": ["claim", "weakpoints"], "text": "Across the layer-wise sparsity tolerance tests on GNNNets with BBBP, Spline with Cora, and HGPSL with Proteins, early convolutional layers tolerated more pruning, whereas linear layers showed heightened sensitivity.", "title": "E:O01"}, {"id": "search:papers:paper_f519c93b::claim_O02", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O02"], "tags": ["claim", "claims"], "text": "Fine-grained pruning with fine-tuning works better for BBBP and Cora-Node but fails for Cora-Link.", "title": "E:O02"}, {"id": "search:papers:paper_f519c93b::claim_O03", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O03"], "tags": ["claim", "weakpoints"], "text": "In BBBP, Cora-Node, and Proteins, fine-grained pruning is more aggressive and leads to higher accuracy drops compared with global pruning.", "title": "E:O03"}, {"id": "search:papers:paper_f519c93b::claim_O04", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O04"], "tags": ["claim", "claims"], "text": "Under extreme pruning, Cora-Link is equally affected by both fine-grained pruning and global pruning.", "title": "E:O04"}, {"id": "search:papers:paper_f519c93b::claim_O08", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O08"], "tags": ["claim", "weakpoints"], "text": "Across tasks, global pruning was more robust than fine-grained pruning, especially for link prediction.", "title": "E:O08"}, {"id": "search:papers:paper_f519c93b::claim_O09", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O09"], "tags": ["claim", "claims"], "text": "Across the datasets and sparsity levels evaluated in Figure 5, fine-grained pruning tended to have higher energy consumption than global pruning for most datasets, especially at lower sparsity levels (0.1–0.3), while global pruning was more consistent and energy-efficient at medium-to-high sparsity levels (0.4–0.8).", "title": "E:O09"}, {"id": "search:papers:paper_f519c93b::claim_O10", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O10"], "tags": ["claim", "claims"], "text": "In the energy consumption experiment, the energy of the BBBP dataset fluctuates between 24 and 42 for rates ≤ 1e-2, spikes sharply to 80 at rates 0.6–0.8, and then drops back.", "title": "E:O10"}, {"id": "search:papers:paper_f519c93b::claim_O11", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O11"], "tags": ["claim", "claims"], "text": "In the energy consumption experiment, the energy for the Cora-Node dataset stabilizes between 26 and 37.", "title": "E:O11"}, {"id": "search:papers:paper_f519c93b::claim_O12", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O12"], "tags": ["claim", "claims"], "text": "In the energy consumption experiment, the energy of the proteins dataset is constant between 22 and 28 at all rates, with minor fluctuations.", "title": "E:O12"}, {"id": "search:papers:paper_f519c93b::claim_O19", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O19"], "tags": ["claim", "claims"], "text": "Energy consumption generally increased with higher regularization rates, but spiked at specific thresholds such as 0.6–0.8 for BBBP.", "title": "E:O19"}, {"id": "search:papers:paper_f519c93b::claim_O20", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O20"], "tags": ["claim", "claims"], "text": "Regularization rates from 1.00 to 10^6 may reduce energy consumption.", "title": "E:O20"}, {"id": "search:papers:paper_f519c93b::claim_O21", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O21"], "tags": ["claim", "claims"], "text": "Energy consumption was more stable for the Proteins and Cora-Node datasets than for the other datasets.", "title": "E:O21"}, {"id": "search:papers:paper_f519c93b::claim_O22", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O22"], "tags": ["claim", "claims"], "text": "For the Cora-Link dataset, varying the regularization rate caused energy consumption to rise to 22–32 for rates less than 0.9, increase to 77 at rates of 1e2 and 10e6, and remain stable between 26 and 28 otherwise.", "title": "E:O22"}, {"id": "search:papers:paper_f519c93b::claim_O23", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O23"], "tags": ["claim", "claims"], "text": "At mid-range regularization rates of 0.1–0.9, energy and CPU usage spiked, indicating inefficiency.", "title": "E:O23"}, {"id": "search:papers:paper_f519c93b::claim_O24", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O24"], "tags": ["claim", "claims"], "text": "Low-to-moderate regularization rates (less than 1e-2) preserved accuracy, whereas higher rates degraded accuracy.", "title": "E:O24"}, {"id": "search:papers:paper_f519c93b::claim_O25", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O25"], "tags": ["claim", "weakpoints"], "text": "Optimal regularization rates that balance accuracy preservation and resource efficiency were typically in the range of 1e-6 to 1e-2, and higher rates were detrimental to both performance and computational cost.", "title": "E:O25"}, {"id": "search:papers:paper_f519c93b::claim_O26", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O26"], "tags": ["claim", "weakpoints"], "text": "Very high regularization rates (≥1e2) may reduce resource usage, but at the cost of decreased accuracy.", "title": "E:O26"}, {"id": "search:papers:paper_f519c93b::claim_O27", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O27"], "tags": ["claim", "claims"], "text": "On the Proteins dataset, varying the regularization rate had minimal impact on resource usage.", "title": "E:O27"}, {"id": "search:papers:paper_f519c93b::claim_O28", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O28"], "tags": ["claim", "claims"], "text": "For node classification on the Cora dataset, the two-layer graph convolutional models from DGL (GraphConv) and PyG (GCov) achieved low accuracies of 0.727 ± 0.008 and 0.712 ± 0.017, respectively.", "title": "E:O28"}, {"id": "search:papers:paper_f519c93b::claim_O29", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O29"], "tags": ["claim", "weakpoints"], "text": "On the Cora dataset node classification task, SplineConv with two layers achieved the best accuracy of 0.872 ± 0.008.", "title": "E:O29"}, {"id": "search:papers:paper_f519c93b::claim_O30", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O30"], "tags": ["claim", "claims"], "text": "On the Cora dataset link prediction task, NESS achieved the highest accuracy of 0.940 ± 0.000, outperforming GraphSAGE (0.872 ± 0.007) and WalkPooling (0.919 ± 0.004).", "title": "E:O30"}, {"id": "search:papers:paper_f519c93b::claim_O31", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O31"], "tags": ["claim", "weakpoints"], "text": "On the BBBP dataset, the two-layer GCN model from PyTorch-Geometric achieved the lowest graph classification accuracy among the evaluated GNN models, 0.72 ±0.02.", "title": "E:O31"}, {"id": "search:papers:paper_f519c93b::claim_O32", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O32"], "tags": ["claim", "weakpoints"], "text": "On the Proteins dataset, the two-layer GCN model from PyTorch-Geometric achieved the lowest graph classification accuracy among the evaluated GNN models, 0.56 ±0.01.", "title": "E:O32"}, {"id": "search:papers:paper_f519c93b::claim_O33", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O33"], "tags": ["claim", "weakpoints"], "text": "On the Proteins dataset, the HGP-SL model achieved the highest graph classification accuracy among the evaluated GNN models, 0.83 ±0.03.", "title": "E:O33"}, {"id": "search:papers:paper_f519c93b::claim_O34", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O34"], "tags": ["claim", "weakpoints"], "text": "Across the Table 5 datasets, both pruning methods show increasing model size ratios with higher sparsity.", "title": "E:O34"}, {"id": "search:papers:paper_f519c93b::claim_O35", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O35"], "tags": ["claim", "weakpoints"], "text": "For the Cora node classification and link prediction datasets in Table 5, fine-grained and global pruning yielded minimal differences in model size ratios, indicating pruning details are less important for this dataset.", "title": "E:O35"}, {"id": "search:papers:paper_f519c93b::claim_O36", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O36"], "tags": ["claim", "weakpoints"], "text": "On the Table 5 BBBP dataset, fine-grained pruning produced higher ratios of base model size to pruned model size than global pruning (5.79 vs 4.49 at 80% sparsity and 8.71 vs 7.72 at 90% sparsity).", "title": "E:O36"}, {"id": "search:papers:paper_f519c93b::claim_O37", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O37"], "tags": ["claim", "weakpoints"], "text": "On the Table 5 Proteins dataset, global pruning's model size ratio dropped anomalously from 3.13 to 1.9 at higher sparsity, whereas fine-grained pruning maintained stability and peaked at 8.32.", "title": "E:O37"}, {"id": "search:papers:paper_f519c93b::claim_O38", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O38"], "tags": ["claim", "claims"], "text": "Overall, from the Table 5 results, fine-grained pruning is superior for structurally sensitive tasks, while global pruning is better for pure compression.", "title": "E:O38"}, {"id": "search:papers:paper_f519c93b::claim_O39", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O39"], "tags": ["claim", "claims"], "text": "In the memory-usage measurements, fine-tuning after pruning helped reduce memory usage, but the improvement was typically less than 5%.", "title": "E:O39"}, {"id": "search:papers:paper_f519c93b::claim_O40", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O40"], "tags": ["claim", "claims"], "text": "In the memory-usage measurements, memory usage did not decrease consistently as pruning sparsity increased, and in the BBBP case at 0.8 sparsity pruning increased memory usage.", "title": "E:O40"}, {"id": "search:papers:paper_f519c93b::claim_O42", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O42"], "tags": ["claim", "claims"], "text": "In the energy-consumption measurements, energy consumption was not strictly linear with sparsity.", "title": "E:O42"}, {"id": "search:papers:paper_f519c93b::claim_O43", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O43"], "tags": ["claim", "claims"], "text": "In the energy-consumption measurements, fine-tuning after pruning did not drastically alter energy consumption relative to pruning alone, causing only minor variations such as slight increases or decreases in standard deviation.", "title": "E:O43"}, {"id": "search:papers:paper_f519c93b::claim_O44", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O44"], "tags": ["claim", "claims"], "text": "For fine-grained pruning, energy consumption was unstable in the 0.2-0.5 sparsity range, whereas global pruning worked better at higher sparsity (0.7-0.9).", "title": "E:O44"}, {"id": "search:papers:paper_f519c93b::claim_O45", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O45"], "tags": ["claim", "claims"], "text": "Across all datasets and sparsity levels, pruning with fine-tuning and pruning alone had almost identical CPU usage.", "title": "E:O45"}, {"id": "search:papers:paper_f519c93b::claim_O46", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O46"], "tags": ["claim", "claims"], "text": "Across all datasets, CPU usage for the two pruning methods was highly non-linear and erratic with respect to sparsity, indicating that the computational cost of sparse matrix operations or model-size changes did not decrease consistently with fewer parameters.", "title": "E:O46"}, {"id": "search:papers:paper_f519c93b::claim_O47", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O47"], "tags": ["claim", "claims"], "text": "On the BBBP dataset, QAT-INT8 and DQ-INT8 achieved the highest accuracy and surpassed FP32, while A2Q performed poorly.", "title": "E:O47"}, {"id": "search:papers:paper_f519c93b::claim_O48", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O48"], "tags": ["claim", "weakpoints"], "text": "For the Proteins dataset, A2Q, QAT, and DQ-INT8 outperformed FP32, QAT-INT8 was the best, and DQ-INT4 lagged.", "title": "E:O48"}, {"id": "search:papers:paper_f519c93b::claim_O49", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O49"], "tags": ["claim", "claims"], "text": "For training on the BBBP dataset, QAT-INT8 and DQ-INT8 were significantly faster than FP32, while A2Q and QAT-INT4 were much slower.", "title": "E:O49"}, {"id": "search:papers:paper_f519c93b::claim_O50", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O50"], "tags": ["claim", "claims"], "text": "For training on the Proteins dataset, QAT-INT8 was the fastest, A2Q and QAT-INT4 were less efficient than QAT-INT8, and DQ-INT8 was slower than FP32.", "title": "E:O50"}, {"id": "search:papers:paper_f519c93b::claim_O51", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O51"], "tags": ["claim", "claims"], "text": "On the BBBP dataset, A2Q quantization used 80.15 ± 0.49 GB memory, roughly double the approximately 42.69–47.00 GB used by QAT and DQ methods.", "title": "E:O51"}, {"id": "search:papers:paper_f519c93b::claim_O52", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O52"], "tags": ["claim", "claims"], "text": "On the BBBP dataset, QAT-INT4 and DQ-INT8 quantization used 45.52 and 44.15 GB memory, respectively, staying close to FP32's 39.82 GB memory footprint.", "title": "E:O52"}, {"id": "search:papers:paper_f519c93b::claim_O53", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O53"], "tags": ["claim", "claims"], "text": "On the Proteins dataset, A2Q quantization used 77.35 GB memory, whereas the other quantization methods, including DQ-INT8, used roughly 36.78–37.45 GB.", "title": "E:O53"}, {"id": "search:papers:paper_f519c93b::claim_O54", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O54"], "tags": ["claim", "claims"], "text": "When global-pruned GNN models were compared with and without fine-tuning, fine-tuning had a negligible effect on inference time.", "title": "E:O54"}, {"id": "search:papers:paper_f519c93b::claim_O55", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O55"], "tags": ["claim", "weakpoints"], "text": "In the evaluation of global pruning without fine-tuning on BBBP, Cora-Node, Cora-Link, and Proteins from sparsity 0 to 0.9, pruning did not consistently reduce inference time in GNNs; most models maintained inference time regardless of sparsity, except for Cora in the node-classification task, where specific reductions in inference time were observed.", "title": "E:O55"}, {"id": "search:papers:paper_f519c93b::claim_O56", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O56"], "tags": ["claim", "weakpoints"], "text": "When only nonzero weights of the globally pruned models were saved on disk, the disk size of pruned models decreased relative to the base model.", "title": "E:O56"}, {"id": "search:papers:paper_f519c93b::claim_O57", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O57"], "tags": ["claim", "weakpoints"], "text": "The sizes of pruned models and fine-tuned pruned models were almost equal.", "title": "E:O57"}, {"id": "search:papers:paper_f519c93b::claim_O61", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O61"], "tags": ["claim", "claims"], "text": "Across the four datasets, both global pruning and fine-grained pruning showed increasing model-size ratios with higher sparsity, indicating that larger substructures remained.", "title": "E:O61"}, {"id": "search:papers:paper_f519c93b::claim_O62", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O62"], "tags": ["claim", "weakpoints"], "text": "Across BBBP, Cora-Node, Core-Link, and Proteins, increasing fine-grained pruning sparsity from 0 to 0.9 without fine-tuning decreased classification accuracy from 0.85 ± 0.02, 0.86 ± 0.00, 0.95 ± 0.00, and 0.83 ± 0.03 to 0.43 ± 0.17, 0.76 ± 0.01, 0.87 ± 0.00, and 0.54 ± 0.00, respectively.", "title": "E:O62"}, {"id": "search:papers:paper_f519c93b::claim_O63", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O63"], "tags": ["claim", "weakpoints"], "text": "On the BBBP dataset without fine-tuning, fine-grained pruning at sparsity levels of 0, 0.1, and 0.2 achieved accuracies of 0.85±0.02, 0.85±0.02, and 1.85±0, respectively.", "title": "E:O63"}, {"id": "search:papers:paper_f519c93b::claim_O64", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O64"], "tags": ["claim", "claims"], "text": "For the BBBP dataset, accuracy remained stable between 0.84 and 0.85 for regularization rates up to 1e-3, dropped sharply to 0.50-0.72 for rates higher than 1e-2, and further degraded at extreme rates (>=1e6).", "title": "E:O64"}, {"id": "search:papers:paper_f519c93b::claim_O65", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O65"], "tags": ["claim", "claims"], "text": "For the Cora-Link dataset trained by the NESS model, accuracy declined gradually from 0.95 to 0.66 as regularization rates increased, with significant drops at rates >=0.1.", "title": "E:O65"}, {"id": "search:papers:paper_f519c93b::claim_O66", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O66"], "tags": ["claim", "claims"], "text": "For the Cora-Node dataset, accuracy remained stable between 0.87 and 0.90 for regularization rates less than 1e-2, collapsed to 0.14-0.28 for rates greater than 0.1, and did not recover at rates >=1e2.", "title": "E:O66"}, {"id": "search:papers:paper_f519c93b::claim_O67", "metadata": {"step": 4}, "refs": ["knowledge:papers:paper_f519c93b::claim_O67"], "tags": ["claim", "claims"], "text": "For the Proteins dataset with the HGPSL model, accuracy remained stable at 0.82 for regularization rates less than 1e-2, dropped to 0.70 for rates greater than 0.1, and showed no recovery at extreme rates.",
