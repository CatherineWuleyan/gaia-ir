ons, several key trends emerged. First and foremost, individual winning tickets which generalize across all datasets with performance close to that of winning tickets generated on the target dataset can be found.","excerptZh":"在所有比较中出现了若干关键趋势。首先也是最重要的是，可以找到能够跨所有数据集泛化的单个中奖彩票，其性能接近直接在目标数据集上产生的彩票。","supports":"paper:867771291879342656::conclusion_1","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_38ad8d064f6577f1\")].steps[?(@.step_id==\"8\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H1\":\"highlight\",\"paper:867771291879342656::H2\":\"highlight\"}"},{"stableId":"OTWTA-ARG-C01-S09","sourceLayer":"graph_reasoning_step","originalId":"lfac_38ad8d064f6577f1::step_9","parentFactorId":"lfac_38ad8d064f6577f1","canonicalConclusionId":"OTWTA-C01","proposition":"综合定义和实验结果可得：在大型、复杂自然图像源数据集上通过迭代量级剪枝发现的彩票，迁移到其他自然图像目标数据集并训练相同架构时，往往能取得接近目标数据集专用彩票的测试准确率；迁移覆盖广泛剪枝比例，并且大型、类别更丰富的源数据集产生更强迁移。","sourceTextEn":"Conclude from the preceding experimental definitions and empirical results that winning-ticket initializations discovered by iterative magnitude pruning (iterative pruning rate $0.2$, up to 30 pruning iterations; late resetting to early training iterations) on large, complex natural-image source datasets (ImageNet and Places365, and to a lesser extent CIFAR-100) produce sparse initializations that, when used to train the same architecture on other natural-image target datasets (SVHN, Fashion-MNIST, CIFAR-10, CIFAR-100, ImageNet, Places365), frequently achieve test accuracies on the target tasks that are close to accuracies obtained by winning tickets discovered directly on those targets, with transferability observed across a wide range of pruning fractions and stronger transfer from larger / more class-rich sources. \nFig. 3","workingTextZh":"综合定义和实验结果可得：在大型、复杂自然图像源数据集上通过迭代量级剪枝发现的彩票，迁移到其他自然图像目标数据集并训练相同架构时，往往能取得接近目标数据集专用彩票的测试准确率；迁移覆盖广泛剪枝比例，并且大型、类别更丰富的源数据集产生更强迁移。","type":"结论","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络推出步骤","paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3","ocrLines":"L118-L145（核心：L121）","excerpt":"Across all comparisons, several key trends emerged. First and foremost, individual winning tickets which generalize across all datasets with performance close to that of winning tickets generated on the target dataset can be found.","excerptZh":"在所有比较中出现了若干关键趋势。首先也是最重要的是，可以找到能够跨所有数据集泛化的单个中奖彩票，其性能接近直接在目标数据集上产生的彩票。","supports":"paper:867771291879342656::conclusion_1","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_38ad8d064f6577f1\")].steps[?(@.step_id==\"9\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H1\":\"highlight\",\"paper:867771291879342656::H2\":\"highlight\"}"},{"stableId":"OTWTA-ARG-C02-S01","sourceLayer":"graph_reasoning_step","originalId":"lfac_cb96d1b77e42b35b::step_1","parentFactorId":"lfac_cb96d1b77e42b35b","canonicalConclusionId":"OTWTA-C02","proposition":"将“源数据集规模”定义为训练样本数量，将“类别数量”定义为分类任务输出标签集合的基数；两者都是可能影响模型表征需求的数据集属性。","sourceTextEn":"Define \"source dataset scale\" as the size of the training set measured by the number of training examples and define \"number of classes\" as the cardinality of the output label set for the classification task; both are properties of a dataset that can influence representational demands placed on a model.","workingTextZh":"将“源数据集规模”定义为训练样本数量，将“类别数量”定义为分类任务输出标签集合的基数；两者都是可能影响模型表征需求的数据集属性。","type":"前提","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3; Fig. 4","ocrLines":"L124-L133","excerpt":"We consistently observed that winning tickets generated on larger, more complex datasets generalized substantially better than those generated on small datasets. ... Consistently, CIFAR-100 tickets generalized better than CIFAR-10 tickets.","excerptZh":"我们持续观察到，在更大、更复杂数据集上产生的中奖彩票，比小型数据集产生的彩票具有明显更好的泛化能力。CIFAR-100 彩票也持续优于 CIFAR-10 彩票。","supports":"paper:867771291879342656::conclusion_2","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_cb96d1b77e42b35b\")].steps[?(@.step_id==\"1\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H3\":\"highlight\",\"paper:867771291879342656::P1\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C02-S02","sourceLayer":"graph_reasoning_step","originalId":"lfac_cb96d1b77e42b35b::step_2","parentFactorId":"lfac_cb96d1b77e42b35b","canonicalConclusionId":"OTWTA-C02","proposition":"实证结果表明，从训练样本更多和/或类别更多的大型源数据集中产生的彩票，比小型源数据集产生的彩票更能迁移到新的目标数据集；该趋势在所考察的自然图像数据集中持续出现。","sourceTextEn":"State the empirical finding that winning tickets generated on larger source datasets (larger in number of training examples and/or number of classes) transferred substantially better to novel target datasets than tickets discovered on smaller source datasets; this trend was observed consistently across the set of natural-image datasets considered (Fashion-MNIST, SVHN, CIFAR-10, CIFAR-100, ImageNet, Places365). The summary claim appears in the Results and Discussion where larger, more complex datasets produced more generic winning tickets. \nFig. 3","workingTextZh":"实证结果表明，从训练样本更多和/或类别更多的大型源数据集中产生的彩票，比小型源数据集产生的彩票更能迁移到新的目标数据集；该趋势在所考察的自然图像数据集中持续出现。","type":"观察","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3","ocrLines":"L124-L133","excerpt":"We consistently observed that winning tickets generated on larger, more complex datasets generalized substantially better than those generated on small datasets. ... Consistently, CIFAR-100 tickets generalized better than CIFAR-10 tickets.","excerptZh":"我们持续观察到，在更大、更复杂数据集上产生的中奖彩票，比小型数据集产生的彩票具有明显更好的泛化能力。CIFAR-100 彩票也持续优于 CIFAR-10 彩票。","supports":"paper:867771291879342656::conclusion_2","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_cb96d1b77e42b35b\")].steps[?(@.step_id==\"2\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H3\":\"highlight\",\"paper:867771291879342656::P1\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C02-S03","sourceLayer":"graph_reasoning_step","originalId":"lfac_cb96d1b77e42b35b::step_3","parentFactorId":"lfac_cb96d1b77e42b35b","canonicalConclusionId":"OTWTA-C02","proposition":"为表明该效应不能只由训练集大小解释，比较训练样本数同为 50,000 的 CIFAR-10 与 CIFAR-100。两者类别数分别为 10 和 100；CIFAR-100 彩票在多个目标数据集上比 CIFAR-10 彩票泛化更好，包括 Fashion-MNIST 和 SVHN 等简单数据集。该对比将类别数量视为样本数以外的独立预测因素。","sourceTextEn":"Provide the counterexample used to show that the effect is not solely explained by raw training-set size: compare CIFAR-10 and CIFAR-100, which both have $50{,}000$ total training examples, but differ in number of classes (CIFAR-10 has $10$ classes, CIFAR-100 has $100$ classes); empirically, winning tickets generated on CIFAR-100 generalized better across target datasets than those generated on CIFAR-10, including transfers to simple datasets such as Fashion-MNIST and SVHN. This comparison isolates number of classes as an independent predictor of transferability beyond raw sample count. \nFig. 3","workingTextZh":"为表明该效应不能只由训练集大小解释，比较训练样本数同为 50,000 的 CIFAR-10 与 CIFAR-100。两者类别数分别为 10 和 100；CIFAR-100 彩票在多个目标数据集上比 CIFAR-10 彩票泛化更好，包括 Fashion-MNIST 和 SVHN 等简单数据集。该对比将类别数量视为样本数以外的独立预测因素。","type":"观察","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3","ocrLines":"L124-L133","excerpt":"We consistently observed that winning tickets generated on larger, more complex datasets generalized substantially better than those generated on small datasets. ... Consistently, CIFAR-100 tickets generalized better than CIFAR-10 tickets.","excerptZh":"我们持续观察到，在更大、更复杂数据集上产生的中奖彩票，比小型数据集产生的彩票具有明显更好的泛化能力。CIFAR-100 彩票也持续优于 CIFAR-10 彩票。","supports":"paper:867771291879342656::conclusion_2","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_cb96d1b77e42b35b\")].steps[?(@.step_id==\"3\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H3\":\"highlight\",\"paper:867771291879342656::P1\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C02-S04","sourceLayer":"graph_reasoning_step","originalId":"lfac_cb96d1b77e42b35b::step_4","parentFactorId":"lfac_cb96d1b77e42b35b","canonicalConclusionId":"OTWTA-C02","proposition":"作者明确指出，来自 ImageNet 和 Places365 的彩票在所有目标任务上最稳定地保持竞争力，这进一步支持更大的训练集、更多类别和更高任务复杂度与更强的彩票泛化相关。","sourceTextEn":"Note that the authors explicitly state that ImageNet- and Places365-derived tickets produced the most consistently competitive transfer performance across all targets, reinforcing that both larger training-set size and greater task complexity (many classes, diverse images) predict stronger generalization of winning tickets. \nFig. 3","workingTextZh":"作者明确指出，来自 ImageNet 和 Places365 的彩票在所有目标任务上最稳定地保持竞争力，这进一步支持更大的训练集、更多类别和更高任务复杂度与更强的彩票泛化相关。","type":"观察","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3","ocrLines":"L124-L133","excerpt":"We consistently observed that winning tickets generated on larger, more complex datasets generalized substantially better than those generated on small datasets. ... Consistently, CIFAR-100 tickets generalized better than CIFAR-10 tickets.","excerptZh":"我们持续观察到，在更大、更复杂数据集上产生的中奖彩票，比小型数据集产生的彩票具有明显更好的泛化能力。CIFAR-100 彩票也持续优于 CIFAR-10 彩票。","supports":"paper:867771291879342656::conclusion_2","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_cb96d1b77e42b35b\")].steps[?(@.step_id==\"4\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H3\":\"highlight\",\"paper:867771291879342656::P1\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C02-S05","sourceLayer":"graph_reasoning_step","originalId":"lfac_cb96d1b77e42b35b::step_5","parentFactorId":"lfac_cb96d1b77e42b35b","canonicalConclusionId":"OTWTA-C02","proposition":"根据实验比较和 CIFAR-10/CIFAR-100 对比，可归纳为：训练样本更多、输出类别更多的大型源数据集产生的彩票，比小型源数据集产生的彩票更能迁移到新目标；这种差异不能只用训练样本数解释。","sourceTextEn":"Conclude that, based on the experimental comparisons and the CIFAR-10 vs CIFAR-100 controlled contrast, winning tickets discovered on larger source datasets—both in terms of number of training examples and number of output classes—transfer substantially better to novel target datasets than tickets discovered on smaller source datasets, and that this difference is not solely explained by raw training-set size because datasets with equal sample sizes but different class counts produced different transfer outcomes.","workingTextZh":"根据实验比较和 CIFAR-10/CIFAR-100 对比，可归纳为：训练样本更多、输出类别更多的大型源数据集产生的彩票，比小型源数据集产生的彩票更能迁移到新目标；这种差异不能只用训练样本数解释。","type":"结论","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络推出步骤","paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3; Fig. 4","ocrLines":"L124-L133","excerpt":"We consistently observed that winning tickets generated on larger, more complex datasets generalized substantially better than those generated on small datasets. ... Consistently, CIFAR-100 tickets generalized better than CIFAR-10 tickets.","excerptZh":"我们持续观察到，在更大、更复杂数据集上产生的中奖彩票，比小型数据集产生的彩票具有明显更好的泛化能力。CIFAR-100 彩票也持续优于 CIFAR-10 彩票。","supports":"paper:867771291879342656::conclusion_2","challenges":""," ":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H4\":\"highlight\",\"paper:867771291879342656::P2\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C03-S05","sourceLayer":"graph_reasoning_step","originalId":"lfac_666bfce3ddeaaf51::step_5","parentFactorId":"lfac_666bfce3ddeaaf51","canonicalConclusionId":"OTWTA-C03","proposition":"由实验和性能曲线可得，在 VGG 模型上，一种优化器产生的中奖彩票可以迁移到另一种优化器，但存在优化器相关的性能差异。","sourceTextEn":"Conclude that, from the described experiments and observed performance curves, winning-ticket initializations generated with one optimizer generalize to training with a different optimizer for VGG models, with some optimizer-dependent performance nuances (SGD-to-Adam under-performance at low pruning fractions but advantage at high pruning fractions).","workingTextZh":"由实验和性能曲线可得，在 VGG 模型上，一种优化器产生的中奖彩票可以迁移到另一种优化器，但存在优化器相关的性能差异。","type":"结论","epistemicStatus":"LKM 推理步骤","argumentRole":"推理中的限定/反例","paperSection":"§4.3 跨优化器迁移","figure":"Fig. 5","ocrLines":"L150-L159（核心：L153）","excerpt":"Transferred winning tickets for VGG models achieved similar performance as those generated using the source optimizer. ... Tickets transferred from SGD to Adam under-performed random tickets at low pruning fractions, but significantly outperformed random tickets at high pruning fractions.","excerptZh":"VGG 模型的迁移彩票取得了与源优化器产生的彩票相近的性能。从 SGD 迁移到 Adam 的彩票在低剪枝比例下不如随机彩票，但在高剪枝比例下明显优于随机彩票。","supports":"paper:867771291879342656::conclusion_3","challenges":"paper:867771291879342656::conclusion_3","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_666bfce3ddeaaf51\")].steps[?(@.step_id==\"5\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H4\":\"highlight\",\"paper:867771291879342656::P2\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C04-S01","sourceLayer":"graph_reasoning_step","originalId":"lfac_745c4fd9e6ca523f::step_1","parentFactorId":"lfac_745c4fd9e6ca523f","canonicalConclusionId":"OTWTA-C04","proposition":"将“同分布迁移”定义为把一个数据子集上发现的中奖彩票初始化迁移到从同一分布抽取的互不重叠子集。实验把 CIFAR-10 划分为 CIFAR-10a 和 CIFAR-10b，每个子集含 25,000 个训练样本、每类 2,500 张图像。","sourceTextEn":"Define \"within-distribution transfer\" as transferring a winning-ticket initialization from one subset of a dataset to a disjoint subset drawn from the same data distribution; in the experiments, CIFAR-10 was split into CIFAR-10a and CIFAR-10b, each containing $25{,}000$ training examples and $2{,}500$ images per class.","workingTextZh":"将“同分布迁移”定义为把一个数据子集上发现的中奖彩票初始化迁移到从同一分布抽取的互不重叠子集。实验把 CIFAR-10 划分为 CIFAR-10a 和 CIFAR-10b，每个子集含 25,000 个训练样本、每类 2,500 张图像。","type":"前提","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§4.1 同一数据分布内迁移","figure":"Fig. 2","ocrLines":"L102-L111","excerpt":"We then asked whether winning tickets generated using CIFAR-10a would produce increased performance on CIFAR-10b. ... For ResNet50 models ... both under-performed random tickets at low pruning fractions.","excerptZh":"随后我们询问，使用 CIFAR-10a 产生的彩票能否提高 CIFAR-10b 上的性能。对于 ResNet50，两类彩票在低剪枝比例下都不如随机彩票。","supports":"paper:867771291879342656::conclusion_4","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_745c4fd9e6ca523f\")].steps[?(@.step_id==\"1\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H5\":\"highlight\",\"paper:867771291879342656::P3\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C04-S02","sourceLayer":"graph_reasoning_step","originalId":"lfac_745c4fd9e6ca523f::step_2","parentFactorId":"lfac_745c4fd9e6ca523f","canonicalConclusionId":"OTWTA-C04","proposition":"实验先在 CIFAR-10a 上通过迭代量级剪枝和延迟重置产生中奖彩票，再把保留的稀疏初始化迁移到互不重叠的 CIFAR-10b 上训练，并与随机彩票及直接在 CIFAR-10b 上发现的彩票比较。VGG19 和 ResNet50 的每条曲线均使用 6 个随机种子。","sourceTextEn":"Describe the experimental protocol for this within-distribution test: generate a winning ticket on CIFAR-10a by iterative magnitude pruning with late resetting, then evaluate that winning ticket by training the preserved sparse initialization on the disjoint subset CIFAR-10b and compare performance to a random ticket baseline and to a winning ticket generated directly on CIFAR-10b. Experiments were performed for both VGG19 and ResNet50 architectures with six random seeds per curve. \nFig. 2","workingTextZh":"实验先在 CIFAR-10a 上通过迭代量级剪枝和延迟重置产生中奖彩票，再把保留的稀疏初始化迁移到互不重叠的 CIFAR-10b 上训练，并与随机彩票及直接在 CIFAR-10b 上发现的彩票比较。VGG19 和 ResNet50 的每条曲线均使用 6 个随机种子。","type":"观察","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§4.1 同一数据分布内迁移","figure":"Fig. 2","ocrLines":"L102-L111","excerpt":"We then asked whether winning tickets generated using CIFAR-10a would produce increased performance on CIFAR-10b. ... For ResNet50 models ... both under-performed random tickets at low pruning fractions.","excerptZh":"随后我们询问，使用 CIFAR-10a 产生的彩票能否提高 CIFAR-10b 上的性能。对于 ResNet50，两类彩票在低剪枝比例下都不如随机彩票。","supports":"paper:867771291879342656::conclusion_4","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_745c4fd9e6ca523f\")].steps[?(@.step_id==\"2\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H5\":\"highlight\",\"paper:867771291879342656::P3\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C04-S03","sourceLayer":"graph_reasoning_step","originalId":"lfac_745c4fd9e6ca523f::step_3","parentFactorId":"lfac_745c4fd9e6ca523f","canonicalConclusionId":"OTWTA-C04","proposition":"CIFAR-10a 彩票在 VGG19 和 ResNet50 上都能较好迁移到 CIFAR-10b；相对于随机稀疏初始化，迁移彩票改善了留出子集上的训练。这说明彩票并非只记忆特定训练样本，而是捕获了有利于同分布其他样本的初始化结构。","sourceTextEn":"Report empirical observations: the CIFAR-10a winning ticket generalized well to CIFAR-10b for both VGG19 and ResNet50—transferred tickets improved training on the held-out subset relative to random sparse initializations—demonstrating that winning tickets are not simply memorizing specific training samples but capture initialization structure that benefits other samples from the same distribution. \nFig. 2","workingTextZh":"CIFAR-10a 彩票在 VGG19 和 ResNet50 上都能较好迁移到 CIFAR-10b；相对于随机稀疏初始化，迁移彩票改善了留出子集上的训练。这说明彩票并非只记忆特定训练样本，而是捕获了有利于同分布其他样本的初始化结构。","type":"观察","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§4.1 同一数据分布内迁移","figure":"Fig. 2","ocrLines":"L102-L111","excerpt":"We then asked whether winning tickets generated using CIFAR-10a would produce increased performance on CIFAR-10b. ... For ResNet50 models ... both under-performed random tickets at low pruning fractions.","excerptZh":"随后我们询问，使用 CIFAR-10a 产生的彩票能否提高 CIFAR-10b 上的性能。对于 ResNet50，两类彩票在低剪枝比例下都不如随机彩票。","supports":"paper:867771291879342656::conclusion_4","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_745c4fd9e6ca523f\")].steps[?(@.step_id==\"3\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H5\":\"highlight\",\"paper:867771291879342656::P3\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C04-S04","sourceLayer":"graph_reasoning_step","originalId":"lfac_745c4fd9e6ca523f::step_4","parentFactorId":"lfac_745c4fd9e6ca523f","canonicalConclusionId":"OTWTA-C04","proposition":"ResNet50 在低剪枝比例下表现出敏感性：少量权重被剪除时，迁移彩票偶尔不如随机彩票。这表明同分布迁移可能依赖架构和剪枝比例。","sourceTextEn":"Report the architecture-dependent caveat: ResNet50 showed sensitivity at low pruning fractions, occasionally under-performing random tickets when few weights are pruned, indicating that within-distribution transfer can be architecture- and pruning-fraction-dependent. This behavior is explicitly observed in the ResNet50 CIFAR-10a-to-10b transfer curves where transferred tickets under-perform random tickets at low pruning. \nFig. 2","workingTextZh":"ResNet50 在低剪枝比例下表现出敏感性：少量权重被剪除时，迁移彩票偶尔不如随机彩票。这表明同分布迁移可能依赖架构和剪枝比例。","type":"观察","epistemicStatus":"LKM 推理步骤","argumentRole":"推理中的限定/反例","paperSection":"§4.1 同一数据分布内迁移","figure":"Fig. 2","ocrLines":"L102-L111","excerpt":"We then asked whether winning tickets generated using CIFAR-10a would produce increased performance on CIFAR-10b. ... For ResNet50 models ... both under-performed random tickets at low pruning fractions.","excerptZh":"随后我们询问，使用 CIFAR-10a 产生的彩票能否提高 CIFAR-10b 上的性能。对于 ResNet50，两类彩票在低剪枝比例下都不如随机彩票。","supports":"paper:867771291879342656::conclusion_4","challenges":"paper:867771291879342656::conclusion_4","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_745c4fd9e6ca523f\")].steps[?(@.step_id==\"4\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H5\":\"highlight\",\"paper:867771291879342656::P3\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C04-S05","sourceLayer":"graph_reasoning_step","originalId":"lfac_745c4fd9e6ca523f::step_5","parentFactorId":"lfac_745c4fd9e6ca523f","canonicalConclusionId":"OTWTA-C04","proposition":"因此，一个数据子集上发现的彩票可以迁移到同一分布下互不重叠的子集，并相对于随机稀疏初始化改善训练；该结果在 VGG19 和 ResNet50 上都成立，但 ResNet50 在低剪枝比例下较敏感。","sourceTextEn":"Conclude that a winning ticket discovered on one subset of a dataset transfers to a disjoint subset from the same data distribution and improves training on that held-out subset relative to random sparse initializations, with the within-distribution transfer holding for both VGG19 and ResNet50, though ResNet50 showed sensitivity at low pruning fractions.","workingTextZh":"因此，一个数据子集上发现的彩票可以迁移到同一分布下互不重叠的子集，并相对于随机稀疏初始化改善训练；该结果在 VGG19 和 ResNet50 上都成立，但 ResNet50 在低剪枝比例下较敏感。","type":"结论","epistemicStatus":"LKM 推理步骤","argumentRole":"推理中的限定/反例","paperSection":"§4.1 同一数据分布内迁移","figure":"Fig. 2","ocrLines":"L102-L111","excerpt":"We then asked whether winning tickets generated using CIFAR-10a would produce increased performance on CIFAR-10b. ... For ResNet50 models ... both under-performed random tickets at low pruning fractions.","excerptZh":"随后我们询问，使用 CIFAR-10a 产生的彩票能否提高 CIFAR-10b 上的性能。对于 ResNet50，两类彩票在低剪枝比例下都不如随机彩票。","supports":"paper:867771291879342656::conclusion_4","challenges":"paper:867771291879342656::conclusion_4","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_745c4fd9e6ca523f\")].steps[?(@.step_id==\"5\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H5\":\"highlight\",\"paper:867771291879342656::P3\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C05-S01","sourceLayer":"graph_reasoning_step","originalId":"lfac_58096a5ebe94e02b::step_1","parentFactorId":"lfac_58096a5ebe94e02b","canonicalConclusionId":"OTWTA-C05","proposition":"“逐层剪枝”指在每一层内独立删除相同比例的参数；“全局剪枝”指汇总所有层的权重，并在整个网络范围内删除量级最小的权重，因此各层最终稀疏度可以不同。","sourceTextEn":"Define \"layerwise pruning\" as pruning that removes the same fraction of parameters within each layer independently, and define \"global pruning\" as pooling all weights across layers and removing the smallest-magnitude weights across the entire network, allowing different layers to have different resulting sparsities.","workingTextZh":"“逐层剪枝”指在每一层内独立删除相同比例的参数；“全局剪枝”指汇总所有层的权重，并在整个网络范围内删除量级最小的权重，因此各层最终稀疏度可以不同。","type":"前提","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§3.1 彩票假说——全局剪枝","figure":"Fig. 1","ocrLines":"L77-L80","excerpt":"We observed that global pruning leads to higher performance than local pruning. ... Global magnitude pruning preferentially prunes weights in deeper layers, leaving the first layer in particular relatively unpruned.","excerptZh":"我们观察到，全局剪枝比逐层剪枝取得更高性能。全局量级剪枝倾向于更多剪除深层权重，而第一层尤其保留了较多参数。","supports":"paper:867771291879342656::conclusion_5","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_58096a5ebe94e02b\")].steps[?(@.step_id==\"1\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H6\":\"highlight\",\"paper:867771291879342656::P4\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C05-S02","sourceLayer":"graph_reasoning_step","originalId":"lfac_58096a5ebe94e02b::step_2","parentFactorId":"lfac_58096a5ebe94e02b","canonicalConclusionId":"OTWTA-C05","proposition":"作者在 CIFAR-10 上的 VGG19 中比较全局量级剪枝和逐层剪枝所得彩票的性能，并以剪除权重比例为横轴绘制测试准确率，同时与随机彩票比较。在总体稀疏度相同时，全局剪枝得到的稀疏子网络性能更高。","sourceTextEn":"State the experimental comparison: the authors compared performance of winning tickets found using global magnitude pruning to those found using layerwise pruning on CIFAR-10 with VGG19, plotting test accuracy as a function of fraction of pruned weights and comparing against random-ticket baselines. The comparison shows that global pruning yields higher-performing sparse subnetworks than layerwise pruning at matched overall sparsity levels. \nFig. 1","workingTextZh":"作者在 CIFAR-10 上的 VGG19 中比较全局量级剪枝和逐层剪枝所得彩票的性能，并以剪除权重比例为横轴绘制测试准确率，同时与随机彩票比较。在总体稀疏度相同时，全局剪枝得到的稀疏子网络性能更高。","type":"观察","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§3.1 彩票假说——全局剪枝","figure":"Fig. 1","ocrLines":"L77-L80","excerpt":"We observed that global pruning leads to higher performance than local pruning. ... Global magnitude pruning preferentially prunes weights in deeper layers, leaving the first layer in particular relatively unpruned.","excerptZh":"我们观察到，全局剪枝比逐层剪枝取得更高性能。全局量级剪枝倾向于更多剪除深层权重，而第一层尤其保留了较多参数。","supports":"paper:867771291879342656::conclusion_5","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_58096a5ebe94e02b\")].steps[?(@.step_id==\"2\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H6\":\"highlight\",\"paper:867771291879342656::P4\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C05-S03","sourceLayer":"graph_reasoning_step","originalId":"lfac_58096a5ebe94e02b::step_3","parentFactorId":"lfac_58096a5ebe94e02b","canonicalConclusionId":"OTWTA-C05","proposition":"全局剪枝下逐层稀疏度并不均匀：深层卷积层被剪得更多，浅层、尤其第一卷积层保留了更高比例的参数。各卷积层的全局剪枝率与逐层剪枝率之比定量展示了这一模式。","sourceTextEn":"Report the observed non-uniformity of layerwise sparsity under global magnitude pruning: when applying global pruning schedules, deeper convolutional layers were pruned more heavily while early layers, notably the first convolutional layer, retained a much larger fraction of their parameters. This pattern is shown quantitatively by plotting, per convolutional layer, the ratio of global pruning rate to layerwise pruning rate at multiple pruning iterations, which indicates higher relative pruning in deeper layers and relative preservation of early layers. \nFig. 1","workingTextZh":"全局剪枝下逐层稀疏度并不均匀：深层卷积层被剪得更多，浅层、尤其第一卷积层保留了更高比例的参数。各卷积层的全局剪枝率与逐层剪枝率之比定量展示了这一模式。","type":"观察","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§3.1 彩票假说——全局剪枝","figure":"Fig. 1","ocrLines":"L77-L80","excerpt":"We observed that global pruning leads to higher performance than local pruning. ... Global magnitude pruning preferentially prunes weights in deeper layers, leaving the first layer in particular relatively unpruned.","excerptZh":"我们观察到，全局剪枝比逐层剪枝取得更高性能。全局量级剪枝倾向于更多剪除深层权重，而第一层尤其保留了较多参数。","supports":"paper:867771291879342656::conclusion_5","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_58096a5ebe94e02b\")].steps[?(@.step_id==\"3\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H6\":\"highlight\",\"paper:867771291879342656::P4\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C05-S04","sourceLayer":"graph_reasoning_step","originalId":"lfac_58096a5ebe94e02b::step_4","parentFactorId":"lfac_58096a5ebe94e02b","canonicalConclusionId":"OTWTA-C05","proposition":"作者给出的直观解释是：深层通常比浅层拥有更多参数，逐层使用固定剪枝率会过度损害绝对参数量很少的浅层。例如 VGG19 第一层有 1,792 个参数，若剪除 99%，只剩 18 个参数，表达能力将严重受损；全局剪枝会在参数多处多剪、参数少处少剪。","sourceTextEn":"Provide the intuitive justification and concrete numerical example offered by the authors: because deeper layers often contain many more parameters than early layers, applying a constant pruning rate per layer (layerwise) would disproportionately harm early layers that have few absolute parameters; for instance, the first layer of VGG19 contains $1792$ parameters, so pruning that layer at a $99\\%$ rate would leave only $18$ parameters, severely reducing expressivity; global pruning avoids this by pruning relatively more where parameter counts are large and relatively less where parameter counts are small.","workingTextZh":"作者给出的直观解释是：深层通常比浅层拥有更多参数，逐层使用固定剪枝率会过度损害绝对参数量很少的浅层。例如 VGG19 第一层有 1,792 个参数，若剪除 99%，只剩 18 个参数，表达能力将严重受损；全局剪枝会在参数多处多剪、参数少处少剪。","type":"假说","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§3.1 彩票假说——全局剪枝","figure":"Fig. 1","ocrLines":"L77-L80","excerpt":"We observed that global pruning leads to higher performance than local pruning. ... Global magnitude pruning preferentially prunes weights in deeper layers, leaving the first layer in particular relatively unpruned.","excerptZh":"我们观察到，全局剪枝比逐层剪枝取得更高性能。全局量级剪枝倾向于更多剪除深层权重，而第一层尤其保留了较多参数。","supports":"paper:867771291879342656::conclusion_5","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_58096a5ebe94e02b\")].steps[?(@.step_id==\"4\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H6\":\"highlight\",\"paper:867771291879342656::P4\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C05-S05","sourceLayer":"graph_reasoning_step","originalId":"lfac_58096a5ebe94e02b::step_5","parentFactorId":"lfac_58096a5ebe94e02b","canonicalConclusionId":"OTWTA-C05","proposition":"根据性能比较和逐层剪枝统计，全局量级剪枝比逐层剪枝更能产生高性能中奖彩票，并形成非均匀逐层稀疏模式：深层剪得更多，浅层、尤其第一卷积层保留更多参数。","sourceTextEn":"Conclude from the empirical comparison and layerwise-pruning statistics that global magnitude pruning outperforms layerwise pruning in producing higher-performing winning tickets, and that global pruning induces non-uniform layerwise sparsity with deeper layers pruned more and early layers, especially the first convolutional layer, retaining a larger fraction of parameters. \nFig. 1","workingTextZh":"根据性能比较和逐层剪枝统计，全局量级剪枝比逐层剪枝更能产生高性能中奖彩票，并形成非均匀逐层稀疏模式：深层剪得更多，浅层、尤其第一卷积层保留更多参数。","type":"结论","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络推出步骤","paperSection":"§3.1 彩票假说——全局剪枝","figure":"Fig. 1","ocrLines":"L77-L80","excerpt":"We observed that global pruning leads to higher performance than local pruning. ... Global magnitude pruning preferentially prunes weights in deeper layers, leaving the first layer in particular relatively unpruned.","excerptZh":"我们观察到，全局剪枝比逐层剪枝取得更高性能。全局量级剪枝倾向于更多剪除深层权重，而第一层尤其保留了较多参数。","supports":"paper:867771291879342656::conclusion_5","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_58096a5ebe94e02b\")].steps[?(@.step_id==\"5\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H6\":\"highlight\",\"paper:867771291879342656::P4\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C06-S01","sourceLayer":"graph_reasoning_step","originalId":"lfac_c6ff5645cff61bd7::step_1","parentFactorId":"lfac_c6ff5645cff61bd7","canonicalConclusionId":"OTWTA-C06","proposition":"将剪枝掩码定义为模型参数上的二值指示器：1 表示保留权重，0 表示删除权重。实验区分三种条件：保留掩码，即原样使用彩票发现得到的掩码；层内置换掩码，即在每层内部随机置换，保留逐层稀疏统计但打乱层内结构；全局置换掩码，即跨所有层随机置换，既不保留逐层统计，也不保留层内结构。","sourceTextEn":"Define the \"pruning mask\" (or \"mask\") as the binary indicator over model parameters where a value of $1$ indicates a preserved (unpruned) weight and $0$ indicates a removed (pruned) weight; distinguish three mask conditions used in experiments: (a) \"preserved mask\" meaning the exact mask found by the winning-ticket discovery process is used unchanged for the random ticket, (b) \"locally permuted mask\" meaning the mask is randomly permuted within each layer (so layerwise sparsity statistics are preserved but intra-layer structure is randomized), and (c) \"globally permuted mask\" meaning the mask is randomly permuted across all layers (so neither layerwise statistics nor intra-layer structure is preserved).","workingTextZh":"将剪枝掩码定义为模型参数上的二值指示器：1 表示保留权重，0 表示删除权重。实验区分三种条件：保留掩码，即原样使用彩票发现得到的掩码；层内置换掩码，即在每层内部随机置换，保留逐层稀疏统计但打乱层内结构；全局置换掩码，即跨所有层随机置换，既不保留逐层统计，也不保留层内结构。","type":"前提","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§3.1 随机掩码; Appendix A.2 随机化掩码","figure":"Fig. A1（并参照 Fig. 1）","ocrLines":"L83; L242-L261（核心：L258-L261）","excerpt":"While locally permuting masks damaged performance somewhat, globally permuting the mask results in dramatically worse performance, suggesting that the layerwise statistics derived from training the over-parameterized model are very informative.","excerptZh":"层内置换掩码会在一定程度上损害性能，而全局置换掩码会使性能显著恶化，这表明从过参数化模型训练中得到的逐层统计包含大量信息。","supports":"paper:867771291879342656::conclusion_6","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_c6ff5645cff61bd7\")].steps[?(@.step_id==\"1\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H7\":\"highlight\",\"paper:867771291879342656::P5\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C06-S02","sourceLayer":"graph_reasoning_step","originalId":"lfac_c6ff5645cff61bd7::step_2","parentFactorId":"lfac_c6ff5645cff61bd7","canonicalConclusionId":"OTWTA-C06","proposition":"在 CIFAR-10 上，作者比较保留掩码的彩票、使用层内置换掩码的随机彩票和使用全局置换掩码的随机彩票，并保持初始化的其他方面一致；性能在多个剪枝比例下测量，每条曲线使用 6 个随机种子。","sourceTextEn":"Describe the experiment comparing these mask types: on CIFAR-10 the authors evaluated performance of a winning ticket (preserved mask), a random-ticket using locally permuted masks, and a random-ticket using globally permuted masks, holding other aspects of initialization constant; performance was measured across pruning fractions with six random seeds per curve. \nFig. A1","workingTextZh":"在 CIFAR-10 上，作者比较保留掩码的彩票、使用层内置换掩码的随机彩票和使用全局置换掩码的随机彩票，并保持初始化的其他方面一致；性能在多个剪枝比例下测量，每条曲线使用 6 个随机种子。","type":"观察","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§3.1 随机掩码; Appendix A.2 随机化掩码","figure":"Fig. A1","ocrLines":"L83; L242-L261（核心：L258-L261）","excerpt":"While locally permuting masks damaged performance somewhat, globally permuting the mask results in dramatically worse performance, suggesting that the layerwise statistics derived from training the over-parameterized model are very informative.","excerptZh":"层内置换掩码会在一定程度上损害性能，而全局置换掩码会使性能显著恶化，这表明从过参数化模型训练中得到的逐层统计包含大量信息。","supports":"paper:867771291879342656::conclusion_6","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_c6ff5645cff61bd7\")].steps[?(@.step_id==\"2\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H7\":\"highlight\",\"paper:867771291879342656::P5\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C06-S03","sourceLayer":"graph_reasoning_step","originalId":"lfac_c6ff5645cff61bd7::step_3","parentFactorId":"lfac_c6ff5645cff61bd7","canonicalConclusionId":"OTWTA-C06","proposition":"掩码比较实验发现：中奖彩票优于所有随机彩票；层内置换相对保留掩码造成一定性能损失，而全局置换相对保留掩码和层内置换掩码都造成显著更差的性能。这说明逐层掩码统计与跨层掩码结构都携带剪枝过程中发现的有信息归纳偏置。","sourceTextEn":"Report empirical findings from the mask-comparison experiment: the winning ticket outperformed all random tickets; locally permuting masks damaged performance somewhat relative to the preserved mask, whereas globally permuting the mask resulted in dramatically worse performance relative to both the preserved and locally permuted masks. These results indicate that layerwise mask statistics and cross-layer mask structure both carry informative inductive bias discovered during pruning. \nFig. A1","workingTextZh":"掩码比较实验发现：中奖彩票优于所有随机彩票；层内置换相对保留掩码造成一定性能损失，而全局置换相对保留掩码和层内置换掩码都造成显著更差的性能。这说明逐层掩码统计与跨层掩码结构都携带剪枝过程中发现的有信息归纳偏置。","type":"观察","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§3.1 随机掩码; Appendix A.2 随机化掩码","figure":"Fig. A1","ocrLines":"L83; L242-L261（核心：L258-L261）","excerpt":"While locally permuting masks damaged performance somewhat, globally permuting the mask results in dramatically worse performance, suggesting that the layerwise statistics derived from training the over-parameterized model are very informative.","excerptZh":"层内置换掩码会在一定程度上损害性能，而全局置换掩码会使性能显著恶化，这表明从过参数化模型训练中得到的逐层统计包含大量信息。","supports":"paper:867771291879342656::conclusion_6","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_c6ff5645cff61bd7\")].steps[?(@.step_id==\"3\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H7\":\"highlight\",\"paper:867771291879342656::P5\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C06-S04","sourceLayer":"graph_reasoning_step","originalId":"lfac_c6ff5645cff61bd7::step_4","parentFactorId":"lfac_c6ff5645cff61bd7","canonicalConclusionId":"OTWTA-C06","proposition":"作者据此提出方法学含义：在随机彩票基线中保留逐层掩码结构，会把中奖彩票的信息带入基线。因此，公平的随机彩票应同时随机化权重值和掩码结构，即进行全局掩码置换，避免无意保留已发现彩票的逐层统计或跨层结构信息。","sourceTextEn":"State the methodological implication drawn by the authors: because preserving the layerwise mask structure transfers information from the winning ticket to the random-ticket baseline, a fair \"random ticket\" baseline should randomize both weight values and mask structure (i.e., perform a global permutation of the mask) so that no layerwise statistics or cross-layer mask information is inadvertently preserved from the discovered winning ticket. This recommendation is based on the observed large performance gap when masks are globally permuted versus preserved. \nFig. A1","workingTextZh":"作者据此提出方法学含义：在随机彩票基线中保留逐层掩码结构，会把中奖彩票的信息带入基线。因此，公平的随机彩票应同时随机化权重值和掩码结构，即进行全局掩码置换，避免无意保留已发现彩票的逐层统计或跨层结构信息。","type":"观察","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§3.1 随机掩码; Appendix A.2 随机化掩码","figure":"Fig. A1","ocrLines":"L83; L242-L261（核心：L258-L261）","excerpt":"While locally permuting masks damaged performance somewhat, globally permuting the mask results in dramatically worse performance, suggesting that the layerwise statistics derived from training the over-parameterized model are very informative.","excerptZh":"层内置换掩码会在一定程度上损害性能，而全局置换掩码会使性能显著恶化，这表明从过参数化模型训练中得到的逐层统计包含大量信息。","supports":"paper:867771291879342656::conclusion_6","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_c6ff5645cff61bd7\")].steps[?(@.step_id==\"4\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H7\":\"highlight\",\"paper:867771291879342656::P5\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C06-S05","sourceLayer":"graph_reasoning_step","originalId":"lfac_c6ff5645cff61bd7::step_5","parentFactorId":"lfac_c6ff5645cff61bd7","canonicalConclusionId":"OTWTA-C06","proposition":"因此，剪枝掩码结构包含对训练稀疏网络有用的重要信息；公平的随机基线必须随机化掩码结构。层内置换使性能中度下降，而全局置换使性能显著下降。","sourceTextEn":"Conclude that the structure of the pruning mask contains substantial information useful for training sparse networks and that fair random baselines must randomize mask structure (global permutation), because locally permuting a mask degrades performance moderately while globally permuting the mask degrades performance dramatically.","workingTextZh":"因此，剪枝掩码结构包含对训练稀疏网络有用的重要信息；公平的随机基线必须随机化掩码结构。层内置换使性能中度下降，而全局置换使性能显著下降。","type":"结论","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络推出步骤","paperSection":"§3.1 随机掩码; Appendix A.2 随机化掩码","figure":"Fig. A1（并参照 Fig. 1）","ocrLines":"L83; L242-L261（核心：L258-L261）","excerpt":"While locally permuting masks damaged performance somewhat, globally permuting the mask results in dramatically worse performance, suggesting that the layerwise statistics derived from training the over-parameterized model are very informative.","excerptZh":"层内置换掩码会在一定程度上损害性能，而全局置换掩码会使性能显著恶化，这表明从过参数化模型训练中得到的逐层统计包含大量信息。","supports":"paper:867771291879342656::conclusion_6","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_c6ff5645cff61bd7\")].steps[?(@.step_id==\"5\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H7\":\"highlight\",\"paper:867771291879342656::P5\":\"weak_point\"}"},{"stableId":"OTWTA-ARG-C07-S01","sourceLayer":"graph_reasoning_step","originalId":"lfac_c9fb5d9571d5a824::step_1","parentFactorId":"lfac_c9fb5d9571d5a824","canonicalConclusionId":"OTWTA-C07","proposition":"论文采用的迭代量级剪枝日程为：每轮删除剩余参数的 20%，最多进行 30 轮；第 6 轮以后，每隔 3 轮评估一次模型性能。","sourceTextEn":"Specify the iterative magnitude-pruning schedule used to obtain winning tickets: an iterative pruning fraction per iteration of $0.2$ (i.e., $20\\%$ of remaining parameters removed each iteration) and up to $30$ pruning iterations in total; after the sixth pruning iteration, model performance was evaluated every third pruning iteration. These pruning hyperparameters were applied across the experiments reported.","workingTextZh":"论文采用的迭代量级剪枝日程为：每轮删除剩余参数的 20%，最多进行 30 轮；第 6 轮以后，每隔 3 轮评估一次模型性能。","type":"前提","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§3.1 迭代剪枝 / 延迟重置; Appendix A.1","figure":"—","ocrLines":"L71-L74; L231-L240","excerpt":"For all models, an iterative pruning rate of 0.2 was used and 30 pruning iterations were performed. ... For Fashion-MNIST, SVHN, CIFAR-10 and CIFAR-100 winning tickets, late resetting of 1 epoch was used. For ImageNet and Places365 winning tickets, late resetting of 3 epochs was used.","excerptZh":"所有模型均采用每轮 0.2 的迭代剪枝率并执行 30 轮剪枝。Fashion-MNIST、SVHN、CIFAR-10 和 CIFAR-100 彩票使用 1 个 epoch 的延迟重置；ImageNet 和 Places365 彩票使用 3 个 epoch 的延迟重置。","supports":"paper:867771291879342656::conclusion_7","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_c9fb5d9571d5a824\")].steps[?(@.step_id==\"1\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H8\":\"highlight\"}"},{"stableId":"OTWTA-ARG-C07-S02","sourceLayer":"graph_reasoning_step","originalId":"lfac_c9fb5d9571d5a824::step_2","parentFactorId":"lfac_c9fb5d9571d5a824","canonicalConclusionId":"OTWTA-C07","proposition":"不同数据集的延迟重置点为：Fashion-MNIST、SVHN、CIFAR-10 和 CIFAR-100 重置到训练 1 个 epoch 后的权重；ImageNet 和 Places365 重置到训练 3 个 epoch 后的权重。","sourceTextEn":"State the late resetting choices made for different datasets: for Fashion-MNIST, SVHN, CIFAR-10, and CIFAR-100 winning tickets, weights were reset to their values after $1$ epoch of training; for ImageNet and Places365 winning tickets, weights were reset to their values after $3$ epochs of training. These late resetting values were used consistently in the ticket-discovery pipeline.","workingTextZh":"不同数据集的延迟重置点为：Fashion-MNIST、SVHN、CIFAR-10 和 CIFAR-100 重置到训练 1 个 epoch 后的权重；ImageNet 和 Places365 重置到训练 3 个 epoch 后的权重。","type":"背景","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§3.1 迭代剪枝 / 延迟重置; Appendix A.1","figure":"—","ocrLines":"L71-L74; L231-L240","excerpt":"For all models, an iterative pruning rate of 0.2 was used and 30 pruning iterations were performed. ... For Fashion-MNIST, SVHN, CIFAR-10 and CIFAR-100 winning tickets, late resetting of 1 epoch was used. For ImageNet and Places365 winning tickets, late resetting of 3 epochs was used.","excerptZh":"所有模型均采用每轮 0.2 的迭代剪枝率并执行 30 轮剪枝。Fashion-MNIST、SVHN、CIFAR-10 和 CIFAR-100 彩票使用 1 个 epoch 的延迟重置；ImageNet 和 Places365 彩票使用 3 个 epoch 的延迟重置。","supports":"paper:867771291879342656::conclusion_7","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_c9fb5d9571d5a824\")].steps[?(@.step_id==\"2\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H8\":\"highlight\"}"},{"stableId":"OTWTA-ARG-C07-S03","sourceLayer":"graph_reasoning_step","originalId":"lfac_c9fb5d9571d5a824::step_3","parentFactorId":"lfac_c9fb5d9571d5a824","canonicalConclusionId":"OTWTA-C07","proposition":"按模型族匹配的训练超参数为：VGG19 训练 160 个 epoch，在第 80、120 个 epoch 将学习率降低 10 倍；ResNet50 训练 90 个 epoch，在第 50、65、80 个 epoch 将学习率降低 10 倍。SGD 基础学习率为 0.1、动量 0.9、权重衰减 0.0001；Adam 学习率为 0.0003、betas 为 0.9 和 0.999、权重衰减 0.0001。批量大小和分布式训练细节随数据集规模而异。","sourceTextEn":"Provide the learning-rate annealing and other training hyperparameters matched per model family: for VGG19 models, training ran for $160$ epochs with learning-rate drops by a factor of $10$ at epochs $80$ and $120$; for ResNet50 models, training ran for $90$ epochs with learning-rate drops by a factor of $10$ at epochs $50$, $65$, and $80$; for models trained with SGD the base learning rate was $0.1$ with momentum $0.9$ and weight decay $0.0001$, and for models trained with Adam the learning rate was $0.0003$ with betas $0.9$ and $0.999$ and weight decay $0.0001$. Batch sizes and distributed-training details differed by dataset scale as described in the experimental methods. \nFig. 3","workingTextZh":"按模型族匹配的训练超参数为：VGG19 训练 160 个 epoch，在第 80、120 个 epoch 将学习率降低 10 倍；ResNet50 训练 90 个 epoch，在第 50、65、80 个 epoch 将学习率降低 10 倍。SGD 基础学习率为 0.1、动量 0.9、权重衰减 0.0001；Adam 学习率为 0.0003、betas 为 0.9 和 0.999、权重衰减 0.0001。批量大小和分布式训练细节随数据集规模而异。","type":"前提","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§3.1 迭代剪枝 / 延迟重置; Appendix A.1","figure":"Fig. 3","ocrLines":"L71-L74; L231-L240","excerpt":"For all models, an iterative pruning rate of 0.2 was used and 30 pruning iterations were performed. ... For Fashion-MNIST, SVHN, CIFAR-10 and CIFAR-100 winning tickets, late resetting of 1 epoch was used. For ImageNet and Places365 winning tickets, late resetting of 3 epochs was used.","excerptZh":"所有模型均采用每轮 0.2 的迭代剪枝率并执行 30 轮剪枝。Fashion-MNIST、SVHN、CIFAR-10 和 CIFAR-100 彩票使用 1 个 epoch 的延迟重置；ImageNet 和 Places365 彩票使用 3 个 epoch 的延迟重置。","supports":"paper:867771291879342656::conclusion_7","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_c9fb5d9571d5a824\")].steps[?(@.step_id==\"3\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H8\":\"highlight\"}"},{"stableId":"OTWTA-ARG-C07-S04","sourceLayer":"graph_reasoning_step","originalId":"lfac_c9fb5d9571d5a824::step_4","parentFactorId":"lfac_c9fb5d9571d5a824","canonicalConclusionId":"OTWTA-C07","proposition":"作者对这些设置的解释是：每轮只删除较小比例参数的迭代剪枝有助于降低剪枝过程噪声，比一次性大比例剪枝产生更好的模型和彩票；延迟重置到训练早期能够改善大型模型中的彩票恢复，并减少对学习率预热的需求。","sourceTextEn":"Note the motivation given by the authors for these settings: iterative pruning with small per-iteration removal (here $20\\%$) helps to de-noise the pruning process and produces substantially better pruned models and winning tickets than one-shot large-fraction pruning, and late resetting to an early training iteration $k$ improves winning-ticket recovery and removes the need for learning-rate warmup in large models. These considerations motivated the chosen schedule for the large-model / large-dataset regime studied. \n[8]","workingTextZh":"作者对这些设置的解释是：每轮只删除较小比例参数的迭代剪枝有助于降低剪枝过程噪声，比一次性大比例剪枝产生更好的模型和彩票；延迟重置到训练早期能够改善大型模型中的彩票恢复，并减少对学习率预热的需求。","type":"假说","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§3.1 迭代剪枝 / 延迟重置; Appendix A.1","figure":"—","ocrLines":"L71-L74; L231-L240","excerpt":"For all models, an iterative pruning rate of 0.2 was used and 30 pruning iterations were performed. ... For Fashion-MNIST, SVHN, CIFAR-10 and CIFAR-100 winning tickets, late resetting of 1 epoch was used. For ImageNet and Places365 winning tickets, late resetting of 3 epochs was used.","excerptZh":"所有模型均采用每轮 0.2 的迭代剪枝率并执行 30 轮剪枝。Fashion-MNIST、SVHN、CIFAR-10 和 CIFAR-100 彩票使用 1 个 epoch 的延迟重置；ImageNet 和 Places365 彩票使用 3 个 epoch 的延迟重置。","supports":"paper:867771291879342656::conclusion_7","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_c9fb5d9571d5a824\")].steps[?(@.step_id==\"4\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H8\":\"highlight\"}"},{"stableId":"OTWTA-ARG-C07-S05","sourceLayer":"graph_reasoning_step","originalId":"lfac_c9fb5d9571d5a824::step_5","parentFactorId":"lfac_c9fb5d9571d5a824","canonicalConclusionId":"OTWTA-C07","proposition":"因此，在本文的大模型、大数据集设置中，作者采用每轮 20%、最多 30 轮的迭代量级剪枝，并延迟重置到训练早期参数；小型数据集重置到第 1 个 epoch，ImageNet 和 Places365 重置到第 3 个 epoch，同时按模型族匹配学习率日程和其他超参数。","sourceTextEn":"Conclude that, for obtaining competitive winning tickets in the large-model / large-dataset regime used here, the authors used an iterative magnitude-pruning schedule with pruning fraction per iteration $0.2$ over up to $30$ iterations combined with late resetting to parameters at a small early training iteration; the explicit late resetting settings were $1$ epoch for Fashion-MNIST, SVHN, CIFAR-10 and CIFAR-100, and $3$ epochs for ImageNet and Places365, and learning-rate annealing schedules and other hyperparameters were matched per model family (VGG19 trained $160$ epochs with LR drops at epochs $80$ and $120$; ResNet50 trained $90$ epochs with LR drops at epochs $50$, $65$, and $80$). \n[8]","workingTextZh":"因此，在本文的大模型、大数据集设置中，作者采用每轮 20%、最多 30 轮的迭代量级剪枝，并延迟重置到训练早期参数；小型数据集重置到第 1 个 epoch，ImageNet 和 Places365 重置到第 3 个 epoch，同时按模型族匹配学习率日程和其他超参数。","type":"结论","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络推出步骤","paperSection":"§3.1 迭代剪枝 / 延迟重置; Appendix A.1","figure":"—","ocrLines":"L71-L74; L231-L240","excerpt":"For all models, an iterative pruning rate of 0.2 was used and 30 pruning iterations were performed. ... For Fashion-MNIST, SVHN, CIFAR-10 and CIFAR-100 winning tickets, late resetting of 1 epoch was used. For ImageNet and Places365 winning tickets, late resetting of 3 epochs was used.","excerptZh":"所有模型均采用每轮 0.2 的迭代剪枝率并执行 30 轮剪枝。Fashion-MNIST、SVHN、CIFAR-10 和 CIFAR-100 彩票使用 1 个 epoch 的延迟重置；ImageNet 和 Places365 彩票使用 3 个 epoch 的延迟重置。","supports":"paper:867771291879342656::conclusion_7","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_c9fb5d9571d5a824\")].steps[?(@.step_id==\"5\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H8\":\"highlight\"}"}];
const CONCLUSION_DATA = [{"canonicalId":"OTWTA-C01","graphConclusionId":"paper:867771291879342656::conclusion_1","globalId":"gcn_f22fc9a9f36d4b45","title":"大型自然图像源数据集得到的中奖彩票可迁移到自然图像目标数据集，性能接近目标任务专用彩票","content":"在大型、复杂的自然图像源数据集（ImageNet、Places365，以及较弱程度上的 CIFAR-100）上，通过迭代量级剪枝发现的中奖彩票初始化（每轮剪枝率 0.2，最多 30 轮，并延迟重置到训练早期参数），用于在其他自然图像目标数据集（SVHN、Fashion-MNIST、CIFAR-10、CIFAR-100、ImageNet、Places365）上训练相同的 VGG19 或 ResNet50 架构时，往往能取得接近直接在目标数据集上发现的彩票的测试准确率。这种迁移在广泛的剪枝比例下都能观察到，包括极高稀疏度；大型、类别更丰富的源数据集通常比小型源数据集产生更强的跨数据集迁移，例如训练样本数相同的 CIFAR-100 彩票比 CIFAR-10 彩票泛化更好。","cleanClaimIds":"A001; A002; A003; A006; A007; A009; A010","observationIds":"OTWTA-OBS-H01; OTWTA-OBS-H02","weakpointIds":"","questionId":"OTWTA-Q-C01","factorId":"lfac_38ad8d064f6577f1","prior":0.95,"paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3; Fig. 4","inFormalIr":"否","narrative":"该结论得到较充分实证支持。观察 H1 表明，迁移彩票能够缓解 Fashion-MNIST 目标任务特有的过拟合；H2 则表明迁移模式在 VGG19 和 ResNet50 两种架构上保持一致，从而增强了架构无关效应的可信度。但源数据集“复杂度”这一概念仍需更严格操作化；除类别数外，样本量和任务难度等因素也可能混杂。"},{"canonicalId":"OTWTA-C02","graphConclusionId":"paper:867771291879342656::conclusion_2","globalId":"gcn_0fdc65dd973e495e","title":"源数据集规模和类别数量可预测中奖彩票的可迁移性","content":"在 VGG19 和 ResNet50 两种架构上，从训练样本更多、输出类别更多的大型源数据集中发现的中奖彩票，迁移到其他自然图像分类数据集时，明显优于从小型源数据集中发现的彩票。这一效应不能只用原始训练集大小解释：在训练样本数相同的情况下，类别更多的 CIFAR-100（100 类）产生的彩票，比类别较少的 CIFAR-10（10 类）产生的彩票在多个目标任务上泛化更好。","cleanClaimIds":"A006; A007; A008; A009; A010","observationIds":"OTWTA-OBS-H03","weakpointIds":"OTWTA-WP-P01","questionId":"OTWTA-Q-C02","factorId":"lfac_cb96d1b77e42b35b","prior":0.7,"paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3; Fig. 4","inFormalIr":"否","narrative":"观察 H3 表明，不同目标数据集和两种架构上，源数据集有效性的排序相当一致。但 weakpoint P1 指出 CIFAR-10 与 CIFAR-100 的比较并未控制类别数以外的数据属性，因此“类别数量独立预测可迁移性”的结论只能被有限支持。该结论不应被表述为已建立的因果关系。"},{"canonicalId":"OTWTA-C03","graphConclusionId":"paper:867771291879342656::conclusion_3","globalId":"gcn_d354352c21724714","title":"VGG 模型的中奖彩票可以在优化器之间迁移（带动量 SGD 与 Adam）","content":"在自然图像分类任务中，使用一种优化器产生的中奖彩票初始化可以迁移到另一种优化器：用带动量 SGD 或 Adam 在 VGG19 上发现的彩票，改用另一种优化器训练时，能够获得与目标优化器直接发现的彩票相近的较高性能。但行为存在优化器相关差异：从 SGD 迁移到 Adam 的彩票在低剪枝比例下有时不如随机彩票，而在高剪枝比例下则优于随机彩票。","cleanClaimIds":"A011; A012; A013; A014","observationIds":"OTWTA-OBS-H04","weakpointIds":"OTWTA-WP-P02","questionId":"OTWTA-Q-C03","factorId":"lfac_666bfce3ddeaaf51","prior":0.5,"paperSection":"§4.3 跨优化器迁移","figure":"Fig. 5","inFormalIr":"否","narrative":"观察 H4 提供了一个控制优化器变量的跨优化器实验，支持 VGG19 上的跨优化器迁移。但 weakpoint P2 指出实验仅覆盖单一架构，且图文没有明确数据集，因此证据范围受到限制。结论如果仅限定为所测配置较为可信，若推广到其他架构或数据集则证据不足。"},{"canonicalId":"OTWTA-C04","graphConclusionId":"paper:867771291879342656::conclusion_4","globalId":"gcn_2cab68b8709b4d9f","title":"中奖彩票能够在同一数据分布的不同样本子集之间泛化","content":"在包含 25,000 张训练图像、每类 2,500 张图像的 CIFAR-10a 子集上发现的中奖彩票，可以迁移到同一分布下互不重叠的 CIFAR-10b 子集，并相对于随机稀疏初始化改善该留出子集上的训练。该同分布迁移在 VGG19 和 ResNet50 上都成立，但 ResNet50 在低剪枝比例下较敏感，少量权重被剪除时偶尔不如随机彩票。","cleanClaimIds":"A015; A016; A017","observationIds":"OTWTA-OBS-H05","weakpointIds":"OTWTA-WP-P03","questionId":"OTWTA-Q-C04","factorId":"lfac_745c4fd9e6ca523f","prior":0.6,"paperSection":"§4.1 同一数据分布内迁移","figure":"Fig. 2","inFormalIr":"否","narrative":"观察 H5 表明彩票可在留出子集上改善训练，因此支持中奖彩票不只是记忆特定训练样本。但 weakpoint P3 指出结论只基于 CIFAR-10 的一次确定性切分，尚未在其他切分或数据集上复现。因此，该证据支持同分布内可迁移性，但不足以直接建立跨不同数据集或跨数据域的广泛可迁移性。"},{"canonicalId":"OTWTA-C05","graphConclusionId":"paper:867771291879342656::conclusion_5","globalId":"gcn_cdeb0e970f4042d0","title":"全局量级剪枝优于逐层剪枝，并产生非均匀的逐层稀疏模式（深层剪得更多）","content":"在 CIFAR-10 上训练 VGG19 并发现中奖彩票时，将所有层的权重放在一起按量级排序、全局删除最小权重，得到的稀疏子网络性能高于每层按固定比例剪枝的逐层剪枝。在全局量级剪枝下，各层剪枝比例并不相同：更深的卷积层被剪得更多，而浅层、尤其第一卷积层保留了更大比例的参数。","cleanClaimIds":"A018; A019","observationIds":"OTWTA-OBS-H06","weakpointIds":"OTWTA-WP-P04","questionId":"OTWTA-Q-C05","factorId":"lfac_58096a5ebe94e02b","prior":0.5,"paperSection":"§3.1 彩票假说——全局剪枝","figure":"Fig. 1","inFormalIr":"否","narrative":"观察 H6 对全局剪枝和逐层剪枝进行了直接实证比较，并显示逐层稀疏模式不均匀。但 weakpoint P4 指出实验只覆盖 CIFAR-10 上的 VGG19，因此在其他架构和数据集上的推广仍待验证。结论在所测配置上成立，但其普遍性有限。"},{"canonicalId":"OTWTA-C06","graphConclusionId":"paper:867771291879342656::conclusion_6","globalId":"gcn_764a16230b6b4c66","title":"掩码结构包含大量信息；公平的随机基线必须随机化掩码结构","content":"对于在 CIFAR-10 上训练的 VGG19，剪枝掩码的结构包含对训练稀疏网络有用的重要信息。比较保留的彩票掩码、仅在层内置换的掩码和跨所有层全局置换的掩码可见：层内置换使性能中度下降，而全局置换导致性能显著下降。因此，用于评估中奖彩票初始化的公平“随机彩票”基线应同时随机化权重值和掩码结构，因为保留逐层掩码统计会从已发现的彩票中携带信息。","cleanClaimIds":"A020; A021; A022; A023; A024","observationIds":"OTWTA-OBS-H07","weakpointIds":"OTWTA-WP-P05","questionId":"OTWTA-Q-C06","factorId":"lfac_c6ff5645cff61bd7","prior":0.5,"paperSection":"§3.1 随机掩码; Appendix A.2 随机化掩码","figure":"Fig. A1（并参照 Fig. 1）","inFormalIr":"否","narrative":"观察 H7 通过清晰的消融实验表明，掩码结构在两个层面都携带信息，支持随机基线必须随机化掩码结构的主张。但 weakpoint P5 指出证据仅来自 CIFAR-10 上的 VGG19，尚未在其他架构或数据集上验证。方法学建议在该设置中依据充分，跨任务推广仍需谨慎。"},{"canonicalId":"OTWTA-C07","graphConclusionId":"paper:867771291879342656::conclusion_7","globalId":"gcn_1c4ea7e959814d8f","title":"用于大型模型和数据集的彩票发现流程：延迟重置与迭代量级剪枝日程","content":"为了在自然图像分类的大模型、大数据集场景中得到有竞争力的中奖彩票，论文采用每轮剪除剩余参数 20%、最多 30 轮的迭代量级剪枝，并将参数延迟重置到训练早期。Fashion-MNIST、SVHN、CIFAR-10 和 CIFAR-100 重置到第 1 个 epoch 后的参数，ImageNet 和 Places365 重置到第 3 个 epoch 后的参数。学习率退火和其他超参数按模型族匹配：VGG19 训练 160 个 epoch，在第 80、120 个 epoch 降低学习率；ResNet50 训练 90 个 epoch，在第 50、65、80 个 epoch 降低学习率。","cleanClaimIds":"A025","observationIds":"OTWTA-OBS-H08","weakpointIds":"","questionId":"OTWTA-Q-C07","factorId":"lfac_c9fb5d9571d5a824","prior":0.9,"paperSection":"§3.1 迭代剪枝 / 延迟重置; Appendix A.1","figure":"—","inFormalIr":"否","narrative":"观察 H8 证明该延迟重置与迭代剪枝流程能够在六个数据集的大模型上成功产生中奖彩票，从而支撑后续迁移实验。这里没有发现直接的 weakpoint；该日程作为论文中的有效流程得到验证，但并不意味着这些超参数在所有场景中最优。"}];

d":"A013; A014","target":"","relationType":"举例","inferenceType":"无","p1":"","p2":"","description":"A014是A013的具体举例，展示了从SGD迁移到Adam时随剪枝比例变化而出现的具体行为差异。","inFormalIr":"否","notes":"source conclusions: paper:867771291879342656::conclusion_3"},{"stableRelationId":"OTWTA-REL-CLEAN-R008","sourceLayer":"clean_relation","originalRelationId":"R008","sourceOrRelated":"A016; A017","target":"","relationType":"矛盾","inferenceType":"无","p1":"","p2":"","description":"A017所描述的ResNet50在低剪枝比例下的例外表现，与A016中“该分布内迁移在两种架构上都成立”的一般性论断存在张力。","inFormalIr":"否","notes":"source conclusions: paper:867771291879342656::conclusion_4"},{"stableRelationId":"OTWTA-REL-CLEAN-R009","sourceLayer":"clean_relation","originalRelationId":"R009","sourceOrRelated":"A021; A020","target":"","relationType":"推出","inferenceType":"演绎","p1":"","p2":"","description":"A021所描述的实验结果——局部置换中奖彩票掩码只造成中等程度的性能下降，而全局置换则造成大幅下降——推出A020的论断，即剪枝掩码的结构本身包含对训练稀疏网络有用的重要信息。","inFormalIr":"否","notes":"source conclusions: paper:867771291879342656::conclusion_6"},{"stableRelationId":"OTWTA-REL-CLEAN-R010","sourceLayer":"clean_relation","originalRelationId":"R010","sourceOrRelated":"A020; A022","target":"","relationType":"推出","inferenceType":"溯因","p1":"","p2":"","description":"A020所描述的针对VGG19/CIFAR-10的具体实验发现，通过溯因推理被推广为A022的一般性论断——即剪枝掩码的结构本身包含对训练稀疏网络有用的重要信息。","inFormalIr":"否","notes":"source conclusions: paper:867771291879342656::conclusion_6"},{"stableRelationId":"OTWTA-REL-CLEAN-R011","sourceLayer":"clean_relation","originalRelationId":"R011","sourceOrRelated":"A022; A023","target":"","relationType":"推出","inferenceType":"演绎","p1":"","p2":"","description":"A022（剪枝掩码结构包含重要信息）通过演绎推理得出A023——跨层保留掩码统计信息会将已发现彩票中的信息迁移过去。","inFormalIr":"否","notes":"source conclusions: paper:867771291879342656::conclusion_6"},{"stableRelationId":"OTWTA-REL-CLEAN-R012","sourceLayer":"clean_relation","originalRelationId":"R012","sourceOrRelated":"A023; A024","target":"","relationType":"推出","inferenceType":"演绎","p1":"","p2":"","description":"A023所描述的机制——跨层保留掩码统计信息会迁移已发现彩票的信息—
