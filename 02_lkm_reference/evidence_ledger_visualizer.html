}
function compact(value) { return String(value || '').replace(/\s+/g, ' ').trim(); }
function truncate(value, length) { const text = compact(value); return text.length > length ? text.slice(0, length) + '…' : text; }
function canonicalIds(row) { return String(row.canonicalConclusionId || '').split(';').map(function (v) { return v.trim(); }).filter(Boolean); }
function shortCanonical(id) { return String(id || '').replace('OTWTA-', ''); }
function shortOriginal(id) { return String(id || '').replace(/^paper:\d+::/, ''); }
function checkedLayers() { return new Set(Array.from(document.querySelectorAll('[data-layer]:checked')).map(function (input) { return input.dataset.layer; })); }

function conclusionOptions() {
  const select = document.getElementById('conclusion-filter');
  select.innerHTML = '<option value="ALL">全部结论（可能较密）</option>' + CONCLUSION_DATA.map(function (row) {
    return '<option value="' + escapeHtml(row.canonicalId) + '">' + escapeHtml(shortCanonical(row.canonicalId) + ' · ' + truncate(row.title, 34)) + '</option>';
  }).join('');
  select.value = 'OTWTA-C01';
}

function nodeLabel(row) {
  if (row.sourceLayer === 'graph_conclusion') {
    const meta = conclusionByCanonical.get(row.canonicalConclusionId);
    return shortCanonical(row.canonicalConclusionId) + '\n' + truncate(meta ? meta.title : row.proposition, 42);
  }
  if (row.sourceLayer === 'graph_reasoning_step') {
    const match = row.stableId.match(/C(\d+)-S(\d+)/);
    return match ? 'C' + match[1] + ' · S' + match[2] : shortOriginal(row.originalId);
  }
  return shortOriginal(row.originalId) + '\n' + truncate(row.proposition, 36);
}

function visNodeFromLedger(row) {
  const style = STYLE[row.sourceLayer] || STYLE.clean_claims;
  return {
    id: row.stableId,
    label: nodeLabel(row),
    shape: style.shape,
    color: { background: style.bg, border: style.color, highlight: { background: style.bg, border: style.color } },
    font: { color: '#211F1B', size: row.sourceLayer === 'graph_reasoning_step' ? 10 : 11, face: 'sans-serif', multi: false },
    borderWidth: row.sourceLayer === 'graph_conclusion' ? 3 : 1.8,
    margin: row.sourceLayer === 'graph_reasoning_step' ? 7 : 10,
    widthConstraint: { maximum: row.sourceLayer === 'graph_conclusion' ? 220 : 190 },
    _ledger: row
  };
}

function addEdge(list, from, to, kind, id, labelOverride) {
  const style = EDGE_STYLE[kind] || EDGE_STYLE.reasoning;
  list.push({
    id: id,
    from: from,
    to: to,
    arrows: 'to',
    color: { color: style.color, opacity: .72 },
    dashes: style.dashes,
    label: labelOverride || style.label,
    font: { size: 9, color: style.color, strokeWidth: 0, background: '#FAFAF6' },
    smooth: { type: 'cubicBezier', forceDirection: 'horizontal', roundness: .35 }
  });
}

function ledgerGraph() {
  const selected = document.getElementById('conclusion-filter').value;
  const layers = checkedLayers();
  const query = compact(document.getElementById('search-input').value).toLowerCase();
  const baseRows = LEDGER_DATA.filter(function (row) {
    const inConclusion = selected === 'ALL' || canonicalIds(row).includes(selected);
    if (!inConclusion || !layers.has(row.sourceLayer)) return false;
    if (!query || row.sourceLayer === 'graph_conclusion') return true;
    const haystack = [row.stableId, row.originalId, row.proposition, row.sourceTextEn, row.workingTextZh, row.paperSection, row.figure, row.ocrLines, row.excerpt, row.excerptZh].join(' ').toLowerCase();
    return haystack.includes(query);
  });

  const rows = baseRows.slice();
  const requiredCanonicals = new Set();
  if (selected === 'ALL') rows.forEach(function (row) { canonicalIds(row).forEach(function (id) { requiredCanonicals.add(id); }); });
  else requiredCanonicals.add(selected);
  if (layers.has('graph_conclusion')) {
    requiredCanonicals.forEach(function (id) {
      const hub = graphConclusionByCanonical.get(id);
      if (hub && !rows.some(function (row) { return row.stableId === hub.stableId; })) rows.push(hub);
    });
  }

  const visibleIds = new Set(rows.map(function (row) { return row.stableId; }));
  const nodes = rows.map(visNodeFromLedger);
  const edges = [];
  let edgeIndex = 0;

  rows.forEach(function (row) {
    if (row.sourceLayer === 'graph_conclusion' || row.sourceLayer === 'graph_reasoning_step') return;
    canonicalIds(row).filter(function (canonical) { return selected === 'ALL' || canonical === selected; }).forEach(function (canonical) {
      const hub = graphConclusionByCanonical.get(canonical);
      if (!hub || !visibleIds.has(hub.stableId)) return;
      let kind = 'decomposes';
      if (row.sourceLayer === 'graph_highlight' || row.type === '观察') kind = 'supports';
      if (row.sourceLayer === 'graph_weakpoint' || compact(row.challenges)) kind = 'challenges';
      if (row.sourceLayer === 'graph_subproblem') kind = 'background';
      addEdge(edges, row.stableId, hub.stableId, kind, 'ledger-link-' + (++edgeIndex));
    });
  });

  const reasoningGroups = new Map();
  rows.filter(function (row) { return row.sourceLayer === 'graph_reasoning_step'; }).forEach(function (row) {
    const list = reasoningGroups.get(row.parentFactorId) || [];
    list.push(row); reasoningGroups.set(row.parentFactorId, list);
  });
  reasoningGroups.forEach(function (steps) {
    steps.sort(function (a, b) { return a.stableId.localeCompare(b.stableId); });
    for (let index = 0; index < steps.length - 1; index += 1) addEdge(edges, steps[index].stableId, steps[index + 1].stableId, 'reasoning', 'step-' + (++edgeIndex), '');
    const last = steps[steps.length - 1];
    canonicalIds(last).filter(function (canonical) { return selected === 'ALL' || canonical === selected; }).forEach(function (canonical) {
      const hub = graphConclusionByCanonical.get(canonical);
      if (hub && visibleIds.has(hub.stableId)) addEdge(edges, last.stableId, hub.stableId, 'reasoning', 'step-conclusion-' + (++edgeIndex), '推出');
    });
  });

  RELATION_DATA.filter(function (relation) { return relation.sourceLayer === 'clean_relation'; }).forEach(function (relation) {
    const originals = String(relation.sourceOrRelated || '').split(';').map(function (v) { return v.trim(); }).filter(Boolean);
    if (originals.length < 2) return;
    const from = stableByCleanOriginal.get(originals[0]);
    const to = stableByCleanOriginal.get(originals[1]);
    if (!visibleIds.has(from) || !visibleIds.has(to)) return;
    let kind = relation.relationType === '矛盾' ? 'contradiction' : (relation.relationType === '举例' ? 'example' : 'reasoning');
    addEdge(edges, from, to, kind, 'clean-rel-' + (++edgeIndex), relation.relationType || relation.inferenceType || '关联');
  });

  return { nodes: nodes, edges: edges };
}

function coarseMembership() {
  const graph = PAPER_ENTRY.graph || { nodes: [], edges: [] };
  const factorToConclusion = new Map(graph.edges.filter(function (edge) { return edge.type === 'concludes'; }).map(function (edge) { return [edge.source, edge.target]; }));
  const nodeTarget = new Map();
  graph.nodes.forEach(function (node) {
    if (node.kind === 'conclusion') nodeTarget.set(node.id, node.id);
    if (node.kind === 'reasoning_steps') nodeTarget.set(node.id, factorToConclusion.get(node.id));
  });
  graph.edges.forEach(function (edge) {
    if (edge.type === 'subproblem_of') nodeTarget.set(edge.source, edge.target);
    if (edge.type === 'highlight_of' || edge.type === 'weakpoint_of') nodeTarget.set(edge.source, factorToConclusion.get(edge.target));
  });
  return nodeTarget;
}

function sourceLayerForKind(kind) {
  return { conclusion: 'graph_conclusion', reasoning_steps: 'graph_reasoning_step', highlight: 'graph_highlight', weak_point: 'graph_weakpoint', subproblem: 'graph_subproblem' }[kind] || 'graph_subproblem';
}

function canonicalFromGraphConclusion(id) {
  const match = String(id || '').match(/conclusion_(\d+)/);
  return match ? 'OTWTA-C' + String(match[1]).padStart(2, '0') : '';
}

function coarseGraph() {
  const selected = document.getElementById('conclusion-filter').value;
  const layers = checkedLayers();
  const query = compact(document.getElementById('search-input').value).toLowerCase();
  const graph = PAPER_ENTRY.graph || { nodes: [], edges: [] };
  const membership = coarseMembership();
  const rawNodes = graph.nodes.filter(function (node) {
    const canonical = canonicalFromGraphConclusion(membership.get(node.id));
    const inConclusion = selected === 'ALL' || canonical === selected;
    const layer = sourceLayerForKind(node.kind);
    const localized = ledgerByOriginal.get(node.id);
    const localizedSteps = ledgerStepsByFactor.get(node.id) || [];
    const haystack = [node.id, node.title, node.content, localized && localized.proposition, localized && localized.workingTextZh, JSON.stringify(node.steps || []), localizedSteps.map(function (row) { return row.proposition; }).join(' '), JSON.stringify(node.metadata || {})].join(' ').toLowerCase();
    return inConclusion && layers.has(layer) && (!query || haystack.includes(query));
  });
  const ids = new Set(rawNodes.map(function (node) { return node.id; }));
  const nodes = rawNodes.map(function (node) {
    const layer = sourceLayerForKind(node.kind);
    const style = STYLE[layer];
    const localized = ledgerByOriginal.get(node.id);
    const canonical = canonicalFromGraphConclusion(membership.get(node.id));
    const conclusionMeta = conclusionByCanonical.get(canonical);
    const localizedLabel = conclusionMeta && node.kind === 'conclusion' ? conclusionMeta.title : (localized && localized.proposition);
    return {
      id: node.id,
      label: node.kind === 'reasoning_steps' ? '推理因子\n' + (node.steps || []).length + ' 步' : shortOriginal(node.id) + '\n' + truncate(localizedLabel || node.title || node.content, 38),
      shape: style.shape,
      color: { background: style.bg, border: style.color, highlight: { background: style.bg, border: style.color } },
      font: { color: '#211F1B', size: 11, face: 'sans-serif' },
      borderWidth: node.kind === 'conclusion' ? 3 : 1.8,
      margin: 10,
      widthConstraint: { maximum: 210 },
      _raw: node
    };
  });
  const edges = graph.edges.filter(function (edge) { return ids.has(edge.source) && ids.has(edge.target); }).map(function (edge, index) {
    const kind = edge.type === 'weakpoint_of' ? 'challenges' : edge.type === 'highlight_of' ? 'supports' : edge.type === 'subproblem_of' ? 'background' : 'reasoning';
    const style = EDGE_STYLE[kind];
    return { id: 'coarse-' + index, from: edge.source, to: edge.target, arrows: 'to', color: { color: style.color, opacity: .72 }, dashes: style.dashes, label: edge.type, font: { size: 9, color: style.color, strokeWidth: 0, background: '#FAFAF6' }, smooth: { type: 'cubicBezier', forceDirection: 'horizontal', roundness: .35 } };
  });
  return { nodes: nodes, edges: edges };
}

function render() {
  closeDetail();
  const mode = document.getElementById('view-mode').value;
  const result = mode === 'ledger' ? ledgerGraph() : coarseGraph();
  document.getElementById('metric-nodes').textContent = result.nodes.length;
  document.getElementById('metric-edges').textContent = result.edges.length;
  document.getElementById('scope-label').textContent = (mode === 'ledger' ? '证据台账 · ' : '原始粗图 · ') + document.getElementById('conclusion-filter').value;
  document.getElementById('empty-state').style.display = result.nodes.length ? 'none' : 'grid';
  document.getElementById('status').textContent = result.nodes.length ? '已按当前条件重建图谱。' : '没有匹配结果。';
  document.getElementById('status').className = result.nodes.length ? '' : 'error';

  if (network) network.destroy();
  visNodes = new vis.DataSet(result.nodes);
  visEdges = new vis.DataSet(result.edges);
  network = new vis.Network(document.getElementById('network'), { nodes: visNodes, edges: visEdges }, {
    physics: false,
    interaction: { hover: true, tooltipDelay: 100, navigationButtons: true, keyboard: true },
    layout: { hierarchical: { enabled: true, direction: 'LR', sortMethod: 'directed', levelSeparation: 185, nodeSpacing: 125, treeSpacing: 210, blockShifting: true, edgeMinimization: true, parentCentralization: true } },
    edges: { selectionWidth: 2 }
  });
  network.on('click', function (params) {
    if (!params.nodes.length) { closeDetail(); return; }
    const selectedNode = visNodes.get(params.nodes[0]);
    if (selectedNode._ledger) showLedgerDetail(selectedNode._ledger);
    else if (selectedNode._raw) showRawDetail(selectedNode._raw);
  });
  window.setTimeout(function () { if (network && result.nodes.length) network.fit({ animation: { duration: 350, easingFunction: 'easeInOutQuad' } }); }, 40);
}

function detailTag(layer, label) {
  const style = STYLE[layer] || STYLE.clean_claims;
  const tag = document.getElementById('dp-kind');
  tag.textContent = label || style.tag;
  tag.style.background = style.bg;
  tag.style.color = style.color;
}

function section(label, content, cssClass) {
  if (!compact(content)) return '';
  return '<div class="dp-section">' + escapeHtml(label) + '</div><div class="' + (cssClass || '') + '">' + escapeHtml(content) + '</div>';
}

function showLedgerDetail(row) {
  detailTag(row.sourceLayer, STYLE[row.sourceLayer] ? STYLE[row.sourceLayer].tag : row.type);
  const conclusionMeta = conclusionByCanonical.get(canonicalIds(row)[0]);
  document.getElementById('dp-title').textContent = row.sourceLayer === 'graph_conclusion' && conclusionMeta ? conclusionMeta.title : (shortOriginal(row.originalId) + ' · ' + truncate(row.proposition, 72));
  let html = '<div class="dp-section">台账身份</div><dl class="dp-meta">' +
    '<dt>稳定 ID</dt><dd class="mono">' + escapeHtml(row.stableId) + '</dd>' +
    '<dt>原始 ID</dt><dd class="mono">' + escapeHtml(row.originalId) + '</dd>' +
    '<dt>规范结论</dt><dd class="mono">' + escapeHtml(row.canonicalConclusionId) + '</dd>' +
    '<dt>类型</dt><dd>' + escapeHtml(row.type + ' / ' + row.argumentRole) + '</dd>' +
    '<dt>认识状态</dt><dd>' + escapeHtml(row.epistemicStatus) + '</dd>' +
    '<dt>正式 IR</dt><dd>' + escapeHtml(row.inFormalIr + (row.irId ? ' · ' + row.irId : '')) + '</dd>' +
    '<dt>复核状态</dt><dd>' + escapeHtml(row.reviewStatus) + '</dd></dl>';
  html += section('命题文本（self-contained）', row.proposition);
  if (row.workingTextZh && row.workingTextZh !== row.proposition) html += section('中文工作文本', row.workingTextZh);
  html += '<div class="dp-section">论文定位</div><dl class="dp-meta">' +
    '<dt>章节</dt><dd>' + escapeHtml(row.paperSection) + '</dd>' +
    '<dt>图表</dt><dd>' + escapeHtml(row.figure) + '</dd>' +
    '<dt>OCR 行号</dt><dd class="mono">' + escapeHtml(row.ocrLines) + '</dd>' +
    '<dt>支持</dt><dd class="mono">' + escapeHtml(row.supports || '—') + '</dd>' +
    '<dt>限制</dt><dd class="mono">' + escapeHtml(row.challenges || '—') + '</dd></dl>';
  html += section('论文原文锚点（中文译文）', row.excerptZh, 'quote');
  html += section('论文原文锚点（英文）', row.excerpt, 'quote');
  html += '<div class="dp-section">可追溯来源</div><dl class="dp-meta"><dt>来源文件</dt><dd class="mono">' + escapeHtml(row.sourceFile) + '</dd><dt>JSON Path</dt><dd class="mono">' + escapeHtml(row.jsonPath) + '</dd></dl>';
  html += section('备注', row.notes);
  document.getElementById('dp-body').innerHTML = html;
  document.getElementById('detail-panel').classList.add('visible');
}

function showRawDetail(node) {
  const layer = sourceLayerForKind(node.kind);
  const localized = ledgerByOriginal.get(node.id);
  const stepRows = ledgerStepsByFactor.get(node.id) || [];
  const canonical = canonicalFromGraphConclusion(coarseMembership().get(node.id));
  const conclusionMeta = conclusionByCanonical.get(canonical);
  detailTag(layer, 'RAW ' + String(node.kind || '').toUpperCase());
  document.getElementById('dp-title').textContent = (conclusionMeta && node.kind === 'conclusion' ? conclusionMeta.title : '') || (localized && truncate(localized.proposition, 72)) || node.title || shortOriginal(node.id);
  let html = '<div class="dp-section">原始节点</div><dl class="dp-meta"><dt>ID</dt><dd class="mono">' + escapeHtml(node.id) + '</dd><dt>Global ID</dt><dd class="mono">' + escapeHtml(node.global_id || '') + '</dd><dt>Kind</dt><dd>' + escapeHtml(node.kind || '') + '</dd></dl>';
  html += section('内容（中文）', localized ? localized.proposition : (conclusionMeta ? conclusionMeta.content : ''));
  html += section('英文源文本', node.content || '');
  if (stepRows.length || (node.steps && node.steps.length)) {
    html += '<div class="dp-section">推理步骤（中文）</div>' + (stepRows.length ? stepRows.map(function (row, index) { return '<div class="quote"><span class="mono">#' + escapeHtml(index + 1) + '</span> ' + escapeHtml(row.proposition) + '</div>'; }) : node.steps.map(function (step) { return '<div class="quote"><span class="mono">#' + escapeHtml(step.step_id) + '</span> ' + escapeHtml(step.reasoning) + '</div>'; })).join('<br>');
  }
  if (node.metadata) html += section('Metadata（原始代码）', JSON.stringify(node.metadata, null, 2), 'mono');
  document.getElementById('dp-body').innerHTML = html;
  document.getElementById('detail-panel').classList.add('visible');
}

function closeDetail() { document.getElementById('detail-panel').classList.remove('visible'); }
function resetFilters() {
  document.getElementById('view-mode').value = 'ledger';
  document.getElementById('conclusion-filter').value = 'OTWTA-C01';
  document.getElementById('search-input').value = '';
  document.querySelectorAll('[data-layer]').forEach(function (input) { input.checked = input.dataset.layer !== 'graph_reasoning_step'; });
  render();
}

function init() {
  conclusionOptions();
  document.getElementById('paper-title').textContent = (PAPER_ENTRY.paper && (PAPER_ENTRY.paper.zh_title || PAPER_ENTRY.paper.en_title)) || '一张中奖彩票，通吃所有任务';
  document.getElementById('metric-ledger').textContent = LEDGER_DATA.length;
  document.getElementById('metric-ir').textContent = LEDGER_DATA.filter(function (row) { return row.inFormalIr === '是'; }).length;
  document.getElementById('view-mode').addEventListener('change', render);
  document.getElementById('conclusion-filter').addEventListener('change', render);
  document.querySelectorAll('[data-layer]').forEach(function (input) { input.addEventListener('change', render); });
  document.getElementById('search-input').addEventListener('input', function () { window.clearTimeout(debounceTimer); debounceTimer = window.setTimeout(render, 180); });
  document.getElementById('fit-button').addEventListener('click', function () { if (network) network.fit({ animation: { duration: 350, easingFunction: 'easeInOutQuad' } }); });
  document.getElementById('reset-button').addEventListener('click', resetFilters);
  document.getElementById('dp-close').addEventListener('click', closeDetail);
  render();
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
