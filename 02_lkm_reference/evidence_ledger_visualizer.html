ationId":"edge_24","sourceOrRelated":"lfac_745c4fd9e6ca523f [OTWTA-FAC-C04]","target":"paper:867771291879342656::conclusion_4 [OTWTA-GCON-C04]","relationType":"concludes","inferenceType":"","p1":"","p2":"","description":"","inFormalIr":"否","notes":""},{"stableRelationId":"OTWTA-REL-GRAPH-E025","sourceLayer":"graph_edge","originalRelationId":"edge_25","sourceOrRelated":"lfac_c6ff5645cff61bd7 [OTWTA-FAC-C06]","target":"paper:867771291879342656::conclusion_6 [OTWTA-GCON-C06]","relationType":"concludes","inferenceType":"","p1":"","p2":"","description":"","inFormalIr":"否","notes":""},{"stableRelationId":"OTWTA-REL-GRAPH-E026","sourceLayer":"graph_edge","originalRelationId":"edge_26","sourceOrRelated":"lfac_c9fb5d9571d5a824 [OTWTA-FAC-C07]","target":"paper:867771291879342656::conclusion_7 [OTWTA-GCON-C07]","relationType":"concludes","inferenceType":"","p1":"","p2":"","description":"","inFormalIr":"否","notes":""},{"stableRelationId":"OTWTA-REL-GRAPH-E027","sourceLayer":"graph_edge","originalRelationId":"edge_27","sourceOrRelated":"lfac_cb96d1b77e42b35b [OTWTA-FAC-C02]","target":"paper:867771291879342656::conclusion_2 [OTWTA-GCON-C02]","relationType":"concludes","inferenceType":"","p1":"","p2":"","description":"","inFormalIr":"否","notes":""}];
const PAPER_ENTRY = {"addressed_problems":[{"content":"The iterative-pruning procedure used to discover winning ticket initializations is computationally expensive, requiring up to 30 serial retrainings of the full source model to reach extreme pruning fractions, and this cost is amplified when the most transferable tickets are obtained from large datasets such as ImageNet and Places365, limiting practical reuse; therefore, methods to discover transferable winning tickets with substantially lower computational budgets are needed.","global_id":"gcn_4b6b498d0277409f","id":"paper:867771291879342656::open_question_1"},{"content":"Winning ticket transfer has only been demonstrated within the natural image domain (datasets such as Fashion-MNIST, SVHN, CIFAR-10/100, ImageNet, and Places365); it remains unresolved whether winning ticket initializations generalize across fundamentally different data domains, such as non-image data (e.g., text, audio, time series) or multimodal inputs, leaving open the question of whether the inductive biases they confer are domain-agnostic.","global_id":"gcn_aa0b82cba39e4802","id":"paper:867771291879342656::open_question_2"},{"content":"All experiments in this work were restricted to the task of object classification; it is unknown whether winning ticket initializations transfer across fundamentally different task types, such as detection, segmentation, regression, or reinforcement learning, which may require different representational structures and optimization landscapes.","global_id":"gcn_acd5e95c17e0483c","id":"paper:867771291879342656::open_question_3"},{"content":"The study only evaluated transfer across datasets when the network topology (VGG19 or ResNet50) was held fixed between source and target configurations; it remains unresolved whether winning ticket initializations can be transferred across architectures with different topologies (e.g., different number of layers, filter sizes, or connectivity patterns), and the development of methods to parameterize winning tickets for novel architectures is an important open direction.","global_id":"gcn_40259fb0b26b4472","id":"paper:867771291879342656::open_question_4"},{"content":"Although transferred winning tickets often approach the performance of target-specific tickets, there is a persistent performance gap, especially when the source dataset is small (e.g., CIFAR-10 or SVHN); it is unresolved which specific aspects of winning tickets—such as the weight values, mask structure, or layerwise pruning ratios—are dataset-dependent versus dataset-independent, and identifying the structural or statistical properties that confer generic inductive bias is an open problem.","global_id":"gcn_9e2b4c93e7544b08","id":"paper:867771291879342656::open_question_5"},{"content":"The mechanisms by which winning tickets improve training are not understood; it remains an open question what features of a sparse initialization—such as weight sign, magnitude distribution, or connectivity patterns—enable particular optima to be reachable under diverse training regimes (different datasets and optimizers), and answering this is critical for designing principled, broadly useful initialization methods.","global_id":"gcn_11f583b2219841f3","id":"paper:867771291879342656::open_question_6"},{"content":"Only magnitude-based pruning was used to generate winning tickets in this study; it is unresolved whether alternative pruning criteria (e.g., based on gradient information, activation statistics, or structured pruning) could produce winning tickets that transfer even more broadly across datasets and optimizers.","global_id":"gcn_bd34c0750d454160","id":"paper:867771291879342656::open_question_7"},{"content":"The current method for obtaining a winning ticket requires a costly iterative pruning search on a specific source configuration; an open problem is whether the structure of winning tickets (masks and weight values) can be parameterized compactly so that a distribution over transferable tickets can be sampled directly, without requiring the full pruning process for each new dataset or architecture.","global_id":"gcn_b3ea4862e21f4d01","id":"paper:867771291879342656::open_question_8"},{"content":"The work addresses whether the \"lottery ticket\" phenomenon—i.e., the presence within an over-parameterized neural network's random initialization of much smaller sparse sub-networks (\"winning tickets\") that can be trained in isolation to achieve high test performance—can be made practically useful beyond its original, costly discovery procedure. Prior to this study, the lottery ticket hypothesis had been demonstrated mainly by generating winning tickets by repeatedly training a full model to convergence and iteratively pruning it, using heuristics such as magnitude pruning, late resetting, and specific pruning schedules. Generating winning tickets thus required a computationally expensive pipeline of many full-model trainings (iterative pruning across many pruning iterations), and prior empirical work largely evaluated winning tickets only in the identical setting (same architecture, same optimizer, same dataset) in which they were found. These facts produced two substantive, unresolved problem-states motivating this paper: (1) it was unknown whether a winning-ticket initialization discovered in one training configuration (a particular source dataset and/or optimizer) encodes inductive biases that are sufficiently generic to improve training in different target configurations, or whether winning tickets are overfit to their source configuration such that a new, expensive iterative-pruning search would be required for each new dataset or optimizer; and (2) methodological ambiguities in prior comparisons (for example, retaining the source mask when constructing \"random\" baselines, or using layerwise vs. global pruning) left open which aspects of the pruning/mask/initialization pipeline actually carry the transferable signal versus which are artifacts of experimental control. These gaps prevented practitioners from knowing whether a small library of pre-computed winning-ticket initializations could be reused across tasks and optimizers (which would amortize the search cost), or whether the computationally heavy discovery process must be repeated per new dataset/optimizer, and they left the field without controlled evidence about the roles of pruning modality and mask structure in transferability.","global_id":"gcn_10d4984efe2840e3","id":"paper:867771291879342656::problem"}],"graph":{"edges":[{"source":"paper:867771291879342656::conclusion_1_subproblem","target":"paper:867771291879342656::conclusion_1","type":"subproblem_of"},{"source":"paper:867771291879342656::conclusion_2_subproblem","target":"paper:867771291879342656::conclusion_2","type":"subproblem_of"},{"source":"paper:867771291879342656::conclusion_3_subproblem","target":"paper:867771291879342656::conclusion_3","type":"subproblem_of"},{"source":"paper:867771291879342656::conclusion_4_subproblem","target":"paper:867771291879342656::conclusion_4","type":"subproblem_of"},{"source":"paper:867771291879342656::conclusion_5_subproblem","target":"paper:867771291879342656::conclusion_5","type":"subproblem_of"},{"source":"paper:867771291879342656::conclusion_6_subproblem","target":"paper:867771291879342656::conclusion_6","type":"subproblem_of"},{"source":"paper:867771291879342656::conclusion_7_subproblem","target":"paper:867771291879342656::conclusion_7","type":"subproblem_of"},{"p1":0.3,"p2":0.7,"source":"paper:867771291879342656::P1","target":"lfac_cb96d1b77e42b35b","type":"weakpoint_of"},{"p1":0.4,"p2":0.8,"source":"paper:867771291879342656::P2","target":"lfac_666bfce3ddeaaf51","type":"weakpoint_of"},{"p1":0.3,"p2":0.8,"source":"paper:867771291879342656::P3","target":"lfac_745c4fd9e6ca523f","type":"weakpoint_of"},{"p1":0.5,"p2":0.7,"source":"paper:867771291879342656::P4","target":"lfac_58096a5ebe94e02b","type":"weakpoint_of"},{"p1":0.4,"p2":0.6,"source":"paper:867771291879342656::P5","target":"lfac_c6ff5645cff61bd7","type":"weakpoint_of"},{"source":"paper:867771291879342656::H1","target":"lfac_38ad8d064f6577f1","type":"highlight_of"},{"source":"paper:867771291879342656::H2","target":"lfac_38ad8d064f6577f1","type":"highlight_of"},{"source":"paper:867771291879342656::H3","target":"lfac_cb96d1b77e42b35b","type":"highlight_of"},{"source":"paper:867771291879342656::H4","target":"lfac_666bfce3ddeaaf51","type":"highlight_of"},{"source":"paper:867771291879342656::H5","target":"lfac_745c4fd9e6ca523f","type":"highlight_of"},{"source":"paper:867771291879342656::H6","target":"lfac_58096a5ebe94e02b","type":"highlight_of"},{"source":"paper:867771291879342656::H7","target":"lfac_c6ff5645cff61bd7","type":"highlight_of"},{"source":"paper:867771291879342656::H8","target":"lfac_c9fb5d9571d5a824","type":"highlight_of"},{"source":"lfac_38ad8d064f6577f1","target":"paper:867771291879342656::conclusion_1","type":"concludes"},{"source":"lfac_58096a5ebe94e02b","target":"paper:867771291879342656::conclusion_5","type":"concludes"},{"source":"lfac_666bfce3ddeaaf51","target":"paper:867771291879342656::conclusion_3","type":"concludes"},{"source":"lfac_745c4fd9e6ca523f","target":"paper:867771291879342656::conclusion_4","type":"concludes"},{"source":"lfac_c6ff5645cff61bd7","target":"paper:867771291879342656::conclusion_6","type":"concludes"},{"source":"lfac_c9fb5d9571d5a824","target":"paper:867771291879342656::conclusion_7","type":"concludes"},{"source":"lfac_cb96d1b77e42b35b","target":"paper:867771291879342656::conclusion_2","type":"concludes"}],"nodes":[{"content":"In the context of supervised image classification with over-parameterized convolutional networks (VGG19 and ResNet50), researchers sought initialization schemes that permit training highly sparse subnetworks to high performance without requiring repeated full-model search per target task. Prior practice produced winning-ticket initializations by performing iterative magnitude pruning and resetting within the same dataset/optimizer as evaluation; this approach is computationally costly (many full-model re-trainings, e.g., 30 pruning iterations) and leaves open whether the discovered initialization encodes only dataset-specific information or a broader inductive bias. If winning tickets were dataset-specific, then each new target dataset would require the same expensive search, preventing amortization; if they were generic, a small set of winning tickets could be reused. Prior work did not systematically test cross-dataset transfer within the same data domain, so it was unknown whether tickets from large datasets like ImageNet embed transferable structure useful across varied natural-image classification tasks.","global_id":"gcn_60801a4c6da944fb","id":"paper:867771291879342656::conclusion_1_subproblem","kind":"subproblem","type":"question"},{"content":"Practitioners need guidance about how to choose or construct source datasets for producing reusable winning-ticket initializations. Prior to this study, it was unclear whether increasing only the number of examples, only the number of classes, or both would yield more generic tickets. Without this knowledge, attempts to amortize the expensive ticket-discovery process risked choosing suboptimal source datasets that yield tickets that do not generalize, meaning the search cost could not be shared across tasks. Understanding which dataset properties correlate with transferability is necessary to decide whether investing computation into large, class-rich source datasets (e.g., ImageNet/Places365) will produce broadly useful initializations.","global_id":"gcn_cc3793d2a37048f0","id":"paper:867771291879342656::conclusion_2_subproblem","kind":"subproblem","type":"question"},{"content":"It was unknown whether the beneficial initialization captured by a winning ticket is optimizer-specific because different optimizers follow different optimization trajectories and may make different regions of parameter space reachable. If tickets were optimizer-specific, then for each optimizer of practical interest a separate, expensive ticket discovery would be required, limiting reusability. Prior empirical work had not measured cross-optimizer transfer systematically (e.g., SGD ↔ Adam) while controlling other factors, so it remained an open question whether a ticket's inductive bias is tied to the optimization algorithm used to find it.","global_id":"gcn_76a07ce1ef6344af","id":"paper:867771291879342656::conclusion_3_subproblem","kind":"subproblem","type":"question"},{"content":"Before reuse of winning tickets across datasets could be plausibly advocated, it was necessary to check whether discovered tickets merely encode idiosyncratic information about the exact training samples used (overfitting to sample draws). If a ticket were specific to the random sample ordering or particular subset, it would not be reusable even across similar data. Prior studies did not separate sample-level overfitting from distribution-level transfer; establishing within-distribution generalization is a first step toward arguing for broader dataset- or domain-level portability.","global_id":"gcn_89451528994b443e","id":"paper:867771291879342656::conclusion_4_subproblem","kind":"subproblem","type":"question"},{"content":"Pruning methodology determines the mask structure and hence the remaining sparse architecture; prior work employed different pruning regimes without a unified treatment of their comparative effects on winning-ticket quality and mask statistics. If layerwise pruning forces the same pruning fraction in small early layers it can leave too few parameters in those layers and harm expressivity; conversely, global pruning can adapt pruning intensity across layers but its effects on transferability and mask information content were not fully characterized. Understanding which pruning modality yields stronger tickets and what layerwise sparsity patterns emerge was necessary to choose an effective pruning pipeline for transferable tickets.","global_id":"gcn_cfa338f71d0143dd","id":"paper:867771291879342656::conclusion_5_subproblem","kind":"subproblem","type":"question"},{"content":"Prior comparisons between winning tickets and \"random\" sparse initializations sometimes retained the discovered ticket's mask for the random baseline, confounding whether performance differences arose from preserved connectivity patterns or the retained initial weight values. This ambiguity prevented clear attribution of what aspect of a winning ticket—mask topology or initial weight values—drives its training advantage, and could lead to overestimating the novelty of weight-value effects. A controlled assessment of mask permutations was therefore needed to define appropriate baselines and to isolate what is being transferred when reusing winning tickets.","global_id":"gcn_01326b8865054046","id":"paper:867771291879342656::conclusion_6_subproblem","kind":"subproblem","type":"question"},{"content":"Prior demonstrations of lottery-ticket phenomena in large-scale settings encountered failures when applying the naïve reset-to-zero-iteration strategy, and follow-up work proposed late resetting as a remedy; however, reproducing winning tickets at scale requires a concrete, tuned pruning/reset schedule and training hyperparameters to be specified and validated. Without such a specified pipeline, experiments on large datasets and deep architectures risk failing to produce winning tickets simply due to suboptimal schedules rather than absence of sparse trainable subnetworks. Practitioners needed validated schedules and resetting heuristics for producing tickets that can be evaluated for transfer.","global_id":"gcn_c5f455630c854582","id":"paper:867771291879342656::conclusion_7_subproblem","kind":"subproblem","type":"question"},{"content":"Winning-ticket initializations discovered by iterative magnitude pruning (iterative pruning rate 0.2, up to 30 pruning iterations; late resetting to early training iterations) on large, complex natural-image source datasets (ImageNet and Places365, and to a lesser extent CIFAR-100) produce sparse initializations that, when used to train a VGG19 or ResNet50 architecture on other natural-image target datasets (SVHN, Fashion-MNIST, CIFAR-10, CIFAR-100, ImageNet, Places365), frequently achieve test accuracies on the target tasks that are close to the accuracies obtained by winning tickets discovered directly on those target datasets. The transferability is observed across a wide range of pruning fractions (including very high sparsity), and larger / more class-rich source datasets produced stronger cross-dataset transfer than smaller sources (e.g., CIFAR-100 tickets generalize better than CIFAR-10 tickets despite both having 50,000 training examples).","global_id":"gcn_f22fc9a9f36d4b45","id":"paper:867771291879342656::conclusion_1","kind":"conclusion","metadata":{"narrative":"The conclusion is well-supported by extensive empirical evidence. Highlight H1 demonstrates that transferred tickets from large sources can even outperform target-specific tickets on Fashion-MNIST, revealing generic inductive biases beyond dataset-specific effects. Highlight H2 confirms that the transfer pattern is consistent across two distinct architectures (VGG19 and ResNet50), precluding architecture-specific artifacts. No load-bearing weak points were identified within the paper's scope of natural-image datasets and tested architectures. The conclusion is therefore strongly credited."},"order":1,"priors":[{"created_at":"2026-06-12T21:31:49.106416+00:00","id":"gcn_f22fc9a9f36d4b45::extract_paper_867771291879342656","source_id":"extract_paper_867771291879342656","value":0.95}],"title":"Winning tickets from large natural-image source datasets transfer across natural-image target datasets with near target-specific performance","type":"claim"},{"content":"Winning tickets discovered on larger source datasets—both in terms of number of training examples and number of output classes—transfer substantially better to other natural-image classification datasets (SVHN, Fashion-MNIST, CIFAR-10, CIFAR-100, ImageNet, Places365) than tickets discovered on smaller source datasets, for both VGG19 and ResNet50 architectures. This effect is not solely explained by raw training-set size: holding training-set size fixed, a source dataset with many classes (CIFAR-100, 100 classes) produced tickets that generalized better across targets than one with few classes (CIFAR-10, 10 classes).","global_id":"gcn_0fdc65dd973e495e","id":"paper:867771291879342656::conclusion_2","kind":"conclusion","metadata":{"narrative":"The consistent ordering of source effectiveness across multiple targets and architectures (highlight H3) provides robust correlational evidence that source dataset scale and class diversity predict transferability. However, premise P1 identifies a critical confound: the comparison between CIFAR-10 and CIFAR-100 does not control for other dataset properties beyond class count, so the specific claim that number of classes independently predicts transferability is not firmly established. The conclusion's scale aspect is well-supported, but the class-count aspect remains uncertain."},"order":2,"priors":[{"created_at":"2026-06-12T21:31:49.106429+00:00","id":"gcn_0fdc65dd973e495e::extract_paper_867771291879342656","source_id":"extract_paper_867771291879342656","value":0.7}],"title":"Source dataset scale and number of classes predict transferability of winning tickets","type":"claim"},{"content":"Winning-ticket initializations generated with one optimizer generalize to training with a different optimizer on natural-image classification datasets: VGG19 tickets found using SGD with momentum or using Adam, when re-used with the alternate optimizer, achieve high performance that is comparable to tickets discovered under the target optimizer. There are optimizer-dependent nuances in behavior: tickets transferred from SGD to Adam sometimes under-perform random tickets at low pruning fractions but outperform random tickets at high pruning fractions.","global_id":"gcn_d354352c21724714","id":"paper:867771291879342656::conclusion_3","kind":"conclusion","metadata":{"narrative":"Highlight H4 shows a controlled experiment that provides some evidence for cross-optimizer transfer in VGG19. However, premise P2 points out that the experiment lacks specification of the dataset and is limited to a single architecture (VGG19), making the generality of the conclusion uncertain. The conclusion is supported for the specific configuration tested but cannot be confidently extended to other architectures or datasets without additional evidence."},"order":3,"priors":[{"created_at":"2026-06-12T21:31:49.106444+00:00","id":"gcn_d354352c21724714::extract_paper_867771291879342656","source_id":"extract_paper_867771291879342656","value":0.5}],"title":"Winning tickets can generalize across optimizers (SGD w/ momentum and Adam) for VGG models","type":"claim"},{"content":"A winning ticket discovered on CIFAR-10a, a subset of the CIFAR-10 dataset containing 25,000 training images with 2,500 images per class, transfers to a disjoint subset CIFAR-10b from the same data distribution and improves training on that held-out subset relative to random sparse initializations. This within-distribution transfer holds for both VGG19 and ResNet50, though ResNet50 showed sensitivity at low pruning fractions (occasionally under-performing random tickets when few weights are pruned).","global_id":"gcn_2cab68b8709b4d9f","id":"paper:867771291879342656::conclusion_4","kind":"conclusion","metadata":{"narrative":"Highlight H5 shows that within-distribution transfer to a held-out split works for two architectures, precluding the failure mode of sample memorization. However, premise P3 highlights that the experiment uses a single split of a single dataset, which is insufficient to establish the general claim that winning tickets generalize across different samples from the same distribution. The conclusion is partially supported but requires validation across multiple splits and datasets."},"order":4,"priors":[{"created_at":"2026-06-12T21:31:49.106457+00:00","id":"gcn_2cab68b8709b4d9f::extract_paper_867771291879342656","source_id":"extract_paper_867771291879342656","value":0.6}],"title":"Winning tickets generalize across different samples from the same data distribution","type":"claim"},{"content":"When performing magnitude pruning for winning-ticket discovery on VGG19 trained on CIFAR-10, globally ranking weights across all layers and pruning the smallest-magnitude weights globally yields higher-performing sparse subnetworks than pruning a fixed fraction per layer (\"layerwise pruning\"). Under global magnitude pruning the pruning fractions vary across layers: deeper convolutional layers are pruned more heavily while early layers (notably the first convolutional layer) retain a much larger fraction of their parameters.","global_id":"gcn_cdeb0e970f4042d0","id":"paper:867771291879342656::conclusion_5","kind":"conclusion","metadata":{"narrative":"Highlight H6 provides direct empirical evidence that global pruning outperforms layerwise pruning and produces non-uniform sparsity on VGG19/CIFAR-10. However, premise P4 notes that these results are limited to one architecture and one dataset, so the conclusion may not generalize. The claim is well-supported for the tested configuration but not beyond."},"order":5,"priors":[{"created_at":"2026-06-12T21:31:49.106469+00:00","id":"gcn_cdeb0e970f4042d0::extract_paper_867771291879342656","source_id":"extract_paper_867771291879342656","value":0.5}],"title":"Global magnitude pruning outperforms layerwise pruning and results in non-uniform layerwise sparsity (deeper layers pruned more) under global schedules","type":"claim"},{"content":"For VGG19 trained on CIFAR-10, the structure of the pruning mask contains substantial information useful for training sparse networks: comparing (a) preserved winning-ticket masks, (b) masks permuted only within layers (local permutation), and (c) masks permuted across all layers (global permutation) shows that locally permuting a mask degrades performance moderately while globally permuting the mask degrades performance dramatically. Therefore, a fair \"random ticket\" baseline for evaluating a winning-ticket initialization should randomize both weight values and mask structure (global permutation), because preserving mask statistics across layers transfers information from the discovered ticket.","global_id":"gcn_764a16230b6b4c66","id":"paper:867771291879342656::conclusion_6","kind":"conclusion","metadata":{"narrative":"Highlight H7 provides a clear ablation showing that mask structure carries information at two levels, supporting the conclusion that fair baselines must randomize mask structure. However, premise P5 notes that the experiment is limited to VGG19/CIFAR-10, so the generality of the prescription is uncertain. The conclusion is well-supported for the tested setting."},"order":6,"priors":[{"created_at":"2026-06-12T21:31:49.106481+00:00","id":"gcn_764a16230b6b4c66::extract_paper_867771291879342656","source_id":"extract_paper_867771291879342656","value":0.5}],"title":"Mask structure carries substantial information; fair random baselines must randomize mask structure","type":"claim"},{"content":"For obtaining competitive winning tickets in the large-model and large-dataset regime of natural-image classification, an iterative magnitude-pruning schedule with pruning fraction per iteration 0.2 (20% of remaining parameters) over up to 30 iterations combined with late resetting to parameters at a small early training iteration produced effective winning tickets; late resetting settings used were resetting to the parameters after 1 epoch for Fashion-MNIST, SVHN, CIFAR-10 and CIFAR-100, and after 3 epochs for ImageNet and Places365. Learning-rate annealing schedules and other hyperparameters were matched per model family (VGG19 trained 160 epochs with LR drops at epochs 80 and 120; ResNet50 trained 90 epochs with LR drops at epochs 50, 65, and 80).","global_id":"gcn_1c4ea7e959814d8f","id":"paper:867771291879342656::conclusion_7","kind":"conclusion","metadata":{"narrative":"Highlight H8 confirms that the late-resetting and iterative pruning schedule successfully produces winning tickets for large models, replicating prior work. No load-bearing weak points were identified. The schedule is validated as effective for the experiments in this paper."},"order":7,"priors":[{"created_at":"2026-06-12T21:31:49.106492+00:00","id":"gcn_1c4ea7e959814d8f::extract_paper_867771291879342656","source_id":"extract_paper_867771291879342656","value":0.9}],"title":"Late resetting and iterative magnitude-pruning schedule used to obtain winning tickets for large models and datasets","type":"claim"},{"content":"In winning ticket transferability experiments across natural-image datasets with VGG19 and ResNet50 architectures on SVHN, Fashion-MNIST, CIFAR-10, CIFAR-100, ImageNet, and Places365, the comparison between CIFAR-10 (10 classes, 50,000 training images) and CIFAR-100 (100 classes, 50,000 training images) confounds the number of output classes with class granularity (fine-grained versus coarse), image content, and baseline task difficulty. Therefore, the observed superior transferability of CIFAR-100 winning tickets over CIFAR-10 winning tickets cannot be uniquely attributed to the difference in the number of output classes.\n      Fig. 3, Fig. 4","global_id":"gcn_3a20090848234dec","id":"paper:867771291879342656::P1","kind":"weak_point","metadata":{"failure_mode":"If the observed superior transfer of CIFAR-100 tickets is driven by other dataset properties (e.g., greater intra-class variability, more fine-grained distinctions) rather than by the number of classes per se, then the conclusion that \"number of classes predict transferability\" would be false or at least unsupported. The claim that \"simply increasing the number of classes while keeping the dataset size fixed may lead to substantial gains\" would be an overattribution.","refs":[{"text":"Fig. 3, Fig. 4","type":"figure"}],"weak_types":["generalization","causal"],"weakness_reason":"The paper uses a single comparison (CIFAR-10 vs. CIFAR-100) to infer a causal effect of class count, but these datasets are not matched on other dimensions. The field has known confounds between number of classes and dataset difficulty. Without additional control (e.g., artificially varying class count while holding other properties constant, or comparing multiple datasets with varying class counts), the conclusion that class count per se is predictive is uncertain."},"priors":[{"created_at":"2026-06-12T21:31:49.106370+00:00","id":"gcn_3a20090848234dec::extract_paper_867771291879342656","source_id":"extract_paper_867771291879342656","value":0.5}],"title":"CIFAR-10 and CIFAR-100 confound class count with class granularity and image content","type":"claim"},{"content":"The cross-optimizer transfer experiments for winning tickets (VGG19 tickets generated with SGD with momentum or Adam, evaluated on the alternate optimizer) were conducted on an unspecified natural-image classification dataset and used only the VGG19 architecture. The observation that winning tickets generalize across optimizers is therefore supported by evidence from a single architecture and an unidentified training dataset.\n      Fig. 5","global_id":"gcn_c127ed02f3f94de9","id":"paper:867771291879342656::P2","kind":"weak_point","metadata":{"failure_mode":"If the cross-optimizer transfer were evaluated only on CIFAR-10, it is possible that the result does not hold on other datasets (e.g., ImageNet, CIFAR-100) or other VGG variants. The claim that \"winning tickets can generalize across optimizers (SGD w/ momentum and Adam) for VGG models\" would then be overly broad, as it is only validated on one specific configuration.","refs":[{"text":"Fig. 5","type":"figure"}],"weak_types":["measurement","generalization"],"weakness_reason":"The paper's omission of the dataset for the cross-optimizer experiment is a reporting flaw. Moreover, the experiments are limited to a single architecture (VGG19) and a single dataset (likely CIFAR-10, but not stated). Testing on only one combination is insufficient to establish that cross-optimizer transfer is a general property of winning tickets, even for VGG models."},"priors":[{"created_at":"2026-06-12T21:31:49.106382+00:00","id":"gcn_c127ed02f3f94de9::extract_paper_867771291879342656","source_id":"extract_paper_867771291879342656","value":0.4}],"title":"Cross-optimizer transfer experiments tested only VGG19 on an unspecified dataset","type":"claim"},{"content":"The within-distribution transfer experiment uses a single deterministic split of the CIFAR-10 dataset (CIFAR-10a and CIFAR-10b, each containing 25,000 training images with 2,500 images per class). The observed transfer of winning tickets from CIFAR-10a to CIFAR-10b has not been validated on other random splits of CIFAR-10 or on other natural-image datasets such as ImageNet or SVHN.\n      Fig. 2","global_id":"gcn_28af0bbdc68548ff","id":"paper:867771291879342656::P3","kind":"weak_point","metadata":{"failure_mode":"If the specific split CIFAR-10a/10b produced an idiosyncratic favorable result (e.g., due to accidental distribution differences, or sample selection bias), then the conclusion that tickets generalize across samples in general would be unsupported. Even if other splits would also show transfer, without testing, the claim is not justified.","refs":[{"text":"Fig. 2","type":"figure"}],"weak_types":["statistical","generalization"],"weakness_reason":"The experiment lacks replication across multiple random splits, which would be necessary to estimate the variability of the transfer effect and to rule out split-specific artifacts. Many machine learning studies split data randomly to ensure robustness; a single split is weak evidence for a claim about generalization across samples."},"priors":[{"created_at":"2026-06-12T21:31:49.106389+00:00","id":"gcn_28af0bbdc68548ff::extract_paper_867771291879342656","source_id":"extract_paper_867771291879342656","value":0.4}],"title":"Within-distribution transfer validated only on a single CIFAR-10 split","type":"claim"},{"content":"The comparison between global magnitude pruning and layerwise magnitude pruning for winning-ticket discovery was conducted on VGG19 trained on CIFAR-10. Global pruning produced higher test accuracy than layerwise pruning, and under the global schedule deeper convolutional layers were pruned more heavily than early layers. These observations have not been validated on other architectures such as ResNet50 or on other natural-image datasets.\n      Fig. 1","global_id":"gcn_1ab73fec266c44e4","id":"paper:867771291879342656::P4","kind":"weak_point","metadata":{"failure_mode":"If the performance advantage or sparsity pattern does not extend to other architectures, the claim that \"global magnitude pruning outperforms layerwise pruning and results in non-uniform layerwise sparsity (deeper layers pruned more) under global schedules\" would be too strong; it would only be known to hold for VGG19 on CIFAR-10.","refs":[{"text":"Fig. 1","type":"figure"}],"weak_types":["generalization"],"weakness_reason":"The conclusions about pruning methodology are drawn from a single configuration. The sparsity pattern may be architecture-specific (e.g., VGG19 has a specific channel structure; ResNet has skip connections and different depth distributions). The performance advantage of global pruning might not generalize, as the balance between layer sizes varies across architectures."},"priors":[{"created_at":"2026-06-12T21:31:49.106397+00:00","id":"gcn_1ab73fec266c44e4::extract_paper_867771291879342656","source_id":"extract_paper_867771291879342656","value":0.5}],"title":"Global versus layerwise pruning comparison conducted only on VGG19 and CIFAR-10","type":"claim"},{"content":"The analysis of mask information content was performed on VGG19 trained on CIFAR-10. Three mask types were compared: preserved winning-ticket masks, masks permuted only within layers (local permutation), and masks permuted across all layers (global permutation). Locally permuting the mask moderately degraded performance while globally permuting the mask dramatically degraded performance. This analysis has not been extended to other architectures or datasets.\n      Fig. A1","global_id":"gcn_689e6ebe813c4c1a","id":"paper:867771291879342656::P5","kind":"weak_point","metadata":{"failure_mode":"If on other architectures or datasets the performance drop from global permutation is less dramatic or absent, the claim that mask structure carries substantial information (and thus must be randomized for fair baselines) might be overstated or not universally applicable. The recommendation for fair baselines would then need qualification.","refs":[{"text":"Fig. A1","type":"figure"}],"weak_types":["generalization"],"weakness_reason":"The effect of mask permutation on performance could depend on the architecture (e.g., depth, layer sizes) and the dataset (e.g., complexity, number of classes). The paper does not demonstrate that the same pattern holds for ResNet50 or for other datasets like ImageNet."},"priors":[{"created_at":"2026-06-12T21:31:49.106404+00:00","id":"gcn_689e6ebe813c4c1a::extract_paper_867771291879342656","source_id":"extract_paper_867771291879342656","value":0.5}],"title":"Mask information content analysis conducted only on VGG19 and CIFAR-10","type":"claim"},{"content":"For VGG19 trained on Fashion-MNIST, winning tickets sourced from ImageNet, Places365, and CIFAR-100 achieve substantially higher test accuracy at pruning fractions below approximately 80% than winning tickets generated on Fashion-MNIST itself. The Fashion-MNIST-specific tickets at low pruning fractions suffer from severe overfitting (low test accuracy), whereas transferred tickets from larger datasets maintain high accuracy.","global_id":"gcn_e45469c873ff48e0","id":"paper:867771291879342656::H1","kind":"highlight","metadata":{"conclusion_id":"1","credit":"This result guards against the failure mode that transferred tickets might only perform as well as target-specific tickets, or that any positive transfer is merely due to the sparsity-induced regularization that could be achieved with any sparse initialization. Here, transferred tickets actually exceed target-specific performance in a regime where target-specific tickets fail (overfitting), showing that the ticket's initialization contains dataset-independent inductive biases that improve learning beyond what is achievable by the target-specific ticket. This directly supports the conclusion that winning tickets from large source datasets contain generic inductive biases, not just dataset-specific ones. The scope of credit is to provide strong evidence for the qualitative claim of generic inductive bias.","refs":[{"text":"Fig. 3b","type":"figure"}],"role":"highlight","strength_types":["comparative"]},"title":"Transferred tickets outperform target-specific tickets on Fashion-MNIST via regularization","type":"claim"},{"content":"For winning ticket transfer across natural-image datasets (SVHN, Fashion-MNIST, CIFAR-10, CIFAR-100, ImageNet, Places365) with VGG19 and ResNet50, the observed ordering of source dataset effectiveness (ImageNet/Places365 > CIFAR-100 > CIFAR-10 > Fashion-MNIST/SVHN) is consistent across both architectures.","global_id":"gcn_aee4fdc5c5dc459c","id":"paper:867771291879342656::H2","kind":"highlight","metadata":{"conclusion_id":"1","credit":"This consistency across architectures precludes the failure mode that the transfer results are an artifact of a particular architecture's inductive biases. It shows that the generic inductive bias in winning tickets is robust to architectural variations, at least within the tested families. This underwrites the claim that the tickets contain broadly useful properties, strengthening the conclusion that they can transfer across datasets. The scope is to provide strong evidence for the generality of the conclusion beyond a single architecture.","refs":[{"text":"Fig. 3, Fig. 4","type":"figure"}],"role":"highlight","strength_types":["generalization"]},"title":"Transfer pattern consistent across VGG19 and ResNet50","type":"claim"},{"content":"Comparing source dataset transferability across multiple target datasets (SVHN, Fashion-MNIST, CIFAR-10, CIFAR-100, ImageNet, Places365) and two architectures (VGG19 and ResNet50), the ordering of source effectiveness is remarkably consistent: ImageNet/Places365 > CIFAR-100 > CIFAR-10 > Fashion-MNIST/SVHN. This holds across all target datasets.","global_id":"gcn_99969bd7b3374530","id":"paper:867771291879342656::H3","kind":"highlight","metadata":{"conclusion_id":"2","credit":"This result preempts the failure mode that the observed correlations are due to random chance or are specific to a particular target. The regular monotonic ordering across a matrix of source-target pairs provides correlational evidence that is robust and systematic, which is stronger than a single comparison. It underwrites the conclusion that source dataset properties are predictive, though not providing causality. The scope is to provide strong empirical support for the correlational claim.","refs":[{"text":"Fig. 3, Fig. 4","type":"figure"}],"role":"highlight","strength_types":["statistical","measurement"]},"title":"Consistent ordering of source effectiveness across multiple targets and architectures","type":"claim"},{"content":"In the cross-optimizer transfer experiment on VGG19 (dataset not specified in the paper), winning tickets generated with one optimizer (SGD with momentum or Adam) are evaluated with the other optimizer. Across a wide range of pruning fractions, the transferred tickets achieve performance close to tickets generated directly with the target optimizer, especially at high pruning fractions. The experiment controls for architecture and pruning schedule, isolating the optimizer variable.","global_id":"gcn_7e65860943ef43b2","id":"paper:867771291879342656::H4","kind":"highlight","metadata":{"conclusion_id":"3","credit":"The controlled comparison isolates the effect of the optimizer, reducing the risk that other variables confound the transfer effect. The result shows that the winning ticket's inductive bias is not tied to the optimization algorithm used during discovery, at least for this architecture and dataset. This directly supports the conclusion that winning tickets can generalize across optimizers for VGG models. The scope is to show an existence proof for cross-optimizer transfer, though limited.","refs":[{"text":"Fig. 5","type":"figure"}],"role":"highlight","strength_types":["measurement","comparative"]},"title":"Controlled cross-optimizer experiment on VGG19","type":"claim"},{"content":"In the within-distribution transfer experiment (CIFAR-10 split into two halves CIFAR-10a and CIFAR-10b), winning tickets from CIFAR-10a transferred to CIFAR-10b improve test accuracy over random sparse initializations at high pruning fractions for both VGG19 and ResNet50. The use of a disjoint held-out split shows that the ticket's benefit is not due to memorization of training samples.","global_id":"gcn_f5f76650187041f0","id":"paper:867771291879342656::H5","kind":"highlight","metadata":{"conclusion_id":"4","credit":"This result preempts the failure mode that winning tickets only work because they have seen the exact training images during discovery. The use of a disjoint held-out split shows that the initialization helps even on unseen samples from the same distribution. This is a necessary prerequisite for arguing that tickets transfer across different datasets (conclusion 1). The scope is to provide evidence for within-distribution generalization, which supports the broader transfer claims.","refs":[{"text":"Fig. 2","type":"figure"}],"role":"highlight","strength_types":["causal","generalization"]},"title":"Within-distribution transfer to held-out samples for two architectures","type":"claim"},{"content":"Figure 1a shows that global magnitude pruning on VGG19 trained on CIFAR-10 consistently outperforms layerwise pruning across all tested pruning fractions (from 0% pruned to 99.9% pruned). Figure 1b shows that under global pruning, the fraction of pruned weights varies per layer: deeper convolutional layers are pruned more heavily, while the first convolutional layer retains nearly all its weights even at 99.9% overall sparsity.","global_id":"gcn_5bc6e3d40d9047ac","id":"paper:867771291879342656::H6","kind":"highlight","metadata":{"conclusion_id":"5","credit":"This direct empirical comparison demonstrates the superiority of global pruning for this architecture/dataset, showing that global pruning adapts to layer sizes. The pattern of non-uniform sparsity is clearly documented, providing insight into why global pruning works better. This supports the conclusion that global pruning outperforms layerwise pruning, at least in this setting. Without this evidence, the claim would rest on intuition alone.","refs":[{"text":"Fig. 1","type":"figure"}],"role":"highlight","strength_types":["comparative","measurement"]},"title":"Empirical comparison of global vs. layerwise pruning on VGG19/CIFAR-10","type":"claim"},{"content":"Figure A1 compares three mask types (preserved, locally permuted, globally permuted) for VGG19 on CIFAR-10, showing that the preserved mask performs best, locally permuted reduces performance moderately, and globally permuted reduces performance dramatically. This establishes that both layerwise statistics and across-layer mask structure carry information.","global_id":"gcn_7b46b876abf84403","id":"paper:867771291879342656::H7","kind":"highlight","metadata":{"conclusion_id":"6","credit":"This controlled ablation separates the contributions of layerwise versus global mask structure, showing that both levels carry information. This justifies the paper's choice of globally permuted mask as a fair baseline, because it removes both levels of mask information. Without this experiment, the field's standard practice of preserving the mask for random tickets would confound evaluations of winning tickets. The conclusion that mask structure carries substantial information is directly evidenced.","refs":[{"text":"Fig. A1","type":"figure"}],"role":"highlight","strength_types":["comparative","measurement"]},"title":"Ablation of mask types reveals information content at two levels","type":"claim"},{"content":"Using late resetting (1 epoch for small datasets, 3 epochs for ImageNet/Places365) and iterative magnitude pruning (20% per iteration, 30 iterations), the paper successfully generates winning tickets for VGG19 and ResNet50 on all six datasets (Fashion-MNIST, SVHN, CIFAR-10, CIFAR-100, ImageNet, Places365), enabling the transfer experiments.","global_id":"gcn_7f72706648474009","id":"paper:867771291879342656::H8","kind":"highlight","metadata":{"conclusion_id":"7","credit":"The successful replication of the late-resetting recipe demonstrates that the paper's experimental pipeline is sound, and that the tickets used for transfer are genuine winning tickets (i.e., they outperform random sparse baselines). Without this validation, the transfer results could be attributed to suboptimal tickets. The independent confirmation of prior work's recipe provides a reliable foundation for the transfer experiments. The scope is to validate the methodology.","role":"highlight","strength_types":["computational","external"]},"title":"Successful replication of late-resetting for large-scale winning tickets","type":"claim"},{"global_id":"gfac_23a9dc72216645eb","id":"lfac_38ad8d064f6577f1","kind":"reasoning_steps","metadata":{"premise_roles":{"paper:867771291879342656::H1":"highlight","paper:867771291879342656::H2":"highlight"}},"steps":[{"reasoning":"Define \"winning ticket\" as a sparse sub-network initialization which, when trained in isolation from its preserved initial parameter values, attains test accuracy comparable to the full over-parameterized network; define \"random ticket\" as a sparse sub-network with the same sparsity level whose preserved weights are re-drawn from the original initialization distribution and whose pruning mask may be randomized (see later steps for mask types). Cite the lottery ticket hypothesis as the conceptual foundation for this definition. \n[7]","step_id":"1"},{"reasoning":"Define \"iterative magnitude pruning\" as a procedure that repeatedly alternates training to convergence and removing the smallest-magnitude weights, pruning a fixed fraction of the remaining parameters at each iteration; in this work the iterative pruning fraction per iteration is $0.2$ (i.e., $20\\%$ of remaining parameters removed per pruning iteration). Note that magnitude pruning (pruning by weight magnitude) was originally proposed in prior pruning work. \n[12]","step_id":"2"},{"reasoning":"Define \"late resetting\" as resetting the remaining (unpruned) weights to their values at some early training iteration $k$ (with $k$ much smaller than the total number of training iterations) rather than to the parameters at iteration $0$; late resetting has been found to improve winning-ticket recovery in large models. In these experiments, late resetting values used were: reset to parameters after 1 epoch for Fashion-MNIST, SVHN, CIFAR-10, and CIFAR-100, and reset to parameters after 3 epochs for ImageNet and Places365. \n[8]","step_id":"3"},{"reasoning":"Describe the experimental procedure used to evaluate cross-dataset transfer: generate a winning ticket by iterative magnitude pruning (pruning fraction per iteration $0.2$ up to 30 iterations, with late resetting to early-iteration parameters) on a source dataset for a fixed network architecture (either VGG19 or ResNet50), then transfer that sparse initialization to a target dataset by (a) excluding and randomly reinitializing the final linear classification layer if necessary to accommodate a different number of output classes, (b) training the sparse subnetwork from the preserved initialization on the target dataset to convergence, and (c) comparing resulting test accuracy to (i) a random ticket baseline and (ii) a winning ticket discovered directly on the target dataset. Training hyperparameters (learning-rate schedules, number of epochs) were matched per model family during comparisons. \nFig. 3","step_id":"4"},{"reasoning":"Report that, across experiments transferring winning tickets from large, complex natural-image source datasets (ImageNet and Places365, and to a lesser extent CIFAR-100) to many natural-image target datasets (SVHN, Fashion-MNIST, CIFAR-10, CIFAR-100, ImageNet, Places365), the transferred winning-ticket initializations frequently achieved test accuracies on the target tasks that were close to the accuracies obtained by winning tickets discovered directly on those target datasets; this empirical result is summarized by the collection of source-vs-target curves showing that ImageNet- and Places365-sourced tickets attain performance similar to target-specific tickets across a wide range of pruning fractions. \nFig. 3","step_id":"5"},{"reasoning":"State that the transferability was observed across a wide range of pruning fractions, including very high sparsity: VGG19 transferred tickets maintained small decreases in accuracy even when $99.9\\%$ of weights were pruned (i.e., only $0.1\\%$ of parameters remaining), whereas ResNet50 exhibited a sharper degradation when only approximately $5\\text{-}10\\%$ of weights remained. This supports the claim that transfer occurs even at extreme sparsity levels, subject to architecture-dependent pruning cliffs. \nFig. 4","step_id":"6"},{"reasoning":"Provide the specific observation that larger / more class-rich source datasets produced stronger cross-dataset transfer: tickets sourced from ImageNet and Places365 produced the most consistently competitive transfer performance across target datasets; CIFAR-100 tickets generalized better than CIFAR-10 tickets despite both having $50{,}000$ training examples, indicating that source dataset complexity beyond mere sample count improves transfer. This observation is explicitly discussed in the results and illustrated by the CIFAR-10 vs. CIFAR-100 comparisons in the transfer plots. \nFig. 3","step_id":"7"},{"reasoning":"Note that the experimental protocol used VGG19 and ResNet50 architectures (VGG19 with removed fully-connected layers and a global-average-pool to final linear layer; ResNet50 in standard block configuration) and matched training schedules per architecture family (VGG19 trained for 160 epochs with learning-rate drops at epochs 80 and 120; ResNet50 trained for 90 epochs with learning-rate drops at epochs 50, 65, and 80), ensuring that transfer comparisons held architecture and training schedule consistent across source and target evaluations. These architectural and training details contextualize the reported transfer performance. \n[30]","step_id":"8"},{"reasoning":"Conclude from the preceding experimental definitions and empirical results that winning-ticket initializations discovered by iterative magnitude pruning (iterative pruning rate $0.2$, up to 30 pruning iterations; late resetting to early training iterations) on large, complex natural-image source datasets (ImageNet and Places365, and to a lesser extent CIFAR-100) produce sparse initializations that, when used to train the same architecture on other natural-image target datasets (SVHN, Fashion-MNIST, CIFAR-10, CIFAR-100, ImageNet, Places365), frequently achieve test accuracies on the target tasks that are close to accuracies obtained by winning tickets discovered directly on those targets, with transferability observed across a wide range of pruning fractions and stronger transfer from larger / more class-rich sources. \nFig. 3","step_id":"9"}],"subtype":"noisy_and","type":"factor"},{"global_id":"gfac_c69ff580f57d4fff","id":"lfac_cb96d1b77e42b35b","kind":"reasoning_steps","metadata":{"premise_roles":{"paper:867771291879342656::H3":"highlight","paper:867771291879342656::P1":"weak_point"}},"steps":[{"reasoning":"Define \"source dataset scale\" as the size of the training set measured by the number of training examples and define \"number of classes\" as the cardinality of the output label set for the classification task; both are properties of a dataset that can influence representational demands placed on a model.","step_id":"1"},{"reasoning":"State the empirical finding that winning tickets generated on larger source datasets (larger in number of training examples and/or number of classes) transferred substantially better to novel target datasets than tickets discovered on smaller source datasets; this trend was observed consistently across the set of natural-image datasets considered (Fashion-MNIST, SVHN, CIFAR-10, CIFAR-100, ImageNet, Places365). The summary claim appears in the Results and Discussion where larger, more complex datasets produced more generic winning tickets. \nFig. 3","step_id":"2"},{"reasoning":"Provide the counterexample used to show that the effect is not solely explained by raw training-set size: compare CIFAR-10 and CIFAR-100, which both have $50{,}000$ total training examples, but differ in number of classes (CIFAR-10 has $10$ classes, CIFAR-100 has $100$ classes); empirically, winning tickets generated on CIFAR-100 generalized better across target datasets than those generated on CIFAR-10, including transfers to simple datasets such as Fashion-MNIST and SVHN. This comparison isolates number of classes as an independent predictor of transferability beyond raw sample count. \nFig. 3","step_id":"3"},{"reasoning":"Note that the authors explicitly state that ImageNet- and Places365-derived tickets produced the most consistently competitive transfer performance across all targets, reinforcing that both larger training-set size and greater task complexity (many classes, diverse images) predict stronger generalization of winning tickets. \nFig. 3","step_id":"4"},{"reasoning":"Conclude that, based on the experimental comparisons and the CIFAR-10 vs CIFAR-100 controlled contrast, winning tickets discovered on larger source datasets—both in terms of number of training examples and number of output classes—transfer substantially better to novel target datasets than tickets discovered on smaller source datasets, and that this difference is not solely explained by raw training-set size because datasets with equal sample sizes but different class counts produced different transfer outcomes.","step_id":"5"}],"subtype":"noisy_and","type":"factor"},{"global_id":"gfac_44b4164b33d2433e","id":"lfac_666bfce3ddeaaf51","kind":"reasoning_steps","metadata":{"premise_roles":{"paper:867771291879342656::H4":"highlight","paper:867771291879342656::P2":"weak_point"}},"steps":[{"reasoning":"Define the two optimizers used: \"SGD with momentum\" means stochastic gradient descent with momentum coefficient $0.9$, learning rate $0.1$, and weight decay $0.0001$ for the authors' SGD experiments; \"Adam\" denotes the Adam optimizer with learning rate $0.0003$, betas $(0.9,0.999)$, and weight decay $0.0001$ for the authors' Adam experiments. These hyperparameter values are those used in the experiments. \n[16]","step_id":"1"},{"reasoning":"Describe the experimental procedure for optimizer transfer: generate winning tickets using one optimizer (either SGD with momentum or Adam) on a source configuration (architecture and dataset) using iterative magnitude pruning with late resetting, then evaluate the preserved initialization by training the sparse subnetwork on the same dataset and architecture but using the alternate optimizer; compare the transferred-ticket performance to tickets discovered under the target optimizer and to random-ticket baselines.","step_id":"2"},{"reasoning":"Report the empirical result that, for VGG models, winning-ticket initializations generated with one optimizer generalize to training with a different optimizer: VGG19 tickets found using either SGD with momentum or Adam, when re-used with the alternate optimizer on target datasets, achieve high performance that is comparable to tickets discovered under the target optimizer. This result is summarized by the plotted curves showing similar final accuracies for tickets generated under each optimizer when evaluated with the other. \nFig. 5","step_id":"3"},{"reasoning":"Describe and report the optimizer-dependent nuance observed: tickets transferred from SGD to Adam sometimes under-perform random tickets at low pruning fractions (i.e., when few weights have been pruned), but these same transferred tickets outperform random tickets at high pruning fractions; this behavior is explicitly shown in the Adam evaluation curves for VGG models. \nFig. 5","step_id":"4"},{"reasoning":"Conclude that, from the described experiments and observed performance curves, winning-ticket initializations generated with one optimizer generalize to training with a different optimizer for VGG models, with some optimizer-dependent performance nuances (SGD-to-Adam under-performance at low pruning fractions but advantage at high pruning fractions).","step_id":"5"}],"subtype":"noisy_and","type":"factor"},{"global_id":"gfac_e3055133cc914a46","id":"lfac_745c4fd9e6ca523f","kind":"reasoning_steps","metadata":{"premise_roles":{"paper:867771291879342656::H5":"highlight","paper:867771291879342656::P3":"weak_point"}},"steps":[{"reasoning":"Define \"within-distribution transfer\" as transferring a winning-ticket initialization from one subset of a dataset to a disjoint subset drawn from the same data distribution; in the experiments, CIFAR-10 was split into CIFAR-10a and CIFAR-10b, each containing $25{,}000$ training examples and $2{,}500$ images per class.","step_id":"1"},{"reasoning":"Describe the experimental protocol for this within-distribution test: generate a winning ticket on CIFAR-10a by iterative magnitude pruning with late resetting, then evaluate that winning ticket by training the preserved sparse initialization on the disjoint subset CIFAR-10b and compare performance to a random ticket baseline and to a winning ticket generated directly on CIFAR-10b. Experiments were performed for both VGG19 and ResNet50 architectures with six random seeds per curve. \nFig. 2","step_id":"2"},{"reasoning":"Report empirical observations: the CIFAR-10a winning ticket generalized well to CIFAR-10b for both VGG19 and ResNet50—transferred tickets improved training on the held-out subset relative to random sparse initializations—demonstrating that winning tickets are not simply memorizing specific training samples but capture initialization structure that benefits other samples from the same distribution. \nFig. 2","step_id":"3"},{"reasoning":"Report the architecture-dependent caveat: ResNet50 showed sensitivity at low pruning fractions, occasionally under-performing random tickets when few weights are pruned, indicating that within-distribution transfer can be architecture- and pruning-fraction-dependent. This behavior is explicitly observed in the ResNet50 CIFAR-10a-to-10b transfer curves where transferred tickets under-perform random tickets at low pruning. \nFig. 2","step_id":"4"},{"reasoning":"Conclude that a winning ticket discovered on one subset of a dataset transfers to a disjoint subset from the same data distribution and improves training on that held-out subset relative to random sparse initializations, with the within-distribution transfer holding for both VGG19 and ResNet50, though ResNet50 showed sensitivity at low pruning fractions.","step_id":"5"}],"subtype":"noisy_and","type":"factor"},{"global_id":"gfac_c3044cce8fd949da","id":"lfac_58096a5ebe94e02b","kind":"reasoning_steps","metadata":{"premise_roles":{"paper:867771291879342656::H6":"highlight","paper:867771291879342656::P4":"weak_point"}},"steps":[{"reasoning":"Define \"layerwise pruning\" as pruning that removes the same fraction of parameters within each layer independently, and define \"global pruning\" as pooling all weights across layers and removing the smallest-magnitude weights across the entire network, allowing different layers to have different resulting sparsities.","step_id":"1"},{"reasoning":"State the experimental comparison: the authors compared performance of winning tickets found using global magnitude pruning to those found using layerwise pruning on CIFAR-10 with VGG19, plotting test accuracy as a function of fraction of pruned weights and comparing against random-ticket baselines. The comparison shows that global pruning yields higher-performing sparse subnetworks than layerwise pruning at matched overall sparsity levels. \nFig. 1","step_id":"2"},{"reasoning":"Report the observed non-uniformity of layerwise sparsity under global magnitude pruning: when applying global pruning schedules, deeper convolutional layers were pruned more heavily while early layers, notably the first convolutional layer, retained a much larger fraction of their parameters. This pattern is shown quantitatively by plotting, per convolutional layer, the ratio of global pruning rate to layerwise pruning rate at multiple pruning iterations, which indicates higher relative pruning in deeper layers and relative preservation of early layers. \nFig. 1","step_id":"3"},{"reasoning":"Provide the intuitive justification and concrete numerical example offered by the authors: because deeper layers often contain many more parameters than early layers, applying a constant pruning rate per layer (layerwise) would disproportionately harm early layers that have few absolute parameters; for instance, the first layer of VGG19 contains $1792$ parameters, so pruning that layer at a $99\\%$ rate would leave only $18$ parameters, severely reducing expressivity; global pruning avoids this by pruning relatively more where parameter counts are large and relatively less where parameter counts are small.","step_id":"4"},{"reasoning":"Conclude from the empirical comparison and layerwise-pruning statistics that global magnitude pruning outperforms layerwise pruning in producing higher-performing winning tickets, and that global pruning induces non-uniform layerwise sparsity with deeper layers pruned more and early layers, especially the first convolutional layer, retaining a larger fraction of parameters. \nFig. 1","step_id":"5"}],"subtype":"noisy_and","type":"factor"},{"global_id":"gfac_d6b5714cb5074f58","id":"lfac_c6ff5645cff61bd7","kind":"reasoning_steps","metadata":{"premise_roles":{"paper:867771291879342656::H7":"highlight","paper:867771291879342656::P5":"weak_point"}},"steps":[{"reasoning":"Define the \"pruning mask\" (or \"mask\") as the binary indicator over model parameters where a value of $1$ indicates a preserved (unpruned) weight and $0$ indicates a removed (pruned) weight; distinguish three mask conditions used in experiments: (a) \"preserved mask\" meaning the exact mask found by the winning-ticket discovery process is used unchanged for the random ticket, (b) \"locally permuted mask\" meaning the mask is randomly permuted within each layer (so layerwise sparsity statistics are preserved but intra-layer structure is randomized), and (c) \"globally permuted mask\" meaning the mask is randomly permuted across all layers (so neither layerwise statistics nor intra-layer structure is preserved).","step_id":"1"},{"reasoning":"Describe the experiment comparing these mask types: on CIFAR-10 the authors evaluated performance of a winning ticket (preserved mask), a random-ticket using locally permuted masks, and a random-ticket using globally permuted masks, holding other aspects of initialization constant; performance was measured across pruning fractions with six random seeds per curve. \nFig. A1","step_id":"2"},{"reasoning":"Report empirical findings from the mask-comparison experiment: the winning ticket outperformed all random tickets; locally permuting masks damaged performance somewhat relative to the preserved mask, whereas globally permuting the mask resulted in dramatically worse performance relative to both the preserved and locally permuted masks. These results indicate that layerwise mask statistics and cross-layer mask structure both carry informative inductive bias discovered during pruning. \nFig. A1","step_id":"3"},{"reasoning":"State the methodological implication drawn by the authors: because preserving the layerwise mask structure transfers information from the winning ticket to the random-ticket baseline, a fair \"random ticket\" baseline should randomize both weight values and mask structure (i.e., perform a global permutation of the mask) so that no layerwise statistics or cross-layer mask information is inadvertently preserved from the discovered winning ticket. This recommendation is based on the observed large performance gap when masks are globally permuted versus preserved. \nFig. A1","step_id":"4"},{"reasoning":"Conclude that the structure of the pruning mask contains substantial information useful for training sparse networks and that fair random baselines must randomize mask structure (global permutation), because locally permuting a mask degrades performance moderately while globally permuting the mask degrades performance dramatically.","step_id":"5"}],"subtype":"noisy_and","type":"factor"},{"global_id":"gfac_4b1e13fb2075448a","id":"lfac_c9fb5d9571d5a824","kind":"reasoning_steps","metadata":{"premise_roles":{"paper:867771291879342656::H8":"highlight"}},"steps":[{"reasoning":"Specify the iterative magnitude-pruning schedule used to obtain winning tickets: an iterative pruning fraction per iteration of $0.2$ (i.e., $20\\%$ of remaining parameters removed each iteration) and up to $30$ pruning iterations in total; after the sixth pruning iteration, model performance was evaluated every third pruning iteration. These pruning hyperparameters were applied across the experiments reported.","step_id":"1"},{"reasoning":"State the late resetting choices made for different datasets: for Fashion-MNIST, SVHN, CIFAR-10, and CIFAR-100 winning tickets, weights were reset to their values after $1$ epoch of training; for ImageNet and Places365 winning tickets, weights were reset to their values after $3$ epochs of training. These late resetting values were used consistently in the ticket-discovery pipeline.","step_id":"2"},{"reasoning":"Provide the learning-rate annealing and other training hyperparameters matched per model family: for VGG19 models, training ran for $160$ epochs with learning-rate drops by a factor of $10$ at epochs $80$ and $120$; for ResNet50 models, training ran for $90$ epochs with learning-rate drops by a factor of $10$ at epochs $50$, $65$, and $80$; for models trained with SGD the base learning rate was $0.1$ with momentum $0.9$ and weight decay $0.0001$, and for models trained with Adam the learning rate was $0.0003$ with betas $0.9$ and $0.999$ and weight decay $0.0001$. Batch sizes and distributed-training details differed by dataset scale as described in the experimental methods. \nFig. 3","step_id":"3"},{"reasoning":"Note the motivation given by the authors for these settings: iterative pruning with small per-iteration removal (here $20\\%$) helps to de-noise the pruning process and produces substantially better pruned models and winning tickets than one-shot large-fraction pruning, and late resetting to an early training iteration $k$ improves winning-ticket recovery and removes the need for learning-rate warmup in large models. These considerations motivated the chosen schedule for the large-model / large-dataset regime studied. \n[8]","step_id":"4"},{"reasoning":"Conclude that, for obtaining competitive winning tickets in the large-model / large-dataset regime used here, the authors used an iterative magnitude-pruning schedule with pruning fraction per iteration $0.2$ over up to $30$ iterations combined with late resetting to parameters at a small early training iteration; the explicit late resetting settings were $1$ epoch for Fashion-MNIST, SVHN, CIFAR-10 and CIFAR-100, and $3$ epochs for ImageNet and Places365, and learning-rate annealing schedules and other hyperparameters were matched per model family (VGG19 trained $160$ epochs with LR drops at epochs $80$ and $120$; ResNet50 trained $90$ epochs with LR drops at epochs $50$, $65$, and $80$). \n[8]","step_id":"5"}],"subtype":"noisy_and","type":"factor"}]},"open_questions":[{"content":"Several scientifically meaningful limitations and open issues remain. First, generating winning-ticket initializations remains computationally expensive because the iterative-pruning discovery requires many serial full-model retrainings (up to 30 iterations in these experiments), and this cost is accentuated when the most transferable tickets are found on large datasets (ImageNet/Places365), limiting practical reuse; methods to discover transferable tickets with substantially lower compute are needed. Second, transfer was tested only within the single domain and task family of natural-image classification and for fixed network topologies; it remains unresolved whether winning-ticket initializations transfer across domains (e.g., non-image data, multimodal inputs), across fundamentally different tasks (e.g., detection, segmentation, regression), or across architectures with different topologies (the present results hold when a small number of final-layer parameters are reinitialized, but do not establish cross-architecture portability). Third, although transferred tickets often approach the performance of target-specific tickets, there is frequently a residual gap (especially for tickets discovered on small source datasets), and it is unresolved which precise aspects of winning tickets are dataset-dependent versus dataset-independent—identifying the structural or statistical properties of masks and initial values that confer generic inductive bias is an open problem. Fourth, the study leaves open whether alternative pruning criteria or mask-parameterization schemes could (a) produce tickets that transfer even more broadly, or (b) be parameterized compactly so that a distribution over transferable tickets could be sampled without costly pruning searches. Finally, understanding mechanistically what makes winning tickets \"special\"—which features of the sparse initialization enable particular optima to be reached under diverse training regimes—remains an open theoretical and empirical question critical to the design of principled, broadly useful initialization methods.","global_id":"gcn_52f984a488414a9a","id":"paper:867771291879342656::open_question"}],"paper":{"area":"arXiv-Statistics, Information and Computing Sciences, Machine Learning","authors":"Ari S. Morcos | Haonan Yu | Michela Paganini | Yuandong Tian","available_online":"","cover_date_start":"2019-06-06","created_at":"2023-05-23T06:13:18+08:00","doi":"10.48550/arXiv.1906.02773","en_title":"One ticket to win them all: generalizing lottery ticket initializations across datasets and optimizers","id":"867771291879342656","keywords":"","package_id":"paper:867771291879342656","publication_date":"2019-06-06","publication_id":"108580","publication_name":"Machine Learning _ Statistics.stat.ML","research_categories":"[\"Information and Computing Sciences\", \"Machine Learning\"]","zh_title":"一张中奖彩票，通吃所有任务：跨数据集和优化器泛化中奖彩票初始化"}};
