tickets at low pruning fractions.","excerptZh":"随后我们询问，使用 CIFAR-10a 产生的彩票能否提高 CIFAR-10b 上的性能。对于 ResNet50，两类彩票在低剪枝比例下都不如随机彩票。","supports":"paper:867771291879342656::conclusion_4","challenges":"paper:867771291879342656::conclusion_4（对“无条件成立”的宽泛版本构成限定）","sourceFile":"01_paper_sample_one_ticket/clean_claims_and_relations.json; paper_text_ocr_cleaned.md","jsonPath":"$.assertions[?(@.id==\"A017\")]","inFormalIr":"否","irId":"","reviewStatus":"需核对图中读数","notes":""},{"stableId":"OTWTA-CLM-A018","sourceLayer":"clean_claims","originalId":"A018","parentFactorId":"","canonicalConclusionId":"OTWTA-C05","proposition":"在CIFAR-10上训练VGG19进行中奖彩票发现的量级剪枝过程中，跨所有层全局排序权重并全局剪除最小量级的权重，比按每层固定比例剪枝（“逐层剪枝”）产生了性能更高的稀疏子网络。","sourceTextEn":"When performing magnitude pruning for winning-ticket discovery on VGG19 trained on CIFAR-10, globally ranking weights across all layers and pruning the smallest-magnitude weights globally yields higher-performing sparse subnetworks than pruning a fixed fraction per layer (\"layerwise pruning\").","workingTextZh":"在CIFAR-10上训练VGG19进行中奖彩票发现的量级剪枝过程中，跨所有层全局排序权重并全局剪除最小量级的权重，比按每层固定比例剪枝（“逐层剪枝”）产生了性能更高的稀疏子网络。","type":"观察","epistemicStatus":"直接/近直接经验陈述","argumentRole":"比较观测","paperSection":"§3.1 彩票假说——全局剪枝","figure":"Fig. 1","ocrLines":"L77-L80","excerpt":"We observed that global pruning leads to higher performance than local pruning. ... Global magnitude pruning preferentially prunes weights in deeper layers, leaving the first layer in particular relatively unpruned.","excerptZh":"我们观察到，全局剪枝比逐层剪枝取得更高性能。全局量级剪枝倾向于更多剪除深层权重，而第一层尤其保留了较多参数。","supports":"paper:867771291879342656::conclusion_5","challenges":"","sourceFile":"01_paper_sample_one_ticket/clean_claims_and_relations.json; paper_text_ocr_cleaned.md","jsonPath":"$.assertions[?(@.id==\"A018\")]","inFormalIr":"否","irId":"","reviewStatus":"需核对图中读数","notes":""},{"stableId":"OTWTA-CLM-A019","sourceLayer":"clean_claims","originalId":"A019","parentFactorId":"","canonicalConclusionId":"OTWTA-C05","proposition":"在全局量级剪枝下，各层的剪枝比例存在差异：更深的卷积层被剪除得更多，而较早的层（尤其是第一个卷积层）保留了远大比例的参数。","sourceTextEn":"Under global magnitude pruning the pruning fractions vary across layers: deeper convolutional layers are pruned more heavily while early layers (notably the first convolutional layer) retain a much larger fraction of their parameters.","workingTextZh":"在全局量级剪枝下，各层的剪枝比例存在差异：更深的卷积层被剪除得更多，而较早的层（尤其是第一个卷积层）保留了远大比例的参数。","type":"观察","epistemicStatus":"直接/近直接经验陈述","argumentRole":"结构观测","paperSection":"§3.1 彩票假说——全局剪枝","figure":"Fig. 1","ocrLines":"L77-L80","excerpt":"We observed that global pruning leads to higher performance than local pruning. ... Global magnitude pruning preferentially prunes weights in deeper layers, leaving the first layer in particular relatively unpruned.","excerptZh":"我们观察到，全局剪枝比逐层剪枝取得更高性能。全局量级剪枝倾向于更多剪除深层权重，而第一层尤其保留了较多参数。","supports":"paper:867771291879342656::conclusion_5","challenges":"","sourceFile":"01_paper_sample_one_ticket/clean_claims_and_relations.json; paper_text_ocr_cleaned.md","jsonPath":"$.assertions[?(@.id==\"A019\")]","inFormalIr":"否","irId":"","reviewStatus":"需核对图中读数","notes":""},{"stableId":"OTWTA-CLM-A020","sourceLayer":"clean_claims","originalId":"A020","parentFactorId":"","canonicalConclusionId":"OTWTA-C06","proposition":"对于在CIFAR-10上训练的VGG19，剪枝掩码的结构包含了对训练稀疏网络有用的大量信息。","sourceTextEn":"For VGG19 trained on CIFAR-10, the structure of the pruning mask contains substantial information useful for training sparse networks.","workingTextZh":"对于在CIFAR-10上训练的VGG19，剪枝掩码的结构包含了对训练稀疏网络有用的大量信息。","type":"结论","epistemicStatus":"作者归纳或解释","argumentRole":"结论分解","paperSection":"§3.1 随机掩码; Appendix A.2 随机化掩码","figure":"Fig. A1（并参照 Fig. 1）","ocrLines":"L83; L242-L261（核心：L258-L261）","excerpt":"While locally permuting masks damaged performance somewhat, globally permuting the mask results in dramatically worse performance, suggesting that the layerwise statistics derived from training the over-parameterized model are very informative.","excerptZh":"层内置换掩码会在一定程度上损害性能，而全局置换掩码会使性能显著恶化，这表明从过参数化模型训练中得到的逐层统计包含大量信息。","supports":"paper:867771291879342656::conclusion_6","challenges":"","sourceFile":"01_paper_sample_one_ticket/clean_claims_and_relations.json; paper_text_ocr_cleaned.md","jsonPath":"$.assertions[?(@.id==\"A020\")]","inFormalIr":"否","irId":"","reviewStatus":"已定位原文；待句级复核","notes":""},{"stableId":"OTWTA-CLM-A021","sourceLayer":"clean_claims","originalId":"A021","parentFactorId":"","canonicalConclusionId":"OTWTA-C06","proposition":"对于在CIFAR-10上训练的VGG19，局部置换中奖彩票掩码（即仅在每一层内部对掩码进行置换）会使性能出现中等程度的下降，而全局置换中奖彩票掩码（即跨所有层对掩码进行置换）则会使性能大幅下降。","sourceTextEn":"For VGG19 trained on CIFAR-10, locally permuting a winning-ticket mask (permuting the mask only within each layer) degrades performance moderately, while globally permuting the winning-ticket mask (permuting the mask across all layers) degrades performance dramatically.","workingTextZh":"对于在CIFAR-10上训练的VGG19，局部置换中奖彩票掩码（即仅在每一层内部对掩码进行置换）会使性能出现中等程度的下降，而全局置换中奖彩票掩码（即跨所有层对掩码进行置换）则会使性能大幅下降。","type":"观察","epistemicStatus":"直接/近直接经验陈述","argumentRole":"消融观测","paperSection":"§3.1 随机掩码; Appendix A.2 随机化掩码","figure":"Fig. A1（并参照 Fig. 1）","ocrLines":"L83; L242-L261（核心：L258-L261）","excerpt":"While locally permuting masks damaged performance somewhat, globally permuting the mask results in dramatically worse performance, suggesting that the layerwise statistics derived from training the over-parameterized model are very informative.","excerptZh":"层内置换掩码会在一定程度上损害性能，而全局置换掩码会使性能显著恶化，这表明从过参数化模型训练中得到的逐层统计包含大量信息。","supports":"paper:867771291879342656::conclusion_6","challenges":"","sourceFile":"01_paper_sample_one_ticket/clean_claims_and_relations.json; paper_text_ocr_cleaned.md","jsonPath":"$.assertions[?(@.id==\"A021\")]","inFormalIr":"否","irId":"","reviewStatus":"需核对图中读数","notes":""},{"stableId":"OTWTA-CLM-A022","sourceLayer":"clean_claims","originalId":"A022","parentFactorId":"","canonicalConclusionId":"OTWTA-C06","proposition":"剪枝掩码的结构本身包含了对训练稀疏网络有用的重要信息。","sourceTextEn":"The structure of the pruning mask contains substantial i 文；待句级复核","notes":""},{"stableId":"OTWTA-CLM-A024","sourceLayer":"clean_claims","originalId":"A024","parentFactorId":"","canonicalConclusionId":"OTWTA-C06","proposition":"用于评估中奖彩票初始化的公平“随机彩票”基线，应当同时随机化权重值和掩码结构（全局置换）。","sourceTextEn":"A fair \"random ticket\" baseline for evaluating a winning-ticket initialization should randomize both weight values and mask structure (global permutation).","workingTextZh":"用于评估中奖彩票初始化的公平“随机彩票”基线，应当同时随机化权重值和掩码结构（全局置换）。","type":"结论","epistemicStatus":"作者归纳或解释","argumentRole":"方法学建议","paperSection":"§3.1 随机掩码; Appendix A.2 随机化掩码","figure":"Fig. A1（并参照 Fig. 1）","ocrLines":"L83; L242-L261（核心：L258-L261）","excerpt":"While locally permuting masks damaged performance somewhat, globally permuting the mask results in dramatically worse performance, suggesting that the layerwise statistics derived from training the over-parameterized model are very informative.","excerptZh":"层内置换掩码会在一定程度上损害性能，而全局置换掩码会使性能显著恶化，这表明从过参数化模型训练中得到的逐层统计包含大量信息。","supports":"paper:867771291879342656::conclusion_6","challenges":"","sourceFile":"01_paper_sample_one_ticket/clean_claims_and_relations.json; paper_text_ocr_cleaned.md","jsonPath":"$.assertions[?(@.id==\"A024\")]","inFormalIr":"否","irId":"","reviewStatus":"已定位原文；待句级复核","notes":""},{"stableId":"OTWTA-CLM-A025","sourceLayer":"clean_claims","originalId":"A025","parentFactorId":"","canonicalConclusionId":"OTWTA-C07","proposition":"为了在自然图像分类的大模型、大数据集范围内获得具有竞争力的中奖彩票，采用每轮剪枝比例为0.2（剩余参数的20%）、最多进行30轮迭代的迭代量级剪枝方案，并结合将参数延迟重置到训练早期某个较小迭代步的做法，能够产生有效的中奖彩票；所采用的延迟重置设置为：对于Fashion-MNIST、SVHN、CIFAR-10和CIFAR-100，重置到第1个epoch后的参数，对于ImageNet和Places365，重置到第3个epoch后的参数。学习率退火方案和其他超参数按模型系列进行了匹配（VGG19训练160个epoch，在第80和第120个epoch进行学习率下降；ResNet50训练90个epoch，在第50、65和80个epoch进行学习率下降）。","sourceTextEn":"For obtaining competitive winning tickets in the large-model and large-dataset regime of natural-image classification, an iterative magnitude-pruning schedule with pruning fraction per iteration 0.2 (20% of remaining parameters) over up to 30 iterations combined with late resetting to parameters at a small early training iteration produced effective winning tickets; late resetting settings used were resetting to the parameters after 1 epoch for Fashion-MNIST, SVHN, CIFAR-10 and CIFAR-100, and after 3 epochs for ImageNet and Places365. Learning-rate annealing schedules and other hyperparameters were matched per model family (VGG19 trained 160 epochs with LR drops at epochs 80 and 120; ResNet50 trained 90 epochs with LR drops at epochs 50, 65, and 80).","workingTextZh":"为了在自然图像分类的大模型、大数据集范围内获得具有竞争力的中奖彩票，采用每轮剪枝比例为0.2（剩余参数的20%）、最多进行30轮迭代的迭代量级剪枝方案，并结合将参数延迟重置到训练早期某个较小迭代步的做法，能够产生有效的中奖彩票；所采用的延迟重置设置为：对于Fashion-MNIST、SVHN、CIFAR-10和CIFAR-100，重置到第1个epoch后的参数，对于ImageNet和Places365，重置到第3个epoch后的参数。学习率退火方案和其他超参数按模型系列进行了匹配（VGG19训练160个epoch，在第80和第120个epoch进行学习率下降；ResNet50训练90个epoch，在第50、65和80个epoch进行学习率下降）。","type":"前提","epistemicStatus":"实验方法前提","argumentRole":"实验设置/方法前提","paperSection":"§3.1 迭代剪枝 / 延迟重置; Appendix A.1","figure":"—","ocrLines":"L71-L74; L231-L240","excerpt":"For all models, an iterative pruning rate of 0.2 was used and 30 pruning iterations were performed. ... For Fashion-MNIST, SVHN, CIFAR-10 and CIFAR-100 winning tickets, late resetting of 1 epoch was used. For ImageNet and Places365 winning tickets, late resetting of 3 epochs was used.","excerptZh":"所有模型均采用每轮 0.2 的迭代剪枝率并执行 30 轮剪枝。Fashion-MNIST、SVHN、CIFAR-10 和 CIFAR-100 彩票使用 1 个 epoch 的延迟重置；ImageNet 和 Places365 彩票使用 3 个 epoch 的延迟重置。","supports":"paper:867771291879342656::conclusion_7","challenges":"","sourceFile":"01_paper_sample_one_ticket/clean_claims_and_relations.json; paper_text_ocr_cleaned.md","jsonPath":"$.assertions[?(@.id==\"A025\")]","inFormalIr":"否","irId":"","reviewStatus":"已定位原文；待句级复核","notes":""},{"stableId":"OTWTA-GCON-C01","sourceLayer":"graph_conclusion","originalId":"paper:867771291879342656::conclusion_1","parentFactorId":"lfac_38ad8d064f6577f1","canonicalConclusionId":"OTWTA-C01","proposition":"在大型、复杂的自然图像源数据集（ImageNet、Places365，以及较弱程度上的 CIFAR-100）上，通过迭代量级剪枝发现的中奖彩票初始化（每轮剪枝率 0.2，最多 30 轮，并延迟重置到训练早期参数），用于在其他自然图像目标数据集（SVHN、Fashion-MNIST、CIFAR-10、CIFAR-100、ImageNet、Places365）上训练相同的 VGG19 或 ResNet50 架构时，往往能取得接近直接在目标数据集上发现的彩票的测试准确率。这种迁移在广泛的剪枝比例下都能观察到，包括极高稀疏度；大型、类别更丰富的源数据集通常比小型源数据集产生更强的跨数据集迁移，例如训练样本数相同的 CIFAR-100 彩票比 CIFAR-10 彩票泛化更好。","sourceTextEn":"Winning-ticket initializations discovered by iterative magnitude pruning (iterative pruning rate 0.2, up to 30 pruning iterations; late resetting to early training iterations) on large, complex natural-image source datasets (ImageNet and Places365, and to a lesser extent CIFAR-100) produce sparse initializations that, when used to train a VGG19 or ResNet50 architecture on other natural-image target datasets (SVHN, Fashion-MNIST, CIFAR-10, CIFAR-100, ImageNet, Places365), frequently achieve test accuracies on the target tasks that are close to the accuracies obtained by winning tickets discovered directly on those target datasets. The transferability is observed across a wide range of pruning fractions (including very high sparsity), and larger / more class-rich source datasets produced stronger cross-dataset transfer than smaller sources (e.g., CIFAR-100 tickets generalize better than CIFAR-10 tickets despite both having 50,000 training examples).","workingTextZh":"在大型、复杂的自然图像源数据集（ImageNet、Places365，以及较弱程度上的 CIFAR-100）上，通过迭代量级剪枝发现的中奖彩票初始化（每轮剪枝率 0.2，最多 30 轮，并延迟重置到训练早期参数），用于在其他自然图像目标数据集（SVHN、Fashion-MNIST、CIFAR-10、CIFAR-100、ImageNet、Places365）上训练相同的 VGG19 或 ResNet50 架构时，往往能取得接近直接在目标数据集上发现的彩票的测试准确率。这种迁移在广泛的剪枝比例下都能观察到，包括极高稀疏度；大型、类别更丰富的源数据集通常比小型源数据集产生更强的跨数据集迁移，例如训练样本数相同的 CIFAR-100 彩票比 CIFAR-10 彩票泛化更好。","type":"结论","epistemicStatus":"LKM 粗粒度综合结论","argumentRole":"被支持的主结论","paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3; Fig. 4","ocrLines":"L118-L145（核心：L121）","excerpt":"Across all comparisons, several key trends emerged. First and foremost, individual winning tickets which generalize across all datasets with performance close to that of winning tickets generated on the target dataset can be found.","excerptZh":"在所有比较中出现了若干关键趋势。首先也是最重要的是，可以找到能够跨所有数据集泛化的单个中奖彩票，其性能接近直接在目标数据集上产生的彩票。","supports":"","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::conclusion_1\")]","inFormalIr":"否","irId":"","reviewStatus":"已定位原文；待句级复核","notes":"graph prior=0.95; global_id=gcn_f22fc9a9f36d4b45"},{"stableId":"OTWTA-GCON-C02","sourceLayer":"graph_conclusion","originalId":"paper:867771291879342656::conclusion_2","parentFactorId":"lfac_cb96d1b77e42b35b","canonicalConclusionId":"OTWTA-C02","proposition":"在 VGG19 和 ResNet50 两种架构上，从训练样本更多、输出类别更多的大型源数据集中发现的中奖彩票，迁移到其他自然图像分类数据集时，明显优于从小型源数据集中发现的彩票。这一效应不能只用原始训练集大小解释：在训练样本数相同的情况下，类别更多的 CIFAR-100（100 类）产生的彩票，比类别较少的 CIFAR-10（10 类）产生的彩票在多个目标任务上泛化更好。","sourceTextEn":"Winning tickets discovered on larger source datasets—both in terms of number of training examples and number of output classes—transfer substantially better to other natural-image classification datasets (SVHN, Fashion-MNIST, CIFAR-10, CIFAR-100, ImageNet, Places365) than tickets discovered on smaller source datasets, for both VGG19 and ResNet50 architectures. This effect is not solely explained by raw training-set size: holding training-set size fixed, a source dataset with many classes (CIFAR-100, 100 classes) produced tickets that generalized better across targets than one with few classes (CIFAR-10, 10 classes).","workingTextZh":"在 VGG19 和 ResNet50 两种架构上，从训练样本更多、输出类别更多的大型源数据集中发现的中奖彩票，迁移到其他自然图像分类数据集时，明显优于从小型源数据集中发现的彩票。这一效应不能只用原始训练集大小解释：在训练样本数相同的情况下，类别更多的 CIFAR-100（100 类）产生的彩票，比类别较少的 CIFAR-10（10 类）产生的彩票在多个目标任务上泛化更好。","type":"结论","epistemicStatus":"LKM 粗粒度综合结论","argumentRole":"被支持的主结论","paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3; Fig. 4","ocrLines":"L124-L133","excerpt":"We consistently observed that winning tickets generated on larger, more complex datasets generalized substantially better than those generated on small datasets. ... Consistently, CIFAR-100 tickets generalized better than CIFAR-10 tickets.","excerptZh":"我们持续观察到，在更大、更复杂数据集上产生的中奖彩票，比小型数据集产生的彩票具有明显更好的泛化能力。CIFAR-100 彩票也持续优于 CIFAR-10 彩票。","supports":"","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::conclusion_2\")]","inFormalIr":"否","irId":"","reviewStatus":"已定位原文；待句级复核","notes":"graph prior=0.7; global_id=gcn_0fdc65dd973e495e"},{"stableId":"OTWTA-GCON-C03","sourceLayer":"graph_conclusion","originalId":"paper:867771291879342656::conclusion_3","parentFactorId":"lfac_666bfce3ddeaaf51","canonicalConclusionId":"OTWTA-C03","proposition":"在自然图像分类任务中，使用一种优化器产生的中奖彩票初始化可以迁移到另一种优化器：用带动量 SGD 或 Adam 在 VGG19 上发现的彩票，改用另一种优化器训练时，能够获得与目标优化器直接发现的彩票相近的较高性能。但行为存在优化器相关差异：从 SGD 迁移到 Adam 的彩票在低剪枝比例下有时不如随机彩票，而在高剪枝比例下则优于随机彩票。","sourceTextEn":"Winning-ticket initializations generated with one optimizer generalize to training with a different optimizer on natural-image classification datasets: VGG19 tickets found using SGD with momentum or using Adam, when re-used with the alternate optimizer, achieve high performance that is comparable to tickets discovered under the target optimizer. There are optimizer-dependent nuances in behavior: tickets transferred from SGD to Adam sometimes under-perform random tickets at low pruning fractions but outperform random tickets at high pruning fractions.","workingTextZh":"在自然图像分类任务中，使用一种优化器产生的中奖彩票初始化可以迁移到另一种优化器：用带动量 SGD 或 Adam 在 VGG19 上发现的彩票，改用另一种优化器训练时，能够获得与目标优化器直接发现的彩票相近的较高性能。但行为存在优化器相关差异：从 SGD 迁移到 Adam 的彩票在低剪枝比例下有时不如随机彩票，而在高剪枝比例下则优于随机彩票。","type":"结论","epistemicStatus":"LKM 粗粒度综合结论","argumentRole":"被支持的主结论","paperSection":"§4.3 跨优化器迁移","figure":"Fig. 5","ocrLines":"L150-L159（核心：L153）","excerpt":"Transferred winning tickets for VGG models achieved similar performance as those generated using the source optimizer. ... Tickets transferred from SGD to Adam under-performed random tickets at low pruning fractions, but significantly outperformed random tickets at high pruning fractions.","excerptZh":"VGG 模型的迁移彩票取得了与源优化器产生的彩票相近的性能。从 SGD 迁移到 Adam 的彩票在低剪枝比例下不如随机彩票，但在高剪枝比例下明显优于随机彩票。","supports":"","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::conclusion_3\")]","inFormalIr":"否","irId":"","reviewStatus":"已定位原文；待句级复核","notes":"graph prior=0.5; global_id=gcn_d354352c21724714"},{"stableId":"OTWTA-GCON-C04","sourceLayer":"graph_conclusion","originalId":"paper:867771291879342656::conclusion_4","parentFactorId":"lfac_745c4fd9e6ca523f","canonicalConclusionId":"OTWTA-C04","proposition":"在包含 25,000 张训练图像、每类 2,500 张图像的 CIFAR-10a 子集上发现的中奖彩票，可以迁移到同一分布下互不重叠的 CIFAR-10b 子集，并相对于随机稀疏初始化改善该留出子集上的训练。该同分布迁移在 VGG19 和 ResNet50 上都成立，但 ResNet50 在低剪枝比例下较敏感，少量权重被剪除时偶尔不如随机彩票。","sourceTextEn":"A winning ticket discovered on CIFAR-10a, a subset of the CIFAR-10 dataset containing 25,000 training images with 2,500 images per class, transfers to a disjoint subset CIFAR-10b from the same data distribution and improves training on that held-out subset relative to random sparse initializations. This within-distribution transfer holds for both VGG19 and ResNet50, though ResNet50 showed sensitivity at low pruning fractions (occasionally under-performing random tickets when few weights are pruned).","workingTextZh":"在包含 25,000 张训练图像、每类 2,500 张图像的 CIFAR-10a 子集上发现的中奖彩票，可以迁移到同一分布下互不重叠的 CIFAR-10b 子集，并相对于随机稀疏初始化改善该留出子集上的训练。该同分布迁移在 VGG19 和 ResNet50 上都成立，但 ResNet50 在低剪枝比例下较敏感，少量权重被剪除时偶尔不如随机彩票。","type":"结论","epistemicStatus":"LKM 粗粒度综合结论","argumentRole":"被支持的主结论","paperSection":"§4.1 同一数据分布内迁移","figure":"Fig. 2","ocrLines":"L102-L111","excerpt":"We then asked whether winning tickets generated using CIFAR-10a would produce increased performance on CIFAR-10b. ... For ResNet50 models ... both under-performed random tickets at low pruning fractions.","excerptZh":"随后我们询问，使用 CIFAR-10a 产生的彩票能否提高 CIFAR-10b 上的性能。对于 ResNet50，两类彩票在低剪枝比例下都不如随机彩票。","supports":"","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::conclusion_4\")]","inFormalIr":"否","irId":"","reviewStatus":"已定位原文；待句级复核","notes":"graph prior=0.6; global_id=gcn_2cab68b8709b4d9f"},{"stableId":"OTWTA-GCON-C05","sourceLayer":"graph_conclusion","originalId":"paper:867771291879342656::conclusion_5","parentFactorId":"lfac_58096a5ebe94e02b","canonicalConclusionId":"OTWTA-C05","proposition":"在 CIFAR-10 上训练 VGG19 并发现中奖彩票时，将所有层的权重放在一起按量级排序、全局删除最小权重，得到的稀疏子网络性能高于每层按固定比例剪枝的逐层剪枝。在全局量级剪枝下，各层剪枝比例并不相同：更深的卷积层被剪得更多，而浅层、尤其第一卷积层保留了更大比例的参数。","sourceTextEn":"When performing magnitude pruning for winning-ticket discovery on VGG19 trained on CIFAR-10, globally ranking weights across all layers and pruning the smallest-magnitude weights globally yields higher-performing sparse subnetworks than pruning a fixed fraction per layer (\"layerwise pruning\"). Under global magnitude pruning the pruning fractions vary across layers: deeper convolutional layers are pruned more heavily while early layers (notably the first convolutional layer) retain a much larger fraction of their parameters.","workingTextZh":"在 CIFAR-10 上训练 VGG19 并发现中奖彩票时，将所有层的权重放在一起按量级排序、全局删除最小权重，得到的稀疏子网络性能高于每层按固定比例剪枝的逐层剪枝。在全局量级剪枝下，各层剪枝比例并不相同：更深的卷积层被剪得更多，而浅层、尤其第一卷积层保留了更大比例的参数。","type":"结论","epistemicStatus":"LKM 粗粒度综合结论","argumentRole":"被支持的主结论","paperSection":"§3.1 彩票假说——全局剪枝","figure":"Fig. 1","ocrLines":"L77-L80","excerpt":"We observed that global pruning leads to higher performance than local pruning. ... Global magnitude pruning preferentially prunes weights in deeper layers, leaving the first layer in particular relatively unpruned.","excerptZh":"我们观察到，全局剪枝比逐层剪枝取得更高性能。全局量级剪枝倾向于更多剪除深层权重，而第一层尤其保留了较多参数。","supports":"","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::conclusion_5\")]","inFormalIr":"否","irId":"","reviewStatus":"已定位原文；待句级复核","notes":"graph prior=0.5; global_id=gcn_cdeb0e970f4042d0"},{"stableId":"OTWTA-GCON-C06","sourceLayer":"graph_conclusion","originalId":"paper:867771291879342656::conclusion_6","parentFactorId":"lfac_c6ff5645cff61bd7","canonicalConclusionId":"OTWTA-C06","proposition":"对于在 CIFAR-10 上训练的 VGG19，剪枝掩码的结构包含对训练稀疏网络有用的重要信息。比较保留的彩票掩码、仅在层内置换的掩码和跨所有层全局置换的掩码可见：层内置换使性能中度下降，而全局置换导致性能显著下降。因此，用于评估中奖彩票初始化的公平“随机彩票”基线应同时随机化权重值和掩码结构，因为保留逐层掩码统计会从已发现的彩票中携带信息。","sourceTextEn":"For VGG19 trained on CIFAR-10, the structure of the pruning mask contains substantial information useful for training sparse networks: comparing (a) preserved winning-ticket masks, (b) masks permuted only within layers (local permutation), and (c) masks permuted across all layers (global permutation) shows that locally permuting a mask degrades performance moderately while globally permuting the mask degrades performance dramatically. Therefore, a fair \"random ticket\" baseline for evaluating a winning-ticket initialization should randomize both weight values and mask structure (global permutation), because preserving mask statistics across layers transfers information from the discovered ticket.","workingTextZh":"对于在 CIFAR-10 上训练的 VGG19，剪枝掩码的结构包含对训练稀疏网络有用的重要信息。比较保留的彩票掩码、仅在层内置换的掩码和跨所有层全局置换的掩码可见：层内置换使性能中度下降，而全局置换导致性能显著下降。因此，用于评估中奖彩票初始化的公平“随机彩票”基线应同时随机化权重值和掩码结构，因为保留逐层掩码统计会从已发现的彩票中携带信息。","type":"结论","epistemicStatus":"LKM 粗粒度综合结论","argumentRole":"被支持的主结论","paperSection":"§3.1 随机掩码; Appendix A.2 随机化掩码","figure":"Fig. A1（并参照 Fig. 1）","ocrLines":"L83; L242-L261（核心：L258-L261）","excerpt":"While locally permuting masks damaged performance somewhat, globally permuting the mask results in dramatically worse performance, suggesting that the layerwise statistics derived from training the over-parameterized model are very informative.","excerptZh":"层内置换掩码会在一定程度上损害性能，而全局置换掩码会使性能显著恶化，这表明从过参数化模型训练中得到的逐层统计包含大量信息。","supports":"","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::conclusion_6\")]","inFormalIr":"否","irId":"","reviewStatus":"已定位原文；待句级复核","notes":"graph prior=0.5; global_id=gcn_764a16230b6b4c66"},{"stableId":"OTWTA-GCON-C07","sourceLayer":"graph_conclusion","originalId":"paper:867771291879342656::conclusion_7","parentFactorId":"lfac_c9fb5d9571d5a824","canonicalConclusionId":"OTWTA-C07","proposition":"为了在自然图像分类的大模型、大数据集场景中得到有竞争力的中奖彩票，论文采用每轮剪除剩余参数 20%、最多 30 轮的迭代量级剪枝，并将参数延迟重置到训练早期。Fashion-MNIST、SVHN、CIFAR-10 和 CIFAR-100 重置到第 1 个 epoch 后的参数，ImageNet 和 Places365 重置到第 3 个 epoch 后的参数。学习率退火和其他超参数按模型族匹配：VGG19 训练 160 个 epoch，在第 80、120 个 epoch 降低学习率；ResNet50 训练 90 个 epoch，在第 50、65、80 个 epoch 降低学习率。","sourceTextEn":"For obtaining competitive winning tickets in the large-model and large-dataset regime of natural-image classification, an iterative magnitude-pruning schedule with pruning fraction per iteration 0.2 (20% of remaining parameters) over up to 30 iterations combined with late resetting to parameters at a small early training iteration produced effective winning tickets; late resetting settings used were resetting to the parameters after 1 epoch for Fashion-MNIST, SVHN, CIFAR-10 and CIFAR-100, and after 3 epochs for ImageNet and Places365. Learning-rate annealing schedules and other hyperparameters were matched per model family (VGG19 trained 160 epochs with LR drops at epochs 80 and 120; ResNet50 trained 90 epochs with LR drops at epochs 50, 65, and 80).","workingTextZh":"为了在自然图像分类的大模型、大数据集场景中得到有竞争力的中奖彩票，论文采用每轮剪除剩余参数 20%、最多 30 轮的迭代量级剪枝，并将参数延迟重置到训练早期。Fashion-MNIST、SVHN、CIFAR-10 和 CIFAR-100 重置到第 1 个 epoch 后的参数，ImageNet 和 Places365 重置到第 3 个 epoch 后的参数。学习率退火和其他超参数按模型族匹配：VGG19 训练 160 个 epoch，在第 80、120 个 epoch 降低学习率；ResNet50 训练 90 个 epoch，在第 50、65、80 个 epoch 降低学习率。","type":"结论","epistemicStatus":"LKM 粗粒度综合结论","argumentRole":"被支持的主结论","paperSection":"§3.1 迭代剪枝 / 延迟重置; Appendix A.1","figure":"—","ocrLines":"L71-L74; L231-L240","excerpt":"For all models, an iterative pruning rate of 0.2 was used and 30 pruning iterations were performed. ... For Fashion-MNIST, SVHN, CIFAR-10 and CIFAR-100 winning tickets, late resetting of 1 epoch was used. For ImageNet and Places365 winning tickets, late resetting of 3 epochs was used.","excerptZh":"所有模型均采用每轮 0.2 的迭代剪枝率并执行 30 轮剪枝。Fashion-MNIST、SVHN、CIFAR-10 和 CIFAR-100 彩票使用 1 个 epoch 的延迟重置；ImageNet 和 Places365 彩票使用 3 个 epoch 的延迟重置。","supports":"","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::conclusion_7\")]","inFormalIr":"否","irId":"","reviewStatus":"已定位原文；待句级复核","notes":"graph prior=0.9; global_id=gcn_1c4ea7e959814d8f"},{"stableId":"OTWTA-OBS-H01","sourceLayer":"graph_highlight","originalId":"paper:867771291879342656::H1","parentFactorId":"lfac_38ad8d064f6577f1","canonicalConclusionId":"OTWTA-C01","proposition":"对于在 Fashion-MNIST 上训练的 VGG19，当剪枝比例低于约 80% 时，来自 ImageNet、Places365 和 CIFAR-100 的中奖彩票测试准确率明显高于在 Fashion-MNIST 本身发现的彩票。Fashion-MNIST 专用彩票在低剪枝比例下出现严重过拟合、测试准确率较低，而来自较大数据集的迁移彩票保持较高准确率。","sourceTextEn":"For VGG19 trained on Fashion-MNIST, winning tickets sourced from ImageNet, Places365, and CIFAR-100 achieve substantially higher test accuracy at pruning fractions below approximately 80% than winning tickets generated on Fashion-MNIST itself. The Fashion-MNIST-specific tickets at low pruning fractions suffer from severe overfitting (low test accuracy), whereas transferred tickets from larger datasets maintain high accuracy.","workingTextZh":"对于在 Fashion-MNIST 上训练的 VGG19，当剪枝比例低于约 80% 时，来自 ImageNet、Places365 和 CIFAR-100 的中奖彩票测试准确率明显高于在 Fashion-MNIST 本身发现的彩票。Fashion-MNIST 专用彩票在低剪枝比例下出现严重过拟合、测试准确率较低，而来自较大数据集的迁移彩票保持较高准确率。","type":"观察","epistemicStatus":"LKM 提取的关键实验观察","argumentRole":"支持证据","paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3b","ocrLines":"L136","excerpt":"Transferred winning tickets dramatically outperformed winning tickets generated on Fashion-MNIST itself at low pruning rates ... suggesting that transferred tickets provide additional regularization against overfitting.","excerptZh":"在低剪枝比例下，迁移的中奖彩票显著优于直接在 Fashion-MNIST 上产生的彩票，这表明迁移彩票对过拟合提供了额外的正则化作用。","supports":"paper:867771291879342656::conclusion_1","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::H1\")]","inFormalIr":"否","irId":"","reviewStatus":"需核对图中读数","notes":"证据贡献说明见 Conclusion_Map 的中文 LKM 评述；原始 metadata 保留在 Raw_Graph_Nodes。"},{"stableId":"OTWTA-OBS-H02","sourceLayer":"graph_highlight","originalId":"paper:867771291879342656::H2","parentFactorId":"lfac_38ad8d064f6577f1","canonicalConclusionId":"OTWTA-C01","proposition":"在 VGG19 和 ResNet50 上进行自然图像数据集间的中奖彩票迁移时，源数据集有效性的排序在两种架构上保持一致：ImageNet/Places365 高于 CIFAR-100，CIFAR-100 高于 CIFAR-10，CIFAR-10 高于 Fashion-MNIST/SVHN。","sourceTextEn":"For winning ticket transfer across natural-image datasets (SVHN, Fashion-MNIST, CIFAR-10, CIFAR-100, ImageNet, Places365) with VGG19 and ResNet50, the observed ordering of source dataset effectiveness (ImageNet/Places365 > CIFAR-100 > CIFAR-10 > Fashion-MNIST/SVHN) is consistent across both architectures.","workingTextZh":"在 VGG19 和 ResNet50 上进行自然图像数据集间的中奖彩票迁移时，源数据集有效性的排序在两种架构上保持一致：ImageNet/Places365 高于 CIFAR-100，CIFAR-100 高于 CIFAR-10，CIFAR-10 高于 Fashion-MNIST/SVHN。","type":"观察","epistemicStatus":"LKM 提取的关键实验观察","argumentRole":"支持证据","paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3, Fig. 4","ocrLines":"L118-L145（核心：L121）","excerpt":"Across all comparisons, several key trends emerged. First and foremost, individual winning tickets which generalize across all datasets with performance close to that of winning tickets generated on the target dataset can be found.","excerptZh":"在所有比较中出现了若干关键趋势。首先也是最重要的是，可以找到能够跨所有数据集泛化的单个中奖彩票，其性能接近直接在目标数据集上产生的彩票。","supports":"paper:867771291879342656::conclusion_1","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::H2\")]","inFormalIr":"否","irId":"","reviewStatus":"需核对图中读数","notes":"证据贡献说明见 Conclusion_Map 的中文 LKM 评述；原始 metadata 保留在 Raw_Graph_Nodes。"},{"stableId":"OTWTA-OBS-H03","sourceLayer":"graph_highlight","originalId":"paper:867771291879342656::H3","parentFactorId":"lfac_cb96d1b77e42b35b","canonicalConclusionId":"OTWTA-C02","proposition":"比较六个自然图像数据集之间的迁移以及 VGG19、ResNet50 两种架构后，源数据集有效性的排序非常一致：ImageNet/Places365 高于 CIFAR-100，CIFAR-100 高于 CIFAR-10，CIFAR-10 高于 Fashion-MNIST/SVHN；该排序在所有目标数据集上都成立。","sourceTextEn":"Comparing source dataset transferability across multiple target datasets (SVHN, Fashion-MNIST, CIFAR-10, CIFAR-100, ImageNet, Places365) and two architectures (VGG19 and ResNet50), the ordering of source effectiveness is remarkably consistent: ImageNet/Places365 > CIFAR-100 > CIFAR-10 > Fashion-MNIST/SVHN. This holds across all target datasets.","workingTextZh":"比较六个自然图像数据集之间的迁移以及 VGG19、ResNet50 两种架构后，源数据集有效性的排序非常一致：ImageNet/Places365 高于 CIFAR-100，CIFAR-100 高于 CIFAR-10，CIFAR-10 高于 Fashion-MNIST/SVHN；该排序在所有目标数据集上都成立。","type":"观察","epistemicStatus":"LKM 提取的关键实验观察","argumentRole":"支持证据","paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3, Fig. 4","ocrLines":"L124-L133","excerpt":"We consistently observed that winning tickets generated on larger, more complex datasets generalized substantially better than those generated on small datasets. ... Consistently, CIFAR-100 tickets generalized better than CIFAR-10 tickets.","excerptZh":"我们持续观察到，在更大、更复杂数据集上产生的中奖彩票，比小型数据集产生的彩票具有明显更好的泛化能力。CIFAR-100 彩票也持续优于 CIFAR-10 彩票。","supports":"paper:867771291879342656::conclusion_2","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::H3\")]","inFormalIr":"否","irId":"","reviewStatus":"需核对图中读数","notes":"证据贡献说明见 Conclusion_Map 的中文 LKM 评述；原始 metadata 保留在 Raw_Graph_Nodes。"},{"stableId":"OTWTA-OBS-H04","sourceLayer":"graph_highlight","originalId":"paper:867771291879342656::H4","parentFactorId":"lfac_666bfce3ddeaaf51","canonicalConclusionId":"OTWTA-C03","proposition":"在 VGG19 的跨优化器迁移实验中（论文未明确数据集），使用带动量 SGD 或 Adam 中一种优化器产生的彩票，交由另一种优化器评估。在广泛的剪枝比例下，迁移彩票的性能接近直接用目标优化器产生的彩票，尤其是在高剪枝比例下。实验控制了架构和剪枝日程，从而主要隔离了优化器变量。","sourceTextEn":"In the cross-optimizer transfer experiment on VGG19 (dataset not specified in the paper), winning tickets generated with one optimizer (SGD with momentum or Adam) are evaluated with the other optimizer. Across a wide range of pruning fractions, the transferred tickets achieve performance close to tickets generated directly with the target optimizer, especially at high pruning fractions. The experiment controls for architecture and pruning schedule, isolating the optimizer variable.","workingTextZh":"在 VGG19 的跨优化器迁移实验中（论文未明确数据集），使用带动量 SGD 或 Adam 中一种优化器产生的彩票，交由另一种优化器评估。在广泛的剪枝比例下，迁移彩票的性能接近直接用目标优化器产生的彩票，尤其是在高剪枝比例下。实验控制了架构和剪枝日程，从而主要隔离了优化器变量。","type":"观察","epistemicStatus":"LKM 提取的关键实验观察","argumentRole":"支持证据","paperSection":"§4.3 跨优化器迁移","figure":"Fig. 5","ocrLines":"L150-L159（核心：L153）","excerpt":"Transferred winning tickets for VGG models achieved similar performance as those generated using the source optimizer. ... Tickets transferred from SGD to Adam under-performed random tickets at low pruning fractions, but significantly outperformed random tickets at high pruning fractions.","excerptZh":"VGG 模型的迁移彩票取得了与源优化器产生的彩票相近的性能。从 SGD 迁移到 Adam 的彩票在低剪枝比例下不如随机彩票，但在高剪枝比例下明显优于随机彩票。","supports":"paper:867771291879342656::conclusion_3","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::H4\")]","inFormalIr":"否","irId":"","reviewStatus":"需核对图中读数","notes":"证据贡献说明见 Conclusion_Map 的中文 LKM 评述；原始 metadata 保留在 Raw_Graph_Nodes。"},{"stableId":"OTWTA-OBS-H05","sourceLayer":"graph_highlight","originalId":"paper:867771291879342656::H5","parentFactorId":"lfac_745c4fd9e6ca523f","canonicalConclusionId":"OTWTA-C04","proposition":"在将 CIFAR-10 划分为互不重叠的 CIFAR-10a 和 CIFAR-10b 的同分布迁移实验中，CIFAR-10a 彩票迁移到 CIFAR-10b 后，在高剪枝比例下对 VGG19 和 ResNet50 都比随机稀疏初始化取得更高测试准确率。使用互不重叠的留出子集表明，彩票收益并非来自对训练样本的记忆。","sourceTextEn":"In the within-distribution transfer experiment (CIFAR-10 split into two halves CIFAR-10a and CIFAR-10b), winning tickets from CIFAR-10a transferred to CIFAR-10b improve test accuracy over random sparse initializations at high pruning fractions for both VGG19 and ResNet50. The use of a disjoint held-out split shows that the ticket's benefit is not due to memorization of training samples.","workingTextZh":"在将 CIFAR-10 划分为互不重叠的 CIFAR-10a 和 CIFAR-10b 的同分布迁移实验中，CIFAR-10a 彩票迁移到 CIFAR-10b 后，在高剪枝比例下对 VGG19 和 ResNet50 都比随机稀疏初始化取得更高测试准确率。使用互不重叠的留出子集表明，彩票收益并非来自对训练样本的记忆。","type":"观察","epistemicStatus":"LKM 提取的关键实验观察","argumentRole":"支持证据","paperSection":"§4.1 同一数据分布内迁移","figure":"Fig. 2","ocrLines":"L102-L111","excerpt":"We then asked whether winning tickets generated using CIFAR-10a would produce increased performance on CIFAR-10b. ... For ResNet50 models ... both under-performed random tickets at low pruning fractions.","excerptZh":"随后我们询问，使用 CIFAR-10a 产生的彩票能否提高 CIFAR-10b 上的性能。对于 ResNet50，两类彩票在低剪枝比例下都不如随机彩票。","supports":"paper:867771291879342656::conclusion_4","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::H5\")]","inFormalIr":"否","irId":"","reviewStatus":"需核对图中读数","notes":"证据贡献说明见 Conclusion_Map 的中文 LKM 评述；原始 metadata 保留在 Raw_Graph_Nodes。"},{"stableId":"OTWTA-OBS-H06","sourceLayer":"graph_highlight","originalId":"paper:867771291879342656::H6","parentFactorId":"lfac_58096a5ebe94e02b","canonicalConclusionId":"OTWTA-C05","proposition":"图 1a 显示，在 CIFAR-10 上训练的 VGG19 中，全局量级剪枝在所有测试剪枝比例（0% 到 99.9%）下都优于逐层剪枝。图 1b 显示，全局剪枝下各层剪枝比例不同：深层卷积层被剪得更多，而第一卷积层即使在总体稀疏度达到 99.9% 时仍保留几乎全部权重。","sourceTextEn":"Figure 1a shows that global magnitude pruning on VGG19 trained on CIFAR-10 consistently outperforms layerwise pruning across all tested pruning fractions (from 0% pruned to 99.9% pruned). Figure 1b shows that under global pruning, the fraction of pruned weights varies per layer: deeper convolutional layers are pruned more heavily, while the first convolutional layer retains nearly all its weights even at 99.9% overall sparsity.","workingTextZh":"图 1a 显示，在 CIFAR-10 上训练的 VGG19 中，全局量级剪枝在所有测试剪枝比例（0% 到 99.9%）下都优于逐层剪枝。图 1b 显示，全局剪枝下各层剪枝比例不同：深层卷积层被剪得更多，而第一卷积层即使在总体稀疏度达到 99.9% 时仍保留几乎全部权重。","type":"观察","epistemicStatus":"LKM 提取的关键实验观察","argumentRole":"支持证据","paperSection":"§3.1 彩票假说——全局剪枝","figure":"Fig. 1","ocrLines":"L77-L80","excerpt":"We observed that global pruning leads to higher performance than local pruning. ... Global magnitude pruning preferentially prunes weights in deeper layers, leaving the first layer in particular relatively unpruned.","excerptZh":"我们观察到，全局剪枝比逐层剪枝取得更高性能。全局量级剪枝倾向于更多剪除深层权重，而第一层尤其保留了较多参数。","supports":"paper:867771291879342656::conclusion_5","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::H6\")]","inFormalIr":"否","irId":"","reviewStatus":"需核对图中读数","notes":"证据贡献说明见 Conclusion_Map 的中文 LKM 评述；原始 metadata 保留在 Raw_Graph_Nodes。"},{"stableId":"OTWTA-OBS-H07","sourceLayer":"graph_highlight","originalId":"paper:867771291879342656::H7","parentFactorId":"lfac_c6ff5645cff61bd7","canonicalConclusionId":"OTWTA-C06","proposition":"图 A1 在 CIFAR-10 上的 VGG19 中比较了保留掩码、层内置换掩码和全局置换掩码。保留掩码性能最好，层内置换使性能中度下降，全局置换使性能显著下降。这表明逐层稀疏统计和跨层掩码结构都携带信息。","sourceTextEn":"Figure A1 compares three mask types (preserved, locally permuted, globally permuted) for VGG19 on CIFAR-10, showing that the preserved mask performs best, locally permuted reduces performance moderately, and globally permuted reduces performance dramatically. This establishes that both layerwise statistics and across-layer mask structure carry information.","workingTextZh":"图 A1 在 CIFAR-10 上的 VGG19 中比较了保留掩码、层内置换掩码和全局置换掩码。保留掩码性能最好，层内置换使性能中度下降，全局置换使性能显著下降。这表明逐层稀疏统计和跨层掩码结构都携带信息。","type":"观察","epistemicStatus":"LKM 提取的关键实验观察","argumentRole":"支持证据","paperSection":"§3.1 随机掩码; Appendix A.2 随机化掩码","figure":"Fig. A1","ocrLines":"L83; L242-L261（核心：L258-L261）","excerpt":"While locally permuting masks damaged performance somewhat, globally permuting the mask results in dramatically worse performance, suggesting that the layerwise statistics derived from training the over-parameterized model are very informative.","excerptZh":"层内置换掩码会在一定程度上损害性能，而全局置换掩码会使性能显著恶化，这表明从过参数化模型训练中得到的逐层统计包含大量信息。","supports":"paper:867771291879342656::conclusion_6","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::H7\")]","inFormalIr":"否","irId":"","reviewStatus":"需核对图中读数","notes":"证据贡献说明见 Conclusion_Map 的中文 LKM 评述；原始 metadata 保留在 Raw_Graph_Nodes。"},{"stableId":"OTWTA-OBS-H08","sourceLayer":"graph_highlight","originalId":"paper:867771291879342656::H8","parentFactorId":"lfac_c9fb5d9571d5a824","canonicalConclusionId":"OTWTA-C07","proposition":"论文采用延迟重置（小型数据集重置到第 1 个 epoch，ImageNet/Places365 重置到第 3 个 epoch）和迭代量级剪枝（每轮 20%，共 30 轮），在六个数据集上为 VGG19 和 ResNet50 成功产生了中奖彩票，从而使后续迁移实验得以进行。","sourceTextEn":"Using late resetting (1 epoch for small datasets, 3 epochs for ImageNet/Places365) and iterative magnitude pruning (20% per iteration, 30 iterations), the paper successfully generates winning tickets for VGG19 and ResNet50 on all six datasets (Fashion-MNIST, SVHN, CIFAR-10, CIFAR-100, ImageNet, Places365), enabling the transfer experiments.","workingTextZh":"论文采用延迟重置（小型数据集重置到第 1 个 epoch，ImageNet/Places365 重置到第 3 个 epoch）和迭代量级剪枝（每轮 20%，共 30 轮），在六个数据集上为 VGG19 和 ResNet50 成功产生了中奖彩票，从而使后续迁移实验得以进行。","type":"观察","epistemicStatus":"LKM 提取的关键实验观察","argumentRole":"支持证据","paperSection":"§3.1 迭代剪枝 / 延迟重置; Appendix A.1","figure":"—","ocrLines":"L71-L74; L231-L240","excerpt":"For all models, an iterative pruning rate of 0.2 was used and 30 pruning iterations were performed. ... For Fashion-MNIST, SVHN, CIFAR-10 and CIFAR-100 winning tickets, late resetting of 1 epoch was used. For ImageNet and Places365 winning tickets, late resetting of 3 epochs was used.","excerptZh":"所有模型均采用每轮 0.2 的迭代剪枝率并执行 30 轮剪枝。Fashion-MNIST、SVHN、CIFAR-10 和 CIFAR-100 彩票使用 1 个 epoch 的延迟重置；ImageNet 和 Places365 彩票使用 3 个 epoch 的延迟重置。","supports":"paper:867771291879342656::conclusion_7","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::H8\")]","inFormalIr":"否","irId":"","reviewStatus":"已定位原文；待句级复核","notes":"证据贡献说明见 Conclusion_Map 的中文 LKM 评述；原始 metadata 保留在 Raw_Graph_Nodes。"},{"stableId":"OTWTA-WP-P01","sourceLayer":"graph_weakpoint","originalId":"paper:867771291879342656::P1","parentFactorId":"lfac_cb96d1b77e42b35b","canonicalConclusionId":"OTWTA-C02","proposition":"在使用 VGG19 和 ResNet50 对多个自然图像数据集进行中奖彩票迁移的实验中，CIFAR-10（10 类、50,000 张训练图像）与 CIFAR-100（100 类、50,000 张训练图像）的比较，不仅改变了输出类别数，也同时改变了类别粒度、图像内容和基线任务难度。因此，CIFAR-100 彩票优于 CIFAR-10 彩票的迁移结果，不能唯一归因于输出类别数量的差异。","sourceTextEn":"In winning ticket transferability experiments across natural-image datasets with VGG19 and ResNet50 architectures on SVHN, Fashion-MNIST, CIFAR-10, CIFAR-100, ImageNet, and Places365, the comparison between CIFAR-10 (10 classes, 50,000 training images) and CIFAR-100 (100 classes, 50,000 training images) confounds the number of output classes with class granularity (fine-grained versus coarse), image content, and baseline task difficulty. Therefore, the observed superior transferability of CIFAR-100 winning tickets over CIFAR-10 winning tickets cannot be uniquely attributed to the difference in the number of output classes.\n      Fig. 3, Fig. 4","workingTextZh":"在使用 VGG19 和 ResNet50 对多个自然图像数据集进行中奖彩票迁移的实验中，CIFAR-10（10 类、50,000 张训练图像）与 CIFAR-100（100 类、50,000 张训练图像）的比较，不仅改变了输出类别数，也同时改变了类别粒度、图像内容和基线任务难度。因此，CIFAR-100 彩票优于 CIFAR-10 彩票的迁移结果，不能唯一归因于输出类别数量的差异。","type":"前提","epistemicStatus":"分析性反驳前提（非论文直接结论）","argumentRole":"weakpoint / 限制","paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3, Fig. 4","ocrLines":"L118; L124-L133","excerpt":"These datasets vary across a number of axes, including grayscale vs. color, input size, number of output classes, and training set size. ... CIFAR-100 tickets generalized better than CIFAR-10 tickets.","excerptZh":"这些数据集在多个维度上不同，包括灰度或彩色、输入尺寸、输出类别数以及训练集大小；CIFAR-100 彩票比 CIFAR-10 彩票泛化得更好。","supports":"","challenges":"paper:867771291879342656::conclusion_2","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::P1\")]","inFormalIr":"否","irId":"","reviewStatus":"分析性命题；待复核","notes":"限制理由已合并到中文命题；原始 weakness_reason 保留在 Raw_Graph_Nodes。"},{"stableId":"OTWTA-WP-P02","sourceLayer":"graph_weakpoint","originalId":"paper:867771291879342656::P2","parentFactorId":"lfac_666bfce3ddeaaf51","canonicalConclusionId":"OTWTA-C03","proposition":"跨优化器迁移实验将使用带动量 SGD 或 Adam 产生的 VGG19 彩票交由另一种优化器评估，但论文没有明确说明所用自然图像分类数据集，而且只测试了 VGG19 架构。因此，“中奖彩票可以跨优化器泛化”这一观察，目前只得到单一架构和未明确训练数据集的证据支持。","sourceTextEn":"The cross-optimizer transfer experiments for winning tickets (VGG19 tickets generated with SGD with momentum or Adam, evaluated on the alternate optimizer) were conducted on an unspecified natural-image classification dataset and used only the VGG19 architecture. The observation that winning tickets generalize across optimizers is therefore supported by evidence from a single architecture and an unidentified training dataset.\n      Fig. 5","workingTextZh":"跨优化器迁移实验将使用带动量 SGD 或 Adam 产生的 VGG19 彩票交由另一种优化器评估，但论文没有明确说明所用自然图像分类数据集，而且只测试了 VGG19 架构。因此，“中奖彩票可以跨优化器泛化”这一观察，目前只得到单一架构和未明确训练数据集的证据支持。","type":"前提","epistemicStatus":"分析性反驳前提（非论文直接结论）","argumentRole":"weakpoint / 限制","paperSection":"§4.3 跨优化器迁移","figure":"Fig. 5","ocrLines":"L150-L159","excerpt":"The paragraph and Figure 5 caption identify VGG and the two optimizers, but do not identify the dataset; the scope shown in the paper is therefore narrower than the broadest wording of the conclusion.","excerptZh":"正文段落和图 5 图注明确了 VGG 及两种优化器，但没有说明数据集；因此，论文展示的证据范围窄于该结论最宽泛的表述。","supports":"","challenges":"paper:867771291879342656::conclusion_3","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::P2\")]","inFormalIr":"否","irId":"","reviewStatus":"分析性命题；待复核","notes":"限制理由已合并到中文命题；原始 weakness_reason 保留在 Raw_Graph_Nodes。"},{"stableId":"OTWTA-WP-P03","sourceLayer":"graph_weakpoint","originalId":"paper:867771291879342656::P3","parentFactorId":"lfac_745c4fd9e6ca523f","canonicalConclusionId":"OTWTA-C04","proposition":"同分布迁移实验只使用 CIFAR-10 的一次确定性切分：CIFAR-10a 和 CIFAR-10b 各含 25,000 张训练图像，每类 2,500 张。CIFAR-10a 彩票迁移到 CIFAR-10b 的结果，尚未在 CIFAR-10 的其他随机切分或 ImageNet、SVHN 等其他自然图像数据集上验证。","sourceTextEn":"The within-distribution transfer experiment uses a single deterministic split of the CIFAR-10 dataset (CIFAR-10a and CIFAR-10b, each containing 25,000 training images with 2,500 images per class). The observed transfer of winning tickets from CIFAR-10a to CIFAR-10b has not been validated on other random splits of CIFAR-10 or on other natural-image datasets such as ImageNet or SVHN.\n      Fig. 2","workingTextZh":"同分布迁移实验只使用 CIFAR-10 的一次确定性切分：CIFAR-10a 和 CIFAR-10b 各含 25,000 张训练图像，每类 2,500 张。CIFAR-10a 彩票迁移到 CIFAR-10b 的结果，尚未在 CIFAR-10 的其他随机切分或 ImageNet、SVHN 等其他自然图像数据集上验证。","type":"前提","epistemicStatus":"分析性反驳前提（非论文直接结论）","argumentRole":"weakpoint / 限制","paperSection":"§4.1 同一数据分布内迁移","figure":"Fig. 2","ocrLines":"L102-L111","excerpt":"We then asked whether winning tickets generated using CIFAR-10a would produce increased performance on CIFAR-10b. ... For ResNet50 models ... both under-performed random tickets at low pruning fractions.","excerptZh":"随后我们询问，使用 CIFAR-10a 产生的彩票能否提高 CIFAR-10b 上的性能。对于 ResNet50，两类彩票在低剪枝比例下都不如随机彩票。","supports":"","challenges":"paper:867771291879342656::conclusion_4","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::P3\")]","inFormalIr":"否","irId":"","reviewStatus":"分析性命题；待复核","notes":"限制理由已合并到中文命题；原始 weakness_reason 保留在 Raw_Graph_Nodes。"},{"stableId":"OTWTA-WP-P04","sourceLayer":"graph_weakpoint","originalId":"paper:867771291879342656::P4","parentFactorId":"lfac_58096a5ebe94e02b","canonicalConclusionId":"OTWTA-C05","proposition":"全局量级剪枝与逐层量级剪枝的比较只在 CIFAR-10 上训练的 VGG19 中进行。实验观察到全局剪枝测试准确率更高，而且在全局日程下，深层卷积层比浅层剪得更多。上述结果尚未在 ResNet50 等其他架构或其他自然图像数据集上验证。","sourceTextEn":"The comparison between global magnitude pruning and layerwise magnitude pruning for winning-ticket discovery was conducted on VGG19 trained on CIFAR-10. Global pruning produced higher test accuracy than layerwise pruning, and under the global schedule deeper convolutional layers were pruned more heavily than early layers. These observations have not been validated on other architectures such as ResNet50 or on other natural-image datasets.\n      Fig. 1","workingTextZh":"全局量级剪枝与逐层量级剪枝的比较只在 CIFAR-10 上训练的 VGG19 中进行。实验观察到全局剪枝测试准确率更高，而且在全局日程下，深层卷积层比浅层剪得更多。上述结果尚未在 ResNet50 等其他架构或其他自然图像数据集上验证。","type":"前提","epistemicStatus":"分析性反驳前提（非论文直接结论）","argumentRole":"weakpoint / 限制","paperSection":"§3.1 彩票假说——全局剪枝","figure":"Fig. 1","ocrLines":"L77-L80","excerpt":"We observed that global pruning leads to higher performance than local pruning. ... Global magnitude pruning preferentially prunes weights in deeper layers, leaving the first layer in particular relatively unpruned.","excerptZh":"我们观察到，全局剪枝比逐层剪枝取得更高性能。全局量级剪枝倾向于更多剪除深层权重，而第一层尤其保留了较多参数。","supports":"","challenges":"paper:867771291879342656::conclusion_5","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::P4\")]","inFormalIr":"否","irId":"","reviewStatus":"分析性命题；待复核","notes":"限制理由已合并到中文命题；原始 weakness_reason 保留在 Raw_Graph_Nodes。"},{"stableId":"OTWTA-WP-P05","sourceLayer":"graph_weakpoint","originalId":"paper:867771291879342656::P5","parentFactorId":"lfac_c6ff5645cff61bd7","canonicalConclusionId":"OTWTA-C06","proposition":"掩码信息量分析只在 CIFAR-10 上训练的 VGG19 中进行。实验比较了保留的彩票掩码、仅在层内置换的掩码和跨所有层全局置换的掩码；层内置换使性能中度下降，全局置换使性能显著下降。该分析尚未扩展到其他架构或数据集。","sourceTextEn":"The analysis of mask information content was performed on VGG19 trained on CIFAR-10. Three mask types were compared: preserved winning-ticket masks, masks permuted only within layers (local permutation), and masks permuted across all layers (global permutation). Locally permuting the mask moderately degraded performance while globally permuting the mask dramatically degraded performance. This analysis has not been extended to other architectures or datasets.\n      Fig. A1","workingTextZh":"掩码信息量分析只在 CIFAR-10 上训练的 VGG19 中进行。实验比较了保留的彩票掩码、仅在层内置换的掩码和跨所有层全局置换的掩码；层内置换使性能中度下降，全局置换使性能显著下降。该分析尚未扩展到其他架构或数据集。","type":"前提","epistemicStatus":"分析性反驳前提（非论文直接结论）","argumentRole":"weakpoint / 限制","paperSection":"§3.1 随机掩码; Appendix A.2 随机化掩码","figure":"Fig. A1","ocrLines":"L83; L242-L261（核心：L258-L261）","excerpt":"While locally permuting masks damaged performance somewhat, globally permuting the mask results in dramatically worse performance, suggesting that the layerwise statistics derived from training the over-parameterized model are very informative.","excerptZh":"层内置换掩码会在一定程度上损害性能，而全局置换掩码会使性能显著恶化，这表明从过参数化模型训练中得到的逐层统计包含大量信息。","supports":"","challenges":"paper:867771291879342656::conclusion_6","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::P5\")]","inFormalIr":"否","irId":"","reviewStatus":"分析性命题；待复核","notes":"限制理由已合并到中文命题；原始 weakness_reason 保留在 Raw_Graph_Nodes。"},{"stableId":"OTWTA-Q-C01","sourceLayer":"graph_subproblem","originalId":"paper:867771291879342656::conclusion_1_subproblem","parentFactorId":"","canonicalConclusionId":"OTWTA-C01","proposition":"在使用过参数化卷积网络（VGG19 和 ResNet50）进行监督图像分类时，研究者希望找到一种初始化方案，使高度稀疏的子网络无需针对每个目标任务反复搜索完整模型，也能训练到较高性能。以往通常在与评估相同的数据集和优化器上，通过迭代量级剪枝和参数重置来发现中奖彩票初始化；这种方法计算成本很高（例如需要 30 轮剪枝与多次完整模型重训），而且尚不清楚所得初始化只编码了特定数据集的信息，还是包含更广泛的归纳偏置。如果中奖彩票依赖特定数据集，每个新目标数据集都要重复昂贵搜索；如果它们具有通用性，则可以复用少量中奖彩票。此前工作没有系统检验同一数据域内的跨数据集迁移，因此尚不知道 ImageNet 等大型数据集得到的彩票是否包含可用于多种自然图像分类任务的可迁移结构。","sourceTextEn":"In the context of supervised image classification with over-parameterized convolutional networks (VGG19 and ResNet50), researchers sought initialization schemes that permit training highly sparse subnetworks to high performance without requiring repeated full-model search per target task. Prior practice produced winning-ticket initializations by performing iterative magnitude pruning and resetting within the same dataset/optimizer as evaluation; this approach is computationally costly (many full-model re-trainings, e.g., 30 pruning iterations) and leaves open whether the discovered initialization encodes only dataset-specific information or a broader inductive bias. If winning tickets were dataset-specific, then each new target dataset would require the same expensive search, preventing amortization; if they were generic, a small set of winning tickets could be reused. Prior work did not systematically test cross-dataset transfer within the same data domain, so it was unknown whether tickets from large datasets like ImageNet embed transferable structure useful across varied natural-image classification tasks.","workingTextZh":"在使用过参数化卷积网络（VGG19 和 ResNet50）进行监督图像分类时，研究者希望找到一种初始化方案，使高度稀疏的子网络无需针对每个目标任务反复搜索完整模型，也能训练到较高性能。以往通常在与评估相同的数据集和优化器上，通过迭代量级剪枝和参数重置来发现中奖彩票初始化；这种方法计算成本很高（例如需要 30 轮剪枝与多次完整模型重训），而且尚不清楚所得初始化只编码了特定数据集的信息，还是包含更广泛的归纳偏置。如果中奖彩票依赖特定数据集，每个新目标数据集都要重复昂贵搜索；如果它们具有通用性，则可以复用少量中奖彩票。此前工作没有系统检验同一数据域内的跨数据集迁移，因此尚不知道 ImageNet 等大型数据集得到的彩票是否包含可用于多种自然图像分类任务的可迁移结构。","type":"问题","epistemicStatus":"LKM 问题设定","argumentRole":"研究问题/待回答问题","paperSection":"引言（Introduction）；§4.2 跨数据集迁移","figure":"Fig. 3; Fig. 4","ocrLines":"L41-L44; L118-L145（核心：L121）","excerpt":"It remains unclear whether the properties of winning tickets ... are specific to the precise combination of architecture, optimizer, and dataset, or whether winning tickets contain inductive biases which improve training more generically.","excerptZh":"中奖彩票的这些性质究竟依赖架构、优化器和数据集的精确组合，还是彩票包含能够更普遍改善训练的归纳偏置，仍不清楚。","supports":"","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::conclusion_1_subproblem\")]","inFormalIr":"否","irId":"","reviewStatus":"问题设定；待确认边界","notes":"该问题由 paper:867771291879342656::conclusion_1 回答。"},{"stableId":"OTWTA-Q-C02","sourceLayer":"graph_subproblem","originalId":"paper:867771291879342656::conclusion_2_subproblem","parentFactorId":"","canonicalConclusionId":"OTWTA-C02","proposition":"实践者需要知道应如何选择或构造源数据集，以产生可复用的中奖彩票初始化。在本研究之前，尚不清楚仅增加样本数、仅增加类别数，或同时增加两者，哪一种能得到更通用的彩票。缺少这一知识时，为摊销昂贵的彩票发现成本而选择源数据集，可能选中只能产生低泛化彩票的次优数据集。弄清哪些数据集属性与可迁移性相关，是判断是否值得在 ImageNet、Places365 等大型且类别丰富的数据集上投入计算的前提。","sourceTextEn":"Practitioners need guidance about how to choose or construct source datasets for producing reusable winning-ticket initializations. Prior to this study, it was unclear whether increasing only the number of examples, only the number of classes, or both would yield more generic tickets. Without this knowledge, attempts to amortize the expensive ticket-discovery process risked choosing suboptimal source datasets that yield tickets that do not generalize, meaning the search cost could not be shared across tasks. Understanding which dataset properties correlate with transferability is necessary to decide whether investing computation into large, class-rich source datasets (e.g., ImageNet/Places365) will produce broadly useful initializations.","workingTextZh":"实践者需要知道应如何选择或构造源数据集，以产生可复用的中奖彩票初始化。在本研究之前，尚不清楚仅增加样本数、仅增加类别数，或同时增加两者，哪一种能得到更通用的彩票。缺少这一知识时，为摊销昂贵的彩票发现成本而选择源数据集，可能选中只能产生低泛化彩票的次优数据集。弄清哪些数据集属性与可迁移性相关，是判断是否值得在 ImageNet、Places365 等大型且类别丰富的数据集上投入计算的前提。","type":"问题","epistemicStatus":"LKM 问题设定","argumentRole":"研究问题/待回答问题","paperSection":"引言（Introduction）；§4.2 跨数据集迁移","figure":"Fig. 3; Fig. 4","ocrLines":"L41-L44; L124-L133","excerpt":"It remains unclear whether the properties of winning tickets ... are specific to the precise combination of architecture, optimizer, and dataset, or whether winning tickets contain inductive biases which improve training more generically.","excerptZh":"中奖彩票的这些性质究竟依赖架构、优化器和数据集的精确组合，还是彩票包含能够更普遍改善训练的归纳偏置，仍不清楚。","supports":"","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::conclusion_2_subproblem\")]","inFormalIr":"否","irId":"","reviewStatus":"问题设定；待确认边界","notes":"该问题由 paper:867771291879342656::conclusion_2 回答。"},{"stableId":"OTWTA-Q-C03","sourceLayer":"graph_subproblem","originalId":"paper:867771291879342656::conclusion_3_subproblem","parentFactorId":"","canonicalConclusionId":"OTWTA-C03","proposition":"中奖彩票所包含的有益初始化是否依赖特定优化器，过去并不清楚，因为不同优化器遵循不同的优化轨迹，也可能到达参数空间的不同区域。如果彩票依赖优化器，则每种实际使用的优化器都需要单独进行昂贵的彩票搜索，复用价值会受到限制。此前实证工作没有在控制其他因素的情况下系统测量跨优化器迁移（例如 SGD 与 Adam 之间的迁移），因此彩票的归纳偏置是否与发现它的优化算法绑定，仍是开放问题。","sourceTextEn":"It was unknown whether the beneficial initialization captured by a winning ticket is optimizer-specific because different optimizers follow different optimization trajectories and may make different regions of parameter space reachable. If tickets were optimizer-specific, then for each optimizer of practical interest a separate, expensive ticket discovery would be required, limiting reusability. Prior empirical work had not measured cross-optimizer transfer systematically (e.g., SGD ↔ Adam) while controlling other factors, so it remained an open question whether a ticket's inductive bias is tied to the optimization algorithm used to find it.","workingTextZh":"中奖彩票所包含的有益初始化是否依赖特定优化器，过去并不清楚，因为不同优化器遵循不同的优化轨迹，也可能到达参数空间的不同区域。如果彩票依赖优化器，则每种实际使用的优化器都需要单独进行昂贵的彩票搜索，复用价值会受到限制。此前实证工作没有在控制其他因素的情况下系统测量跨优化器迁移（例如 SGD 与 Adam 之间的迁移），因此彩票的归纳偏置是否与发现它的优化算法绑定，仍是开放问题。","type":"问题","epistemicStatus":"LKM 问题设定","argumentRole":"研究问题/待回答问题","paperSection":"引言（Introduction）；§4.3 跨优化器迁移","figure":"Fig. 5","ocrLines":"L41-L44; L150-L159（核心：L153）","excerpt":"It remains unclear whether the properties of winning tickets ... are specific to the precise combination of architecture, optimizer, and dataset, or whether winning tickets contain inductive biases which improve training more generically.","excerptZh":"中奖彩票的这些性质究竟依赖架构、优化器和数据集的精确组合，还是彩票包含能够更普遍改善训练的归纳偏置，仍不清楚。","supports":"","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::conclusion_3_subproblem\")]","inFormalIr":"否","irId":"","reviewStatus":"问题设定；待确认边界","notes":"该问题由 paper:867771291879342656::conclusion_3 回答。"},{"stableId":"OTWTA-Q-C04","sourceLayer":"graph_subproblem","originalId":"paper:867771291879342656::conclusion_4_subproblem","parentFactorId":"","canonicalConclusionId":"OTWTA-C04","proposition":"在主张中奖彩票可以跨数据集复用之前，需要先检查所得彩票是否只编码了所用训练样本的偶然特征，即是否过拟合于具体样本抽取。如果彩票依赖随机样本顺序或特定子集，那么即使面对相似数据也无法复用。此前研究没有区分样本层面的过拟合与分布层面的迁移；证明同分布内的泛化，是进一步论证跨数据集或跨数据域可迁移性的第一步。","sourceTextEn":"Before reuse of winning tickets across datasets could be plausibly advocated, it was necessary to check whether discovered tickets merely encode idiosyncratic information about the exact training samples used (overfitting to sample draws). If a ticket were specific to the random sample ordering or particular subset, it would not be reusable even across similar data. Prior studies did not separate sample-level overfitting from distribution-level transfer; establishing within-distribution generalization is a first step toward arguing for broader dataset- or domain-level portability.","workingTextZh":"在主张中奖彩票可以跨数据集复用之前，需要先检查所得彩票是否只编码了所用训练样本的偶然特征，即是否过拟合于具体样本抽取。如果彩票依赖随机样本顺序或特定子集，那么即使面对相似数据也无法复用。此前研究没有区分样本层面的过拟合与分布层面的迁移；证明同分布内的泛化，是进一步论证跨数据集或跨数据域可迁移性的第一步。","type":"问题","epistemicStatus":"LKM 问题设定","argumentRole":"研究问题/待回答问题","paperSection":"§4.1 同一数据分布内迁移","figure":"Fig. 2","ocrLines":"L102-L111","excerpt":"We then asked whether winning tickets generated using CIFAR-10a would produce increased performance on CIFAR-10b. ... For ResNet50 models ... both under-performed random tickets at low pruning fractions.","excerptZh":"随后我们询问，使用 CIFAR-10a 产生的彩票能否提高 CIFAR-10b 上的性能。对于 ResNet50，两类彩票在低剪枝比例下都不如随机彩票。","supports":"","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::conclusion_4_subproblem\")]","inFormalIr":"否","irId":"","reviewStatus":"问题设定；待确认边界","notes":"该问题由 paper:867771291879342656::conclusion_4 回答。"},{"stableId":"OTWTA-Q-C05","sourceLayer":"graph_subproblem","originalId":"paper:867771291879342656::conclusion_5_subproblem","parentFactorId":"","canonicalConclusionId":"OTWTA-C05","proposition":"剪枝方法决定掩码结构以及最终保留的稀疏架构。既有工作采用了不同剪枝机制，但尚未统一比较它们对中奖彩票质量和掩码统计的影响。逐层剪枝若强制每层使用相同剪枝比例，可能使参数本就较少的浅层保留过少参数并损害表达能力；全局剪枝可以按层调整剪枝强度，但其对可迁移性和掩码信息量的影响尚未充分刻画。因此，需要确定哪种剪枝方式能产生更强的彩票，以及会形成怎样的逐层稀疏模式。","sourceTextEn":"Pruning methodology determines the mask structure and hence the remaining sparse architecture; prior work employed different pruning regimes without a unified treatment of their comparative effects on winning-ticket quality and mask statistics. If layerwise pruning forces the same pruning fraction in small early layers it can leave too few parameters in those layers and harm expressivity; conversely, global pruning can adapt pruning intensity across layers but its effects on transferability and mask information content were not fully characterized. Understanding which pruning modality yields stronger tickets and what layerwise sparsity patterns emerge was necessary to choose an effective pruning pipeline for transferable tickets.","workingTextZh":"剪枝方法决定掩码结构以及最终保留的稀疏架构。既有工作采用了不同剪枝机制，但尚未统一比较它们对中奖彩票质量和掩码统计的影响。逐层剪枝若强制每层使用相同剪枝比例，可能使参数本就较少的浅层保留过少参数并损害表达能力；全局剪枝可以按层调整剪枝强度，但其对可迁移性和掩码信息量的影响尚未充分刻画。因此，需要确定哪种剪枝方式能产生更强的彩票，以及会形成怎样的逐层稀疏模式。","type":"问题","epistemicStatus":"LKM 问题设定","argumentRole":"研究问题/待回答问题","paperSection":"§3.1 彩票假说——全局剪枝","figure":"Fig. 1","ocrLines":"L77-L80","excerpt":"We observed that global pruning leads to higher performance than local pruning. ... Global magnitude pruning preferentially prunes weights in deeper layers, leaving the first layer in particular relatively unpruned.","excerptZh":"我们观察到，全局剪枝比逐层剪枝取得更高性能。全局量级剪枝倾向于更多剪除深层权重，而第一层尤其保留了较多参数。","supports":"","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::conclusion_5_subproblem\")]","inFormalIr":"否","irId":"","reviewStatus":"问题设定；待确认边界","notes":"该问题由 paper:867771291879342656::conclusion_5 回答。"},{"stableId":"OTWTA-Q-C06","sourceLayer":"graph_subproblem","originalId":"paper:867771291879342656::conclusion_6_subproblem","parentFactorId":"","canonicalConclusionId":"OTWTA-C06","proposition":"以往将中奖彩票与“随机”稀疏初始化比较时，有时会在随机基线中保留中奖彩票的掩码，因此无法区分性能差异究竟来自保留的连接结构，还是来自保留的初始权重值。这种混淆使人难以判断中奖彩票的优势由掩码拓扑还是初始权重驱动，也可能高估权重值本身的新颖作用。因而需要通过受控的掩码置换实验来定义恰当基线，并明确复用中奖彩票时究竟迁移了什么。","sourceTextEn":"Prior comparisons between winning tickets and \"random\" sparse initializations sometimes retained the discovered ticket's mask for the random baseline, confounding whether performance differences arose from preserved connectivity patterns or the retained initial weight values. This ambiguity prevented clear attribution of what aspect of a winning ticket—mask topology or initial weight values—drives its training advantage, and could lead to overestimating the novelty of weight-value effects. A controlled assessment of mask permutations was therefore needed to define appropriate baselines and to isolate what is being transferred when reusing winning tickets.","workingTextZh":"以往将中奖彩票与“随机”稀疏初始化比较时，有时会在随机基线中保留中奖彩票的掩码，因此无法区分性能差异究竟来自保留的连接结构，还是来自保留的初始权重值。这种混淆使人难以判断中奖彩票的优势由掩码拓扑还是初始权重驱动，也可能高估权重值本身的新颖作用。因而需要通过受控的掩码置换实验来定义恰当基线，并明确复用中奖彩票时究竟迁移了什么。","type":"问题","epistemicStatus":"LKM 问题设定","argumentRole":"研究问题/待回答问题","paperSection":"§3.1 随机掩码; Appendix A.2 随机化掩码","figure":"Fig. A1（并参照 Fig. 1）","ocrLines":"L83; L242-L261（核心：L258-L261）","excerpt":"While locally permuting masks damaged performance somewhat, globally permuting the mask results in dramatically worse performance, suggesting that the layerwise statistics derived from training the over-parameterized model are very informative.","excerptZh":"层内置换掩码会在一定程度上损害性能，而全局置换掩码会使性能显著恶化，这表明从过参数化模型训练中得到的逐层统计包含大量信息。","supports":"","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::conclusion_6_subproblem\")]","inFormalIr":"否","irId":"","reviewStatus":"问题设定；待确认边界","notes":"该问题由 paper:867771291879342656::conclusion_6 回答。"},{"stableId":"OTWTA-Q-C07","sourceLayer":"graph_subproblem","originalId":"paper:867771291879342656::conclusion_7_subproblem","parentFactorId":"","canonicalConclusionId":"OTWTA-C07","proposition":"此前在大规模场景中复现彩票假说时，直接重置到第 0 次迭代的朴素策略曾出现失败，后续工作提出延迟重置作为补救。但要在大规模模型上复现中奖彩票，还必须明确并验证具体的剪枝/重置日程和训练超参数。若缺少经过验证的流程，大型数据集和深层架构上的实验可能只是因为日程不佳而无法得到中奖彩票，而不是因为不存在可训练的稀疏子网络。实践者因此需要一套已验证的日程和重置启发式方法。","sourceTextEn":"Prior demonstrations of lottery-ticket phenomena in large-scale settings encountered failures when applying the naïve reset-to-zero-iteration strategy, and follow-up work proposed late resetting as a remedy; however, reproducing winning tickets at scale requires a concrete, tuned pruning/reset schedule and training hyperparameters to be specified and validated. Without such a specified pipeline, experiments on large datasets and deep architectures risk failing to produce winning tickets simply due to suboptimal schedules rather than absence of sparse trainable subnetworks. Practitioners needed validated schedules and resetting heuristics for producing tickets that can be evaluated for transfer.","workingTextZh":"此前在大规模场景中复现彩票假说时，直接重置到第 0 次迭代的朴素策略曾出现失败，后续工作提出延迟重置作为补救。但要在大规模模型上复现中奖彩票，还必须明确并验证具体的剪枝/重置日程和训练超参数。若缺少经过验证的流程，大型数据集和深层架构上的实验可能只是因为日程不佳而无法得到中奖彩票，而不是因为不存在可训练的稀疏子网络。实践者因此需要一套已验证的日程和重置启发式方法。","type":"问题","epistemicStatus":"LKM 问题设定","argumentRole":"研究问题/待回答问题","paperSection":"§3.1 迭代剪枝 / 延迟重置; Appendix A.1","figure":"—","ocrLines":"L71-L74; L231-L240","excerpt":"For all models, an iterative pruning rate of 0.2 was used and 30 pruning iterations were performed. ... For Fashion-MNIST, SVHN, CIFAR-10 and CIFAR-100 winning tickets, late resetting of 1 epoch was used. For ImageNet and Places365 winning tickets, late resetting of 3 epochs was used.","excerptZh":"所有模型均采用每轮 0.2 的迭代剪枝率并执行 30 轮剪枝。Fashion-MNIST、SVHN、CIFAR-10 和 CIFAR-100 彩票使用 1 个 epoch 的延迟重置；ImageNet 和 Places365 彩票使用 3 个 epoch 的延迟重置。","supports":"","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"paper:867771291879342656::conclusion_7_subproblem\")]","inFormalIr":"否","irId":"","reviewStatus":"问题设定；待确认边界","notes":"该问题由 paper:867771291879342656::conclusion_7 回答。"},{"stableId":"OTWTA-ARG-C01-S01","sourceLayer":"graph_reasoning_step","originalId":"lfac_38ad8d064f6577f1::step_1","parentFactorId":"lfac_38ad8d064f6577f1","canonicalConclusionId":"OTWTA-C01","proposition":"将“中奖彩票”定义为一种稀疏子网络初始化：它从保留的初始参数值出发单独训练时，可以达到与完整过参数化网络相近的测试准确率。将“随机彩票”定义为具有相同稀疏度的稀疏子网络，其保留权重从原始初始化分布重新抽样，剪枝掩码也可以被随机化；彩票假说是这一概念的理论基础。","sourceTextEn":"Define \"winning ticket\" as a sparse sub-network initialization which, when trained in isolation from its preserved initial parameter values, attains test accuracy comparable to the full over-parameterized network; define \"random ticket\" as a sparse sub-network with the same sparsity level whose preserved weights are re-drawn from the original initialization distribution and whose pruning mask may be randomized (see later steps for mask types). Cite the lottery ticket hypothesis as the conceptual foundation for this definition. \n[7]","workingTextZh":"将“中奖彩票”定义为一种稀疏子网络初始化：它从保留的初始参数值出发单独训练时，可以达到与完整过参数化网络相近的测试准确率。将“随机彩票”定义为具有相同稀疏度的稀疏子网络，其保留权重从原始初始化分布重新抽样，剪枝掩码也可以被随机化；彩票假说是这一概念的理论基础。","type":"前提","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3; Fig. 4","ocrLines":"L118-L145（核心：L121）","excerpt":"Across all comparisons, several key trends emerged. First and foremost, individual winning tickets which generalize across all datasets with performance close to that of winning tickets generated on the target dataset can be found.","excerptZh":"在所有比较中出现了若干关键趋势。首先也是最重要的是，可以找到能够跨所有数据集泛化的单个中奖彩票，其性能接近直接在目标数据集上产生的彩票。","supports":"paper:867771291879342656::conclusion_1","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_38ad8d064f6577f1\")].steps[?(@.step_id==\"1\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H1\":\"highlight\",\"paper:867771291879342656::H2\":\"highlight\"}"},{"stableId":"OTWTA-ARG-C01-S02","sourceLayer":"graph_reasoning_step","originalId":"lfac_38ad8d064f6577f1::step_2","parentFactorId":"lfac_38ad8d064f6577f1","canonicalConclusionId":"OTWTA-C01","proposition":"将“迭代量级剪枝”定义为反复交替执行训练至收敛和删除最小量级权重的过程，每一轮剪除剩余参数中的固定比例。本研究每轮剪枝率为 0.2，即每轮删除剩余参数的 20%。","sourceTextEn":"Define \"iterative magnitude pruning\" as a procedure that repeatedly alternates training to convergence and removing the smallest-magnitude weights, pruning a fixed fraction of the remaining parameters at each iteration; in this work the iterative pruning fraction per iteration is $0.2$ (i.e., $20\\%$ of remaining parameters removed per pruning iteration). Note that magnitude pruning (pruning by weight magnitude) was originally proposed in prior pruning work. \n[12]","workingTextZh":"将“迭代量级剪枝”定义为反复交替执行训练至收敛和删除最小量级权重的过程，每一轮剪除剩余参数中的固定比例。本研究每轮剪枝率为 0.2，即每轮删除剩余参数的 20%。","type":"前提","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3; Fig. 4","ocrLines":"L118-L145（核心：L121）","excerpt":"Across all comparisons, several key trends emerged. First and foremost, individual winning tickets which generalize across all datasets with performance close to that of winning tickets generated on the target dataset can be found.","excerptZh":"在所有比较中出现了若干关键趋势。首先也是最重要的是，可以找到能够跨所有数据集泛化的单个中奖彩票，其性能接近直接在目标数据集上产生的彩票。","supports":"paper:867771291879342656::conclusion_1","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_38ad8d064f6577f1\")].steps[?(@.step_id==\"2\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H1\":\"highlight\",\"paper:867771291879342656::H2\":\"highlight\"}"},{"stableId":"OTWTA-ARG-C01-S03","sourceLayer":"graph_reasoning_step","originalId":"lfac_38ad8d064f6577f1::step_3","parentFactorId":"lfac_38ad8d064f6577f1","canonicalConclusionId":"OTWTA-C01","proposition":"将“延迟重置”定义为把剩余未剪权重重置到较早训练迭代 k 时的值，而不是第 0 次迭代的参数。实验中，Fashion-MNIST、SVHN、CIFAR-10 和 CIFAR-100 重置到训练 1 个 epoch 后，ImageNet 和 Places365 重置到训练 3 个 epoch 后。","sourceTextEn":"Define \"late resetting\" as resetting the remaining (unpruned) weights to their values at some early training iteration $k$ (with $k$ much smaller than the total number of training iterations) rather than to the parameters at iteration $0$; late resetting has been found to improve winning-ticket recovery in large models. In these experiments, late resetting values used were: reset to parameters after 1 epoch for Fashion-MNIST, SVHN, CIFAR-10, and CIFAR-100, and reset to parameters after 3 epochs for ImageNet and Places365. \n[8]","workingTextZh":"将“延迟重置”定义为把剩余未剪权重重置到较早训练迭代 k 时的值，而不是第 0 次迭代的参数。实验中，Fashion-MNIST、SVHN、CIFAR-10 和 CIFAR-100 重置到训练 1 个 epoch 后，ImageNet 和 Places365 重置到训练 3 个 epoch 后。","type":"前提","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3; Fig. 4","ocrLines":"L118-L145（核心：L121）","excerpt":"Across all comparisons, several key trends emerged. First and foremost, individual winning tickets which generalize across all datasets with performance close to that of winning tickets generated on the target dataset can be found.","excerptZh":"在所有比较中出现了若干关键趋势。首先也是最重要的是，可以找到能够跨所有数据集泛化的单个中奖彩票，其性能接近直接在目标数据集上产生的彩票。","supports":"paper:867771291879342656::conclusion_1","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_38ad8d064f6577f1\")].steps[?(@.step_id==\"3\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H1\":\"highlight\",\"paper:867771291879342656::H2\":\"highlight\"}"},{"stableId":"OTWTA-ARG-C01-S04","sourceLayer":"graph_reasoning_step","originalId":"lfac_38ad8d064f6577f1::step_4","parentFactorId":"lfac_38ad8d064f6577f1","canonicalConclusionId":"OTWTA-C01","proposition":"跨数据集迁移实验流程为：在固定架构（VGG19 或 ResNet50）和源数据集上，通过迭代量级剪枝产生中奖彩票；再将该稀疏初始化迁移到目标数据集。若输出类别数不同，则排除并随机重置最终线性分类层；随后在目标数据集上将稀疏子网络训练至收敛，并将测试准确率与随机彩票及直接在目标数据集上发现的彩票比较。比较时按模型族匹配训练超参数。","sourceTextEn":"Describe the experimental procedure used to evaluate cross-dataset transfer: generate a winning ticket by iterative magnitude pruning (pruning fraction per iteration $0.2$ up to 30 iterations, with late resetting to early-iteration parameters) on a source dataset for a fixed network architecture (either VGG19 or ResNet50), then transfer that sparse initialization to a target dataset by (a) excluding and randomly reinitializing the final linear classification layer if necessary to accommodate a different number of output classes, (b) training the sparse subnetwork from the preserved initialization on the target dataset to convergence, and (c) comparing resulting test accuracy to (i) a random ticket baseline and (ii) a winning ticket discovered directly on the target dataset. Training hyperparameters (learning-rate schedules, number of epochs) were matched per model family during comparisons. \nFig. 3","workingTextZh":"跨数据集迁移实验流程为：在固定架构（VGG19 或 ResNet50）和源数据集上，通过迭代量级剪枝产生中奖彩票；再将该稀疏初始化迁移到目标数据集。若输出类别数不同，则排除并随机重置最终线性分类层；随后在目标数据集上将稀疏子网络训练至收敛，并将测试准确率与随机彩票及直接在目标数据集上发现的彩票比较。比较时按模型族匹配训练超参数。","type":"前提","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3","ocrLines":"L118-L145（核心：L121）","excerpt":"Across all comparisons, several key trends emerged. First and foremost, individual winning tickets which generalize across all datasets with performance close to that of winning tickets generated on the target dataset can be found.","excerptZh":"在所有比较中出现了若干关键趋势。首先也是最重要的是，可以找到能够跨所有数据集泛化的单个中奖彩票，其性能接近直接在目标数据集上产生的彩票。","supports":"paper:867771291879342656::conclusion_1","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_38ad8d064f6577f1\")].steps[?(@.step_id==\"4\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H1\":\"highlight\",\"paper:867771291879342656::H2\":\"highlight\"}"},{"stableId":"OTWTA-ARG-C01-S05","sourceLayer":"graph_reasoning_step","originalId":"lfac_38ad8d064f6577f1::step_5","parentFactorId":"lfac_38ad8d064f6577f1","canonicalConclusionId":"OTWTA-C01","proposition":"实验观察到，从 ImageNet、Places365 以及较弱程度上的 CIFAR-100 等大型自然图像源数据集迁移到多个目标数据集时，迁移彩票经常取得接近目标数据集专用彩票的测试准确率；源—目标曲线表明，ImageNet 和 Places365 彩票在广泛剪枝比例下与目标专用彩票表现相近。","sourceTextEn":"Report that, across experiments transferring winning tickets from large, complex natural-image source datasets (ImageNet and Places365, and to a lesser extent CIFAR-100) to many natural-image target datasets (SVHN, Fashion-MNIST, CIFAR-10, CIFAR-100, ImageNet, Places365), the transferred winning-ticket initializations frequently achieved test accuracies on the target tasks that were close to the accuracies obtained by winning tickets discovered directly on those target datasets; this empirical result is summarized by the collection of source-vs-target curves showing that ImageNet- and Places365-sourced tickets attain performance similar to target-specific tickets across a wide range of pruning fractions. \nFig. 3","workingTextZh":"实验观察到，从 ImageNet、Places365 以及较弱程度上的 CIFAR-100 等大型自然图像源数据集迁移到多个目标数据集时，迁移彩票经常取得接近目标数据集专用彩票的测试准确率；源—目标曲线表明，ImageNet 和 Places365 彩票在广泛剪枝比例下与目标专用彩票表现相近。","type":"观察","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3","ocrLines":"L118-L145（核心：L121）","excerpt":"Across all comparisons, several key trends emerged. First and foremost, individual winning tickets which generalize across all datasets with performance close to that of winning tickets generated on the target dataset can be found.","excerptZh":"在所有比较中出现了若干关键趋势。首先也是最重要的是，可以找到能够跨所有数据集泛化的单个中奖彩票，其性能接近直接在目标数据集上产生的彩票。","supports":"paper:867771291879342656::conclusion_1","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_38ad8d064f6577f1\")].steps[?(@.step_id==\"5\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H1\":\"highlight\",\"paper:867771291879342656::H2\":\"highlight\"}"},{"stableId":"OTWTA-ARG-C01-S06","sourceLayer":"graph_reasoning_step","originalId":"lfac_38ad8d064f6577f1::step_6","parentFactorId":"lfac_38ad8d064f6577f1","canonicalConclusionId":"OTWTA-C01","proposition":"迁移能力在广泛剪枝比例、包括极高稀疏度下都能观察到：VGG19 彩票即使剪除 99.9% 权重，准确率下降仍较小；ResNet50 在只剩约 5%—10% 权重时下降更陡。这说明极端稀疏下仍可能迁移，但存在依赖架构的剪枝临界点。","sourceTextEn":"State that the transferability was observed across a wide range of pruning fractions, including very high sparsity: VGG19 transferred tickets maintained small decreases in accuracy even when $99.9\\%$ of weights were pruned (i.e., only $0.1\\%$ of parameters remaining), whereas ResNet50 exhibited a sharper degradation when only approximately $5\\text{-}10\\%$ of weights remained. This supports the claim that transfer occurs even at extreme sparsity levels, subject to architecture-dependent pruning cliffs. \nFig. 4","workingTextZh":"迁移能力在广泛剪枝比例、包括极高稀疏度下都能观察到：VGG19 彩票即使剪除 99.9% 权重，准确率下降仍较小；ResNet50 在只剩约 5%—10% 权重时下降更陡。这说明极端稀疏下仍可能迁移，但存在依赖架构的剪枝临界点。","type":"观察","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§4.2 跨数据集迁移","figure":"Fig. 4","ocrLines":"L118-L145（核心：L121）","excerpt":"Across all comparisons, several key trends emerged. First and foremost, individual winning tickets which generalize across all datasets with performance close to that of winning tickets generated on the target dataset can be found.","excerptZh":"在所有比较中出现了若干关键趋势。首先也是最重要的是，可以找到能够跨所有数据集泛化的单个中奖彩票，其性能接近直接在目标数据集上产生的彩票。","supports":"paper:867771291879342656::conclusion_1","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_38ad8d064f6577f1\")].steps[?(@.step_id==\"6\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H1\":\"highlight\",\"paper:867771291879342656::H2\":\"highlight\"}"},{"stableId":"OTWTA-ARG-C01-S07","sourceLayer":"graph_reasoning_step","originalId":"lfac_38ad8d064f6577f1::step_7","parentFactorId":"lfac_38ad8d064f6577f1","canonicalConclusionId":"OTWTA-C01","proposition":"大型或类别更丰富的源数据集产生更强的跨数据集迁移。ImageNet 和 Places365 彩票整体最具竞争力；CIFAR-100 与 CIFAR-10 都有 50,000 个训练样本，但前者彩票泛化更好，说明源数据集复杂度的作用不止样本数量。","sourceTextEn":"Provide the specific observation that larger / more class-rich source datasets produced stronger cross-dataset transfer: tickets sourced from ImageNet and Places365 produced the most consistently competitive transfer performance across target datasets; CIFAR-100 tickets generalized better than CIFAR-10 tickets despite both having $50{,}000$ training examples, indicating that source dataset complexity beyond mere sample count improves transfer. This observation is explicitly discussed in the results and illustrated by the CIFAR-10 vs. CIFAR-100 comparisons in the transfer plots. \nFig. 3","workingTextZh":"大型或类别更丰富的源数据集产生更强的跨数据集迁移。ImageNet 和 Places365 彩票整体最具竞争力；CIFAR-100 与 CIFAR-10 都有 50,000 个训练样本，但前者彩票泛化更好，说明源数据集复杂度的作用不止样本数量。","type":"观察","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3","ocrLines":"L118-L145（核心：L121）","excerpt":"Across all comparisons, several key trends emerged. First and foremost, individual winning tickets which generalize across all datasets with performance close to that of winning tickets generated on the target dataset can be found.","excerptZh":"在所有比较中出现了若干关键趋势。首先也是最重要的是，可以找到能够跨所有数据集泛化的单个中奖彩票，其性能接近直接在目标数据集上产生的彩票。","supports":"paper:867771291879342656::conclusion_1","challenges":"","sourceFile":"01_paper_sample_one_ticket/lkm_coarse_reasoning_graph.json; paper_text_ocr_cleaned.md","jsonPath":"$.data.papers[0].graph.nodes[?(@.id==\"lfac_38ad8d064f6577f1\")].steps[?(@.step_id==\"7\")]","inFormalIr":"否","irId":"","reviewStatus":"LKM推理；待逐步审计","notes":"factor subtype=noisy_and; premise_roles={\"paper:867771291879342656::H1\":\"highlight\",\"paper:867771291879342656::H2\":\"highlight\"}"},{"stableId":"OTWTA-ARG-C01-S08","sourceLayer":"graph_reasoning_step","originalId":"lfac_38ad8d064f6577f1::step_8","parentFactorId":"lfac_38ad8d064f6577f1","canonicalConclusionId":"OTWTA-C01","proposition":"实验使用 VGG19 和 ResNet50，并在各架构族内匹配训练日程：VGG19 训练 160 个 epoch，在第 80、120 个 epoch 降低学习率；ResNet50 训练 90 个 epoch，在第 50、65、80 个 epoch 降低学习率。这些控制使源任务与目标任务的迁移比较保持架构和训练日程一致。","sourceTextEn":"Note that the experimental protocol used VGG19 and ResNet50 architectures (VGG19 with removed fully-connected layers and a global-average-pool to final linear layer; ResNet50 in standard block configuration) and matched training schedules per architecture family (VGG19 trained for 160 epochs with learning-rate drops at epochs 80 and 120; ResNet50 trained for 90 epochs with learning-rate drops at epochs 50, 65, and 80), ensuring that transfer comparisons held architecture and training schedule consistent across source and target evaluations. These architectural and training details contextualize the reported transfer performance. \n[30]","workingTextZh":"实验使用 VGG19 和 ResNet50，并在各架构族内匹配训练日程：VGG19 训练 160 个 epoch，在第 80、120 个 epoch 降低学习率；ResNet50 训练 90 个 epoch，在第 50、65、80 个 epoch 降低学习率。这些控制使源任务与目标任务的迁移比较保持架构和训练日程一致。","type":"观察","epistemicStatus":"LKM 推理步骤","argumentRole":"子网络前提/证据","paperSection":"§4.2 跨数据集迁移","figure":"Fig. 3; Fig. 4","ocrLines":"L118-L145（核心：L121）","excerpt":"Across all comparis
